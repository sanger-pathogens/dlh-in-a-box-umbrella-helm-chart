default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
      - id: script-check
        name: "Syntax check for all shell scripts"
        entry: bash -c 'find "scripts" -name '*.sh' -exec bash -n {} +'
        language: system
        files: ^scripts/.*\.sh$
        pass_filenames: false
      - id: helm-dependency-update
        name: "Update Helm Chart Dependencies"
        entry: scripts/helm/helm-dependency-update.sh
        language: system
        files: ^charts/dlh-in-a-box/Chart\.(yaml|lock)$
        pass_filenames: false
      - id: license-check
        name: "License Check"
        entry: scripts/repo/license-check.sh
        language: system
        always_run: true
      - id: security-check
        name: "Security Check"
        entry: scripts/repo/security-check.sh
        language: system
        always_run: true
      - id: documentation-check
        name: "Check Documentation"
        entry: scripts/repo/docs-check.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: test-chart
        name: "Test Helm Chart"
        entry: test/render-contract.sh
        language: system
        files: ^charts/dlh-in-a-box/
        pass_filenames: false
      - id: helm-lint
        name: "Lint Helm Chart"
        entry: scripts/helm/helm-lint.sh
        language: system
        files: ^(charts/dlh-in-a-box/|examples/)
        pass_filenames: false
      - id: render-chart
        name: "Render Helm Template"
        entry: scripts/helm/template.sh
        language: system
        files: ^(charts/dlh-in-a-box/|examples/)
        pass_filenames: false
      - id: package-chart
        name: "Package Helm Chart"
        entry: scripts/helm/package.sh
        language: system
        files: ^(charts/dlh-in-a-box/|examples/)
        pass_filenames: false
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
        name: "Shellcheck (shell script checker)"
        args:
          - --severity=warning
          - --external-sources
