# Disposable local kind overlay only.
# These credentials are intentionally non-secret demo values and must never be
# reused in a shared or production environment.
global:
  environment: local
  domain: local.test
  storage:
    backend: minio
    s3:
      endpoint: http://dlh-minio:9000
      region: us-east-1
      bucket: dlh-superset-local
      pathStyleAccess: true
      accessKey: minioadmin
      secretKey: minioadmin123
  dataCatalogs:
    default:
      type: deltaLake
      authorizedRoles:
        read: ["superset"]
        write: ["local-admin"]

trino:
  server:
    workers: 1
    node:
      environment: local
    config:
      query:
        maxMemory: 512MB
  coordinator:
    jvm:
      maxHeapSize: 1G
    config:
      query:
        maxMemoryPerNode: 256MB
  worker:
    jvm:
      maxHeapSize: 1G
    config:
      query:
        maxMemoryPerNode: 256MB

prefect:
  enabled: false

sparkOperator:
  enabled: false

minio:
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: 2025.7.23-debian-12-r5
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin123
  defaultBuckets: dlh-superset-local
  persistence:
    enabled: false

datahub:
  enabled: false

hive:
  enabled: false

vault:
  enabled: false

superset:
  enabled: true
  image:
    repository: apache/superset
  bootstrapScript: |
    #!/bin/bash
    set -eu
    if [ ! -f ~/bootstrap ]; then
      if command -v uv >/dev/null 2>&1; then
        UV_CACHE_DIR=/tmp/uv-cache uv pip install --python /app/.venv/bin/python psycopg2-binary==2.9.11
        UV_CACHE_DIR=/tmp/uv-cache uv pip install --python /app/.venv/bin/python "trino>=0.328.0"
      else
        /app/.venv/bin/python -m ensurepip --upgrade
        /app/.venv/bin/python -m pip install psycopg2-binary==2.9.11
        /app/.venv/bin/python -m pip install "trino>=0.328.0"
      fi
      /app/.venv/bin/python -c "import psycopg2"
      /app/.venv/bin/python -c "import trino"
      echo "Installed local Superset runtime extras" > ~/bootstrap
    fi
  extraSecretEnv:
    SUPERSET_SECRET_KEY: local-superset-secret-key-change-me
  extraConfigs:
    import_datasources.yaml: |
      databases:
        - database_name: trino-default
          sqlalchemy_uri: trino://superset@dlh-trino:8080/default
          tables: []
  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    connections:
      db_pass: superset-local
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  init:
    createAdmin: true
    adminUser:
      username: admin
      firstname: Superset
      lastname: Admin
      email: admin@superset.local
      password: admin123456
  postgresql:
    enabled: true
    auth:
      username: superset
      password: superset-local
      database: superset
    primary:
      persistence:
        enabled: false
  redis:
    enabled: true
    auth:
      enabled: false
    master:
      persistence:
        enabled: false
