global:
  environment: prod
  domain: prod.example.com
  storage:
    backend: externalS3
    s3:
      endpoint: https://s3.example.com
      region: us-east-1
      bucket: dlh-prod
      pathStyleAccess: true
      accessKey: ""
      secretKey: ""

prefectWorker:
  worker:
    replicaCount: 3
    config:
      workPool: kubernetes-prod
      workQueues:
        - critical

vault:
  enabled: true

minio:
  enabled: false

datahub:
  enabled: false

hive:
  enabled: false
