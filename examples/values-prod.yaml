# Production-shaped baseline using bundled Keycloak with external LDAP/Active
# Directory federation over LDAPS, Ranger for Trino authorization, and a
# Keycloak-backed proxy in front of Prefect.
global:
  environment: prod
  domain: data-platform.example.org
  identity:
    enabled: true
    provider:
      mode: bundledKeycloak
      keycloak:
        realm: dlh
        browserHost: https://keycloak.data-platform.example.org
        internalScheme: http
        loginTheme: ""
        configCliEnvExistingSecret: &keycloak_config_cli_env_secret dlh-keycloak-config-cli-env
    external:
      oidc:
        issuer: https://keycloak.data-platform.example.org/realms/dlh
        usernameClaim: email
        groupsClaim: groups
        userMappingPattern: "([^@]+)"
        providerCaFile: /etc/oauth2-proxy/keycloak-ca/ca.crt
        scopes:
          - openid
          - profile
          - email
          - groups
        processForwardedHeaders: true
      clients:
        trino:
          enabled: true
          clientId: trino
          existingSecret: dlh-oidc-clients
          clientSecretKey: trinoClientSecret
          redirectUris:
            - https://trino.data-platform.example.org/oauth2/callback
          webOrigins:
            - https://trino.data-platform.example.org
          sharedSecretExistingSecret: dlh-trino-internal-communication
          sharedSecretKey: sharedSecret
          passwordAuthEnabled: true
        trinoDirectGrant:
          enabled: true
          clientId: trino-cli
        superset:
          enabled: false
        datahub:
          enabled: false
        platformHome:
          enabled: true
          clientId: platform-home
          redirectUris:
            - https://portal.data-platform.example.org/
          webOrigins:
            - https://portal.data-platform.example.org
        jupyterhub:
          enabled: true
          clientId: jupyterhub
          existingSecret: dlh-oidc-clients
          clientSecretKey: jupyterhubClientSecret
          redirectUris:
            - https://jupyterhub.data-platform.example.org/hub/oauth_callback
          webOrigins:
            - https://jupyterhub.data-platform.example.org
        cloudbeaverProxy:
          enabled: true
          clientId: cloudbeaver
          existingSecret: dlh-cloudbeaver-oauth2-proxy
          clientSecretKey: client-secret
          cookieExistingSecret: dlh-cloudbeaver-oauth2-proxy
          cookieSecretKey: cookie-secret
          redirectUrl: https://cloudbeaver.data-platform.example.org/oauth2/callback
          redirectUris:
            - https://cloudbeaver.data-platform.example.org/oauth2/callback
          webOrigins:
            - https://cloudbeaver.data-platform.example.org
          emailDomains:
            - example.org
          ingress:
            enabled: true
            className: nginx
            host: cloudbeaver.data-platform.example.org
            tlsSecretName: prod-example-wildcard
        prefectProxy:
          enabled: true
          clientId: prefect
          existingSecret: dlh-prefect-oauth2-proxy
          clientSecretKey: client-secret
          cookieExistingSecret: dlh-prefect-oauth2-proxy
          cookieSecretKey: cookie-secret
          redirectUrl: https://prefect.data-platform.example.org/oauth2/callback
          redirectUris:
            - https://prefect.data-platform.example.org/oauth2/callback
          webOrigins:
            - https://prefect.data-platform.example.org
          emailDomains:
            - "*"
        prefectAutomation:
          enabled: false
          clientId: prefect-automation
          tokenAudience: prefect-api
        prefectDirectGrant:
          enabled: false
          clientId: prefect-cli
          tokenAudience: prefect-api
    directory:
      mode: externalLdap
      ldap:
        enabled: true
        url: ldaps://ad.example.org:636
        userBaseDn: OU=Users,DC=example,DC=org
        usernameAttribute: sAMAccountName
        firstNameAttribute: givenName
        lastNameAttribute: sn
        emailAttribute: mail
        uuidAttribute: objectGUID
        userObjectClasses: person,organizationalPerson,user
        userSearchFilter: "(sAMAccountName={0})"
        userBindPattern: "${USER}@example.org"
        groupNameAttribute: cn
        membershipUserAttribute: sAMAccountName
        groupObjectClasses: group
        useGroupFilter: true
        groupBaseDn: OU=Groups,DC=example,DC=org
        groupSearchFilter: "(cn=platform-*)"
        groupSearchMemberAttribute: member
        userMemberOfAttribute: memberOf
        bindDistinguishedName: CN=svc-platform-keycloak,OU=Service Accounts,DC=example,DC=org
        bindExistingSecret: dlh-ad-bind
        bindPasswordKey: bindPassword
        trustedCaExistingSecret: dlh-ad-ca
        trustedCaCertKey: ca.crt
        allowInsecure: false
  authorization:
    platformRoleExceptions: []
    ranger:
      enabled: true
      serviceName: trino
      serviceUsername: trino
      serviceAdminGroups:
        - admins
      superGroups:
        - admins
      useRangerGroups: false
      postgresql:
        enabled: true
        existingSecret: dlh-ranger-postgresql
        passwordKey: password
        adminPasswordKey: postgres-password
      admin:
        browserUrl: https://ranger.data-platform.example.org
        existingSecret: dlh-ranger-admin
        adminPasswordKey: rangerAdminPassword
        usersyncPasswordKey: rangerUsersyncPassword
      usersync:
        enabled: true
        schedule: "*/15 * * * *"
        syncSource: LDAP
      importCatalogAcls: false
      bootstrapPolicies:
        - name: trino-redcap-access
          description: Allow analyst and principal-investigator roles to read the redcap catalog and platform administrators to manage it.
          resources:
            catalog: redcap
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - platform-user
                - platform-viewer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: execute
                  isAllowed: true
              conditions: []
              delegateAdmin: false
            - groups: []
              users: []
              roles:
                - platform-admin
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: execute
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
                - type: grant
                  isAllowed: true
                - type: revoke
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: trino-redcap-mask-identifiers
          description: Mask direct identifier columns for analyst and principal-investigator roles.
          policyType: 1
          resources:
            catalog: redcap
            schema: patient_data
            table: participants
            column:
              - national_id
              - phone_number
          dataMaskPolicyItems:
            - groups: []
              users: []
              roles:
                - platform-user
                - platform-viewer
              accesses:
                - type: select
                  isAllowed: true
              dataMaskInfo:
                dataMaskType: MASK_SHOW_LAST_4
              conditions: []
              delegateAdmin: false
  storage:
    backend: externalS3
    s3:
      endpoint: https://s3.example.org
      region: us-east-1
      bucket: redcap-prod
      pathStyleAccess: true
      existingSecret: dlh-prod-object-store-credentials
  dataCatalogs:
    redcap:
      type: deltaLake
      governance:
        dataType: research
        classification: restricted-identifiable
        containsDirectIdentifiers: true
        containsQuasiIdentifiers: true
        consentBasis: consent-and-dcc-approval
        irbStatus: required-approved
        sharingStatus: approved-secondary-use
        ownerPi: redcap-pi
        dataSteward: data-platform-team
        sourceSystem: redcap
        approvalReference: DCC-PROD-001
        retentionNotes: Retain according to the approved study retention schedule.

trino:
  accessControl:
    type: configmap
  auth:
    internalCommunicationSharedSecretSecret: dlh-trino-internal-communication

prefect:
  enabled: true
  server:
    enabled: true
  workers:
    enabled: true
  authProxy:
    enabled: true

prefect-auth-proxy:
  config:
    existingSecret: dlh-prefect-oauth2-proxy
  extraVolumes:
    - name: keycloak-issuer-ca
      secret:
        secretName: prod-example-wildcard
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: keycloak-issuer-ca
      mountPath: /etc/oauth2-proxy/keycloak-ca
      readOnly: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - prefect.data-platform.example.org
    tls:
      - secretName: prod-example-wildcard
        hosts:
          - prefect.data-platform.example.org

platformHome:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    host: portal.data-platform.example.org
    tlsSecretName: prod-example-wildcard

jupyterhub:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - jupyterhub.data-platform.example.org
    tls:
      - secretName: prod-example-wildcard
        hosts:
          - jupyterhub.data-platform.example.org
  hub:
    db:
      type: sqlite-memory
    extraEnv:
      JUPYTERHUB_BROWSER_AUTHORIZE_URL: https://keycloak.data-platform.example.org/realms/dlh/protocol/openid-connect/auth
      JUPYTERHUB_INTERNAL_TOKEN_URL: http://dlh-keycloak.data-lakehouse.svc.cluster.local/realms/dlh/protocol/openid-connect/token
      JUPYTERHUB_INTERNAL_USERDATA_URL: http://dlh-keycloak.data-lakehouse.svc.cluster.local/realms/dlh/protocol/openid-connect/userinfo
      JUPYTERHUB_OAUTH_CALLBACK_URL: https://jupyterhub.data-platform.example.org/hub/oauth_callback
      JUPYTERHUB_CLIENT_ID: jupyterhub
      JUPYTERHUB_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: dlh-oidc-clients
            key: jupyterhubClientSecret
      JUPYTERHUB_ROLES_CLAIM: platform_roles
      JUPYTERHUB_ALLOWED_ROLES: platform-admin,platform-user
      JUPYTERHUB_ADMIN_ROLES: platform-admin
      JUPYTERHUB_USERNAME_CLAIM: preferred_username
      JUPYTERHUB_LOGIN_SERVICE: Keycloak
  singleuser:
    storage:
      type: none
    extraEnv:
      TRINO_HOST: trino.data-platform.example.org
      TRINO_PORT: "443"
      TRINO_HTTP_SCHEME: https
      TRINO_CATALOG: redcap
      TRINO_SCHEMA: default
      TRINO_VERIFY_TLS: "true"
      TRINO_DEMO_QUERY: SELECT * FROM redcap.default.platform_demo_enrollment LIMIT 10

cloudbeaver:
  enabled: true
  bootstrap:
    existingSecret: dlh-cloudbeaver-bootstrap
  authProxy:
    enabled: true

cloudbeaver-auth-proxy:
  config:
    existingSecret: dlh-cloudbeaver-oauth2-proxy
  ingress:
    enabled: true
    className: nginx
    hosts:
      - cloudbeaver.data-platform.example.org
    tls:
      - secretName: prod-example-wildcard
        hosts:
          - cloudbeaver.data-platform.example.org

keycloak:
  enabled: true
  auth:
    existingSecret: dlh-keycloak-admin
    passwordSecretKey: adminPassword
  trustedCertsExistingSecret: dlh-ad-ca
  keycloakConfigCli:
    extraEnvVarsSecret: *keycloak_config_cli_env_secret

datahub:
  enabled: false

superset:
  enabled: false

vault:
  enabled: true

minio:
  enabled: false

hive:
  enabled: false
