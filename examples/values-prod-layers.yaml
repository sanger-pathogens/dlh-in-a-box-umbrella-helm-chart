global:
  environment: prod
  domain: prod.example.com
  identity:
    accessModel:
      additionalRoles:
        bronze-reader:
          description: Approved read-only users for the bronze catalog.
        bronze-writer:
          description: Approved read-write users for the bronze catalog.
        silver-reader:
          description: Approved read-only users for the silver catalog.
        silver-writer:
          description: Approved read-write users for the silver catalog.
        geospatial-reader:
          description: Approved read-only users for the geospatial catalog.
        geospatial-writer:
          description: Approved read-write users for the geospatial catalog.
  authorization:
    platformRoleExceptions: []
    ranger:
      enabled: true
      importCatalogAcls: false
      bootstrapPolicies:
        - name: bronze-read
          resources:
            catalog: bronze
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - bronze-reader
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: bronze-write
          resources:
            catalog: bronze
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - bronze-writer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: silver-read
          resources:
            catalog: silver
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - silver-reader
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: silver-write
          resources:
            catalog: silver
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - silver-writer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: geospatial-read
          resources:
            catalog: geospatial
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - geospatial-reader
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: geospatial-write
          resources:
            catalog: geospatial
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - geospatial-writer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
              conditions: []
              delegateAdmin: false
  storage:
    backend: externalS3
    s3:
      endpoint: https://s3.example.com
      region: us-east-1
      bucket: dlh-prod
      pathStyleAccess: true
      existingSecret: dlh-prod-object-store-credentials
  dataCatalogs:
    bronze:
      type: deltaLake
      governance:
        dataType: surveillance
        classification: restricted-deidentified
        containsDirectIdentifiers: false
        containsQuasiIdentifiers: true
        consentBasis: approved-surveillance-use
        irbStatus: required-approved
        sharingStatus: approved-secondary-use
        ownerPi: surveillance-pi
        dataSteward: data-platform-team
        sourceSystem: surveillance-bronze
        approvalReference: DCC-PROD-BRONZE
        retentionNotes: Retain under the surveillance data retention schedule.
    silver:
      type: deltaLake
      governance:
        dataType: derived
        classification: internal-deidentified
        containsDirectIdentifiers: false
        containsQuasiIdentifiers: true
        consentBasis: approved-internal-analytics
        irbStatus: not-required
        sharingStatus: internal-only
        ownerPi: surveillance-pi
        dataSteward: analytics-team
        sourceSystem: surveillance-silver
        approvalReference: INT-PROD-SILVER
        retentionNotes: Retain according to the shared environment retention standard.
    gold:
      type: deltaLake
      governance:
        dataType: derived
        classification: public
        containsDirectIdentifiers: false
        containsQuasiIdentifiers: false
        consentBasis: approved-public-release
        irbStatus: not-required
        sharingStatus: public
        ownerPi: surveillance-pi
        dataSteward: analytics-team
        sourceSystem: surveillance-gold
        approvalReference: PUB-PROD-GOLD
        retentionNotes: Retain under the publication archive schedule.
    geospatial:
      type: hive
      governance:
        dataType: routineClinical
        classification: restricted-deidentified
        containsDirectIdentifiers: false
        containsQuasiIdentifiers: true
        consentBasis: approved-internal-analytics
        irbStatus: required-approved
        sharingStatus: internal-only
        ownerPi: geospatial-pi
        dataSteward: gis-team
        sourceSystem: geospatial-reference
        approvalReference: DCC-PROD-GEOSPATIAL
        retentionNotes: Retain according to the clinical support retention schedule.

prefectWorker:
  worker:
    replicaCount: 3
    config:
      workPool: kubernetes-prod
      workQueues:
        - critical

vault:
  enabled: true

minio:
  enabled: false

datahub:
  enabled: false

hive:
  enabled: true
