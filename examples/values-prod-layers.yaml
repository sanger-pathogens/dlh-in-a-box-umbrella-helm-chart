global:
  environment: prod
  domain: prod.example.com
  identity:
    accessRoles:
      bronze-reader:
        description: Approved read-only users for the bronze catalog.
      bronze-writer:
        description: Approved read-write users for the bronze catalog.
      silver-reader:
        description: Approved read-only users for the silver catalog.
      silver-writer:
        description: Approved read-write users for the silver catalog.
      geospatial-reader:
        description: Approved read-only users for the geospatial catalog.
      geospatial-writer:
        description: Approved read-write users for the geospatial catalog.
  authorization:
    ranger:
      enabled: true
      bootstrapPolicies:
        - name: bronze-read
          resources:
            catalog: bronze
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - bronze-reader
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: bronze-write
          resources:
            catalog: bronze
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - bronze-writer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: silver-read
          resources:
            catalog: silver
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - silver-reader
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: silver-write
          resources:
            catalog: silver
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - silver-writer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: geospatial-read
          resources:
            catalog: geospatial
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - geospatial-reader
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: geospatial-write
          resources:
            catalog: geospatial
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - geospatial-writer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
              conditions: []
              delegateAdmin: false
  storage:
    backend: externalS3
    s3:
      endpoint: https://s3.example.com
      region: us-east-1
      bucket: dlh-prod
      pathStyleAccess: true
      existingSecret: dlh-prod-object-store-credentials
  dataCatalogs:
    bronze:
      type: deltaLake
    silver:
      type: deltaLake
    gold:
      type: deltaLake
    geospatial:
      type: hive

prefectWorker:
  worker:
    replicaCount: 3
    config:
      workPool: kubernetes-prod
      workQueues:
        - critical

vault:
  enabled: true

minio:
  enabled: false

datahub:
  enabled: false

hive:
  enabled: true
