global:
  environment: dev
  domain: dev.local
  storage:
    backend: externalS3
    existingSecret: dev-external-s3
    s3:
      endpoint: https://s3.example-dev.local
      region: us-east-1
      bucket: dlh-dev
      pathStyleAccess: true

dataCatalogs:
  default:
    type: deltaLake
    authorizedUsers:
      read: ["user1", "user2"]
      write: ["admin"]

trino:
  catalogs:
    default: |
      connector.name=delta_lake
      hive.metastore.uri=thrift://dlh-default-metastore:9083
      fs.native-s3.enabled=true
      s3.aws-access-key=accesskey
      s3.aws-secret-key=secretkey
      s3.endpoint=https://s3.example-dev.local
      s3.region=us-east-1
      s3.path-style-access=true
      delta.enable-non-concurrent-writes=true
      delta.register-table-procedure.enabled=true
      delta.metadata.cache-ttl=30s

prefect:
  workers:
    replicaCount: 1
    workPool: kubernetes-dev
    workQueue: default

datahub:
  enabled: false

hive:
  enabled: false
  metastore:
    image:
      registry: docker.io
      repository: apache/hive
      tag: 3.1.3
  schemainit:
    image:
      registry: docker.io
      repository: apache/hive
      tag: 3.1.3
  postgres:
    host: dlh-postgresql
    port: "5432"
    username: hive
    password: hivepassword
  s3:
    endpoint: https://s3.example-dev.local
    accessKey: accesskey
    secretKey: secretkey
  warehouseDir: s3a://dlh-dev/warehouse

minio:
  enabled: false
