# Shared development baseline.
# Keep this file free of inline credentials so it can be reused safely.
global:
  environment: dev
  domain: dev.local
  storage:
    backend: externalS3
    s3:
      endpoint: https://s3.example-dev.local
      region: us-east-1
      bucket: dlh-dev
      pathStyleAccess: true
      existingSecret: dlh-dev-object-store-credentials
  dataCatalogs:
    default:
      type: deltaLake
      authorizedUsers:
        read: ["user1", "user2"]
        write: ["admin"]

trino:
  accessControl:
    type: configmap

prefectWorker:
  worker:
    replicaCount: 1
    config:
      workPool: kubernetes-dev
      workQueues:
        - default

datahub:
  enabled: false

hive:
  enabled: false

minio:
  enabled: false
