# Shared development baseline using bundled Keycloak, external organizational
# LDAP or AD, and Apache Ranger. Keep this file free of inline credentials so
# it can be reused safely across clusters.
global:
  environment: dev
  domain: dev.example.org
  identity: &identity
    enabled: true
    accessRoles:
      platform-admin:
        enabled: true
      platform-user:
        enabled: true
        appAccess:
          superset: true
          datahub: true
          jupyterhub: true
          cloudbeaver: true
      platform-viewer:
        enabled: true
        appAccess:
          superset: true
          datahub: true
    provider:
      mode: bundledKeycloak
      keycloak:
        realm: dlh
        browserHost: https://keycloak.dev.example.org
        internalScheme: http
        loginTheme: ""
        configCliEnvExistingSecret: &keycloak_config_cli_env_secret dlh-keycloak-config-cli-env
    external:
      oidc:
        issuer: https://keycloak.dev.example.org/realms/dlh
        usernameClaim: email
        groupsClaim: groups
        userMappingPattern: "([^@]+)"
        providerCaFile: /etc/oauth2-proxy/keycloak-ca/ca.crt
        scopes:
          - openid
          - profile
          - email
          - groups
        processForwardedHeaders: true
      clients:
        trino:
          enabled: true
          clientId: trino
          existingSecret: dlh-oidc-clients
          clientSecretKey: trinoClientSecret
          redirectUris:
            - https://trino.dev.example.org/oauth2/callback
          webOrigins:
            - https://trino.dev.example.org
          sharedSecretExistingSecret: dlh-trino-internal-communication
          sharedSecretKey: sharedSecret
          passwordAuthEnabled: true
        trinoDirectGrant:
          enabled: true
          clientId: trino-cli
        superset:
          enabled: false
        datahub:
          enabled: false
        platformHome:
          enabled: true
          clientId: platform-home
          redirectUris:
            - https://portal.dev.example.org/
          webOrigins:
            - https://portal.dev.example.org
        jupyterhub:
          enabled: true
          clientId: jupyterhub
          existingSecret: dlh-oidc-clients
          clientSecretKey: jupyterhubClientSecret
          redirectUris:
            - https://jupyterhub.dev.example.org/hub/oauth_callback
          webOrigins:
            - https://jupyterhub.dev.example.org
        cloudbeaverProxy:
          enabled: true
          clientId: cloudbeaver
          existingSecret: dlh-cloudbeaver-oauth2-proxy
          clientSecretKey: client-secret
          cookieExistingSecret: dlh-cloudbeaver-oauth2-proxy
          cookieSecretKey: cookie-secret
          redirectUrl: https://cloudbeaver.dev.example.org/oauth2/callback
          redirectUris:
            - https://cloudbeaver.dev.example.org/oauth2/callback
          webOrigins:
            - https://cloudbeaver.dev.example.org
          emailDomains:
            - "*"
          ingress:
            enabled: true
            className: nginx
            host: cloudbeaver.dev.example.org
            tlsSecretName: dev-example-tls
        prefectProxy:
          enabled: true
          clientId: prefect
          existingSecret: dlh-prefect-oauth2-proxy
          clientSecretKey: client-secret
          cookieExistingSecret: dlh-prefect-oauth2-proxy
          cookieSecretKey: cookie-secret
          redirectUrl: https://prefect.dev.example.org/oauth2/callback
          redirectUris:
            - https://prefect.dev.example.org/oauth2/callback
          webOrigins:
            - https://prefect.dev.example.org
          emailDomains:
            - "*"
        prefectAutomation:
          enabled: false
          clientId: prefect-automation
          tokenAudience: prefect-api
        prefectDirectGrant:
          enabled: false
          clientId: prefect-cli
          tokenAudience: prefect-api
    directory:
      mode: externalLdap
      ldap:
        enabled: true
        url: ldaps://ldap.dev.example.org:636
        userBaseDn: ou=people,dc=example,dc=org
        usernameAttribute: uid
        firstNameAttribute: givenName
        lastNameAttribute: sn
        emailAttribute: mail
        uuidAttribute: entryUUID
        userObjectClasses: inetOrgPerson,organizationalPerson,person
        userSearchFilter: "(uid={0})"
        userBindPattern: "uid=${USER},ou=people,dc=example,dc=org"
        groupNameAttribute: cn
        membershipUserAttribute: uid
        groupObjectClasses: groupOfNames
        useGroupFilter: true
        groupBaseDn: ou=groups,dc=example,dc=org
        groupSearchFilter: "(cn=platform-*)"
        groupSearchMemberAttribute: member
        userMemberOfAttribute: memberOf
        bindDistinguishedName: cn=svc-platform-keycloak,ou=service-accounts,dc=example,dc=org
        bindExistingSecret: dlh-directory-bind
        bindPasswordKey: bindPassword
        useSystemTrustStore: true
        allowInsecure: false
  authorization: &authorization
    ranger:
      enabled: true
      serviceName: trino
      serviceUsername: trino
      serviceAdminGroups:
        - admins
      superGroups:
        - admins
      useRangerGroups: false
      postgresql:
        existingSecret: dlh-ranger-postgresql
        passwordKey: password
        adminPasswordKey: postgres-password
      admin:
        browserUrl: https://ranger.dev.example.org
        existingSecret: dlh-ranger-admin
        adminPasswordKey: rangerAdminPassword
        usersyncPasswordKey: rangerUsersyncPassword
      usersync:
        enabled: true
        schedule: "*/15 * * * *"
        syncSource: LDAP
      importCatalogAcls: false
      bootstrapPolicies:
        - name: trino-redcap-access
          description: Allow analyst and principal-investigator roles to read the redcap catalog and platform administrators to manage it.
          resources:
            catalog: redcap
            schema: "*"
            table: "*"
            column: "*"
          policyItems:
            - groups: []
              users: []
              roles:
                - platform-user
                - platform-viewer
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: execute
                  isAllowed: true
              conditions: []
              delegateAdmin: false
            - groups: []
              users: []
              roles:
                - platform-admin
              accesses:
                - type: select
                  isAllowed: true
                - type: show
                  isAllowed: true
                - type: use
                  isAllowed: true
                - type: execute
                  isAllowed: true
                - type: insert
                  isAllowed: true
                - type: create
                  isAllowed: true
                - type: delete
                  isAllowed: true
                - type: drop
                  isAllowed: true
                - type: alter
                  isAllowed: true
                - type: grant
                  isAllowed: true
                - type: revoke
                  isAllowed: true
              conditions: []
              delegateAdmin: false
        - name: trino-redcap-mask-identifiers
          description: Mask direct identifier columns for analyst and principal-investigator roles.
          policyType: 1
          resources:
            catalog: redcap
            schema: patient_data
            table: participants
            column:
              - national_id
              - phone_number
          dataMaskPolicyItems:
            - groups: []
              users: []
              roles:
                - platform-user
                - platform-viewer
              accesses:
                - type: select
                  isAllowed: true
              dataMaskInfo:
                dataMaskType: MASK_SHOW_LAST_4
              conditions: []
              delegateAdmin: false
        - name: trino-redcap-pi-filter
          description: Limit principal investigators to their approved study subset.
          policyType: 2
          resources:
            catalog: redcap
            schema: patient_data
            table: encounters
          rowFilterPolicyItems:
            - groups: []
              users: []
              roles:
                - platform-viewer
              accesses:
                - type: select
                  isAllowed: true
              rowFilterInfo:
                filterExpr: "study_visibility = 'PI_APPROVED'"
              conditions: []
              delegateAdmin: false
  storage:
    backend: externalS3
    s3:
      endpoint: https://s3.example-dev.local
      region: us-east-1
      bucket: redcap-dev
      pathStyleAccess: true
      existingSecret: dlh-dev-object-store-credentials
  dataCatalogs:
    redcap:
      type: deltaLake

trino:
  accessControl:
    type: configmap
  auth:
    internalCommunicationSharedSecretSecret: dlh-trino-internal-communication

prefect:
  enabled: true
  server:
    enabled: true
  workers:
    enabled: true
  authProxy:
    enabled: true

prefect-auth-proxy:
  config:
    existingSecret: dlh-prefect-oauth2-proxy
  extraVolumes:
    - name: keycloak-issuer-ca
      secret:
        secretName: dev-example-tls
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: keycloak-issuer-ca
      mountPath: /etc/oauth2-proxy/keycloak-ca
      readOnly: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - prefect.dev.example.org
    tls:
      - secretName: dev-example-tls
        hosts:
          - prefect.dev.example.org

platformHome:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    host: portal.dev.example.org
    tlsSecretName: dev-example-tls

jupyterhub:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - jupyterhub.dev.example.org
    tls:
      - secretName: dev-example-tls
        hosts:
          - jupyterhub.dev.example.org
  hub:
    db:
      type: sqlite-memory
    extraEnv:
      JUPYTERHUB_BROWSER_AUTHORIZE_URL: https://keycloak.dev.example.org/realms/dlh/protocol/openid-connect/auth
      JUPYTERHUB_INTERNAL_TOKEN_URL: http://dlh-keycloak.data-lakehouse.svc.cluster.local/realms/dlh/protocol/openid-connect/token
      JUPYTERHUB_INTERNAL_USERDATA_URL: http://dlh-keycloak.data-lakehouse.svc.cluster.local/realms/dlh/protocol/openid-connect/userinfo
      JUPYTERHUB_OAUTH_CALLBACK_URL: https://jupyterhub.dev.example.org/hub/oauth_callback
      JUPYTERHUB_CLIENT_ID: jupyterhub
      JUPYTERHUB_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: dlh-oidc-clients
            key: jupyterhubClientSecret
      JUPYTERHUB_ROLES_CLAIM: platform_roles
      JUPYTERHUB_ALLOWED_ROLES: platform-admin,platform-user
      JUPYTERHUB_ADMIN_ROLES: platform-admin
      JUPYTERHUB_USERNAME_CLAIM: preferred_username
      JUPYTERHUB_LOGIN_SERVICE: Keycloak
  singleuser:
    storage:
      type: none
    extraEnv:
      TRINO_HOST: trino.dev.example.org
      TRINO_PORT: "443"
      TRINO_HTTP_SCHEME: https
      TRINO_CATALOG: redcap
      TRINO_SCHEMA: default
      TRINO_VERIFY_TLS: "true"
      TRINO_DEMO_QUERY: SELECT * FROM redcap.default.platform_demo_enrollment LIMIT 10

cloudbeaver:
  enabled: true
  bootstrap:
    existingSecret: dlh-cloudbeaver-bootstrap
  authProxy:
    enabled: true

cloudbeaver-auth-proxy:
  config:
    existingSecret: dlh-cloudbeaver-oauth2-proxy
  ingress:
    enabled: true
    className: nginx
    hosts:
      - cloudbeaver.dev.example.org
    tls:
      - secretName: dev-example-tls
        hosts:
          - cloudbeaver.dev.example.org

keycloak:
  enabled: true
  auth:
    existingSecret: dlh-keycloak-admin
    passwordSecretKey: adminPassword
  keycloakConfigCli:
    extraEnvVarsSecret: *keycloak_config_cli_env_secret

datahub:
  enabled: false
