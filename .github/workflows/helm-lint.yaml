name: helm-lint

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.12.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        run: npm ci
        working-directory: scripts

      - name: Update dependencies
        run: ./scripts/helm/helm-dependency-update.sh

      - name: License check
        run: ./scripts/repo/license-check.sh

      - name: Security check
        run: ./scripts/repo/security-check.sh

      - name: Documentation check
        run: ./scripts/repo/docs-check.sh

      - name: Test chart
        run: ./test/render-contract.sh

      - name: Helm lint
        run: ./scripts/helm/helm-lint.sh

      - name: Render chart
        run: ./scripts/helm/template.sh

      - name: Package chart
        run: ./scripts/helm/package.sh
