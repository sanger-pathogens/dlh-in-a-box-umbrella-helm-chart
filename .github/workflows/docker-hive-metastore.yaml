name: docker-hive-metastore

on:
  push:
    branches:
      - main
    paths:
      - 'docker/hive-metastore/**'
  workflow_dispatch:

concurrency:
  group: docker-hive-metastore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository }}/hive-metastore
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:4.2.0" docker/hive-metastore/
          docker push "${IMAGE}:4.2.0"

      - name: Publish summary
        env:
          IMAGE: ghcr.io/${{ github.repository }}/hive-metastore
        run: |
          {
            echo "## Docker publish"
            echo
            echo "- Image: \`${IMAGE}:4.2.0\`"
          } >> "${GITHUB_STEP_SUMMARY}"