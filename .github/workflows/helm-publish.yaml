name: helm-publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: helm-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GHCR_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.12.0

      - name: Resolve publish version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BASE_VERSION="$(ruby -e 'require "yaml"; chart = YAML.load_file("charts/dlh-in-a-box/Chart.yaml"); puts chart.fetch("version")')"
          BASE_APP_VERSION="$(ruby -e 'require "yaml"; chart = YAML.load_file("charts/dlh-in-a-box/Chart.yaml"); puts chart.fetch("appVersion")')"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${BASE_VERSION}" ]]; then
              echo "Git tag ${TAG_VERSION} does not match Chart.yaml version ${BASE_VERSION}" >&2
              exit 1
            fi

            CHART_VERSION="${BASE_VERSION}"
            APP_VERSION="${BASE_APP_VERSION}"
            CHANNEL="release"
          else
            CHART_VERSION="${BASE_VERSION}-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.${SHORT_SHA}"
            APP_VERSION="${BASE_APP_VERSION}-main.${SHORT_SHA}"
            CHANNEL="main"
          fi

          PACKAGE_REF="${GHCR_REPOSITORY}/dlh-in-a-box"

          {
            echo "base_version=${BASE_VERSION}"
            echo "chart_version=${CHART_VERSION}"
            echo "app_version=${APP_VERSION}"
            echo "channel=${CHANNEL}"
            echo "package_ref=${PACKAGE_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Update dependencies
        run: ./scripts/helm/helm-dependency-update.sh

      - name: Lint and license checks
        run: ./scripts/lint.sh

      - name: Package chart
        run: ./scripts/helm/package.sh charts/dlh-in-a-box dist "${{ steps.version.outputs.chart_version }}" "${{ steps.version.outputs.app_version }}"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          USERNAME="${GITHUB_ACTOR}"
          TOKEN="${GITHUB_TOKEN}"

          if [ -n "${GHCR_TOKEN}" ]; then
            TOKEN="${GHCR_TOKEN}"
            if [ -n "${GHCR_USERNAME}" ]; then
              USERNAME="${GHCR_USERNAME}"
            fi
          fi

          printf '%s' "${TOKEN}" | helm registry login ghcr.io -u "${USERNAME}" --password-stdin

      - name: Push chart to GHCR
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          PACKAGE_REF: ${{ steps.version.outputs.package_ref }}
        run: |
          set -euo pipefail

          if helm show chart "${PACKAGE_REF}" --version "${CHART_VERSION}" >/dev/null 2>&1; then
            echo "Chart ${PACKAGE_REF}:${CHART_VERSION} already exists in GHCR, skipping push."
            exit 0
          fi

          helm push "dist/dlh-in-a-box-${CHART_VERSION}.tgz" "${GHCR_REPOSITORY}"

      - name: Publish summary
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          PACKAGE_REF: ${{ steps.version.outputs.package_ref }}
        run: |
          {
            echo "## Helm publish"
            echo
            echo "- Channel: ${CHANNEL}"
            echo "- Package: \`${PACKAGE_REF}\`"
            echo "- Version: \`${CHART_VERSION}\`"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "helm install dlh ${PACKAGE_REF} --version ${CHART_VERSION} -n data-lakehouse --create-namespace -f my-values.yaml"
            echo '```'
            echo
            echo "### Consume as dependency"
            echo
            echo '```yaml'
            echo 'dependencies:'
            echo '  - name: dlh-in-a-box'
            echo "    version: ${CHART_VERSION}"
            echo '    repository: oci://ghcr.io/${{ github.repository_owner }}/charts'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
