name: helm-publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GHCR_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update dependencies
        run: ./hack/helm-dependency-update.sh

      - name: Lint and license checks
        run: ./hack/lint.sh

      - name: Package chart
        run: ./hack/package.sh

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          USERNAME="${GITHUB_ACTOR}"
          TOKEN="${GITHUB_TOKEN}"

          if [ -n "${GHCR_TOKEN}" ]; then
            TOKEN="${GHCR_TOKEN}"
            if [ -n "${GHCR_USERNAME}" ]; then
              USERNAME="${GHCR_USERNAME}"
            fi
          fi

          printf '%s' "${TOKEN}" | helm registry login ghcr.io -u "${USERNAME}" --password-stdin

      - name: Push chart to GHCR
        run: helm push dist/dlh-in-a-box-*.tgz "${GHCR_REPOSITORY}"
