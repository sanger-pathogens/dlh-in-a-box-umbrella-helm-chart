name: helm-smoke-install

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/helm-lint.yaml"
      - ".github/workflows/helm-publish.yaml"
      - ".github/workflows/helm-smoke-install.yaml"
      - "charts/**"
      - "examples/**"
      - "hack/**"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/helm-lint.yaml"
      - ".github/workflows/helm-publish.yaml"
      - ".github/workflows/helm-smoke-install.yaml"
      - "charts/**"
      - "examples/**"
      - "hack/**"
      - "Makefile"

concurrency:
  group: helm-smoke-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-install:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIR: artifacts/kind-smoke-install
      NAMESPACE: data-lakehouse-local
      RELEASE_NAME: dlh
      TIMEOUT: 20m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: dlh-ci

      - name: Install validated local overlay
        run: ./hack/smoke-install.sh

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kind-smoke-install-diagnostics
          path: artifacts/kind-smoke-install
          if-no-files-found: warn
