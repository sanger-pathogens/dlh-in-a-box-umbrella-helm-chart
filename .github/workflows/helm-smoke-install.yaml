name: helm-smoke-install

on:
  workflow_dispatch:

concurrency:
  group: helm-smoke-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-install:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIR: artifacts/kind-smoke-install
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NAMESPACE: data-lakehouse-local
      RELEASE_NAME: dlh
      TIMEOUT: 30m
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.12.0

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: dlh-ci

      - name: Install validated local-auth overlay
        run: ./scripts/helm/smoke-install.sh charts/dlh-in-a-box examples/values-local-auth.yaml

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-smoke-install-diagnostics
          path: artifacts/kind-smoke-install
          if-no-files-found: warn
