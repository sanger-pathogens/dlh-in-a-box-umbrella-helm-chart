name: helm-smoke-install

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/helm-lint.yaml"
      - ".github/workflows/helm-publish.yaml"
      - ".github/workflows/helm-smoke-install.yaml"
      - "charts/**"
      - "examples/**"
      - "hack/**"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/helm-lint.yaml"
      - ".github/workflows/helm-publish.yaml"
      - ".github/workflows/helm-smoke-install.yaml"
      - "charts/**"
      - "examples/**"
      - "hack/**"
      - "Makefile"

concurrency:
  group: helm-smoke-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-install:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIR: artifacts/kind-smoke-install
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NAMESPACE: data-lakehouse-local
      RELEASE_NAME: dlh
      TIMEOUT: 20m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: dlh-ci

      - name: Install validated local overlay
        run: ./hack/smoke-install.sh

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kind-smoke-install-diagnostics
          path: artifacts/kind-smoke-install
          if-no-files-found: warn
