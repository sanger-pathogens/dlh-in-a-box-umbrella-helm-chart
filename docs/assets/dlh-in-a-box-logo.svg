<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">dlh-in-a-box logo</title>
  <desc id="desc">A geometric box with lake waves and connected data nodes next to the dlh-in-a-box wordmark.</desc>
  <defs>
    <linearGradient id="topFace" x1="55" y1="30" x2="205" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44d7c2"/>
      <stop offset="1" stop-color="#1593d1"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="45" y1="92" x2="134" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fb7b4"/>
      <stop offset="1" stop-color="#0b5e89"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="132" y1="82" x2="231" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17456f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="lakeLine" x1="76" y1="123" x2="178" y2="123" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8fff7"/>
      <stop offset="0.52" stop-color="#a8f4ff"/>
      <stop offset="1" stop-color="#78d8ff"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="332" y1="162" x2="640" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a085"/>
      <stop offset="0.58" stop-color="#1b9bd7"/>
      <stop offset="1" stop-color="#e5b638"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#102a43" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="920" height="260" fill="none"/>

  <g transform="translate(30 22)" filter="url(#softShadow)">
    <path d="M126 5L230 63L126 121L22 63Z" fill="url(#topFace)"/>
    <path d="M22 63L126 121V235L22 177Z" fill="url(#leftFace)"/>
    <path d="M230 63L126 121V235L230 177Z" fill="url(#rightFace)"/>
    <path d="M126 5L230 63V177L126 235L22 177V63Z" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
    <path d="M22 63L126 121L230 63" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.72"/>
    <path d="M126 121V235" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.72"/>

    <path d="M63 137C78 126 91 126 106 137C121 148 136 148 151 137C166 126 180 126 194 137" fill="none" stroke="url(#lakeLine)" stroke-width="8" stroke-linecap="round"/>
    <path d="M63 162C78 151 91 151 106 162C121 173 136 173 151 162C166 151 180 151 194 162" fill="none" stroke="#c9fff2" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M63 187C78 176 91 176 106 187C121 198 136 198 151 187C166 176 180 176 194 187" fill="none" stroke="#6bd4ff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

    <path d="M82 91L113 75L147 91L178 73" fill="none" stroke="#f8d568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="91" r="8" fill="#ffffff"/>
    <circle cx="113" cy="75" r="8" fill="#ffffff"/>
    <circle cx="147" cy="91" r="8" fill="#ffffff"/>
    <circle cx="178" cy="73" r="8" fill="#ffffff"/>
    <circle cx="82" cy="91" r="4" fill="#16a085"/>
    <circle cx="113" cy="75" r="4" fill="#1593d1"/>
    <circle cx="147" cy="91" r="4" fill="#102a43"/>
    <circle cx="178" cy="73" r="4" fill="#e5b638"/>
  </g>

  <g transform="translate(312 65)">
    <text x="0" y="60" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="800" letter-spacing="0" fill="#102a43">dlh-in-a-box</text>
    <rect x="4" y="93" width="326" height="8" rx="4" fill="url(#accentBar)"/>
    <text x="0" y="136" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="650" letter-spacing="0" fill="#28556f">portable data lakehouse platform</text>
  </g>
