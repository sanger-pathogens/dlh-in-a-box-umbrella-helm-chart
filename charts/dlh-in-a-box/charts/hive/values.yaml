enabled: true

metastore:
  image:
    registry: ghcr.io
    repository: sanger-pathogens/dlh-in-a-box-umbrella-helm-chart/hive-metastore
    tag: "4.2.0"

schemainit:
  image:
    registry: ghcr.io
    repository: sanger-pathogens/dlh-in-a-box-umbrella-helm-chart/hive-metastore
    tag: "4.2.0"
  job:
    enabled: false

# PostgreSQL connection (external or deployed separately)
postgres:
  host: ""
  port: "5432"
  username: ""
  createDatabase: true
  # Do not commit real database passwords in tracked values files.
  password: ""
  existingSecret: ""

# S3 configuration
s3:
  endpoint: ""
  # Do not commit real object-store credentials in tracked values files.
  accessKey: ""
  secretKey: ""
  pathStyleAccess: true
  existingSecret: ""

# Warehouse directory base
warehouseDir: ""

ingress:
  enabled: false
  className: ""
  tlsSecretName: ""

# Data catalogs configuration is sourced from global.dataCatalogs in the umbrella chart.
# If using this chart stand-alone, you can uncomment and populate:
# dataCatalogs:
#   default:
#     type: deltaLake  # deltaLake or hive
#     authorizedUsers:
#       read: []
#       write: []
