enabled: true

metastore:
  # Whether this chart renders its own default, singularly-named metastore.
  # Set false when something else (e.g. a parent chart composing several
  # named instances) is calling hive.metastoreInstance itself instead.
  enabled: true
  image:
    registry: docker.io
    repository: apache/hive
    tag: "4.2.0"

schemainit:
  image:
    registry: docker.io
    repository: apache/hive
    tag: "4.2.0"
  job:
    enabled: true

jdbcDriver:
  url: "https://jdbc.postgresql.org/download/postgresql-42.7.4.jar"

# Bundled PostgreSQL instance owned entirely by this chart
# (same convention as the Bitnami charts this project depends on: a
# `postgresql.enabled` toggle for a self-contained instance). Hive's own
# connecting role is that instance's superuser, so it self-creates its
# per-catalog databases; that's only appropriate because it owns the whole
# instance, not a scoped role on a Postgres instance shared with other
# applications.
postgresql:
  enabled: true
  nameOverride: hive-postgresql
  auth:
    enablePostgresUser: true
    # Do not commit real database passwords in tracked values files.
    postgresPassword: ""
    existingSecret: ""

# Connection details for an external PostgreSQL instance -- your own
# externally managed cluster, or one this chart doesn't own (e.g. a shared
# instance) -- used whenever postgresql.enabled=false.
externalDatabase:
  host: ""
  port: 5432
  user: ""
  # Do not commit real database passwords in tracked values files.
  password: ""
  existingSecret: ""

# S3 configuration
s3:
  endpoint: ""
  # Do not commit real object-store credentials in tracked values files.
  accessKey: ""
  secretKey: ""
  pathStyleAccess: true
  existingSecret: ""

# Warehouse directory base
warehouseDir: ""

# Name of the single metastore database this chart creates by default. Only
# used when nothing calls hive.metastoreInstance with an explicit name --
# see templates/metastore.yaml and _metastore.tpl.
database: hive

ingress:
  enabled: false
  className: ""
  tlsSecretName: ""
