{{- $catalogs := default dict .Values.global.dataCatalogs }}
{{- range $catalogName, $catalog := $catalogs }}
{{- $safeCatalog := include "hive.sanitize" $catalogName }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore
  namespace: {{ $.Release.Namespace }}
spec:
  ports:
    - port: 9083
      targetPort: 9083
  selector:
    app: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/init-config: {{ include (print $.Template.BasePath "/init-config.yaml") $ | sha256sum }}
        checksum/metastore-config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/postgres-secret: {{ include "hive.postgresSecretChecksum" $ }}
        checksum/s3-secret: {{ include "hive.s3SecretChecksum" $ }}
      labels:
        app: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore
    spec:
      initContainers:
        {{- include "hive.waitForPostgresInitContainer" $ | nindent 8 }}
        {{- include "hive.downloadJdbcInitContainer" $ | nindent 8 }}
        {{- if $.Values.postgres.createDatabase }}
        - name: create-db-{{ $safeCatalog }}
          image: postgres:15
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Checking if database '{{ $catalogName }}' exists..."
              if ! PGPASSWORD="$POSTGRES_PASSWORD" psql \
                  -h "$POSTGRES_HOST" \
                  -U "$POSTGRES_USER" \
                  -p "$POSTGRES_PORT" \
                  -d postgres \
                  -tAc "SELECT 1 FROM pg_database WHERE datname='{{ $catalogName }}';" | grep -q 1; then
                echo "Creating database '{{ $catalogName }}'..."
                PGPASSWORD="$POSTGRES_PASSWORD" psql \
                  -h "$POSTGRES_HOST" \
                  -U "$POSTGRES_USER" \
                  -p "$POSTGRES_PORT" \
                  -d postgres \
                  -c "CREATE DATABASE \"{{ $catalogName }}\""
              else
                echo "Database '{{ $catalogName }}' already exists."
              fi
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hive.postgresSecretName" $ }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hive.postgresSecretName" $ }}
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hive.fullname" $ }}-init-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hive.fullname" $ }}-init-config
                  key: POSTGRES_PORT
        {{- end }}
        - name: init-schema-{{ $safeCatalog }}
          image: "{{ $.Values.schemainit.image.registry }}/{{ $.Values.schemainit.image.repository }}:{{ $.Values.schemainit.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              JDBC_URL="jdbc:postgresql://$POSTGRES_HOST:$POSTGRES_PORT/{{ $catalogName }}"
              echo "Upgrading or verifying Hive schema for '{{ $catalogName }}'..."
              if /opt/hive/bin/schematool \
                  -dbType postgres \
                  -driver org.postgresql.Driver \
                  -userName "$POSTGRES_USER" \
                  -passWord "$POSTGRES_PASSWORD" \
                  -url "$JDBC_URL" \
                  -upgradeSchema; then
                echo "Schema is current."
              else
                echo "No existing schema found, initializing..."
                /opt/hive/bin/schematool \
                  --verbose \
                  -dbType postgres \
                  -driver org.postgresql.Driver \
                  -userName "$POSTGRES_USER" \
                  -passWord "$POSTGRES_PASSWORD" \
                  -url "$JDBC_URL" \
                  -initSchema
              fi
          env:
            - name: HADOOP_CLASSPATH
              value: /extra-jars/*
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hive.postgresSecretName" $ }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hive.postgresSecretName" $ }}
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hive.fullname" $ }}-init-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hive.fullname" $ }}-init-config
                  key: POSTGRES_PORT
          volumeMounts:
            {{- include "hive.jdbcDriverVolumeMount" $ | nindent 12 }}
      containers:
        - name: metastore
          image: "{{ $.Values.metastore.image.registry }}/{{ $.Values.metastore.image.repository }}:{{ $.Values.metastore.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: schema_name
              value: "{{ $catalogName }}"
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: IS_RESUME
              value: "true"
            - name: METASTORE_PORT
              value: "9083"
            - name: HIVE_CUSTOM_CONF_DIR
              value: /hive_custom_conf
            - name: HADOOP_OPTIONAL_TOOLS
              value: hadoop-aws
            - name: HADOOP_CLASSPATH
              value: /opt/hadoop/share/hadoop/tools/lib/*:/extra-jars/*
          envFrom:
            - secretRef:
                name: {{ include "hive.postgresSecretName" $ }}
            - secretRef:
                name: {{ include "hive.s3SecretName" $ }}
            - configMapRef:
                name: {{ include "hive.fullname" $ }}-init-config
          ports:
            - containerPort: 9083
          volumeMounts:
            - name: metastore-cfg-vol
              mountPath: /hive_custom_conf
            {{- include "hive.jdbcDriverVolumeMount" $ | nindent 12 }}
      volumes:
        - name: metastore-cfg-vol
          secret:
            secretName: {{ include "hive.fullname" $ }}-metastore-cfg-{{ $safeCatalog }}
        {{- include "hive.jdbcDriverVolume" $ | nindent 8 }}

{{- if $.Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore-ingress
  namespace: {{ $.Release.Namespace }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore.{{ $.Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore
                port:
                  number: 9083
  {{- if $.Values.ingress.tlsSecretName }}
  tls:
    - secretName: {{ $.Values.ingress.tlsSecretName }}
      hosts:
        - {{ include "hive.fullname" $ }}-{{ $safeCatalog }}-metastore.{{ $.Values.global.domain }}
  {{- end }}
{{- end }}

{{- end }}
