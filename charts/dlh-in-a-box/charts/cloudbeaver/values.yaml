enabled: true
image:
  repository: dbeaver/cloudbeaver
  tag: 25.2.5
  pullPolicy: IfNotPresent
service:
  port: 8978
strategy:
  type: Recreate
workspace:
  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
# auth.proxy is the SSO login path (Keycloak via oauth2-proxy) and stays
# mandatory whenever cloudbeaver.enabled=true (enforced in the umbrella
# chart's identity-validation.yaml) so CloudBeaver always sits behind the
# central authentication boundary. auth.local is the local users login path.
# Both providers can be registered at once. This chart also enforces its own
# self-contained "at least one enabled" guard (templates/validation.yaml)
# independent of the umbrella's stricter policy.
auth:
  admin:
    # Native CloudBeaver admin identity. Always provisioned.
    username: cbadmin
    existingSecret: ""
    passwordSecretKey: password
  local:
    enabled: false
  proxy:
    enabled: false
    userHeader: X-Forwarded-Preferred-Username
    # CloudBeaver treats this header as a list of existing team ids. The
    # oauth2-proxy X-Forwarded-Groups header can contain broad Keycloak/OIDC
    # roles such as offline_access, which breaks CloudBeaver login when those
    # teams do not exist. Keep this dedicated header unless an upstream proxy
    # explicitly emits CloudBeaver team ids such as platform-admin/platform-user-scientist.
    groupHeader: X-CloudBeaver-Platform-Team
    groupDelimiter: ","
    firstNameHeader: ""
    lastNameHeader: ""
    logoutUrl: ""

# seed provisions first-boot data -- teams/users/permissions (seed.teams),
# and pre-loaded Trino/DB connections plus who can use them (seed.connections). Both are optional.
seed:
  teams:
    existingSecret: ""
    dataKey: initial-data.conf
  connections:
    existingSecret: ""
    dataSourcesKey: data-sources.json
    force: false
    sharedAccess:
      enabled: false
      connectionIdKey: shared-connection-id
      projectIdKey: shared-project-id
      usernameKey: shared-connection-username
      passwordKey: shared-connection-password
      bootstrapUsernameKey: shared-bootstrap-username
      bootstrapGroupsKey: shared-bootstrap-groups
      expectedCatalog: redcap
      # Fallback default group for the bootstrap script's
      # CB_SHARED_BOOTSTRAP_GROUPS, when sharedAccess.enabled=true.
      adminTeam: ""

h2FreshSchemaPatch:
  enabled: false
  pluginJar: ""

# Every key in this secret is imported by CloudBeaver at startup
# into its own trust store, and every
# JDBC/DB connection inherits it automatically.
# https://github.com/dbeaver/cloudbeaver/wiki/SSL-Configuration
trustedCerts:
  existingSecret: ""

app:
  # Passed through verbatim into CloudBeaver's own app: {} config, written
  # to cloudbeaver.runtime.conf and force-reapplied to the workspace on
  # every pod start -- Helm values always win over persisted or
  # admin-UI-edited state (see templates/configmap.yaml). Any key from
  # CloudBeaver's Server-configuration docs is valid here; anything unset
  # falls back to CloudBeaver's own built-in default. A few auth-wiring
  # keys are always chart-derived from auth.* and override anything set
  # here (see templates/configmap.yaml).
  config: {}

# Raw Kubernetes EnvVar entries appended to the cloudbeaver container, e.g.
# to reach the CLOUDBEAVER_* placeholders already baked into
# cloudbeaver.conf's server block (session/password policy, devMode), or to
# set CB_SERVER_NAME:
# extraEnv:
#   - name: CB_SERVER_NAME
#     value: "My CloudBeaver"
extraEnv: []
