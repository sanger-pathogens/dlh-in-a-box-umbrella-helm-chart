{{- if .Values.enabled }}
{{- $serviceName := include "cloudbeaver.serviceName" . -}}
{{- $port := default 8978 .Values.service.port -}}
{{- $auth := .Values.auth | default dict -}}
{{- $authAdmin := get $auth "admin" | default dict -}}
{{- $authProxy := get $auth "proxy" | default dict -}}
{{- $seed := .Values.seed | default dict -}}
{{- $seedTeams := get $seed "teams" | default dict -}}
{{- $seedConnections := get $seed "connections" | default dict -}}
{{- $appConfig := .Values.app | default dict -}}
{{- $workspace := .Values.workspace | default dict -}}
{{- $workspacePersistence := get $workspace "persistence" | default dict -}}
{{- $trustedCerts := .Values.trustedCerts | default dict -}}
{{- $authAdminExistingSecret := default "" $authAdmin.existingSecret -}}
{{- $authAdminUsername := default "cbadmin" $authAdmin.username -}}
{{- $authAdminPasswordSecretKey := default "admin-password" $authAdmin.passwordSecretKey -}}
{{- $seedTeamsExistingSecret := default "" $seedTeams.existingSecret -}}
{{- $seedTeamsDataKey := default "initial-data.conf" $seedTeams.dataKey -}}
{{- $seedConnectionsExistingSecret := default "" $seedConnections.existingSecret -}}
{{- $seedConnectionsDataSourcesKey := default "data-sources.json" $seedConnections.dataSourcesKey -}}
{{- $seedConnectionsForce := default false $seedConnections.force -}}
{{- $h2FreshSchemaPatch := get .Values "h2FreshSchemaPatch" | default dict -}}
{{- $h2FreshSchemaPatchEnabled := default false $h2FreshSchemaPatch.enabled -}}
{{- $h2FreshSchemaPatchPluginJar := default "" $h2FreshSchemaPatch.pluginJar -}}
{{- $sharedAccess := get $seedConnections "sharedAccess" | default dict -}}
{{- $sharedAccessEnabled := default false $sharedAccess.enabled -}}
{{- $sharedAccessConnectionIdKey := default "shared-connection-id" $sharedAccess.connectionIdKey -}}
{{- $sharedAccessProjectIdKey := default "shared-project-id" $sharedAccess.projectIdKey -}}
{{- $sharedAccessUsernameKey := default "shared-connection-username" $sharedAccess.usernameKey -}}
{{- $sharedAccessPasswordKey := default "shared-connection-password" $sharedAccess.passwordKey -}}
{{- $sharedAccessBootstrapUsernameKey := default "shared-bootstrap-username" $sharedAccess.bootstrapUsernameKey -}}
{{- $sharedAccessBootstrapGroupsKey := default "shared-bootstrap-groups" $sharedAccess.bootstrapGroupsKey -}}
{{- $sharedAccessExpectedCatalog := default "redcap" $sharedAccess.expectedCatalog -}}
{{- $trustedCertsSecret := default "" $trustedCerts.existingSecret -}}
{{- /* CloudBeaver auto-imports every cert found here at startup into its own
   trust store, so all JDBC/DB connections inherit it -- no per-connection
   truststore config needed. Every key in $trustedCertsSecret becomes one
   file here, so trusting an extra CA is a Secret-content change only. See
   https://github.com/dbeaver/cloudbeaver/wiki/SSL-Configuration */ -}}
{{- $customCertsPath := "/opt/cloudbeaver/workspace/.data/custom-certs" -}}
{{- $global := .Values.global | default dict -}}
{{- $identity := get $global "identity" | default dict -}}
{{- $appConfigMap := get $appConfig "config" | default dict -}}
{{- $derivedAdminTeam := "platform-admin" -}}
{{- $defaultUserTeam := default "" $appConfigMap.defaultUserTeam -}}
{{- $adminTeam := default $derivedAdminTeam $sharedAccess.adminTeam -}}
{{- $reverseProxyAuthEnabled := default false $authProxy.enabled -}}
{{- $external := get $identity "external" | default dict -}}
{{- $clients := get $external "clients" | default dict -}}
{{- $cloudbeaverIdentity := get $clients "cloudbeaverProxy" | default dict -}}
{{- $cloudbeaverOrigin := first (default (list) (get $cloudbeaverIdentity "webOrigins")) -}}
{{- $cloudbeaverServerUrl := "" -}}
{{- if $cloudbeaverOrigin -}}
  {{- $cloudbeaverServerUrl = printf "%s/" (trimSuffix "/" $cloudbeaverOrigin) -}}
{{- end -}}
{{- $authProxyForChecksum := $authProxy -}}
{{- $checksums := dict
  "config" ((printf "%s\n%s\n%s\n%s" (toPrettyJson $authProxyForChecksum) (toPrettyJson $appConfig) (toPrettyJson $cloudbeaverIdentity) (toPrettyJson $h2FreshSchemaPatch)) | sha256sum)
  "admin" $authAdminExistingSecret
  "teamsSeed" $seedTeamsExistingSecret
  "connectionsSeed" $seedConnectionsExistingSecret
  "trustedCerts" $trustedCertsSecret
-}}
{{- with (lookup "v1" "Secret" .Release.Namespace $authAdminExistingSecret) }}
  {{- $_ := set $checksums "admin" (toJson (default dict .data) | sha256sum) -}}
{{- end }}
{{- if $seedTeamsExistingSecret }}
  {{- with (lookup "v1" "Secret" .Release.Namespace $seedTeamsExistingSecret) }}
    {{- $_ := set $checksums "teamsSeed" (toJson (default dict .data) | sha256sum) -}}
  {{- end }}
{{- end }}
{{- if $seedConnectionsExistingSecret }}
  {{- with (lookup "v1" "Secret" .Release.Namespace $seedConnectionsExistingSecret) }}
    {{- $_ := set $checksums "connectionsSeed" (toJson (default dict .data) | sha256sum) -}}
  {{- end }}
{{- end }}
{{- if $trustedCertsSecret }}
  {{- with (lookup "v1" "Secret" .Release.Namespace $trustedCertsSecret) }}
    {{- $_ := set $checksums "trustedCerts" (toJson (default dict .data) | sha256sum) -}}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudbeaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudbeaver
spec:
  replicas: 1
  strategy:
    {{- toYaml (default (dict "type" "Recreate") .Values.strategy) | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "cloudbeaver.name" . }}
      app.kubernetes.io/component: cloudbeaver
  template:
    metadata:
      annotations:
        checksum/cloudbeaver-config: {{ get $checksums "config" | quote }}
        checksum/cloudbeaver-admin: {{ get $checksums "admin" | quote }}
        checksum/cloudbeaver-teams-seed: {{ get $checksums "teamsSeed" | quote }}
        checksum/cloudbeaver-connections-seed: {{ get $checksums "connectionsSeed" | quote }}
        checksum/cloudbeaver-trusted-certs: {{ get $checksums "trustedCerts" | quote }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "cloudbeaver.name" . }}
        app.kubernetes.io/component: cloudbeaver
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if $h2FreshSchemaPatchEnabled }}
        - name: cloudbeaver-h2-fresh-schema-patch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              plugin_jar={{ $h2FreshSchemaPatchPluginJar | quote }}
              source_path="/opt/cloudbeaver/server/plugins/${plugin_jar}"
              patched_path="/patched/${plugin_jar}"

              test -f "${source_path}"
              cp "${source_path}" "${patched_path}"

              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "${tmp_dir}"' EXIT
              cd "${tmp_dir}"
              jar xf "${patched_path}" db
              find db -type f -name 'cb_schema_update_*.sql' | while read -r script; do
                printf '%s\n' \
                  "-- Skipped by dlh-in-a-box for forced fresh CloudBeaver workspaces." \
                  "-- The bundled cb_schema_create.sql already contains the current schema." \
                  >"${script}"
              done
              jar uf "${patched_path}" db
          volumeMounts:
            - name: cloudbeaver-security-plugin-patch
              mountPath: /patched
        {{- end }}
        {{- if $seedConnectionsExistingSecret }}
        - name: cloudbeaver-workspace-seed
          image: docker.io/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              target_dir="/workspace/GlobalConfiguration/.dbeaver"
              target_file="${target_dir}/data-sources.json"
              permissions_file="${target_dir}/data-sources-permissions.json"
              if [ "{{ ternary "true" "false" $seedConnectionsForce }}" = "true" ]; then
                find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              fi
              mkdir -p "${target_dir}"
              if [ "{{ ternary "true" "false" $seedConnectionsForce }}" = "true" ] || [ ! -f "${target_file}" ]; then
                cp "/seed/{{ $seedConnectionsDataSourcesKey }}" "${target_file}"
              fi
              if [ -f "/seed/data-sources-permissions.json" ]; then
                cp "/seed/data-sources-permissions.json" "${permissions_file}"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: workspace-seed
              mountPath: /seed
              readOnly: true
        {{- end }}
        - name: cloudbeaver-runtime-config
          image: docker.io/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /workspace/.data
              cp /config/cloudbeaver.runtime.conf /workspace/.data/.cloudbeaver.runtime.conf
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cloudbeaver-config
              mountPath: /config
              readOnly: true
      containers:
        - name: cloudbeaver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLOUDBEAVER_WEB_SERVER_PORT
              value: {{ printf "%v" $port | quote }}
            {{- if $cloudbeaverServerUrl }}
            - name: CB_SERVER_URL
              value: {{ $cloudbeaverServerUrl | quote }}
            {{- end }}
            - name: CB_ADMIN_NAME
              value: {{ $authAdminUsername | quote }}
            - name: CB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $authAdminPasswordSecretKey }}
            {{- if $sharedAccessEnabled }}
            - name: CB_SHARED_CONNECTION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessConnectionIdKey }}
            - name: CB_SHARED_CONNECTION_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessProjectIdKey }}
                  optional: true
            - name: CB_SHARED_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessBootstrapUsernameKey }}
            - name: CB_SHARED_BOOTSTRAP_GROUPS
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessBootstrapGroupsKey }}
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $sharedAccessEnabled }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    (
                    set +e
                    if [ -z "${CB_SHARED_CONNECTION_ID:-}" ] || [ -z "${CB_SHARED_BOOTSTRAP_USERNAME:-}" ]; then
                      exit 0
                    fi
                    project_id="${CB_SHARED_CONNECTION_PROJECT_ID:-g_GlobalConfiguration}"
                    bootstrap_groups="${CB_SHARED_BOOTSTRAP_GROUPS:-{{ $adminTeam }},{{ $defaultUserTeam }}}"
                    expected_catalog={{ $sharedAccessExpectedCatalog | quote }}
                    for _ in $(seq 1 90); do
                      if curl -fsS "http://127.0.0.1:{{ $port }}/status" >/dev/null 2>&1; then
                        break
                      fi
                      sleep 2
                    done
                    tmp_dir="$(mktemp -d)"
                    trap 'rm -rf "$tmp_dir"' EXIT
                    subjects_json="["
                    old_ifs="${IFS}"
                    IFS=','
                    set -- ${bootstrap_groups}
                    IFS="${old_ifs}"
                    for subject in "$@"; do
                      subject="$(printf '%s' "${subject}" | tr -d '[:space:]')"
                      if [ -z "${subject}" ]; then
                        continue
                      fi
                      if [ "${subjects_json}" != "[" ]; then
                        subjects_json="${subjects_json},"
                      fi
                      subjects_json="${subjects_json}\"${subject}\""
                    done
                    subjects_json="${subjects_json}]"
                    if [ "${subjects_json}" = "[]" ]; then
                      subjects_json="[\"{{ $adminTeam }}\",\"{{ $defaultUserTeam }}\"]"
                    fi
                    cat >"${tmp_dir}/open-session.json" <<'EOF'
                    {"query":"mutation { openSession { valid } }"}
                    EOF
                    cat >"${tmp_dir}/connection-info.json" <<EOF
                    {"query":"query ConnectionInfo(\$projectId: ID!, \$id: ID!) { connectionInfo(projectId: \$projectId, id: \$id) { nodePath authNeeded credentialsSaved sharedCredentials } }","variables":{"projectId":"${project_id}","id":"${CB_SHARED_CONNECTION_ID}"}}
                    EOF
                    bootstrap_complete=0
                    for _ in $(seq 1 30); do
                      if ! curl -fsS \
                        -c "${tmp_dir}/cookies.txt" \
                        -b "${tmp_dir}/cookies.txt" \
                        -H "Content-Type: application/json" \
                        -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                        -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                        --data @"${tmp_dir}/open-session.json" \
                        "http://127.0.0.1:{{ $port }}/api/gql" >/dev/null; then
                        sleep 2
                        continue
                      fi
                      for subject in "$@"; do
                        subject="$(printf '%s' "${subject}" | tr -d '[:space:]')"
                        if [ -z "${subject}" ]; then
                          continue
                        fi
                        cat >"${tmp_dir}/create-team.json" <<EOF
                    {"query":"query CreateTeam(\$teamId: ID!, \$teamName: String, \$description: String) { createTeam(teamId: \$teamId, teamName: \$teamName, description: \$description) { teamId } }","variables":{"teamId":"${subject}","teamName":"${subject}","description":"Provisioned by CloudBeaver startup bootstrap."}}
                    EOF
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/create-team.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" >/dev/null || true
                      done
                      cat >"${tmp_dir}/set-access.json" <<EOF
                    {"query":"query SetAccess(\$projectId: ID!, \$connectionId: ID!, \$subjects: [ID!]!) { setConnectionSubjectAccess(projectId: \$projectId, connectionId: \$connectionId, subjects: \$subjects) }","variables":{"projectId":"${project_id}","connectionId":"${CB_SHARED_CONNECTION_ID}","subjects":${subjects_json}}}
                    EOF
                      access_response="$(
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/set-access.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" || true
                      )"
                      connection_info="$(
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/connection-info.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" || true
                      )"
                      node_path="$(printf '%s' "${connection_info}" | sed -n 's/.*"nodePath":"\([^"]*\)".*/\1/p')"
                      if [ -z "${node_path}" ]; then
                        sleep 2
                        continue
                      fi
                      cat >"${tmp_dir}/navigator.json" <<EOF
                    {"query":"query NavNodeChildren(\$parentPath: ID!) { navNodeChildren(parentPath: \$parentPath) { name plainName nodeType hasChildren } }","variables":{"parentPath":"${node_path}"}}
                    EOF
                      navigator_response="$(
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/navigator.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" || true
                      )"
                      if printf '%s' "${access_response}" | grep -Eq '"setConnectionSubjectAccess":[[:space:]]*true' \
                        && printf '%s' "${navigator_response}" | tr -d '[:space:]' | grep -Fq "\"name\":\"${expected_catalog}\""; then
                        bootstrap_complete=1
                        break
                      fi
                      sleep 2
                    done
                    if [ "${bootstrap_complete}" != "1" ]; then
                      echo "WARN: CloudBeaver shared Trino bootstrap did not confirm expected catalog '${expected_catalog}' during postStart; continuing startup." >&2
                    fi
                    exit 0
                    ) >/proc/1/fd/1 2>/proc/1/fd/2 &
                    exit 0
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: cloudbeaver-config
              mountPath: /opt/cloudbeaver/conf/cloudbeaver.conf
              subPath: cloudbeaver.conf
              readOnly: true
            {{- if $seedTeamsExistingSecret }}
            - name: cloudbeaver-teams-seed
              mountPath: /opt/cloudbeaver/conf/initial-data.conf
              subPath: {{ $seedTeamsDataKey }}
              readOnly: true
            {{- end }}
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
            {{- if $h2FreshSchemaPatchEnabled }}
            - name: cloudbeaver-security-plugin-patch
              mountPath: /opt/cloudbeaver/server/plugins/{{ $h2FreshSchemaPatchPluginJar }}
              subPath: {{ $h2FreshSchemaPatchPluginJar }}
              readOnly: true
            {{- end }}
            {{- if $trustedCertsSecret }}
            - name: cloudbeaver-trusted-certs
              mountPath: {{ $customCertsPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: cloudbeaver-config
          configMap:
            name: {{ $serviceName }}-config
        {{- if $seedTeamsExistingSecret }}
        - name: cloudbeaver-teams-seed
          secret:
            secretName: {{ $seedTeamsExistingSecret }}
        {{- end }}
        {{- if $trustedCertsSecret }}
        - name: cloudbeaver-trusted-certs
          secret:
            secretName: {{ $trustedCertsSecret }}
        {{- end }}
        {{- if $seedConnectionsExistingSecret }}
        - name: workspace-seed
          secret:
            secretName: {{ $seedConnectionsExistingSecret }}
        {{- end }}
        {{- if $h2FreshSchemaPatchEnabled }}
        - name: cloudbeaver-security-plugin-patch
          emptyDir: {}
        {{- end }}
        - name: workspace
          {{- if default false $workspacePersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workspace" $serviceName) $workspacePersistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
