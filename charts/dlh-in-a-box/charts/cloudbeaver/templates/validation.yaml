{{- /*
Self-contained CloudBeaver sanity checks.
*/ -}}
{{- if .Values.enabled -}}
{{- $auth := .Values.auth | default dict -}}
{{- $authAdmin := get $auth "admin" | default dict -}}
{{- $authLocal := get $auth "local" | default dict -}}
{{- $authProxy := get $auth "proxy" | default dict -}}
{{- $seed := .Values.seed | default dict -}}
{{- $seedConnections := get $seed "connections" | default dict -}}
{{- $seedConnectionsForce := default false $seedConnections.force -}}
{{- $h2FreshSchemaPatch := get .Values "h2FreshSchemaPatch" | default dict -}}
{{- $h2FreshSchemaPatchEnabled := default false $h2FreshSchemaPatch.enabled -}}
{{- $h2FreshSchemaPatchPluginJar := default "" $h2FreshSchemaPatch.pluginJar -}}
{{- if not (or (default false $authLocal.enabled) (default false $authProxy.enabled)) -}}
{{- fail "cloudbeaver: at least one of auth.local.enabled or auth.proxy.enabled must be true when cloudbeaver.enabled=true." -}}
{{- end -}}
{{- if not (default "" $authAdmin.existingSecret) -}}
{{- fail "cloudbeaver.auth.admin.existingSecret is required when CloudBeaver is enabled." -}}
{{- end -}}
{{- if and $h2FreshSchemaPatchEnabled (not $seedConnectionsForce) -}}
{{- fail "cloudbeaver.h2FreshSchemaPatch.enabled requires cloudbeaver.seed.connections.force=true because it is only safe for intentionally fresh CloudBeaver workspaces." -}}
{{- end -}}
{{- if and $h2FreshSchemaPatchEnabled (not $h2FreshSchemaPatchPluginJar) -}}
{{- fail "cloudbeaver.h2FreshSchemaPatch.pluginJar is required when cloudbeaver.h2FreshSchemaPatch.enabled=true." -}}
{{- end -}}
{{- end -}}
