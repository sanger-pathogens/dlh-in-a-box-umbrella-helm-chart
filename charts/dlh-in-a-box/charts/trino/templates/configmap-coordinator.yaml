{{- $coordinatorJmx := merge .Values.jmx.coordinator (omit .Values.jmx "coordinator" "worker") -}}
{{- $identity := get .Values.global "identity" | default (dict) -}}
{{- $provider := get $identity "provider" | default (dict) -}}
{{- $keycloakProvider := get $provider "keycloak" | default (dict) -}}
{{- $externalIdentity := get $identity "external" | default (dict) -}}
{{- $oidc := get $externalIdentity "oidc" | default (dict) -}}
{{- $identityClients := get $externalIdentity "clients" | default (dict) -}}
{{- $trinoIdentity := get $identityClients "trino" | default (dict) -}}
{{- $directory := get $identity "directory" | default (dict) -}}
{{- $directoryMode := default "externalLdap" (get $directory "mode") -}}
{{- $keycloakLocalMode := eq $directoryMode "keycloakLocal" -}}
{{- $ldap := get $directory "ldap" | default (dict) -}}
{{- $authorization := get .Values.global "authorization" | default (dict) -}}
{{- $ranger := get $authorization "ranger" | default (dict) -}}
{{- $rangerTrino := get $ranger "trino" | default (dict) -}}
{{- $identityEnabled := and (default false $identity.enabled) (default false $trinoIdentity.enabled) -}}
{{- $legacyPasswordAuthRequested := contains "PASSWORD" (default "" .Values.server.config.authenticationType) -}}
{{- $passwordAuthRequested := and $identityEnabled (default false $trinoIdentity.passwordAuthEnabled) -}}
{{- $ldapDirectoryEnabled := and $identityEnabled (default false $ldap.enabled) -}}
{{- $passwordAuthMode := default "ldap" $trinoIdentity.passwordAuthMode -}}
{{- $ldapPasswordAuthEnabled := and $passwordAuthRequested (or (eq $passwordAuthMode "ldap") (eq $passwordAuthMode "ldap-file")) -}}
{{- $filePasswordAuthEnabled := and $passwordAuthRequested (or (eq $passwordAuthMode "file") (eq $passwordAuthMode "ldap-file")) -}}
{{- $multiPasswordAuthEnabled := and $ldapPasswordAuthEnabled $filePasswordAuthEnabled -}}
{{- $ldapEnabled := and $ldapDirectoryEnabled $ldapPasswordAuthEnabled -}}
{{- $ldapGroupProviderEnabled := and $ldapEnabled (default false $trinoIdentity.groupProviderEnabled) -}}
{{- $rangerEnabled := default false $ranger.enabled -}}
{{- $issuer := include "dlh-in-a-box.identity.issuer" . -}}
{{- $authUrl := include "dlh-in-a-box.identity.authorizeUrl" . -}}
{{- $tokenUrl := include "dlh-in-a-box.identity.internalAccessTokenUrl" . -}}
{{- $jwksUrl := include "dlh-in-a-box.identity.internalJwksUri" . -}}
{{- $apiBaseUrl := include "dlh-in-a-box.identity.apiBaseUrl" . -}}
{{- $ldapUrl := include "dlh-in-a-box.identity.directory.url" . -}}
{{- $ldapUserBaseDn := include "dlh-in-a-box.identity.directory.userBaseDn" . -}}
{{- $ldapGroupBaseDn := include "dlh-in-a-box.identity.directory.groupBaseDn" . -}}
{{- $ldapBindDn := include "dlh-in-a-box.identity.directory.bindDn" . -}}
{{- $ldapTrustedCaSecretName := include "dlh-in-a-box.identity.directory.trustedCaSecretName" . -}}
{{- $ldapTrustedCaCertKey := include "dlh-in-a-box.identity.directory.trustedCaCertKey" . -}}
{{- $ldapUsernameAttribute := default "uid" $ldap.usernameAttribute -}}
{{- $ldapAllowInsecure := default false $ldap.allowInsecure -}}
{{- $ldapTrustedCaPath := printf "%s/auth/ldap/ca/%s" .Values.server.config.path $ldapTrustedCaCertKey -}}
{{- $ldapUseTrustedCa := and $ldapEnabled (not $ldapAllowInsecure) $ldapTrustedCaSecretName -}}
{{- $ldapUserBindPattern := default (default "" $ldap.userBindPattern) $trinoIdentity.ldapUserBindPattern -}}
{{- $bootstrapUsersEnabled := gt (len (default (list) $keycloakProvider.bootstrapUsers)) 0 -}}
{{- $bootstrapOnlyMode := and $bootstrapUsersEnabled (not $ldapEnabled) -}}
{{- $rangerTrinoEnabled := and $rangerEnabled (default false $rangerTrino.enabled) (not $bootstrapOnlyMode) -}}
{{- if $identityEnabled }}
  {{- if not $issuer }}{{- fail "An OIDC issuer is required when Trino identity integration is enabled. Set global.identity.external.oidc.issuer or use identity.provider.mode=bundledKeycloak." }}{{- end }}
  {{- if not $trinoIdentity.clientId }}{{- fail "global.identity.external.clients.trino.clientId is required when Trino identity integration is enabled." }}{{- end }}
  {{- if not $trinoIdentity.existingSecret }}{{- fail "global.identity.external.clients.trino.existingSecret is required when Trino identity integration is enabled." }}{{- end }}
  {{- if not $trinoIdentity.sharedSecretExistingSecret }}{{- fail "global.identity.external.clients.trino.sharedSecretExistingSecret is required when Trino identity integration is enabled." }}{{- end }}
  {{- if and $passwordAuthRequested (not (or $ldapPasswordAuthEnabled $filePasswordAuthEnabled)) }}{{- fail "global.identity.external.clients.trino.passwordAuthMode must be one of ldap, file, or ldap-file when Trino PASSWORD auth is enabled." }}{{- end }}
  {{- if and $keycloakLocalMode $ldapPasswordAuthEnabled }}{{- fail "global.identity.external.clients.trino.passwordAuthMode must be file when global.identity.directory.mode=keycloakLocal. LDAP PASSWORD auth is not allowed in that mode." }}{{- end }}
  {{- if and $ldapPasswordAuthEnabled (not $ldapDirectoryEnabled) }}{{- fail "global.identity.directory.ldap.enabled must be true when Trino LDAP PASSWORD auth is enabled through the shared identity contract." }}{{- end }}
  {{- if and $ldapEnabled (not $ldapUrl) }}{{- fail "global.identity.directory.ldap.url is required when Trino identity integration is enabled." }}{{- end }}
  {{- if and $ldapEnabled (not $ldapUserBaseDn) }}{{- fail "global.identity.directory.ldap.userBaseDn is required when Trino identity integration is enabled." }}{{- end }}
  {{- if and $ldapEnabled (not $ldapGroupBaseDn) }}{{- fail "global.identity.directory.ldap.groupBaseDn is required when Trino identity integration is enabled." }}{{- end }}
  {{- if and $ldapEnabled (not $ldapBindDn) }}{{- fail "global.identity.directory.ldap.bindDistinguishedName is required when Trino identity integration is enabled." }}{{- end }}
  {{- if and $ldapEnabled (not (include "dlh-in-a-box.identity.directory.bindSecretName" .)) }}{{- fail "global.identity.directory.ldap.bindExistingSecret is required when Trino identity integration is enabled." }}{{- end }}
  {{- if $legacyPasswordAuthRequested }}{{- fail "Use global.identity.external.clients.trino.passwordAuthEnabled instead of trino.server.config.authenticationType=PASSWORD when shared identity is enabled." }}{{- end }}
  {{- if and $ldapPasswordAuthEnabled (not $ldapUserBindPattern) }}{{- fail "global.identity.directory.ldap.userBindPattern is required when Trino LDAP PASSWORD auth is enabled against the shared organizational directory." }}{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "trino.coordinator" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
data:
  node.properties: |
    node.environment={{ .Values.server.node.environment }}
    node.data-dir={{ .Values.server.node.dataDir }}
    plugin.dir={{ .Values.server.node.pluginDir }}
  {{- range $configValue := .Values.additionalNodeProperties }}
    {{ $configValue }}
  {{- end }}

  jvm.config: |
    -server
    -agentpath:/usr/lib/trino/bin/libjvmkill.so
    -Xmx{{ .Values.coordinator.jvm.maxHeapSize }}
    -XX:+{{ .Values.coordinator.jvm.gcMethod.type }}
    -XX:G1HeapRegionSize={{ .Values.coordinator.jvm.gcMethod.g1.heapRegionSize }}
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=512M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
    # Allow loading dynamic agent used by JOL
    -XX:+EnableDynamicAgentLoading
  {{/* only check the version number if the image is not overriden in any way */}}
  {{- with .Values.image -}}
  {{- if and (eq .repository "trinodb/trino") (not .useRepositoryAsSoleImageReference) (not .registry) (not .digest) (gt (default $.Chart.AppVersion .tag | int ) 447 ) }}
    # https://bugs.openjdk.org/browse/JDK-8329528
    -XX:+UnlockDiagnosticVMOptions
    -XX:G1NumCollectionsKeepPinned=10000000
  {{- end }}{{/* if */}}
  {{- end }}{{/* with */}}
  {{- range $configValue := .Values.coordinator.additionalJVMConfig }}
    {{ $configValue }}
  {{- end }}
  {{- if $coordinatorJmx.enabled }}
    -Dcom.sun.management.jmxremote.rmi.port={{- $coordinatorJmx.serverPort }}
  {{- end }}

  config.properties: |
    coordinator=true
    {{- if gt (int .Values.server.workers) 0 }}
    node-scheduler.include-coordinator=false
    {{- else }}
    node-scheduler.include-coordinator=true
    {{- end }}
    http-server.http.port={{ .Values.service.port }}
    query.max-memory={{ .Values.server.config.query.maxMemory }}
    query.max-memory-per-node={{ .Values.coordinator.config.query.maxMemoryPerNode }}
    {{- if .Values.coordinator.config.memory.heapHeadroomPerNode }}
    memory.heap-headroom-per-node={{ .Values.coordinator.config.memory.heapHeadroomPerNode }}
    {{- end }}
    discovery.uri=http://localhost:{{ .Values.service.port }}
    {{- $internalSharedSecret := include "trino.internalCommunicationSharedSecret" . }}
    {{- if $identityEnabled }}
    http-server.process-forwarded={{ default true $oidc.processForwardedHeaders }}
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
    http-server.authentication.type={{ ternary "OAUTH2,PASSWORD" "OAUTH2" $passwordAuthRequested }}
    http-server.authentication.oauth2.issuer={{ $issuer }}
    http-server.authentication.oauth2.oidc.discovery=false
    http-server.authentication.oauth2.auth-url={{ $authUrl }}
    http-server.authentication.oauth2.token-url={{ $tokenUrl }}
    http-server.authentication.oauth2.jwks-url={{ $jwksUrl }}
    http-server.authentication.oauth2.end-session-url={{ printf "%s/logout" $apiBaseUrl }}
    http-server.authentication.oauth2.client-id={{ $trinoIdentity.clientId }}
    http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_CLIENT_SECRET}
    http-server.authentication.oauth2.principal-field={{ default "email" $oidc.usernameClaim }}
    {{- if $oidc.scopes }}
    http-server.authentication.oauth2.scopes={{ join "," $oidc.scopes }}
    {{- end }}
    {{- if $passwordAuthRequested }}
    http-server.authentication.password.user-mapping.pattern={{ default "([^@]+)" $oidc.userMappingPattern }}
    {{- if $multiPasswordAuthEnabled }}
    password-authenticator.config-files={{ .Values.server.config.path }}/file-authenticator.properties,{{ .Values.server.config.path }}/ldap-authenticator.properties
    {{- end }}
    {{- end }}
    {{- else if .Values.server.config.authenticationType }}
    http-server.authentication.type={{ .Values.server.config.authenticationType }}
    {{- end }}
    {{- if and (not $identityEnabled) $internalSharedSecret }}
    internal-communication.shared-secret={{ $internalSharedSecret }}
    {{- end }}
    {{- range $configValue := .Values.additionalConfigProperties }}
    {{- if and $identityEnabled (hasPrefix "internal-communication.shared-secret=" $configValue) }}
    {{- else }}
    {{ $configValue }}
    {{- end }}
    {{- end }}
    {{- if .Values.server.config.https.enabled }}
    http-server.https.enabled=true
    http-server.https.port={{ .Values.server.config.https.port }}
    http-server.https.keystore.path={{ .Values.server.config.https.keystore.path }}
    {{- end }}
    {{- if $coordinatorJmx.enabled }}
    jmx.rmiregistry.port={{- $coordinatorJmx.registryPort }}
    jmx.rmiserver.port={{- $coordinatorJmx.serverPort }}
    {{- end }}
    {{- if .Values.worker.gracefulShutdown.enabled }}
    shutdown.grace-period={{- .Values.worker.gracefulShutdown.gracePeriodSeconds -}}s
    {{- end }}
    {{- if .Values.server.coordinatorExtraConfig }}
    {{- .Values.server.coordinatorExtraConfig | nindent 4 }}
    {{- end }}

{{- if $rangerTrinoEnabled }}
  access-control.properties: |
    access-control.name=ranger
    ranger.service.name={{ default "trino" $ranger.serviceName }}
    ranger.plugin.config.resource={{ .Values.server.config.path }}/ranger-trino-security.xml,{{ .Values.server.config.path }}/ranger-trino-audit.xml,{{ .Values.server.config.path }}/ranger-policymgr-ssl.xml

  ranger-trino-security.xml: |
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <property>
        <name>ranger.plugin.trino.service.name</name>
        <value>{{ default "trino" $ranger.serviceName }}</value>
      </property>
      <property>
        <name>ranger.plugin.trino.policy.source.impl</name>
        <value>org.apache.ranger.admin.client.RangerAdminRESTClient</value>
      </property>
      <property>
        <name>ranger.plugin.trino.policy.rest.url</name>
        <value>{{ include "dlh-in-a-box.ranger.admin.url" . }}</value>
      </property>
      <property>
        <name>ranger.plugin.trino.policy.rest.ssl.config.file</name>
        <value>{{ .Values.server.config.path }}/ranger-policymgr-ssl.xml</value>
      </property>
      <property>
        <name>ranger.plugin.trino.policy.pollIntervalMs</name>
        <value>30000</value>
      </property>
      <property>
        <name>ranger.plugin.trino.policy.rest.client.connection.timeoutMs</name>
        <value>30000</value>
      </property>
      <property>
        <name>ranger.plugin.trino.policy.rest.client.read.timeoutMs</name>
        <value>30000</value>
      </property>
      <property>
        <name>ranger.plugin.trino.policy.cache.dir</name>
        <value>/tmp</value>
      </property>
      <property>
        <name>ranger.plugin.trino.use.rangerGroups</name>
        <value>{{ ternary "true" "false" (default false $ranger.useRangerGroups) }}</value>
      </property>
      <property>
        <name>ranger.plugin.trino.use.only.rangerGroups</name>
        <value>{{ ternary "true" "false" (default false $ranger.useRangerGroups) }}</value>
      </property>
    </configuration>

  ranger-trino-audit.xml: |
    <?xml version="1.0"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration xmlns:xi="http://www.w3.org/2001/XInclude">
      <property>
        <name>xasecure.audit.is.enabled</name>
        <value>{{ ternary "true" "false" (eq (default "log4j" $rangerTrino.auditMode) "log4j") }}</value>
      </property>
      <property>
        <name>xasecure.audit.hdfs.is.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>xasecure.audit.log4j.is.enabled</name>
        <value>{{ ternary "true" "false" (eq (default "log4j" $rangerTrino.auditMode) "log4j") }}</value>
      </property>
      <property>
        <name>xasecure.audit.log4j.is.async</name>
        <value>true</value>
      </property>
      <property>
        <name>xasecure.audit.log4j.async.max.queue.size</name>
        <value>10240</value>
      </property>
      <property>
        <name>xasecure.audit.log4j.async.max.flush.interval.ms</name>
        <value>30000</value>
      </property>
      <property>
        <name>xasecure.audit.trino.is.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>xasecure.audit.solr.is.enabled</name>
        <value>false</value>
      </property>
    </configuration>

  ranger-policymgr-ssl.xml: |
    <?xml version="1.0"?>
    <configuration />
{{- else if .Values.accessControl }}
  {{- if eq .Values.accessControl.type "configmap" }}
  access-control.properties: |
    access-control.name=file
    {{- if .Values.accessControl.refreshPeriod }}
    security.refresh-period={{ .Values.accessControl.refreshPeriod }}
    {{- end }}
    security.config-file={{ .Values.server.config.path }}/access-control/{{ .Values.accessControl.configFile | default "rules.json" }}
  {{- else if eq .Values.accessControl.type "properties" }}
  access-control.properties: |
    {{- if .Values.accessControl.properties }}
    {{- .Values.accessControl.properties | nindent 4 }}
    {{- else}}
    {{- fail "accessControl.properties is required when accessControl.type is 'properties'." }}
    {{- end }}
  {{- else}}
  {{- fail "Invalid accessControl.type value. It must be either 'configmap' or 'properties'." }}
  {{- end }}
{{- end }}

{{- if .Values.resourceGroups }}
  {{- if eq .Values.resourceGroups.type "configmap" }}
  resource-groups.properties: |
    resource-groups.configuration-manager=file
    resource-groups.config-file={{ .Values.server.config.path }}/resource-groups/resource-groups.json
  {{- else if eq .Values.resourceGroups.type "properties" }}
  resource-groups.properties: |
    {{- if .Values.resourceGroups.properties }}
    {{- .Values.resourceGroups.properties | nindent 4 }}
    {{- else}}
    {{- fail "resourceGroups.properties is required when resourceGroups.type is 'properties'." }}
    {{- end }}
  {{- else}}
  {{- fail "Invalid resourceGroups.type value. It must be either 'configmap' or 'properties'." }}
  {{- end }}
{{- end }}

{{- if .Values.server.exchangeManager }}
  exchange-manager.properties: |
    exchange-manager.name={{ .Values.server.exchangeManager.name }}
    exchange.base-directories={{ .Values.server.exchangeManager.baseDir }}
  {{- range $configValue := .Values.additionalExchangeManagerProperties }}
    {{ $configValue }}
  {{- end }}
{{- end }}

  log.properties: |
    io.trino={{ .Values.server.log.trino.level }}
  {{- range $configValue := .Values.additionalLogProperties }}
    {{ $configValue }}
  {{- end }}

  {{- if and $identityEnabled $passwordAuthRequested $multiPasswordAuthEnabled }}
  {{- if not (index .Values.coordinator.additionalConfigFiles "ldap-authenticator.properties") }}
  ldap-authenticator.properties: |
    password-authenticator.name=ldap
    ldap.url={{ $ldapUrl }}
    ldap.allow-insecure={{ $ldapAllowInsecure }}
    {{- if $ldapUseTrustedCa }}
    ldap.ssl.truststore.path={{ $ldapTrustedCaPath }}
    {{- end }}
    ldap.user-bind-pattern={{ $ldapUserBindPattern }}
  {{- end }}
  {{- if not (index .Values.coordinator.additionalConfigFiles "file-authenticator.properties") }}
  file-authenticator.properties: |
    password-authenticator.name=file
    file.password-file={{ .Values.server.config.path }}/auth/password/password.db
  {{- end }}
  {{- else if and $identityEnabled $passwordAuthRequested }}{{- if not (index .Values.coordinator.additionalConfigFiles "password-authenticator.properties") }}
  password-authenticator.properties: |
    {{- if $ldapPasswordAuthEnabled }}
    password-authenticator.name=ldap
    ldap.url={{ $ldapUrl }}
    ldap.allow-insecure={{ $ldapAllowInsecure }}
    {{- if $ldapUseTrustedCa }}
    ldap.ssl.truststore.path={{ $ldapTrustedCaPath }}
    {{- end }}
    ldap.user-bind-pattern={{ $ldapUserBindPattern }}
    {{- else if $filePasswordAuthEnabled }}
    password-authenticator.name=file
    file.password-file={{ .Values.server.config.path }}/auth/password/password.db
    {{- end }}
  {{- end }}{{- else if $legacyPasswordAuthRequested }}{{- if not (index .Values.coordinator.additionalConfigFiles "password-authenticator.properties") }}
  password-authenticator.properties: |
    password-authenticator.name=file
    file.password-file={{ .Values.server.config.path }}/auth/password/password.db
  {{- end }}{{- end }}

  {{- if $ldapGroupProviderEnabled }}{{- if not (index .Values.coordinator.additionalConfigFiles "group-provider.properties") }}
  group-provider.properties: |
    group-provider.name=ldap
    group-provider.group-case=lower
    ldap.url={{ $ldapUrl }}
    ldap.allow-insecure={{ $ldapAllowInsecure }}
    {{- if $ldapUseTrustedCa }}
    ldap.ssl.truststore.path={{ $ldapTrustedCaPath }}
    {{- end }}
    ldap.admin-user={{ $ldapBindDn }}
    ldap.admin-password=${ENV:TRINO_LDAP_BIND_PASSWORD}
    ldap.group-name-attribute={{ default "cn" $ldap.groupNameAttribute }}
    ldap.user-base-dn={{ $ldapUserBaseDn }}
    ldap.user-search-filter={{ default (printf "(%s={0})" $ldapUsernameAttribute) $ldap.userSearchFilter }}
    ldap.use-group-filter={{ ternary "true" "false" (default false $ldap.useGroupFilter) }}
    {{- if default false $ldap.useGroupFilter }}
    ldap.group-base-dn={{ $ldapGroupBaseDn }}
    ldap.group-search-filter={{ default "(cn=trino_*)" $ldap.groupSearchFilter }}
    ldap.group-search-member-attribute={{ default "member" $ldap.groupSearchMemberAttribute }}
    {{- else }}
    ldap.user-member-of-attribute={{ default "memberOf" $ldap.userMemberOfAttribute }}
    {{- end }}
  {{- end }}{{- else if .Values.auth.groups }}{{- if not (index .Values.coordinator.additionalConfigFiles "group-provider.properties") }}
  group-provider.properties: |
    group-provider.name=file
    file.group-file={{ .Values.server.config.path }}/auth/group/group.db
    {{- if .Values.auth.refreshPeriod }}
    file.refresh-period={{ .Values.auth.refreshPeriod }}
    {{- end }}
  {{- end }}{{- end }}

{{ if .Values.eventListenerProperties }}
  event-listener.properties: |
  {{- range $configValue := .Values.eventListenerProperties }}
    {{ $configValue }}
  {{- end }}
{{ end }}

{{- range $fileName, $fileContent := .Values.coordinator.additionalConfigFiles }}
  {{ $fileName }}: |
    {{- tpl $fileContent $ | nindent 4 }}
{{- end }}
{{- if eq .Values.resourceGroups.type "configmap" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "trino.fullname" . }}-resource-groups-volume-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
data:
  resource-groups.json: |-
    {{- .Values.resourceGroups.resourceGroupsConfig | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "trino.fullname" . }}-schemas-volume-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
data:
  {{- range $key, $val := .Values.kafka.tableDescriptions }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
