{{- if .Values.cloudbeaver.enabled }}
{{- $serviceName := include "dlh-in-a-box.cloudbeaver.serviceName" . -}}
{{- $port := default 8978 .Values.cloudbeaver.service.port -}}
{{- $auth := .Values.cloudbeaver.auth | default dict -}}
{{- $authAdmin := get $auth "admin" | default dict -}}
{{- $authLocal := get $auth "local" | default dict -}}
{{- $authProxy := get $auth "proxy" | default dict -}}
{{- $seed := .Values.cloudbeaver.seed | default dict -}}
{{- $seedTeams := get $seed "teams" | default dict -}}
{{- $seedConnections := get $seed "connections" | default dict -}}
{{- $appConfig := .Values.cloudbeaver.app | default dict -}}
{{- $workspace := .Values.cloudbeaver.workspace | default dict -}}
{{- $workspacePersistence := get $workspace "persistence" | default dict -}}
{{- $trustedCa := .Values.cloudbeaver.trustedCa | default dict -}}
{{- $authAdminExistingSecret := default "" $authAdmin.existingSecret -}}
{{- $authAdminUsername := default "cbadmin" $authAdmin.username -}}
{{- $authAdminPasswordSecretKey := default "admin-password" $authAdmin.passwordSecretKey -}}
{{- $authLocalEnabled := default false $authLocal.enabled -}}
{{- $seedTeamsExistingSecret := default "" $seedTeams.existingSecret -}}
{{- $seedTeamsDataKey := default "initial-data.conf" $seedTeams.dataKey -}}
{{- $seedConnectionsExistingSecret := default "" $seedConnections.existingSecret -}}
{{- $seedConnectionsDataSourcesKey := default "data-sources.json" $seedConnections.dataSourcesKey -}}
{{- $seedConnectionsForce := default false $seedConnections.force -}}
{{- $h2FreshSchemaPatch := get .Values.cloudbeaver "h2FreshSchemaPatch" | default dict -}}
{{- $h2FreshSchemaPatchEnabled := default false $h2FreshSchemaPatch.enabled -}}
{{- $h2FreshSchemaPatchPluginJar := default "" $h2FreshSchemaPatch.pluginJar -}}
{{- if and $h2FreshSchemaPatchEnabled (not $seedConnectionsForce) -}}
  {{- fail "cloudbeaver.h2FreshSchemaPatch.enabled requires cloudbeaver.seed.connections.force=true because it is only safe for intentionally fresh CloudBeaver workspaces." -}}
{{- end -}}
{{- if and $h2FreshSchemaPatchEnabled (not $h2FreshSchemaPatchPluginJar) -}}
  {{- fail "cloudbeaver.h2FreshSchemaPatch.pluginJar is required when cloudbeaver.h2FreshSchemaPatch.enabled=true." -}}
{{- end -}}
{{- $sharedAccess := get $seedConnections "sharedAccess" | default dict -}}
{{- $sharedAccessEnabled := default false $sharedAccess.enabled -}}
{{- $sharedAccessConnectionIdKey := default "shared-connection-id" $sharedAccess.connectionIdKey -}}
{{- $sharedAccessProjectIdKey := default "shared-project-id" $sharedAccess.projectIdKey -}}
{{- $sharedAccessUsernameKey := default "shared-connection-username" $sharedAccess.usernameKey -}}
{{- $sharedAccessPasswordKey := default "shared-connection-password" $sharedAccess.passwordKey -}}
{{- $sharedAccessBootstrapUsernameKey := default "shared-bootstrap-username" $sharedAccess.bootstrapUsernameKey -}}
{{- $sharedAccessBootstrapGroupsKey := default "shared-bootstrap-groups" $sharedAccess.bootstrapGroupsKey -}}
{{- $sharedAccessExpectedCatalog := default "redcap" $sharedAccess.expectedCatalog -}}
{{- $trustedCaSecret := default "" $trustedCa.existingSecret -}}
{{- $trustedCaCertKey := default "ca.crt" $trustedCa.certKey -}}
{{- $trustStorePath := default "/opt/cloudbeaver/trust/cloudbeaver-trino-truststore.p12" $trustedCa.trustStorePath -}}
{{- $trustStorePassword := default "changeit" $trustedCa.trustStorePassword -}}
{{- $trustStoreType := default "PKCS12" $trustedCa.trustStoreType -}}
{{- $trustStoreMountPath := dir $trustStorePath -}}
{{- $trustStoreFileName := base $trustStorePath -}}
{{- $trustedCaInitImage := get $trustedCa "initImage" | default dict -}}
{{- $trustedCaInitImageRepository := default "eclipse-temurin" $trustedCaInitImage.repository -}}
{{- $trustedCaInitImageTag := default "21-jdk" $trustedCaInitImage.tag -}}
{{- $trustedCaInitImagePullPolicy := default "IfNotPresent" $trustedCaInitImage.pullPolicy -}}
{{- $global := .Values.global | default dict -}}
{{- $identity := get $global "identity" | default dict -}}
{{- $accessModelRoles := fromJson (include "dlh-in-a-box.identity.accessModelRolesJson" .) -}}
{{- $cloudbeaverRoles := list -}}
{{- range $roleName := keys $accessModelRoles | sortAlpha -}}
  {{- $role := get $accessModelRoles $roleName | default dict -}}
  {{- if default false (get (get $role "appAccess" | default dict) "cloudbeaver") -}}
    {{- $cloudbeaverRoles = uniq (append $cloudbeaverRoles (toString $roleName)) -}}
  {{- end -}}
{{- end -}}
{{- $derivedDefaultUserTeam := default "" (first $cloudbeaverRoles) -}}
{{- $derivedAdminTeam := "platform-admin" -}}
{{- $defaultUserTeam := default $derivedDefaultUserTeam $appConfig.defaultUserTeam -}}
{{- $adminTeam := default $derivedAdminTeam $appConfig.adminTeam -}}
{{- $reverseProxyAuthEnabled := default false $authProxy.enabled -}}
{{- $enforceRuntimeConfig := $reverseProxyAuthEnabled -}}
{{- if hasKey $appConfig "enforceRuntimeConfig" -}}
  {{- $enforceRuntimeConfig = get $appConfig "enforceRuntimeConfig" -}}
{{- end -}}
{{- /*
  enabledAuthProviders is additive, not exclusive: reverseProxy (Keycloak via
  oauth2-proxy) and local (native cbadmin login) can both be registered at
  once. oauth2-proxy sends userHeader on every proxied request, so CloudBeaver
  auto-authenticates via reverseProxy and never surfaces the local login
  screen on that path; local only becomes reachable by bypassing oauth2-proxy
  and hitting the CloudBeaver Service directly with no forwarded-username
  header present, which is the deliberate break-glass path for auth.local.
*/ -}}
{{- $enabledAuthProviders := list -}}
{{- if $reverseProxyAuthEnabled -}}
  {{- $enabledAuthProviders = append $enabledAuthProviders "reverseProxy" -}}
{{- end -}}
{{- if $authLocalEnabled -}}
  {{- $enabledAuthProviders = append $enabledAuthProviders "local" -}}
{{- end -}}
{{- $external := get $identity "external" | default dict -}}
{{- $clients := get $external "clients" | default dict -}}
{{- $cloudbeaverIdentity := get $clients "cloudbeaverProxy" | default dict -}}
{{- $cloudbeaverOrigin := first (default (list) (get $cloudbeaverIdentity "webOrigins")) -}}
{{- $logoutUrl := default (printf "%s/oauth2/sign_out" $cloudbeaverOrigin) $authProxy.logoutUrl -}}
{{- $cloudbeaverServerName := default "Data Platform CloudBeaver" $appConfig.serverName -}}
{{- $cloudbeaverServerUrl := "" -}}
{{- $supportsCustomConnections := true -}}
{{- if hasKey $appConfig "supportsCustomConnections" -}}
  {{- $supportsCustomConnections = get $appConfig "supportsCustomConnections" -}}
{{- end -}}
{{- $showReadOnlyConnectionInfo := true -}}
{{- if hasKey $appConfig "showReadOnlyConnectionInfo" -}}
  {{- $showReadOnlyConnectionInfo = get $appConfig "showReadOnlyConnectionInfo" -}}
{{- end -}}
{{- $cloudbeaverSecretManagerEnabled := or (default false $appConfig.secretManagerEnabled) (default false $appConfig.publicCredentialsSaveEnabled) (default false $appConfig.adminCredentialsSaveEnabled) -}}
{{- if $cloudbeaverOrigin -}}
  {{- $cloudbeaverServerUrl = printf "%s/" (trimSuffix "/" $cloudbeaverOrigin) -}}
{{- end -}}
{{- $cloudbeaverForceHttps := hasPrefix "https://" $cloudbeaverServerUrl -}}
{{- $checksums := dict
  "config" ((printf "%s\n%s\n%s\n%s\n%s" (toPrettyJson $authProxy) (toPrettyJson $appConfig) (toPrettyJson $cloudbeaverIdentity) (toPrettyJson $h2FreshSchemaPatch) $logoutUrl) | sha256sum)
  "admin" $authAdminExistingSecret
  "teamsSeed" $seedTeamsExistingSecret
  "connectionsSeed" $seedConnectionsExistingSecret
  "trustedCa" $trustedCaSecret
-}}
{{- with (lookup "v1" "Secret" .Release.Namespace $authAdminExistingSecret) }}
  {{- $_ := set $checksums "admin" (toJson (default dict .data) | sha256sum) -}}
{{- end }}
{{- if $seedTeamsExistingSecret }}
  {{- with (lookup "v1" "Secret" .Release.Namespace $seedTeamsExistingSecret) }}
    {{- $_ := set $checksums "teamsSeed" (toJson (default dict .data) | sha256sum) -}}
  {{- end }}
{{- end }}
{{- if $seedConnectionsExistingSecret }}
  {{- with (lookup "v1" "Secret" .Release.Namespace $seedConnectionsExistingSecret) }}
    {{- $_ := set $checksums "connectionsSeed" (toJson (default dict .data) | sha256sum) -}}
  {{- end }}
{{- end }}
{{- if $trustedCaSecret }}
  {{- with (lookup "v1" "Secret" .Release.Namespace $trustedCaSecret) }}
    {{- $_ := set $checksums "trustedCa" (toJson (default dict .data) | sha256sum) -}}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serviceName }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudbeaver
data:
  cloudbeaver.conf: |
    {
      server: {
        serverPort: {{ $port }},
        forceHttps: {{ ternary "true" "false" (or $cloudbeaverForceHttps (default false $appConfig.forceHttps)) }},
        contentRoot: "web",
        driversLocation: "drivers",
        sslConfigurationPath: "${CLOUDBEAVER_SSL_CONF_PATH:workspace/.data/ssl-config.xml}",
        rootURI: "/",
        serviceURI: "/api/",
        supportedHosts: [],
        expireSessionAfterPeriod: "${CLOUDBEAVER_EXPIRE_SESSION_AFTER_PERIOD:1800000}",
        bindSessionToIp: "${CLOUDBEAVER_BIND_SESSION_TO_IP:disable}",
        develMode: "${CLOUDBEAVER_DEVEL_MODE:false}",
        enableSecurityManager: false,
        sm: {
          enableBruteForceProtection: "${CLOUDBEAVER_BRUTE_FORCE_PROTECTION_ENABLED:true}",
          maxFailedLogin: "${CLOUDBEAVER_MAX_FAILED_LOGINS:10}",
          minimumLoginTimeout: "${CLOUDBEAVER_MINIMUM_LOGIN_TIMEOUT:1}",
          blockLoginPeriod: "${CLOUDBEAVER_BLOCK_PERIOD:300}",
          passwordPolicy: {
            minLength: "${CLOUDBEAVER_POLICY_MIN_LENGTH:8}",
            requireMixedCase: "${CLOUDBEAVER_POLICY_REQUIRE_MIXED_CASE:true}",
            minNumberCount: "${CLOUDBEAVER_POLICY_MIN_NUMBER_COUNT:1}",
            minSymbolCount: "${CLOUDBEAVER_POLICY_MIN_SYMBOL_COUNT:0}"
          }
        },
        database: {
          driver: "${CLOUDBEAVER_DB_DRIVER:h2_embedded_v2}",
          url: "${CLOUDBEAVER_DB_URL:jdbc:h2:${workspace}/.data/cb.h2v2.dat}",
          schema: "${CLOUDBEAVER_DB_SCHEMA:''}",
          user: "${CLOUDBEAVER_DB_USER:''}",
          password: "${CLOUDBEAVER_DB_PASSWORD:''}",
          initialDataConfiguration: "${CLOUDBEAVER_DB_INITIAL_DATA:conf/initial-data.conf}",
          pool: {
            minIdleConnections: "${CLOUDBEAVER_DB_MIN_IDLE_CONNECTIONS:4}",
            maxIdleConnections: "${CLOUDBEAVER_DB_MAX_IDLE_CONNECTIONS:10}",
            maxConnections: "${CLOUDBEAVER_DB_MAX_CONNECTIONS:100}",
            validationQuery: "${CLOUDBEAVER_DB_VALIDATION_QUERY:SELECT 1}"
          },
          backupEnabled: "${CLOUDBEAVER_DB_BACKUP_ENABLED:true}"
        }
      },
      app: {
        anonymousAccessEnabled: false,
        defaultUserTeam: {{ $defaultUserTeam | quote }},
        supportsCustomConnections: {{ ternary "true" "false" $supportsCustomConnections }},
        showReadOnlyConnectionInfo: {{ ternary "true" "false" $showReadOnlyConnectionInfo }},
        publicCredentialsSaveEnabled: {{ ternary "true" "false" (default false $appConfig.publicCredentialsSaveEnabled) }},
        adminCredentialsSaveEnabled: {{ ternary "true" "false" (default false $appConfig.adminCredentialsSaveEnabled) }},
        secretManagerEnabled: {{ ternary "true" "false" $cloudbeaverSecretManagerEnabled }},
        enableReverseProxyAuth: {{ ternary "true" "false" $reverseProxyAuthEnabled }},
        forwardProxy: true,
        linkExternalCredentialsWithUser: true,
        enabledAuthProviders: [
          {{- range $index, $provider := $enabledAuthProviders }}
          {{- if $index }},{{ end }}
          {{ $provider | quote }}
          {{- end }}
        ],
        authConfigurations: [
          {{- if $reverseProxyAuthEnabled }}
          {
            id: "keycloak-proxy",
            provider: "reverseProxy",
            displayName: "Keycloak",
            disabled: false,
            iconURL: "",
            description: "CloudBeaver browser login is delegated to the Keycloak-backed reverse proxy.",
            parameters: {
              "logout-url": {{ $logoutUrl | quote }},
              "user-header": {{ default "X-Forwarded-Preferred-Username" $authProxy.userHeader | quote }},
              "team-header": {{ default "X-Forwarded-Groups" $authProxy.groupHeader | quote }},
              "team-delimiter": {{ default "," $authProxy.groupDelimiter | quote }},
              "first-name-header": {{ default "" $authProxy.firstNameHeader | quote }},
              "last-name-header": {{ default "" $authProxy.lastNameHeader | quote }}
            }
          }
          {{- end }}
        ]
      }
    }
  cloudbeaver.runtime.conf: |
    {
      app: {
        anonymousAccessEnabled: false,
        defaultUserTeam: {{ $defaultUserTeam | quote }},
        supportsCustomConnections: {{ ternary "true" "false" $supportsCustomConnections }},
        showReadOnlyConnectionInfo: {{ ternary "true" "false" $showReadOnlyConnectionInfo }},
        publicCredentialsSaveEnabled: {{ ternary "true" "false" (default false $appConfig.publicCredentialsSaveEnabled) }},
        adminCredentialsSaveEnabled: {{ ternary "true" "false" (default false $appConfig.adminCredentialsSaveEnabled) }},
        secretManagerEnabled: {{ ternary "true" "false" $cloudbeaverSecretManagerEnabled }},
        enableReverseProxyAuth: {{ ternary "true" "false" $reverseProxyAuthEnabled }},
        forwardProxy: true,
        linkExternalCredentialsWithUser: true,
        enabledAuthProviders: [
          {{- range $index, $provider := $enabledAuthProviders }}
          {{- if $index }},{{ end }}
          {{ $provider | quote }}
          {{- end }}
        ],
        authConfigurations: [
          {{- if $reverseProxyAuthEnabled }}
          {
            id: "keycloak-proxy",
            provider: "reverseProxy",
            displayName: "Keycloak",
            disabled: false,
            iconURL: "",
            description: "CloudBeaver browser login is delegated to the Keycloak-backed reverse proxy.",
            parameters: {
              "logout-url": {{ $logoutUrl | quote }},
              "user-header": {{ default "X-Forwarded-Preferred-Username" $authProxy.userHeader | quote }},
              "team-header": {{ default "X-Forwarded-Groups" $authProxy.groupHeader | quote }},
              "team-delimiter": {{ default "," $authProxy.groupDelimiter | quote }},
              "first-name-header": {{ default "" $authProxy.firstNameHeader | quote }},
              "last-name-header": {{ default "" $authProxy.lastNameHeader | quote }}
            }
          }
          {{- end }}
        ]
      }
    }
---
{{- if and (default false $workspacePersistence.enabled) (not (get $workspacePersistence "existingClaim")) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $serviceName }}-workspace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudbeaver
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default "10Gi" $workspacePersistence.size }}
  {{- if $workspacePersistence.storageClass }}
  storageClassName: {{ $workspacePersistence.storageClass }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudbeaver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
    app.kubernetes.io/component: cloudbeaver
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudbeaver
spec:
  replicas: 1
  strategy:
    {{- toYaml (default (dict "type" "Recreate") .Values.cloudbeaver.strategy) | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
      app.kubernetes.io/component: cloudbeaver
  template:
    metadata:
      annotations:
        checksum/cloudbeaver-config: {{ get $checksums "config" | quote }}
        checksum/cloudbeaver-admin: {{ get $checksums "admin" | quote }}
        checksum/cloudbeaver-teams-seed: {{ get $checksums "teamsSeed" | quote }}
        checksum/cloudbeaver-connections-seed: {{ get $checksums "connectionsSeed" | quote }}
        checksum/cloudbeaver-trusted-ca: {{ get $checksums "trustedCa" | quote }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: cloudbeaver
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $trustedCaSecret $seedConnectionsExistingSecret $enforceRuntimeConfig $h2FreshSchemaPatchEnabled }}
      initContainers:
        {{- if $h2FreshSchemaPatchEnabled }}
        - name: cloudbeaver-h2-fresh-schema-patch
          image: "{{ .Values.cloudbeaver.image.repository }}:{{ .Values.cloudbeaver.image.tag }}"
          imagePullPolicy: {{ .Values.cloudbeaver.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              plugin_jar={{ $h2FreshSchemaPatchPluginJar | quote }}
              source_path="/opt/cloudbeaver/server/plugins/${plugin_jar}"
              patched_path="/patched/${plugin_jar}"

              test -f "${source_path}"
              cp "${source_path}" "${patched_path}"

              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "${tmp_dir}"' EXIT
              cd "${tmp_dir}"
              jar xf "${patched_path}" db
              find db -type f -name 'cb_schema_update_*.sql' | while read -r script; do
                printf '%s\n' \
                  "-- Skipped by dlh-in-a-box for forced fresh CloudBeaver workspaces." \
                  "-- The bundled cb_schema_create.sql already contains the current schema." \
                  >"${script}"
              done
              jar uf "${patched_path}" db
          volumeMounts:
            - name: cloudbeaver-security-plugin-patch
              mountPath: /patched
        {{- end }}
        {{- if $trustedCaSecret }}
        - name: cloudbeaver-truststore
          image: "{{ $trustedCaInitImageRepository }}:{{ $trustedCaInitImageTag }}"
          imagePullPolicy: {{ $trustedCaInitImagePullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /trust
              rm -f "/trust/{{ $trustStoreFileName }}"
              keytool \
                -importcert \
                -noprompt \
                -alias cloudbeaver-trusted-ca \
                -file "/ca/{{ $trustedCaCertKey }}" \
                -keystore "/trust/{{ $trustStoreFileName }}" \
                -storepass "{{ $trustStorePassword }}" \
                -storetype "{{ $trustStoreType }}"
          volumeMounts:
            - name: cloudbeaver-truststore
              mountPath: /trust
            - name: cloudbeaver-trusted-ca
              mountPath: /ca
              readOnly: true
        {{- end }}
        {{- if $seedConnectionsExistingSecret }}
        - name: cloudbeaver-workspace-seed
          image: docker.io/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              target_dir="/workspace/GlobalConfiguration/.dbeaver"
              target_file="${target_dir}/data-sources.json"
              permissions_file="${target_dir}/data-sources-permissions.json"
              if [ "{{ ternary "true" "false" $seedConnectionsForce }}" = "true" ]; then
                find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              fi
              mkdir -p "${target_dir}"
              if [ "{{ ternary "true" "false" $seedConnectionsForce }}" = "true" ] || [ ! -f "${target_file}" ]; then
                cp "/seed/{{ $seedConnectionsDataSourcesKey }}" "${target_file}"
              fi
              if [ -f "/seed/data-sources-permissions.json" ]; then
                cp "/seed/data-sources-permissions.json" "${permissions_file}"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: workspace-seed
              mountPath: /seed
              readOnly: true
        {{- end }}
        {{- if $enforceRuntimeConfig }}
        - name: cloudbeaver-runtime-config
          image: docker.io/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /workspace/.data
              cp /config/cloudbeaver.runtime.conf /workspace/.data/.cloudbeaver.runtime.conf
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cloudbeaver-config
              mountPath: /config
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: cloudbeaver
          image: "{{ .Values.cloudbeaver.image.repository }}:{{ .Values.cloudbeaver.image.tag }}"
          imagePullPolicy: {{ .Values.cloudbeaver.image.pullPolicy }}
          env:
            - name: CLOUDBEAVER_WEB_SERVER_PORT
              value: {{ printf "%v" $port | quote }}
            - name: CB_SERVER_NAME
              value: {{ $cloudbeaverServerName | quote }}
            {{- if $cloudbeaverServerUrl }}
            - name: CB_SERVER_URL
              value: {{ $cloudbeaverServerUrl | quote }}
            {{- end }}
            - name: CB_ADMIN_NAME
              value: {{ $authAdminUsername | quote }}
            - name: CB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $authAdminPasswordSecretKey }}
            {{- if $sharedAccessEnabled }}
            - name: CB_SHARED_CONNECTION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessConnectionIdKey }}
            - name: CB_SHARED_CONNECTION_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessProjectIdKey }}
                  optional: true
            - name: CB_SHARED_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessBootstrapUsernameKey }}
            - name: CB_SHARED_BOOTSTRAP_GROUPS
              valueFrom:
                secretKeyRef:
                  name: {{ $authAdminExistingSecret }}
                  key: {{ $sharedAccessBootstrapGroupsKey }}
                  optional: true
            {{- end }}
          {{- if $sharedAccessEnabled }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    (
                    set +e
                    if [ -z "${CB_SHARED_CONNECTION_ID:-}" ] || [ -z "${CB_SHARED_BOOTSTRAP_USERNAME:-}" ]; then
                      exit 0
                    fi
                    project_id="${CB_SHARED_CONNECTION_PROJECT_ID:-g_GlobalConfiguration}"
                    bootstrap_groups="${CB_SHARED_BOOTSTRAP_GROUPS:-{{ $adminTeam }},{{ $defaultUserTeam }}}"
                    expected_catalog={{ $sharedAccessExpectedCatalog | quote }}
                    for _ in $(seq 1 90); do
                      if curl -fsS "http://127.0.0.1:{{ $port }}/status" >/dev/null 2>&1; then
                        break
                      fi
                      sleep 2
                    done
                    tmp_dir="$(mktemp -d)"
                    trap 'rm -rf "$tmp_dir"' EXIT
                    subjects_json="["
                    old_ifs="${IFS}"
                    IFS=','
                    set -- ${bootstrap_groups}
                    IFS="${old_ifs}"
                    for subject in "$@"; do
                      subject="$(printf '%s' "${subject}" | tr -d '[:space:]')"
                      if [ -z "${subject}" ]; then
                        continue
                      fi
                      if [ "${subjects_json}" != "[" ]; then
                        subjects_json="${subjects_json},"
                      fi
                      subjects_json="${subjects_json}\"${subject}\""
                    done
                    subjects_json="${subjects_json}]"
                    if [ "${subjects_json}" = "[]" ]; then
                      subjects_json="[\"{{ $adminTeam }}\",\"{{ $defaultUserTeam }}\"]"
                    fi
                    cat >"${tmp_dir}/open-session.json" <<'EOF'
                    {"query":"mutation { openSession { valid } }"}
                    EOF
                    cat >"${tmp_dir}/connection-info.json" <<EOF
                    {"query":"query ConnectionInfo(\$projectId: ID!, \$id: ID!) { connectionInfo(projectId: \$projectId, id: \$id) { nodePath authNeeded credentialsSaved sharedCredentials } }","variables":{"projectId":"${project_id}","id":"${CB_SHARED_CONNECTION_ID}"}}
                    EOF
                    bootstrap_complete=0
                    for _ in $(seq 1 30); do
                      if ! curl -fsS \
                        -c "${tmp_dir}/cookies.txt" \
                        -b "${tmp_dir}/cookies.txt" \
                        -H "Content-Type: application/json" \
                        -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                        -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                        --data @"${tmp_dir}/open-session.json" \
                        "http://127.0.0.1:{{ $port }}/api/gql" >/dev/null; then
                        sleep 2
                        continue
                      fi
                      for subject in "$@"; do
                        subject="$(printf '%s' "${subject}" | tr -d '[:space:]')"
                        if [ -z "${subject}" ]; then
                          continue
                        fi
                        cat >"${tmp_dir}/create-team.json" <<EOF
                    {"query":"query CreateTeam(\$teamId: ID!, \$teamName: String, \$description: String) { createTeam(teamId: \$teamId, teamName: \$teamName, description: \$description) { teamId } }","variables":{"teamId":"${subject}","teamName":"${subject}","description":"Provisioned by CloudBeaver startup bootstrap."}}
                    EOF
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/create-team.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" >/dev/null || true
                      done
                      cat >"${tmp_dir}/set-access.json" <<EOF
                    {"query":"query SetAccess(\$projectId: ID!, \$connectionId: ID!, \$subjects: [ID!]!) { setConnectionSubjectAccess(projectId: \$projectId, connectionId: \$connectionId, subjects: \$subjects) }","variables":{"projectId":"${project_id}","connectionId":"${CB_SHARED_CONNECTION_ID}","subjects":${subjects_json}}}
                    EOF
                      access_response="$(
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/set-access.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" || true
                      )"
                      connection_info="$(
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/connection-info.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" || true
                      )"
                      node_path="$(printf '%s' "${connection_info}" | sed -n 's/.*"nodePath":"\([^"]*\)".*/\1/p')"
                      if [ -z "${node_path}" ]; then
                        sleep 2
                        continue
                      fi
                      cat >"${tmp_dir}/navigator.json" <<EOF
                    {"query":"query NavNodeChildren(\$parentPath: ID!) { navNodeChildren(parentPath: \$parentPath) { name plainName nodeType hasChildren } }","variables":{"parentPath":"${node_path}"}}
                    EOF
                      navigator_response="$(
                        curl -fsS \
                          -c "${tmp_dir}/cookies.txt" \
                          -b "${tmp_dir}/cookies.txt" \
                          -H "Content-Type: application/json" \
                          -H "X-Forwarded-Preferred-Username: ${CB_SHARED_BOOTSTRAP_USERNAME}" \
                          -H "X-Forwarded-Groups: ${bootstrap_groups}" \
                          --data @"${tmp_dir}/navigator.json" \
                          "http://127.0.0.1:{{ $port }}/api/gql" || true
                      )"
                      if printf '%s' "${access_response}" | grep -Eq '"setConnectionSubjectAccess":[[:space:]]*true' \
                        && printf '%s' "${navigator_response}" | tr -d '[:space:]' | grep -Fq "\"name\":\"${expected_catalog}\""; then
                        bootstrap_complete=1
                        break
                      fi
                      sleep 2
                    done
                    if [ "${bootstrap_complete}" != "1" ]; then
                      echo "WARN: CloudBeaver shared Trino bootstrap did not confirm expected catalog '${expected_catalog}' during postStart; continuing startup." >&2
                    fi
                    exit 0
                    ) >/proc/1/fd/1 2>/proc/1/fd/2 &
                    exit 0
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: cloudbeaver-config
              mountPath: /opt/cloudbeaver/conf/cloudbeaver.conf
              subPath: cloudbeaver.conf
              readOnly: true
            {{- if $seedTeamsExistingSecret }}
            - name: cloudbeaver-teams-seed
              mountPath: /opt/cloudbeaver/conf/initial-data.conf
              subPath: {{ $seedTeamsDataKey }}
              readOnly: true
            {{- end }}
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
            {{- if $h2FreshSchemaPatchEnabled }}
            - name: cloudbeaver-security-plugin-patch
              mountPath: /opt/cloudbeaver/server/plugins/{{ $h2FreshSchemaPatchPluginJar }}
              subPath: {{ $h2FreshSchemaPatchPluginJar }}
              readOnly: true
            {{- end }}
            {{- if $trustedCaSecret }}
            - name: cloudbeaver-truststore
              mountPath: {{ $trustStoreMountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: cloudbeaver-config
          configMap:
            name: {{ $serviceName }}-config
        {{- if $seedTeamsExistingSecret }}
        - name: cloudbeaver-teams-seed
          secret:
            secretName: {{ $seedTeamsExistingSecret }}
        {{- end }}
        {{- if $trustedCaSecret }}
        - name: cloudbeaver-trusted-ca
          secret:
            secretName: {{ $trustedCaSecret }}
            items:
              - key: {{ $trustedCaCertKey }}
                path: {{ $trustedCaCertKey }}
        - name: cloudbeaver-truststore
          emptyDir: {}
        {{- end }}
        {{- if $seedConnectionsExistingSecret }}
        - name: workspace-seed
          secret:
            secretName: {{ $seedConnectionsExistingSecret }}
        {{- end }}
        {{- if $h2FreshSchemaPatchEnabled }}
        - name: cloudbeaver-security-plugin-patch
          emptyDir: {}
        {{- end }}
        - name: workspace
          {{- if default false $workspacePersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workspace" $serviceName) $workspacePersistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
