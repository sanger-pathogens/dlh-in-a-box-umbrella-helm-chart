{{- if .Values.platformHome.enabled }}
{{- $serviceName := include "dlh-in-a-box.platformHome.serviceName" . -}}
{{- $port := default 8080 .Values.platformHome.service.port -}}
{{- $apiPort := default 18080 (dig "api" "port" 18080 .Values.platformHome) -}}
{{- $platformHomeValues := .Values.platformHome | default dict -}}
{{- $launchers := get $platformHomeValues "launchers" | default dict -}}
{{- $keycloakBrowserBaseUrl := trimSuffix "/" (default "" (get $platformHomeValues "keycloakBrowserBaseUrl")) -}}
{{- $branding := .Values.platformHome.branding | default dict -}}
{{- $theme := get $platformHomeValues "theme" | default dict -}}
{{- $themeColors := get $theme "colors" | default dict -}}
{{- $themeFonts := get $theme "fonts" | default dict -}}
{{- $themeFontPreloads := get $themeFonts "preloads" | default (list) -}}
{{- $themeFontFaces := get $themeFonts "fontFaces" | default (list) -}}
{{- $itemMeta := get $platformHomeValues "itemMeta" | default dict -}}
{{- $portalHealth := get $platformHomeValues "health" | default dict -}}
{{- $global := .Values.global | default dict -}}
{{- $identity := get $global "identity" | default dict -}}
{{- $directory := get $identity "directory" | default dict -}}
{{- $directoryMode := include "dlh-in-a-box.identity.directoryMode" . -}}
{{- $keycloakLocalMode := eq $directoryMode "keycloakLocal" -}}
{{- $ldap := get $directory "ldap" | default dict -}}
{{- $authorization := get $global "authorization" | default dict -}}
{{- $platformRoles := get $authorization "platformRoles" | default dict -}}
{{- $platformRoleExceptions := get $authorization "platformRoleExceptions" | default (list) -}}
{{- $ranger := get $authorization "ranger" | default dict -}}
{{- $rangerAdmin := get $ranger "admin" | default dict -}}
{{- $usersyncEnabled := dig "usersync" "enabled" true $ranger -}}
{{- $external := get $identity "external" | default dict -}}
{{- $clients := get $external "clients" | default dict -}}
{{- $rangerProxyIdentity := get $clients "rangerProxy" | default dict -}}
{{- $oidc := get $external "oidc" | default dict -}}
{{- $rangerBrowserUrl := default (default "" (get $rangerAdmin "browserUrl")) (first (default (list) (get $rangerProxyIdentity "webOrigins"))) -}}
{{- $adminRequiredGroup := include "dlh-in-a-box.group.role" (dict "root" . "name" "platform-admin") -}}
{{- $ldapEnabled := default false $ldap.enabled -}}
{{- $ldapUrl := include "dlh-in-a-box.identity.directory.url" . -}}
{{- $ldapUserBaseDn := include "dlh-in-a-box.identity.directory.userBaseDn" . -}}
{{- $ldapGroupBaseDn := include "dlh-in-a-box.identity.directory.groupBaseDn" . -}}
{{- $ldapBindDn := include "dlh-in-a-box.identity.directory.bindDn" . -}}
{{- $ldapAllowAnonymousRead := default false $ldap.allowAnonymousRead -}}
{{- $ldapEffectiveBindDn := ternary "" $ldapBindDn $ldapAllowAnonymousRead -}}
{{- $ldapBindSecretName := include "dlh-in-a-box.identity.directory.bindSecretName" . -}}
{{- $ldapBindPasswordKey := include "dlh-in-a-box.identity.directory.bindSecretKey" . -}}
{{- $ldapTrustedCaSecretName := include "dlh-in-a-box.identity.directory.trustedCaSecretName" . -}}
{{- $ldapTrustedCaCertKey := include "dlh-in-a-box.identity.directory.trustedCaCertKey" . -}}
{{- $ldapTrustedCaPath := printf "/opt/platform-home-api/ldap-ca/%s" $ldapTrustedCaCertKey -}}
{{- $ldapUseTrustedCa := and $ldapEnabled (not (default false $ldap.allowInsecure)) (ne $ldapTrustedCaSecretName "") -}}
{{- $ldapHostAliases := default (list) $ldap.hostAliases -}}
{{- $accessControlStateConfigMapName := printf "%s-access-control-state" $serviceName -}}
{{- $brandingTitle := default "Data Platform" $branding.title -}}
{{- $brandingSubtitle := default "" $branding.subtitle -}}
{{- $brandingLogoUrl := default "" $branding.logoUrl -}}
{{- $brandingLogoAlt := default "Platform logo" $branding.logoAlt -}}
{{- $brandingFaviconUrl := default "" $branding.faviconUrl -}}
{{- $metaThemeColor := default "#1f5f7a" (get $theme "metaThemeColor") -}}
{{- $fontBodyFamily := default "system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif" (get $themeFonts "bodyFamily") -}}
{{- $fontHeadingFamily := default "Georgia, \"Times New Roman\", serif" (get $themeFonts "headingFamily") -}}
{{- $accessControlNotice := "Access Control is read-only because Keycloak owns platform roles and role membership. Use Keycloak Admin to change routine role membership." -}}
{{- $portalLaunchers := dict -}}
{{- range $launcherName := keys $launchers | sortAlpha -}}
  {{- $launcher := get $launchers $launcherName | default dict -}}
  {{- if default false (get $launcher "enabled") -}}
    {{- $_ := set $portalLaunchers $launcherName (dict
      "mode" (default "redirect" (get $launcher "mode"))
      "path" (default (printf "/launch/%s" $launcherName) (get $launcher "path"))
      "targetUrl" (default "" (get $launcher "targetUrl"))
      "completeUrl" (default "" (get $launcher "completeUrl"))
      "internalApiUrl" (default "" (get $launcher "internalApiUrl"))
      "redirectUri" (default "" (get $launcher "redirectUri"))
      "authMount" (default "" (get $launcher "authMount"))
      "role" (default "" (get $launcher "role"))
      "wrapTtl" (default "" (get $launcher "wrapTtl"))
      "requiredGroups" (default (list) (get $launcher "requiredGroups"))
    ) -}}
  {{- end -}}
{{- end -}}
{{- $platformRoleViews := list -}}
{{- $appRoleGroups := dict
  "superset" (list)
  "datahub" (list)
  "jupyterhub" (list)
  "cloudbeaver" (list)
  "prefect" (list)
-}}
{{- range $roleKey := keys $platformRoles | sortAlpha -}}
  {{- $role := get $platformRoles $roleKey | default dict -}}
  {{- $members := get $role "members" | default dict -}}
  {{- $roleApps := get $role "apps" | default dict -}}
  {{- $rolePortal := get $role "portal" | default dict -}}
  {{- $rangerRoleName := default $roleKey (dig "ranger" "roleName" "" $role) -}}
  {{- $directoryGroups := get $members "directoryGroups" | default (list) -}}
  {{- if default false (get $roleApps "superset") -}}
    {{- $_ := set $appRoleGroups "superset" (uniq (concat (get $appRoleGroups "superset") $directoryGroups)) -}}
  {{- end -}}
  {{- if default false (get $roleApps "datahub") -}}
    {{- $_ := set $appRoleGroups "datahub" (uniq (concat (get $appRoleGroups "datahub") $directoryGroups)) -}}
  {{- end -}}
  {{- if default false (get $roleApps "jupyterhub") -}}
    {{- $_ := set $appRoleGroups "jupyterhub" (uniq (concat (get $appRoleGroups "jupyterhub") $directoryGroups)) -}}
  {{- end -}}
  {{- if default false (get $roleApps "cloudbeaver") -}}
    {{- $_ := set $appRoleGroups "cloudbeaver" (uniq (concat (get $appRoleGroups "cloudbeaver") $directoryGroups)) -}}
  {{- end -}}
  {{- if default false (get $roleApps "prefect") -}}
    {{- $_ := set $appRoleGroups "prefect" (uniq (concat (get $appRoleGroups "prefect") $directoryGroups)) -}}
  {{- end -}}
  {{- $declaredExceptions := list -}}
  {{- range $exception := $platformRoleExceptions -}}
    {{- if eq (default "" (get $exception "platformRole")) $roleKey -}}
      {{- $declaredExceptions = append $declaredExceptions (dict
        "username" (default "" (get $exception "username"))
        "approvalRef" (default "" (get $exception "approvalRef"))
        "reason" (default "" (get $exception "reason"))
        "grantedBy" (default "" (get $exception "grantedBy"))
        "expiresAt" (default "" (get $exception "expiresAt"))
      ) -}}
    {{- end -}}
  {{- end -}}
  {{- $policySummaries := list -}}
  {{- range $policy := (get $ranger "bootstrapPolicies" | default (list)) -}}
    {{- $policyRoles := list -}}
    {{- range $item := (get $policy "policyItems" | default (list)) -}}
      {{- $policyRoles = concat $policyRoles (get $item "roles" | default (list)) -}}
    {{- end -}}
    {{- range $item := (get $policy "dataMaskPolicyItems" | default (list)) -}}
      {{- $policyRoles = concat $policyRoles (get $item "roles" | default (list)) -}}
    {{- end -}}
    {{- range $item := (get $policy "rowFilterPolicyItems" | default (list)) -}}
      {{- $policyRoles = concat $policyRoles (get $item "roles" | default (list)) -}}
    {{- end -}}
    {{- $policyRoles = uniq $policyRoles -}}
    {{- if or (has $roleKey $policyRoles) (has $rangerRoleName $policyRoles) -}}
      {{- $policyType := default 0 (get $policy "policyType") -}}
      {{- $policyKind := "access" -}}
      {{- if eq (printf "%v" $policyType) "1" -}}
        {{- $policyKind = "data-mask" -}}
      {{- else if eq (printf "%v" $policyType) "2" -}}
        {{- $policyKind = "row-filter" -}}
      {{- end -}}
      {{- $policySummaries = append $policySummaries (dict
        "name" (default "" (get $policy "name"))
        "description" (default "" (get $policy "description"))
        "kind" $policyKind
      ) -}}
    {{- end -}}
  {{- end -}}
  {{- $roleManageable := true -}}
  {{- if hasKey $rolePortal "manageable" -}}
    {{- $roleManageable = (get $rolePortal "manageable") -}}
  {{- end -}}
  {{- $platformRoleViews = append $platformRoleViews (dict
    "key" $roleKey
    "name" $rangerRoleName
    "displayName" (default "" (get $rolePortal "displayName"))
    "manageable" $roleManageable
    "description" (default "" (get $role "description"))
    "directoryGroups" $directoryGroups
    "users" (get $members "users" | default (list))
    "nestedRoles" (get $members "nestedRoles" | default (list))
    "apps" (dict
      "superset" (default false (get $roleApps "superset"))
      "datahub" (default false (get $roleApps "datahub"))
      "trinoUi" (default false (get $roleApps "trinoUi"))
      "jupyterhub" (default false (get $roleApps "jupyterhub"))
      "cloudbeaver" (default false (get $roleApps "cloudbeaver"))
      "prefect" (default false (get $roleApps "prefect"))
    )
    "declaredExceptions" $declaredExceptions
    "policySummaries" $policySummaries
  ) -}}
{{- end -}}
{{- $adminTools := list -}}
{{- $roleManagementEnabled := and (default false $ranger.enabled) (gt (len $platformRoleViews) 0) (not $keycloakLocalMode) -}}
{{- if $roleManagementEnabled -}}
  {{- $toolMeta := get $itemMeta "access-control" | default dict -}}
  {{- $adminTools = append $adminTools (dict
    "id" "access-control"
    "name" "Access Control"
    "summary" "Assign LDAP groups and governed user exceptions to platform roles"
    "url" "/access-control"
    "icon" "AC"
    "iconText" (default "AC" (get $toolMeta "iconText"))
    "iconUrl" (default "" (get $toolMeta "iconUrl"))
    "iconAlt" (default "Access control icon" (get $toolMeta "iconAlt"))
    "iconBackground" (default "" (get $toolMeta "iconBackground"))
    "health" (get $toolMeta "health" | default dict)
    "group" "Governance & Access"
  ) -}}
{{- end -}}
{{- if $rangerBrowserUrl -}}
  {{- $toolMeta := get $itemMeta "ranger-admin" | default dict -}}
  {{- $adminTools = append $adminTools (dict
    "id" "ranger-admin"
    "name" "Ranger Admin"
    "summary" "Manage Trino access policies"
    "url" $rangerBrowserUrl
    "icon" "RA"
    "iconText" (default "RA" (get $toolMeta "iconText"))
    "iconUrl" (default "" (get $toolMeta "iconUrl"))
    "iconAlt" (default "Ranger Admin logo" (get $toolMeta "iconAlt"))
    "iconBackground" (default "" (get $toolMeta "iconBackground"))
    "health" (get $toolMeta "health" | default dict)
    "group" "Governance & Access"
  ) -}}
{{- end -}}
{{- if $keycloakBrowserBaseUrl -}}
  {{- $toolMeta := get $itemMeta "keycloak-admin" | default dict -}}
  {{- $adminTools = append $adminTools (dict
    "id" "keycloak-admin"
    "name" "Keycloak Admin"
    "summary" "Identity realm, groups, and OIDC client configuration"
    "url" (printf "%s/admin/%s/console/" $keycloakBrowserBaseUrl (include "dlh-in-a-box.keycloak.realm" .))
    "icon" "KC"
    "iconText" (default "KC" (get $toolMeta "iconText"))
    "iconUrl" (default "" (get $toolMeta "iconUrl"))
    "iconAlt" (default "Keycloak Admin logo" (get $toolMeta "iconAlt"))
    "iconBackground" (default "" (get $toolMeta "iconBackground"))
    "health" (get $toolMeta "health" | default dict)
    "group" "Governance & Access"
  ) -}}
{{- end -}}
{{- if default false (dig "trino" "enabled" false $clients) -}}
  {{- $toolMeta := get $itemMeta "trino" | default dict -}}
  {{- $adminTools = append $adminTools (dict
    "id" "trino"
    "name" "Trino UI"
    "summary" "Inspect running and completed queries"
    "url" (first (default (list) (dig "trino" "webOrigins" list $clients)))
    "icon" "TR"
    "iconText" (default "TR" (get $toolMeta "iconText"))
    "iconUrl" (default "" (get $toolMeta "iconUrl"))
    "iconAlt" (default "Trino logo" (get $toolMeta "iconAlt"))
    "iconBackground" (default "" (get $toolMeta "iconBackground"))
    "health" (get $toolMeta "health" | default dict)
    "group" "Platform Operations"
  ) -}}
{{- end -}}
{{- range $tool := (get $platformHomeValues "adminTools" | default (list)) -}}
  {{- $toolId := default "" (get $tool "id") -}}
  {{- $toolMeta := get $itemMeta $toolId | default dict -}}
  {{- $adminTools = append $adminTools (dict
    "id" $toolId
    "name" (default "" (get $tool "name"))
    "summary" (default "" (get $tool "summary"))
    "url" (default "" (get $tool "url"))
    "icon" (default "" (get $tool "icon"))
    "iconText" (default (default "" (get $toolMeta "iconText")) (default "" (get $tool "icon")))
    "iconUrl" (default (default "" (get $toolMeta "iconUrl")) (default "" (get $tool "iconUrl")))
    "iconAlt" (default (default "" (get $toolMeta "iconAlt")) (default "" (get $tool "iconAlt")))
    "iconBackground" (default (default "" (get $toolMeta "iconBackground")) (default "" (get $tool "iconBackground")))
    "health" (mergeOverwrite (get $toolMeta "health" | default dict) (get $tool "health" | default dict))
    "group" (default "Platform Operations" (get $tool "group"))
  ) -}}
{{- end -}}
{{- $apps := list -}}
{{- if and .Values.superset.enabled (default false (dig "superset" "enabled" false $clients)) -}}
  {{- $supersetOrigin := trimSuffix "/" (first (default (list) (dig "superset" "webOrigins" list $clients))) -}}
  {{- $supersetProvider := default "keycloak" (dig "superset" "providerName" "" $clients) -}}
  {{- $appMeta := get $itemMeta "superset" | default dict -}}
  {{- $apps = append $apps (dict
    "id" "superset"
    "name" "Superset"
    "summary" "Dashboards and visual analysis"
    "url" (printf "%s/login/%s" $supersetOrigin $supersetProvider)
    "group" "Analysis"
    "icon" "SU"
    "iconText" (default "SU" (get $appMeta "iconText"))
    "iconUrl" (default "" (get $appMeta "iconUrl"))
    "iconAlt" (default "Superset logo" (get $appMeta "iconAlt"))
    "iconBackground" (default "" (get $appMeta "iconBackground"))
    "health" (get $appMeta "health" | default dict)
    "requiredGroups" (uniq (concat (list (include "dlh-in-a-box.group.app" (dict "root" . "name" "superset"))) (get $appRoleGroups "superset")))
  ) -}}
{{- end -}}
{{- if and .Values.datahub.enabled (default false (dig "datahub" "enabled" false $clients)) -}}
  {{- $appMeta := get $itemMeta "datahub" | default dict -}}
  {{- $apps = append $apps (dict
    "id" "datahub"
    "name" "DataHub"
    "summary" "Catalog and discover datasets"
    "url" (first (default (list) (dig "datahub" "webOrigins" list $clients)))
    "group" "Data Access"
    "icon" "DH"
    "iconText" (default "DH" (get $appMeta "iconText"))
    "iconUrl" (default "" (get $appMeta "iconUrl"))
    "iconAlt" (default "DataHub logo" (get $appMeta "iconAlt"))
    "iconBackground" (default "" (get $appMeta "iconBackground"))
    "health" (get $appMeta "health" | default dict)
    "requiredGroups" (uniq (concat (list (include "dlh-in-a-box.group.app" (dict "root" . "name" "datahub"))) (get $appRoleGroups "datahub")))
  ) -}}
{{- end -}}
{{- if and .Values.jupyterhub.enabled (default false (dig "jupyterhub" "enabled" false $clients)) -}}
  {{- $appMeta := get $itemMeta "jupyterhub" | default dict -}}
  {{- $jupyterhubOrigin := trimSuffix "/" (first (default (list) (dig "jupyterhub" "webOrigins" list $clients))) -}}
  {{- $jupyterhubLaunch := get $portalLaunchers "jupyterhub" | default dict -}}
  {{- $apps = append $apps (dict
    "id" "jupyterhub"
    "name" "JupyterHub"
    "summary" "Interactive notebooks and shared code workspace"
    "url" (default $jupyterhubOrigin (get $jupyterhubLaunch "path"))
    "group" "Analysis"
    "icon" "JH"
    "iconText" (default "JH" (get $appMeta "iconText"))
    "iconUrl" (default "" (get $appMeta "iconUrl"))
    "iconAlt" (default "JupyterHub logo" (get $appMeta "iconAlt"))
    "iconBackground" (default "" (get $appMeta "iconBackground"))
    "health" (get $appMeta "health" | default dict)
    "requiredGroups" (uniq (concat (list (include "dlh-in-a-box.group.app" (dict "root" . "name" "jupyterhub"))) (get $appRoleGroups "jupyterhub")))
  ) -}}
{{- end -}}
{{- if default false (dig "prefectProxy" "enabled" false $clients) -}}
  {{- $prefectOrigin := trimSuffix "/" (first (default (list) (dig "prefectProxy" "webOrigins" list $clients))) -}}
  {{- $appMeta := get $itemMeta "prefect" | default dict -}}
  {{- $apps = append $apps (dict
    "id" "prefect"
    "name" "Prefect"
    "summary" "Monitor scheduled and running flows"
    "url" (printf "%s/oauth2/start?rd=%s" $prefectOrigin (urlquery "/"))
    "group" "Workflows"
    "icon" "PF"
    "iconText" (default "PF" (get $appMeta "iconText"))
    "iconUrl" (default "" (get $appMeta "iconUrl"))
    "iconAlt" (default "Prefect logo" (get $appMeta "iconAlt"))
    "iconBackground" (default "" (get $appMeta "iconBackground"))
    "health" (get $appMeta "health" | default dict)
    "requiredGroups" (uniq (concat (list (include "dlh-in-a-box.group.app" (dict "root" . "name" "prefect"))) (get $appRoleGroups "prefect")))
  ) -}}
{{- end -}}
{{- if and .Values.cloudbeaver.enabled (default false (dig "cloudbeaverProxy" "enabled" false $clients)) -}}
  {{- $cloudbeaverOrigin := trimSuffix "/" (first (default (list) (dig "cloudbeaverProxy" "webOrigins" list $clients))) -}}
  {{- $appMeta := get $itemMeta "cloudbeaver" | default dict -}}
  {{- $apps = append $apps (dict
    "id" "cloudbeaver"
    "name" "CloudBeaver"
    "summary" "Browser SQL workspace"
    "url" (printf "%s/oauth2/start?rd=%s" $cloudbeaverOrigin (urlquery "/"))
    "group" "Data Access"
    "icon" "CB"
    "iconText" (default "CB" (get $appMeta "iconText"))
    "iconUrl" (default "" (get $appMeta "iconUrl"))
    "iconAlt" (default "CloudBeaver logo" (get $appMeta "iconAlt"))
    "iconBackground" (default "" (get $appMeta "iconBackground"))
    "health" (get $appMeta "health" | default dict)
    "requiredGroups" (uniq (concat (list (include "dlh-in-a-box.group.app" (dict "root" . "name" "cloudbeaver"))) (get $appRoleGroups "cloudbeaver")))
  ) -}}
{{- end -}}
{{- $healthItems := list -}}
{{- range $app := $apps -}}
  {{- $healthItems = append $healthItems (dict
    "id" (get $app "id")
    "name" (get $app "name")
    "group" (get $app "group")
    "url" (get $app "url")
    "requiredGroups" (get $app "requiredGroups" | default (list))
    "adminOnly" false
    "health" (get $app "health" | default dict)
  ) -}}
{{- end -}}
{{- range $tool := $adminTools -}}
  {{- $healthItems = append $healthItems (dict
    "id" (get $tool "id")
    "name" (get $tool "name")
    "group" (get $tool "group")
    "url" (get $tool "url")
    "requiredGroups" (list)
    "adminOnly" true
    "health" (get $tool "health" | default dict)
  ) -}}
{{- end -}}
{{- $portalApps := list -}}
{{- range $app := $apps -}}
  {{- $portalApps = append $portalApps (omit $app "health") -}}
{{- end -}}
{{- $portalAdminTools := list -}}
{{- range $tool := $adminTools -}}
  {{- $portalAdminTools = append $portalAdminTools (omit $tool "health") -}}
{{- end -}}
{{- $portalConfig := dict
  "branding" (dict
    "title" $brandingTitle
    "subtitle" $brandingSubtitle
    "logoUrl" $brandingLogoUrl
    "logoAlt" $brandingLogoAlt
    "faviconUrl" $brandingFaviconUrl
    "metaThemeColor" $metaThemeColor
  )
  "health" (dict
    "enabled" (default false (get $portalHealth "enabled"))
    "refreshIntervalSeconds" (default 90 (get $portalHealth "refreshIntervalSeconds"))
  )
  "identity" (dict
    "directoryMode" $directoryMode
    "groupsClaim" (default "groups" $oidc.groupsClaim)
    "keycloak" (dict
      "baseUrl" (default (include "dlh-in-a-box.keycloak.browserBaseUrl" .) .Values.platformHome.keycloakBrowserBaseUrl)
      "realm" (include "dlh-in-a-box.keycloak.realm" .)
      "clientId" (default "" (get (get $clients "platformHome" | default dict) "clientId"))
    )
  )
  "apps" $portalApps
  "admin" (dict
    "requiredGroups" (list $adminRequiredGroup)
    "tools" $portalAdminTools
    "roleManagementEnabled" $roleManagementEnabled
    "accessControlEnabled" $roleManagementEnabled
    "accessControlNotice" (ternary $accessControlNotice "" $keycloakLocalMode)
    "accessControlPath" "/access-control"
  )
-}}
{{- $platformHomeAdminConfig := dict
  "admin" (dict
    "requiredGroups" (list $adminRequiredGroup)
    "roleManagementEnabled" $roleManagementEnabled
    "accessControlEnabled" $roleManagementEnabled
    "accessControlNotice" (ternary $accessControlNotice "" $keycloakLocalMode)
    "accessControlPath" "/access-control"
  )
  "adminTools" $adminTools
  "launchers" $portalLaunchers
  "roles" $platformRoleViews
  "health" (dict
    "enabled" (default false (get $portalHealth "enabled"))
    "refreshIntervalSeconds" (default 90 (get $portalHealth "refreshIntervalSeconds"))
  )
  "items" $healthItems
  "ranger" (dict
    "enabled" (default false $ranger.enabled)
    "browserUrl" $rangerBrowserUrl
    "usersyncEnabled" $usersyncEnabled
    "membershipSource" "keycloak"
    "directoryMode" $directoryMode
  )
  "ldap" (dict
    "enabled" $ldapEnabled
    "url" $ldapUrl
    "userBaseDn" $ldapUserBaseDn
    "groupBaseDn" $ldapGroupBaseDn
    "bindDn" $ldapEffectiveBindDn
    "usernameAttribute" (default "uid" $ldap.usernameAttribute)
    "firstNameAttribute" (default "givenName" $ldap.firstNameAttribute)
    "lastNameAttribute" (default "sn" $ldap.lastNameAttribute)
    "emailAttribute" (default "mail" $ldap.emailAttribute)
    "userSearchFilter" (default "(uid=*)" $ldap.userSearchFilter)
    "groupNameAttribute" (default "cn" $ldap.groupNameAttribute)
    "groupSearchFilter" (default "(cn=*)" $ldap.groupSearchFilter)
    "allowInsecure" (default false $ldap.allowInsecure)
    "trustedCaPath" (ternary $ldapTrustedCaPath "" $ldapUseTrustedCa)
  )
  "state" (dict
    "configMapName" $accessControlStateConfigMapName
  )
-}}
{{- $platformHomeChecksum := (printf "%s\n%s\n%s\n%s" (toPrettyJson $portalConfig) (toPrettyJson $platformHomeAdminConfig) (toPrettyJson $theme) (.Files.Get "files/platform-home/keycloak.js") | sha256sum) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serviceName }}-assets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta id="portal-theme-color" name="theme-color" content="{{ $metaThemeColor }}" />
      <title>{{ $brandingTitle }}</title>
      {{- if $brandingFaviconUrl }}
      <link id="portal-favicon" rel="icon" href="{{ $brandingFaviconUrl }}" type="image/x-icon" />
      {{- end }}
      {{- range $preload := $themeFontPreloads }}
      <link
        rel="preload"
        href="{{ default "" (get $preload "href") }}"
        as="{{ default "font" (get $preload "as") }}"
        {{- with (get $preload "type") }} type="{{ . }}"{{- end }}
        {{- if default false (get $preload "crossorigin") }} crossorigin="anonymous"{{- end }}
      />
      {{- end }}
      <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
      <div class="shell">
        <div class="top-ribbon"></div>
        <header class="hero">
          <div class="brand-block">
            <div class="brand-lockup">
              <img id="portal-logo" class="brand-logo is-hidden" alt="{{ $brandingLogoAlt }}" />
              <div class="brand-copy">
                <h1 id="portal-title">{{ $brandingTitle }}</h1>
                <p id="portal-subtitle" class="portal-subtitle">{{ $brandingSubtitle }}</p>
                <div id="anonymous-actions" class="brand-actions">
                  <button id="login-button" class="primary-button hero-login-button" type="button">Sign in</button>
                </div>
              </div>
            </div>
          </div>
          <div id="session-bar" class="session-bar is-hidden">
            <div>
              <p id="session-name" class="session-name">Authenticated user</p>
            </div>
            <button id="logout-button" class="secondary-button" type="button">Sign out</button>
          </div>
        </header>
        <main id="signed-in-content" class="content is-hidden">
          <div id="portal-notice" class="status-banner is-hidden"></div>
          <section id="launch-groups" class="group-stack"></section>
          <section id="empty-panel" class="panel is-hidden">
            <div class="panel-header">
              <h2>No applications assigned</h2>
            </div>
            <p class="panel-note">Your account signed in successfully, but no browser applications are currently assigned.</p>
          </section>
          <section id="administration" class="group-stack is-hidden">
            <section id="admin-tools-panel" class="panel panel-secondary is-hidden">
              <div class="panel-header">
                <div>
                  <p class="eyebrow">Administration</p>
                  <h2>Administrative tools</h2>
                  <p class="detail-note">Platform administration stays inside the signed-in portal experience.</p>
                </div>
              </div>
              <div id="admin-tools" class="group-stack"></div>
            </section>
          </section>
          <section id="role-management-panel" class="panel panel-secondary is-hidden">
            <div class="panel-header access-control-header">
              <div>
                <p class="eyebrow">Access control</p>
                <h2>Platform access control</h2>
                <p class="detail-note">Manage LDAP-backed platform role assignments and governed direct-user exceptions without leaving the portal.</p>
              </div>
              <button id="access-control-back" class="secondary-button compact-button is-hidden" type="button">Back to portal</button>
            </div>
            <div id="role-management-status" class="status-banner is-hidden"></div>
            <div class="role-management-layout">
              <aside class="role-catalog-shell">
                <h3 class="role-catalog-title">Platform roles</h3>
                <div id="role-catalog" class="role-catalog"></div>
              </aside>
              <section id="role-detail" class="role-detail panel-subtle">
                <p class="panel-note">Select a platform role to review LDAP groups, active exceptions, and policy impact.</p>
              </section>
            </div>
          </section>
        </main>
        <main id="anonymous-state" class="content content-minimal"></main>
      </div>
      <script src="/app.js"></script>
    </body>
    </html>
  admin.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="theme-color" content="{{ $metaThemeColor }}" />
      <title>{{ $brandingTitle }}</title>
      {{- if $brandingFaviconUrl }}
      <link rel="icon" href="{{ $brandingFaviconUrl }}" type="image/x-icon" />
      {{- end }}
      <meta http-equiv="refresh" content="0; url=/" />
    </head>
    <body>
      <script>
        try {
          {{- if $keycloakLocalMode }}
          window.sessionStorage.setItem("platform-home-route-notice", JSON.stringify({
            level: "info",
            message: {{ $accessControlNotice | quote }}
          }));
          {{- else }}
          window.sessionStorage.setItem("platform-home-target-section", "access-control");
          {{- end }}
        } catch (error) {
          console.warn("Unable to persist the administration redirect target.", error);
        }
        {{- if $keycloakLocalMode }}
        window.location.replace("/");
        {{- else }}
        window.location.replace("/access-control");
        {{- end }}
      </script>
    </body>
    </html>
  app.js: |
    const anonymousState = document.getElementById("anonymous-state");
    const anonymousActions = document.getElementById("anonymous-actions");
    const signedInContent = document.getElementById("signed-in-content");
    const launchGroups = document.getElementById("launch-groups");
    const emptyPanel = document.getElementById("empty-panel");
    const loginButton = document.getElementById("login-button");
    const sessionBar = document.getElementById("session-bar");
    const sessionName = document.getElementById("session-name");
    const logoutButton = document.getElementById("logout-button");
    const administration = document.getElementById("administration");
    const adminToolsPanel = document.getElementById("admin-tools-panel");
    const adminTools = document.getElementById("admin-tools");
    const roleManagementPanel = document.getElementById("role-management-panel");
    const roleManagementStatus = document.getElementById("role-management-status");
    const portalNotice = document.getElementById("portal-notice");
    const roleCatalog = document.getElementById("role-catalog");
    const roleDetail = document.getElementById("role-detail");
    const accessControlBack = document.getElementById("access-control-back");
    const titleElement = document.getElementById("portal-title");
    const subtitleElement = document.getElementById("portal-subtitle");
    const portalLogo = document.getElementById("portal-logo");
    const portalFavicon = document.getElementById("portal-favicon");
    const portalThemeColor = document.getElementById("portal-theme-color");
    const defaultLoginLabel = loginButton ? loginButton.textContent : "Sign in";
    const sectionStorageKey = "platform-home-target-section";
    const routeNoticeStorageKey = "platform-home-route-notice";
    const accessControlPath = "/access-control";

    const state = {
      config: null,
      keycloak: null,
      groups: [],
      isAdmin: false,
      adminStatus: null,
      roles: [],
      selectedRoleKey: null,
      activeRoleTab: "overview",
      search: {
        user: { query: "", results: [], loading: false, error: "" },
        exception: { query: "", results: [], loading: false, error: "" },
        group: { query: "", results: [], loading: false, error: "" },
      },
      exceptionDraft: {
        mode: "create",
        exceptionId: "",
        username: "",
        displayName: "",
        email: "",
        reason: "",
        approvalRef: "",
        expiresAt: "",
      },
      health: {
        items: {},
        timer: null,
        lastUpdated: "",
      },
    };

    function show(element) {
      if (element) {
        element.classList.remove("is-hidden");
      }
    }

    function emptyExceptionDraft() {
      return {
        mode: "create",
        exceptionId: "",
        username: "",
        displayName: "",
        email: "",
        reason: "",
        approvalRef: "",
        expiresAt: "",
      };
    }

    function hide(element) {
      if (element) {
        element.classList.add("is-hidden");
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function humanizeSlug(value) {
      return String(value || "")
        .split("-")
        .filter(Boolean)
        .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ");
    }

    function buildPortalRedirectUri() {
      const path = window.location.pathname === "/admin.html" ? "/" : window.location.pathname;
      return `${window.location.origin}${path}`;
    }

    function expireCookie(name) {
      document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; path=/; SameSite=Lax`;
    }

    function rememberTargetSection(section) {
      if (!section) {
        return;
      }
      try {
        window.sessionStorage.setItem(sectionStorageKey, section);
      } catch (error) {
        console.warn("Unable to persist the requested portal section.", error);
      }
    }

    function currentPortalRoute() {
      return window.location.pathname === accessControlPath ? "access-control" : "home";
    }

    function currentLaunchTarget() {
      const segments = window.location.pathname
        .split("/")
        .filter(Boolean);
      if (segments.length === 2 && segments[0] === "launch") {
        return segments[1];
      }
      return "";
    }

    function getTargetSection() {
      if (window.location.hash === "#administration" || window.location.pathname === accessControlPath) {
        return "access-control";
      }
      try {
        return window.sessionStorage.getItem(sectionStorageKey) || "";
      } catch (error) {
        return "";
      }
    }

    function clearTargetSection() {
      try {
        window.sessionStorage.removeItem(sectionStorageKey);
      } catch (error) {
        console.warn("Unable to clear the requested portal section.", error);
      }
    }

    function rememberRouteNotice(level, message) {
      if (!message) {
        return;
      }
      try {
        window.sessionStorage.setItem(routeNoticeStorageKey, JSON.stringify({ level, message }));
      } catch (error) {
        console.warn("Unable to persist the route notice.", error);
      }
    }

    function consumeRouteNotice() {
      try {
        const raw = window.sessionStorage.getItem(routeNoticeStorageKey);
        window.sessionStorage.removeItem(routeNoticeStorageKey);
        if (!raw) {
          return null;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") {
          return null;
        }
        return {
          level: typeof parsed.level === "string" ? parsed.level : "info",
          message: typeof parsed.message === "string" ? parsed.message : "",
        };
      } catch (error) {
        return null;
      }
    }

    function clearTunnelOauthProxyCookies() {
      document.cookie
        .split(";")
        .map((entry) => entry.trim().split("=", 1)[0])
        .filter(Boolean)
        .filter((name) => name.startsWith("_oauth2_proxy"))
        .forEach((name) => expireCookie(name));
    }

    function groupItems(items, orderedGroups) {
      const buckets = new Map();
      items.forEach((item) => {
        const group = item.group || "Applications";
        if (!buckets.has(group)) {
          buckets.set(group, []);
        }
        buckets.get(group).push(item);
      });

      const ordered = [];
      orderedGroups.forEach((group) => {
        if (buckets.has(group)) {
          ordered.push([group, buckets.get(group)]);
          buckets.delete(group);
        }
      });

      Array.from(buckets.keys())
        .sort()
        .forEach((group) => ordered.push([group, buckets.get(group)]));

      return ordered;
    }

    function showHomeRoute() {
      show(launchGroups);
      if (!emptyPanel.classList.contains("is-hidden")) {
        show(emptyPanel);
      }
      if (state.isAdmin && administration) {
        show(administration);
      }
      hide(roleManagementPanel);
      hide(accessControlBack);
    }

    function showAccessControlRoute() {
      hide(launchGroups);
      hide(emptyPanel);
      hide(administration);
      show(roleManagementPanel);
      show(accessControlBack);
    }

    function setPortalNotice(level, message) {
      if (!portalNotice) {
        return;
      }
      if (!message) {
        portalNotice.textContent = "";
        portalNotice.className = "status-banner is-hidden";
        return;
      }
      portalNotice.innerHTML = message;
      portalNotice.className = `status-banner is-${level}`;
      show(portalNotice);
    }

    function accessControlEnabled() {
      return Boolean(state.config?.admin?.accessControlEnabled);
    }

    function renderCardIcon(item) {
      const iconStyle = item.iconBackground ? ` style="background: ${escapeHtml(item.iconBackground)}"` : "";
      if (item.iconUrl) {
        return `
          <div class="app-icon has-image"${iconStyle}>
            <img src="${escapeHtml(item.iconUrl)}" alt="${escapeHtml(item.iconAlt || `${item.name} logo`)}" loading="lazy" />
          </div>
        `;
      }
      const iconText = item.iconText || item.icon || item.name.slice(0, 2).toUpperCase();
      return `<div class="app-icon"${iconStyle} aria-hidden="true">${escapeHtml(iconText)}</div>`;
    }

    function healthLabel(status) {
      switch (String(status || "unknown")) {
        case "healthy":
          return "Healthy";
        case "degraded":
          return "Degraded";
        case "down":
          return "Down";
        default:
          return "Unknown";
      }
    }

    function healthStateFor(item) {
      if (!state.config?.health?.enabled) {
        return null;
      }
      return (
        state.health.items[item.id] || {
          status: "unknown",
          summary: "Waiting for the latest platform health check.",
          checkedAt: state.health.lastUpdated || "",
        }
      );
    }

    function formatHealthTimestamp(value) {
      if (!value) {
        return "";
      }
      const timestamp = new Date(value);
      if (Number.isNaN(timestamp.getTime())) {
        return "";
      }
      return timestamp.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function renderHealthStatus(item) {
      const health = healthStateFor(item);
      if (!health) {
        return "";
      }
      const checkedAt = formatHealthTimestamp(health.checkedAt);
      return `
        <div class="launch-card-meta">
          <span class="health-pill is-${escapeHtml(health.status || "unknown")}" title="${escapeHtml(health.summary || "")}">${escapeHtml(healthLabel(health.status))}</span>
          ${checkedAt ? `<span class="health-timestamp">Checked ${escapeHtml(checkedAt)}</span>` : ""}
        </div>
        <p class="health-summary">${escapeHtml(health.summary || "No health details available yet.")}</p>
      `;
    }

    function renderLaunchCard(item) {
      return `
        <article class="launch-card">
          <div class="launch-card-header">
            ${renderCardIcon(item)}
            <div class="launch-copy">
              <h3>${escapeHtml(item.name)}</h3>
              <p>${escapeHtml(item.summary || "")}</p>
            </div>
          </div>
          ${renderHealthStatus(item)}
          <a class="primary-button launch-button" href="${escapeHtml(item.url)}">Open</a>
        </article>
      `;
    }

    function renderGroupedCards(container, items, orderedGroups) {
      if (!container) {
        return;
      }
      container.innerHTML = groupItems(items, orderedGroups)
        .map(
          ([group, groupedItems]) => `
            <section class="panel panel-group">
              <div class="panel-header">
                <h2>${escapeHtml(group)}</h2>
              </div>
              <div class="launch-grid">
                ${groupedItems.map((item) => renderLaunchCard(item)).join("")}
              </div>
            </section>
          `,
        )
        .join("");
    }

    function setAnonymousState() {
      show(anonymousState);
      show(anonymousActions);
      hide(signedInContent);
      hide(sessionBar);
      hide(administration);
      hide(adminToolsPanel);
      hide(roleManagementPanel);
      setPortalNotice("", "");
    }

    function setLoginPending(label = "Starting sign-in...") {
      if (!loginButton) {
        return;
      }
      loginButton.disabled = true;
      loginButton.setAttribute("aria-busy", "true");
      loginButton.dataset.authReady = "false";
      loginButton.textContent = label;
    }

    function setLoginReady() {
      if (!loginButton) {
        return;
      }
      loginButton.disabled = false;
      loginButton.removeAttribute("aria-busy");
      loginButton.dataset.authReady = "true";
      loginButton.textContent = defaultLoginLabel;
    }

    function setAuthenticatedState(displayName, isAdmin) {
      hide(anonymousState);
      hide(anonymousActions);
      show(signedInContent);
      show(sessionBar);
      sessionName.textContent = displayName;
      hide(roleManagementPanel);
      if (isAdmin && administration && currentPortalRoute() !== "access-control") {
        show(administration);
      } else {
        hide(administration);
      }
    }

    function applyBranding(config) {
      const branding = config.branding || {};
      document.title = branding.title || "Data Platform";
      titleElement.textContent = branding.title || "Data Platform";
      if (branding.subtitle) {
        subtitleElement.textContent = branding.subtitle;
        show(subtitleElement);
      } else {
        subtitleElement.textContent = "";
        hide(subtitleElement);
      }

      if (branding.logoUrl) {
        portalLogo.src = branding.logoUrl;
        portalLogo.alt = branding.logoAlt || "Platform logo";
        show(portalLogo);
      } else {
        portalLogo.removeAttribute("src");
        hide(portalLogo);
      }

      if (portalFavicon) {
        if (branding.faviconUrl) {
          portalFavicon.href = branding.faviconUrl;
        } else {
          portalFavicon.removeAttribute("href");
        }
      }

      if (portalThemeColor && branding.metaThemeColor) {
        portalThemeColor.setAttribute("content", branding.metaThemeColor);
      }
    }

    function renderApps(config, groups) {
      if (!launchGroups) {
        return;
      }

      const visibleApps = (config.apps || []).filter((app) => {
        const requiredGroups = app.requiredGroups || [];
        return requiredGroups.length === 0 || requiredGroups.some((group) => groups.includes(group));
      });

      if (visibleApps.length === 0) {
        launchGroups.innerHTML = "";
        show(emptyPanel);
        return;
      }

      hide(emptyPanel);
      renderGroupedCards(launchGroups, visibleApps, ["Data Access", "Analysis", "Workflows"]);
    }

    function renderAdminTools(config, isAdmin) {
      if (!adminToolsPanel || !adminTools) {
        return;
      }

      if (!isAdmin || currentPortalRoute() === "access-control") {
        hide(adminToolsPanel);
        return;
      }

      const tools = (config.admin?.tools || []).filter((tool) => tool.url);
      if (tools.length === 0) {
        hide(adminToolsPanel);
        return;
      }

      show(adminToolsPanel);
      renderGroupedCards(adminTools, tools, ["Governance & Access", "Platform Operations", "Cluster Operations"]);
    }

    function setRoleManagementMessage(level, message) {
      if (!roleManagementStatus) {
        return;
      }
      if (!message) {
        roleManagementStatus.textContent = "";
        roleManagementStatus.className = "status-banner is-hidden";
        return;
      }
      roleManagementStatus.innerHTML = message;
      roleManagementStatus.className = `status-banner is-${level}`;
      show(roleManagementStatus);
    }

    function currentRole() {
      if (state.roles.length === 0) {
        return null;
      }
      return (
        state.roles.find((role) => role.key === state.selectedRoleKey) ||
        state.roles[0] ||
        null
      );
    }

    function memberKindLabel(kind) {
      return kind === "group" ? "Group" : "User";
    }

    function canEditUserMembers() {
      return Boolean(
        state.adminStatus &&
          state.adminStatus.membershipSource === "ranger" &&
          state.adminStatus.ldapReachable,
      );
    }

    function canEditUsers() {
      return canEditUserMembers() && Boolean(state.adminStatus && state.adminStatus.exceptionSupportEnabled);
    }

    function canEditGroups() {
      return canEditUserMembers() && Boolean(state.adminStatus && state.adminStatus.groupAssignmentEnabled);
    }

    function isAssigned(role, kind, name) {
      const members =
        kind === "group"
          ? role.members.groups
          : role.members.users;
      return members.includes(name);
    }

    function renderMemberList(kind, role, members, emptyText, editable) {
      if (!members || members.length === 0) {
        return `<span class="detail-empty">${escapeHtml(emptyText)}</span>`;
      }

      return members
        .map(
          (name) => `
            <span class="member-chip">
              <span class="member-kind">${escapeHtml(memberKindLabel(kind))}</span>
              <span class="member-name">${escapeHtml(name)}</span>
              ${
                editable
                  ? `<button type="button" class="member-remove" data-action="remove-member" data-kind="${escapeHtml(kind)}" data-name="${escapeHtml(name)}" data-role-key="${escapeHtml(role.key)}">Remove</button>`
                  : ""
              }
            </span>
          `,
        )
        .join("");
    }

    function renderSearchResults(kind, role) {
      const search = state.search[kind];
      const isExceptionSearch = kind === "exception";
      const searchKind = isExceptionSearch ? "user" : kind;
      const editable = searchKind === "group" ? canEditGroups() : (isExceptionSearch ? canEditUsers() : canEditUserMembers());
      if (!editable) {
        return `<p class="detail-empty">${
          searchKind === "group"
            ? "Directory-group assignment is unavailable until LDAP and Ranger usersync are enabled."
            : isExceptionSearch
              ? "Direct-user exceptions are unavailable while live access-control editing is disabled."
              : "Direct-user role membership is unavailable while live access-control editing is disabled."
        }</p>`;
      }
      if (search.loading) {
        return `<p class="detail-empty">Searching LDAP-backed ${searchKind === "group" ? "groups" : "users"}...</p>`;
      }
      if (search.error) {
        return `<p class="detail-empty">${escapeHtml(search.error)}</p>`;
      }
      if (!search.query.trim()) {
        return `<p class="detail-empty">Search the organizational directory for ${searchKind === "group" ? "groups" : "users"} to assign to this platform role.</p>`;
      }
      if (search.results.length === 0) {
        return `<p class="detail-empty">No matching directory ${searchKind === "group" ? "groups" : "users"} found.</p>`;
      }
      return search.results
        .map((result) => {
          const name = result.name || "";
          const displayName = result.displayName || name;
          const assigned = isAssigned(role, searchKind, name);
          const metadata = [];
          if (searchKind === "user" && result.email) {
            metadata.push(result.email);
          }
          if (displayName !== name) {
            metadata.unshift(name);
          }
          return `
            <div class="search-result-row">
              <div class="search-result-copy">
                <span class="member-kind">${escapeHtml(memberKindLabel(searchKind))}</span>
                <strong>${escapeHtml(displayName)}</strong>
                ${metadata.length ? `<span>${escapeHtml(metadata.join(" • "))}</span>` : ""}
              </div>
              <button
                type="button"
                class="secondary-button compact-button"
                data-action="${searchKind === "group" ? "add-member" : isExceptionSearch ? "select-exception-user" : "add-member"}"
                data-kind="${escapeHtml(searchKind)}"
                data-name="${escapeHtml(name)}"
                data-display-name="${escapeHtml(displayName)}"
                data-email="${escapeHtml(result.email || "")}"
                data-role-key="${escapeHtml(role.key)}"
                ${assigned ? "disabled" : ""}
              >
                ${assigned ? "Assigned" : searchKind === "group" ? "Add" : isExceptionSearch ? "Use" : "Add"}
              </button>
            </div>
          `;
        })
        .join("");
    }

    function formatDateLabel(value) {
      if (!value) {
        return "";
      }
      const timestamp = new Date(value);
      if (Number.isNaN(timestamp.getTime())) {
        return value;
      }
      return timestamp.toLocaleDateString();
    }

    function normalizeDateInputValue(value) {
      if (!value) {
        return "";
      }
      const timestamp = new Date(value);
      if (Number.isNaN(timestamp.getTime())) {
        return "";
      }
      return timestamp.toISOString().slice(0, 10);
    }

    function renderRoleCatalog() {
      if (!roleCatalog) {
        return;
      }

      if (state.roles.length === 0) {
        roleCatalog.innerHTML = `
          <div class="panel-subtle">
            <p class="panel-note">No manageable platform roles are available for administration.</p>
          </div>
        `;
        return;
      }

      roleCatalog.innerHTML = state.roles
        .map((role) => {
          const selected = currentRole() && currentRole().key === role.key;
          const membershipCount =
            (role.members?.users?.length || 0) +
            (role.members?.groups?.length || 0) +
            (role.exceptions?.active?.length || 0);
          const displayName = role.displayName || humanizeSlug(role.key);
          return `
            <button type="button" class="role-catalog-item ${selected ? "is-active" : ""}" data-action="select-role" data-role-key="${escapeHtml(role.key)}">
              <span class="role-catalog-copy">
                <strong>${escapeHtml(displayName)}</strong>
                <span>${escapeHtml(role.description || "Git-defined platform role")}</span>
              </span>
              <span class="badge">${membershipCount}</span>
            </button>
          `;
        })
        .join("");
    }

    function renderRoleDetail() {
      if (!roleDetail) {
        return;
      }

      const role = currentRole();
      if (!role) {
        roleDetail.innerHTML = `<p class="panel-note">Select a platform role to review live membership, assign LDAP users or groups, and inspect policy impact.</p>`;
        return;
      }

      const groupSearchDisabled = !canEditGroups();
      const userSearchDisabled = !canEditUserMembers();
      const exceptionSearchDisabled = !canEditUsers();
      const displayName = role.displayName || humanizeSlug(role.key);
      const auditLink =
        state.adminStatus && state.adminStatus.auditUrl
          ? `<a href="${escapeHtml(state.adminStatus.auditUrl)}" target="_blank" rel="noreferrer">Open Ranger Admin</a>`
          : "Ranger Admin";
      const activeExceptions = role.exceptions?.active || [];
      const declaredExceptions = role.exceptions?.declared || [];
      const appEntitlements = Object.entries(role.apps || {})
        .filter(([, enabled]) => Boolean(enabled))
        .map(([name]) => humanizeSlug(name.replace(/Ui$/, "-ui")));
      const policySummaries = role.policySummaries || [];
      const activeTab = state.activeRoleTab || "overview";
      const hasDraft = Boolean(state.exceptionDraft.username);

      const overviewPanel = `
        <section class="detail-stack">
          <div class="detail-row role-metadata-row">
            <span class="detail-chip">Ranger role: ${escapeHtml(role.name || role.key)}</span>
            <span class="detail-chip">Nested roles: ${escapeHtml(role.nestedRoles && role.nestedRoles.length ? role.nestedRoles.join(", ") : "None")}</span>
          </div>
          <div class="detail-row role-metadata-row">
            <span class="detail-chip">Approved users: ${escapeHtml(String(role.members.users.length))}</span>
            <span class="detail-chip">LDAP groups: ${escapeHtml(String(role.members.groups.length))}</span>
            <span class="detail-chip">Active exceptions: ${escapeHtml(String(activeExceptions.length))}</span>
          </div>
          <section class="admin-section">
            <h4>Current direct-user members</h4>
            <div class="member-list">
              ${renderMemberList("user", role, role.members.users, "No direct users assigned", canEditUserMembers())}
            </div>
