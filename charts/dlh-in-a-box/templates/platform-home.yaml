apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
spec:
  replicas: {{ default 1 .Values.platformHome.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
      app.kubernetes.io/component: platform-home
  template:
    metadata:
      annotations:
        checksum/platform-home-config: {{ $platformHomeChecksum | quote }}
        rollout/platform-home-release-revision: {{ .Release.Revision | quote }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: platform-home
    spec:
      serviceAccountName: {{ $serviceName }}-admin-api
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ldapHostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: platform-home
          image: "{{ .Values.platformHome.image.repository }}:{{ .Values.platformHome.image.tag }}"
          imagePullPolicy: {{ .Values.platformHome.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
        - name: platform-home-admin-api
          image: "{{ .Values.platformHome.api.image.repository }}:{{ .Values.platformHome.api.image.tag }}"
          imagePullPolicy: {{ .Values.platformHome.api.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              python -m pip install --no-cache-dir ldap3 >/tmp/platform-home-api-pip.log
              python -u /opt/platform-home-api/admin-api.py
          env:
            - name: PORT
              value: {{ $apiPort | quote }}
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: IDENTITY_USERINFO_URL
              value: {{ include "dlh-in-a-box.identity.internalUserInfoUrl" . | quote }}
            - name: IDENTITY_EXPECTED_ISSUER
              value: {{ include "dlh-in-a-box.identity.issuer" . | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ default "groups" $oidc.groupsClaim | quote }}
            - name: PLATFORM_ADMIN_GROUP
              value: {{ $adminRequiredGroup | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ACCESS_CONTROL_STATE_CONFIGMAP_NAME
              value: {{ $accessControlStateConfigMapName | quote }}
            - name: ACCESS_CONTROL_STATE_CONFIGMAP_KEY
              value: "state.json"
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "dlh-ranger-admin" $rangerAdmin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $rangerAdmin.adminPasswordKey }}
                  optional: true
            {{- if $ldapBindSecretName }}
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ldapBindSecretName }}
                  key: {{ $ldapBindPasswordKey }}
            {{- end }}
          ports:
            - name: admin-api
              containerPort: {{ $apiPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin-api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin-api
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: admin-api
              mountPath: /opt/platform-home-api
              readOnly: true
            {{- if $ldapUseTrustedCa }}
            - name: ldap-trusted-ca
              mountPath: /opt/platform-home-api/ldap-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: assets
          configMap:
            name: {{ $serviceName }}-assets
        - name: admin-api
          configMap:
            name: {{ $serviceName }}-api
            defaultMode: 0555
        - name: nginx-config
          configMap:
            name: {{ $serviceName }}-nginx
        {{- if $ldapUseTrustedCa }}
        - name: ldap-trusted-ca
          secret:
            secretName: {{ $ldapTrustedCaSecretName }}
            items:
              - key: {{ $ldapTrustedCaCertKey }}
                path: {{ $ldapTrustedCaCertKey }}
        {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $serviceName }}-access-control-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: platform-home
        spec:
          serviceAccountName: {{ $serviceName }}-admin-api
          restartPolicy: OnFailure
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: platform-home-access-control-reconcile
              image: "{{ .Values.platformHome.api.image.repository }}:{{ .Values.platformHome.api.image.tag }}"
              imagePullPolicy: {{ .Values.platformHome.api.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python -m pip install --no-cache-dir ldap3 >/tmp/platform-home-api-pip.log
                  python /opt/platform-home-api/admin-api.py reconcile-expired
              env:
                - name: PORT
                  value: {{ $apiPort | quote }}
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: IDENTITY_USERINFO_URL
                  value: {{ include "dlh-in-a-box.identity.internalUserInfoUrl" . | quote }}
                - name: IDENTITY_EXPECTED_ISSUER
                  value: {{ include "dlh-in-a-box.identity.issuer" . | quote }}
                - name: OIDC_GROUPS_CLAIM
                  value: {{ default "groups" $oidc.groupsClaim | quote }}
                - name: PLATFORM_ADMIN_GROUP
                  value: {{ $adminRequiredGroup | quote }}
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: ACCESS_CONTROL_STATE_CONFIGMAP_NAME
                  value: {{ $accessControlStateConfigMapName | quote }}
                - name: ACCESS_CONTROL_STATE_CONFIGMAP_KEY
                  value: "state.json"
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default "dlh-ranger-admin" $rangerAdmin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $rangerAdmin.adminPasswordKey }}
                      optional: true
                {{- if $ldapBindSecretName }}
                - name: LDAP_BIND_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ldapBindSecretName }}
                      key: {{ $ldapBindPasswordKey }}
                {{- end }}
              volumeMounts:
                - name: admin-api
                  mountPath: /opt/platform-home-api
                  readOnly: true
                {{- if $ldapUseTrustedCa }}
                - name: ldap-trusted-ca
                  mountPath: /opt/platform-home-api/ldap-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: admin-api
              configMap:
                name: {{ $serviceName }}-api
                defaultMode: 0555
            {{- if $ldapUseTrustedCa }}
            - name: ldap-trusted-ca
              secret:
                secretName: {{ $ldapTrustedCaSecretName }}
                items:
                  - key: {{ $ldapTrustedCaCertKey }}
                    path: {{ $ldapTrustedCaCertKey }}
            {{- end }}
---
{{- if .Values.platformHome.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
  {{- with .Values.platformHome.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.platformHome.ingress.className }}
  ingressClassName: {{ .Values.platformHome.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.platformHome.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  number: 80
    {{- range $extraHost := (.Values.platformHome.ingress.additionalHosts | default (list)) }}
    - host: {{ $extraHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  number: 80
    {{- end }}
  {{- if .Values.platformHome.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.platformHome.ingress.host | quote }}
        {{- range $extraHost := (.Values.platformHome.ingress.additionalHosts | default (list)) }}
        - {{ $extraHost | quote }}
        {{- end }}
      secretName: {{ .Values.platformHome.ingress.tlsSecretName }}
  {{- end }}
{{- end }}
{{- end }}
