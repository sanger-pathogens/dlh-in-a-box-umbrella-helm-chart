      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .member-name {
      font-weight: 700;
    }

    .member-remove {
      border: 0;
      background: transparent;
      color: var(--accent-rose);
      font-family: var(--font-body);
      font-weight: 700;
      cursor: pointer;
      padding: 0 0.15rem;
    }

    .principal-search-form {
      display: grid;
      gap: 0.45rem;
      margin-top: 1rem;
    }

    .search-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink-deep);
    }

    .search-input-row {
      display: grid;
      gap: 0.65rem;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
    }

    .search-input {
