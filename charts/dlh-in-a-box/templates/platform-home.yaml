      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.85rem;
      border-radius: 16px;
      border: 1px solid rgba(18, 89, 116, 0.12);
      background: rgba(255, 255, 255, 0.92);
    }

    .search-result-copy {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.45rem;
      min-width: 0;
    }

    .compact-button {
      min-width: 5rem;
      padding: 0.62rem 0.8rem;
      font-size: 0.88rem;
      line-height: 1;
      white-space: nowrap;
    }

    .exception-card {
      display: grid;
      gap: 0.2rem;
      padding: 0.75rem;
      border-radius: 14px;
      border: 1px dashed rgba(214, 88, 69, 0.28);
      background: rgba(214, 88, 69, 0.05);
    }

    @media (max-width: 920px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .brand-lockup {
        align-items: start;
      }

      .hero-actions-stack,
      .session-bar {
        justify-content: stretch;
      }

      .session-bar {
        display: grid;
      }

      .session-bar > * {
        width: 100%;
      }

      .role-management-layout,
      .role-editor-grid,
      .search-input-row,
      .search-result-row {
        grid-template-columns: 1fr;
      }

      .search-result-row {
        align-items: stretch;
      }
    }
