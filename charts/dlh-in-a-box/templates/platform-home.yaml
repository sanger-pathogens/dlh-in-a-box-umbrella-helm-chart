      background: rgba(255, 255, 255, 0.72);
      border-color: rgba(18, 89, 116, 0.18);
      color: var(--ink-deep);
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-1px);
    }

    .primary-button:hover {
      background: linear-gradient(135deg, #1b5571 0%, var(--brand-deep) 100%);
    }

    .secondary-button:hover {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(18, 89, 116, 0.28);
    }

    .primary-button:disabled,
    .secondary-button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .content {
      display: grid;
      gap: 1.5rem;
    }

    .content-minimal {
      min-height: 0;
    }

    .panel {
      padding: 1.4rem;
    }

    .panel-secondary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(239, 243, 244, 0.92));
    }

    .panel-group {
      padding: 1.2rem;
    }

    .panel-header {
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 1rem;
    }

    .group-stack,
    .admin-grid {
      display: grid;
      gap: 1.25rem;
    }

    #administration {
      gap: 1.5rem;
    }

    .launch-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(15.5rem, 1fr));
    }

    .launch-card,
    .admin-card {
      padding: 1.2rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
