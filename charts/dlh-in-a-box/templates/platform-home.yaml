                  <p>${escapeHtml(exception.reason || "No reason recorded.")}</p>
                  <p class="detail-note">Approval ${escapeHtml(exception.approvalRef || "n/a")} • Expires ${escapeHtml(formatDateLabel(exception.expiresAt))}</p>
