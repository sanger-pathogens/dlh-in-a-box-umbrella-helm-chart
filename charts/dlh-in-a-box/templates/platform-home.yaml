    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    CONFIG_PATH = "/opt/platform-home-api/admin-config.json"
    PORT = int(os.environ.get("PORT", "18080"))
    RANGER_URL = os.environ.get("RANGER_URL", "").rstrip("/")
    RANGER_PASSWORD = os.environ.get("RANGER_ADMIN_PASSWORD", "")
    USERINFO_URL = os.environ.get("IDENTITY_USERINFO_URL", "")
    EXPECTED_ISSUER = os.environ.get("IDENTITY_EXPECTED_ISSUER", "")
    GROUPS_CLAIM = os.environ.get("OIDC_GROUPS_CLAIM", "groups")
    ADMIN_GROUP = os.environ.get("PLATFORM_ADMIN_GROUP", "")
    CACHE_TTL_SECONDS = 60


    class ApiError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status = int(status)
            self.message = str(message)


    def load_config():
        with open(CONFIG_PATH, "r", encoding="utf-8") as handle:
            return json.load(handle)


    CONFIG = load_config()
    ROLE_CATALOG = {
        str(role.get("key", "")): role
        for role in CONFIG.get("roles", [])
        if str(role.get("key", "")).strip()
    }
    HEALTH_CACHE = {}
    HEALTH_CACHE_TTL_SECONDS = max(
        15,
        int(CONFIG.get("health", {}).get("refreshIntervalSeconds") or CACHE_TTL_SECONDS),
    )
    HTTPS_CONTEXT = ssl._create_unverified_context()
    PRINCIPAL_CACHE = {
        "user": {"expires_at": 0, "items": []},
        "group": {"expires_at": 0, "items": []},
    }


    def json_response(handler, status, payload):
        body = json.dumps(payload, sort_keys=True).encode("utf-8")
        handler.send_response(status)
        handler.send_header("Content-Type", "application/json")
        handler.send_header("Cache-Control", "no-store")
        handler.send_header("Content-Length", str(len(body)))
        handler.end_headers()
        handler.wfile.write(body)


    def utc_timestamp():
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


    def read_json(handler):
        raw_length = handler.headers.get("Content-Length", "0")
        try:
            length = int(raw_length)
        except ValueError as exc:
            raise ApiError(400, "Invalid Content-Length header.") from exc
        if length <= 0:
            return {}
        payload = handler.rfile.read(length).decode("utf-8")
        if not payload.strip():
            return {}
        try:
            return json.loads(payload)
        except json.JSONDecodeError as exc:
            raise ApiError(400, "Request body must be valid JSON.") from exc


    def bearer_token(handler):
        auth_header = str(handler.headers.get("Authorization", ""))
        if not auth_header.startswith("Bearer "):
            raise ApiError(401, "A bearer access token is required.")
        token = auth_header.split(" ", 1)[1].strip()
        if not token:
            raise ApiError(401, "A bearer access token is required.")
        return token


    def decode_token_claims(token):
        parts = token.split(".")
        if len(parts) < 2:
            return {}
        payload = parts[1]
        payload += "=" * (-len(payload) % 4)
        try:
            decoded = base64.urlsafe_b64decode(payload.encode("ascii")).decode("utf-8")
            claims = json.loads(decoded)
        except Exception:
            return {}
        return claims if isinstance(claims, dict) else {}


    def userinfo(token):
        if not USERINFO_URL:
            raise ApiError(500, "The portal admin API is missing its identity userinfo endpoint.")
        request = urllib.request.Request(
            USERINFO_URL,
            headers={
                "Accept": "application/json",
                "Authorization": f"Bearer {token}",
            },
            method="GET",
        )
        try:
            with urllib.request.urlopen(request, timeout=30) as response:
                payload = response.read().decode("utf-8")
                return json.loads(payload) if payload else {}
        except urllib.error.HTTPError as exc:
            if exc.code in (401, 403):
                raise ApiError(401, "Your session is no longer valid. Please sign in again.") from exc
            raise


    def normalize_groups(value):
        if isinstance(value, list):
            return [str(item) for item in value if str(item).strip()]
        if isinstance(value, str) and value.strip():
            return [value.strip()]
        return []


    def validate_token_claims(claims):
        if not isinstance(claims, dict) or not claims:
            raise ApiError(401, "Your session is no longer valid. Please sign in again.")

        now = int(time.time())
        exp = claims.get("exp")
        if not isinstance(exp, (int, float)) or int(exp) <= now:
            raise ApiError(401, "Your session is no longer valid. Please sign in again.")

        nbf = claims.get("nbf")
        if isinstance(nbf, (int, float)) and int(nbf) > now:
            raise ApiError(401, "Your session is not active yet. Please sign in again.")

        issuer = str(claims.get("iss", "")).strip()
        if EXPECTED_ISSUER and issuer and issuer != EXPECTED_ISSUER:
            raise ApiError(401, "Your session is no longer valid. Please sign in again.")


    def authenticate(handler, require_admin=True):
        token = bearer_token(handler)
        claims = decode_token_claims(token)
        validate_token_claims(claims)
        profile = {}
        try:
            profile = userinfo(token)
        except ApiError as exc:
            if exc.status != 401:
                raise
        groups = normalize_groups(profile.get(GROUPS_CLAIM))
        if not groups:
            groups = normalize_groups(claims.get(GROUPS_CLAIM))
        is_admin = bool(ADMIN_GROUP and ADMIN_GROUP in groups)
        if require_admin and not is_admin:
            raise ApiError(403, "Platform administration is limited to platform administrators.")
        merged = dict(claims)
        merged.update(profile if isinstance(profile, dict) else {})
        merged["groups"] = groups
        merged["is_admin"] = is_admin
        return merged


    def ranger_enabled():
        return bool(CONFIG.get("ranger", {}).get("enabled")) and bool(RANGER_URL) and bool(RANGER_PASSWORD)


    def ranger_request(method, path, payload=None, ok=(200, 201), parse_json=True):
        if not ranger_enabled():
            raise ApiError(503, "Ranger administration is not enabled for this environment.")
        url = f"{RANGER_URL}{path}"
        headers = {
            "Authorization": "Basic "
            + base64.b64encode(f"admin:{RANGER_PASSWORD}".encode("utf-8")).decode("ascii"),
            "Accept": "application/json",
        }
        body = None
        if payload is not None:
            body = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/json"
        request = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(request, timeout=30) as response:
                raw = response.read().decode("utf-8")
                if not parse_json:
                    return raw
                return json.loads(raw) if raw else None
        except urllib.error.HTTPError as exc:
            if exc.code in ok:
                raw = exc.read().decode("utf-8")
                if not parse_json:
                    return raw
                return json.loads(raw) if raw else None
            if exc.code == 404:
                raise ApiError(404, "Requested Ranger resource was not found.") from exc
            raise


    def role_update_path(role_id):
        return f"/service/public/v2/api/roles/{role_id}?createNonExistUserGroup=true"


    def normalize_role_members(items):
        members = {}
        for item in items or []:
            if isinstance(item, dict):
                name = str(item.get("name", "")).strip()
                is_admin = bool(item.get("isAdmin", False))
            else:
                name = str(item).strip()
                is_admin = False
            if not name:
                continue
            current = members.get(name)
            members[name] = {"name": name, "isAdmin": is_admin or bool(current and current.get("isAdmin"))}
        return [members[name] for name in sorted(members)]


    def extract_member_names(items):
        return [item["name"] for item in normalize_role_members(items)]


    def list_roles():
        roles = []
        start_index = 0
        page_size = 200
        while True:
            page = ranger_request(
                "GET",
                f"/service/public/v2/api/roles?startIndex={start_index}&pageSize={page_size}",
                ok=(200,),
            ) or []
            if not isinstance(page, list):
                break
            roles.extend(page)
            if len(page) < page_size:
                break
            start_index += page_size
        return roles


    def get_role_by_name(role_name):
        for role in list_roles():
            if str(role.get("name", "")) == str(role_name):
                return role
        return None


    def principal_name(kind, item):
        if isinstance(item, str):
            return item.strip()
        if not isinstance(item, dict):
            return ""
        if kind == "group":
            return str(item.get("name") or item.get("groupName") or "").strip()
        return str(item.get("name") or item.get("userName") or "").strip()


    def extract_page_items(page, kind):
        if isinstance(page, list):
            return page
        if not isinstance(page, dict):
            return []
        candidate_keys = ["vXGroups", "vXUsers", "list", "items", "data", "result"]
        for key in candidate_keys:
            value = page.get(key)
            if isinstance(value, list):
                return value
        return []


    def list_known_principals(kind):
        cache = PRINCIPAL_CACHE[kind]
        now = time.time()
        if cache["expires_at"] > now:
            return cache["items"]

        if not ranger_enabled():
            return []

        path = "/service/xusers/groups" if kind == "group" else "/service/xusers/users"
        known = []
        seen = set()
        start_index = 0
        page_size = 200
        while True:
            separator = "&" if "?" in path else "?"
            page = ranger_request(
                "GET",
                f"{path}{separator}startIndex={start_index}&pageSize={page_size}",
                ok=(200,),
            )
            items = extract_page_items(page, kind)
            for item in items:
                name = principal_name(kind, item)
                if name and name not in seen:
                    seen.add(name)
                    known.append(name)
            if len(items) < page_size:
                break
            start_index += page_size

        known.sort(key=str.casefold)
        cache["items"] = known
        cache["expires_at"] = now + CACHE_TTL_SECONDS
        return known


    def principal_exists(kind, name):
        target = str(name).strip()
        return target in set(list_known_principals(kind))


    def role_view(role_entry, live_role):
        users = extract_member_names(live_role.get("users", [])) if live_role else extract_member_names(role_entry.get("users", []))
        groups = extract_member_names(live_role.get("groups", [])) if live_role else extract_member_names(role_entry.get("directoryGroups", []))
        return {
            "key": role_entry.get("key"),
            "name": role_entry.get("name") or role_entry.get("key"),
            "description": role_entry.get("description", ""),
            "nestedRoles": role_entry.get("nestedRoles", []),
            "declaredExceptionsCount": len(role_entry.get("declaredExceptions", [])),
            "members": {
                "users": users,
                "groups": groups,
            },
        }


    def list_platform_roles():
        live_roles = {}
        if ranger_enabled():
            live_roles = {
                str(role.get("name", "")): role
                for role in list_roles()
                if str(role.get("name", "")).strip()
            }
        views = []
        for role_key in sorted(ROLE_CATALOG):
            role_entry = ROLE_CATALOG[role_key]
            live_role = live_roles.get(role_entry.get("name") or role_key)
            views.append(role_view(role_entry, live_role))
        return views


    def visible_items_for(profile):
        groups = set(normalize_groups(profile.get("groups")))
        is_admin = bool(profile.get("is_admin"))
        visible = []
        for item in CONFIG.get("items", []):
            if not isinstance(item, dict):
                continue
            if item.get("adminOnly") and not is_admin:
                continue
            required_groups = {
                str(group).strip()
                for group in (item.get("requiredGroups") or [])
                if str(group).strip()
            }
            if required_groups and groups.isdisjoint(required_groups):
                continue
            visible.append(item)
        return visible


    def normalize_expected_status_codes(values):
        codes = []
        for value in values or []:
            try:
                codes.append(int(value))
            except (TypeError, ValueError):
                continue
        return codes or [200]


    def health_payload(item, status, summary, checked_at=None):
        health = item.get("health") if isinstance(item, dict) else {}
        if not isinstance(health, dict):
            health = {}
        browser_target = str(item.get("url", "")).strip()
        probe_target = str(health.get("targetUrl", "")).strip()
        return {
            "id": str(item.get("id", "")).strip(),
            "label": str(item.get("name", "")).strip(),
            "group": str(item.get("group", "")).strip(),
            "status": status,
            "summary": summary,
            "checkedAt": checked_at or utc_timestamp(),
            "targetUrl": browser_target or probe_target,
            "probeTargetUrl": probe_target or browser_target,
        }


    def probe_item_health(item):
        item_id = str(item.get("id", "")).strip()
        cache_entry = HEALTH_CACHE.get(item_id)
        now = time.time()
        if cache_entry and cache_entry.get("expires_at", 0) > now:
            return cache_entry["payload"]

        health = item.get("health") if isinstance(item, dict) else {}
        if not isinstance(health, dict):
            health = {}
        target_url = str(health.get("targetUrl", "")).strip()
        if not target_url:
            payload = health_payload(item, "unknown", "No health probe is configured for this component.")
            HEALTH_CACHE[item_id] = {"expires_at": now + HEALTH_CACHE_TTL_SECONDS, "payload": payload}
            return payload

        expected_codes = normalize_expected_status_codes(health.get("expectedStatusCodes"))
        timeout_seconds = max(1, int(health.get("timeoutSeconds") or 5))
        body_includes = str(health.get("bodyIncludes", "") or "").strip()
        request = urllib.request.Request(
            target_url,
            headers={"Accept": "text/html,application/json;q=0.9,*/*;q=0.8"},
            method="GET",
        )

        status_code = None
        response_body = ""
        checked_at = utc_timestamp()
        try:
            parsed_target = urllib.parse.urlparse(target_url)
            with urllib.request.urlopen(
                request,
                timeout=timeout_seconds,
                context=HTTPS_CONTEXT if parsed_target.scheme == "https" else None,
            ) as response:
                status_code = int(response.status)
                response_body = response.read(4096).decode("utf-8", "replace")
        except urllib.error.HTTPError as exc:
            status_code = int(exc.code)
            response_body = exc.read(4096).decode("utf-8", "replace")
        except Exception as exc:
            payload = health_payload(item, "down", f"Health check failed: {exc}", checked_at=checked_at)
            HEALTH_CACHE[item_id] = {"expires_at": now + HEALTH_CACHE_TTL_SECONDS, "payload": payload}
            return payload

        if status_code in expected_codes:
            if body_includes and body_includes not in response_body:
                payload = health_payload(
                    item,
                    "degraded",
                    f"Endpoint returned expected HTTP {status_code}, but the configured content marker was not present.",
                    checked_at=checked_at,
                )
            else:
                payload = health_payload(
                    item,
                    "healthy",
                    f"Endpoint returned expected HTTP {status_code}.",
                    checked_at=checked_at,
                )
        elif status_code >= 500:
            payload = health_payload(item, "down", f"Endpoint returned HTTP {status_code}.", checked_at=checked_at)
        else:
            expected_label = ", ".join(str(code) for code in expected_codes)
            payload = health_payload(
                item,
                "degraded",
                f"Endpoint returned HTTP {status_code}; expected one of {expected_label}.",
                checked_at=checked_at,
            )

        HEALTH_CACHE[item_id] = {"expires_at": now + HEALTH_CACHE_TTL_SECONDS, "payload": payload}
        return payload


    def update_role_membership(role_key, kind, name, add_member):
        membership_source = str(CONFIG.get("ranger", {}).get("membershipSource", "git") or "git").lower()
        if membership_source != "ranger":
            raise ApiError(409, "Live role membership edits are disabled until platformRoleMembershipSource is set to ranger.")
        if kind == "group" and not bool(CONFIG.get("ranger", {}).get("usersyncEnabled")):
            raise ApiError(409, "Directory-group assignment is unavailable until LDAP and Ranger usersync are enabled.")
        if kind not in {"user", "group"}:
            raise ApiError(400, "kind must be either user or group.")

        principal = str(name or "").strip()
        if not principal:
            raise ApiError(400, "name must be a non-empty user or group name.")
        if not principal_exists(kind, principal):
            raise ApiError(404, f"{kind.title()} {principal} is not known to Ranger.")

        role_entry = ROLE_CATALOG.get(role_key)
        if not role_entry:
            raise ApiError(404, f"Platform role {role_key} is not defined in Git.")

        existing = get_role_by_name(role_entry.get("name") or role_key)
        if not existing:
            raise ApiError(404, f"Ranger role {(role_entry.get('name') or role_key)} does not exist yet.")

        users = normalize_role_members(existing.get("users", []))
        groups = normalize_role_members(existing.get("groups", []))
        roles = normalize_role_members(existing.get("roles", []))

        target_members = users if kind == "user" else groups
        target_map = {member["name"]: dict(member) for member in target_members}
        if add_member:
            target_map[principal] = {"name": principal, "isAdmin": False}
        else:
            target_map.pop(principal, None)

        payload = {
            "id": existing["id"],
            "guid": existing.get("guid"),
            "version": existing.get("version"),
            "createdByUser": existing.get("createdByUser"),
            "name": existing.get("name") or role_entry.get("name") or role_key,
            "description": role_entry.get("description", existing.get("description", "")),
            "isEnabled": True,
            "users": normalize_role_members(target_map.values()) if kind == "user" else users,
            "groups": normalize_role_members(target_map.values()) if kind == "group" else groups,
            "roles": roles,
        }
        ranger_request("PUT", role_update_path(existing["id"]), payload, ok=(200,))
        refreshed = get_role_by_name(role_entry.get("name") or role_key)
        return role_view(role_entry, refreshed)


    class PlatformAdminHandler(BaseHTTPRequestHandler):
        server_version = "platform-home-admin/1.0"

        def log_message(self, fmt, *args):
            return

        def do_GET(self):
            self.handle_request()

        def do_POST(self):
            self.handle_request()

        def do_DELETE(self):
            self.handle_request()

        def handle_request(self):
            parsed = urllib.parse.urlparse(self.path)
            path = parsed.path

            try:
                if path == "/healthz":
                    json_response(self, 200, {"status": "ok"})
                    return

                if self.command == "GET" and path == "/api/health":
                    session = authenticate(self, require_admin=False)
                    items = [probe_item_health(item) for item in visible_items_for(session)]
                    json_response(self, 200, {"checkedAt": utc_timestamp(), "items": items})
                    return

                authenticate(self)

                if self.command == "GET" and path == "/api/admin/status":
                    json_response(
                        self,
                        200,
                        {
                            "rangerEnabled": bool(CONFIG.get("ranger", {}).get("enabled")),
                            "membershipSource": str(CONFIG.get("ranger", {}).get("membershipSource", "git") or "git"),
                            "usersyncEnabled": bool(CONFIG.get("ranger", {}).get("usersyncEnabled")),
                            "groupAssignmentEnabled": bool(CONFIG.get("ranger", {}).get("usersyncEnabled")),
                            "userAssignmentEnabled": True,
                            "auditUrl": CONFIG.get("ranger", {}).get("browserUrl", ""),
                        },
                    )
                    return

                if self.command == "GET" and path == "/api/admin/platform-roles":
                    json_response(
                        self,
                        200,
                        {
                            "membershipSource": str(CONFIG.get("ranger", {}).get("membershipSource", "git") or "git"),
                            "roles": list_platform_roles(),
                        },
                    )
                    return

                if self.command == "GET" and path == "/api/admin/principals":
                    params = urllib.parse.parse_qs(parsed.query or "")
                    kind = str((params.get("kind") or [""])[0]).strip().lower()
                    query = str((params.get("query") or [""])[0]).strip()
                    if kind not in {"user", "group"}:
                        raise ApiError(400, "kind must be either user or group.")
                    if kind == "group" and not bool(CONFIG.get("ranger", {}).get("usersyncEnabled")):
                        json_response(self, 200, {"kind": kind, "results": []})
                        return
                    results = []
                    if query:
                        lowered = query.casefold()
                        results = [
                            name
                            for name in list_known_principals(kind)
                            if lowered in name.casefold()
                        ][:20]
                    json_response(self, 200, {"kind": kind, "results": results})
                    return

                if path.startswith("/api/admin/platform-roles/") and path.endswith("/members") and self.command in {"POST", "DELETE"}:
                    parts = path.split("/")
                    if len(parts) != 6:
                        raise ApiError(404, "Unknown admin API path.")
                    role_key = urllib.parse.unquote(parts[4])
                    payload = read_json(self)
                    role = update_role_membership(
                        role_key,
                        str(payload.get("kind", "")).strip().lower(),
                        payload.get("name"),
                        add_member=self.command == "POST",
                    )
                    json_response(self, 200, {"role": role})
                    return

                raise ApiError(404, "Unknown admin API path.")
            except ApiError as exc:
                json_response(self, exc.status, {"error": exc.message})
            except Exception as exc:
                json_response(self, 500, {"error": str(exc)})


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", PORT), PlatformAdminHandler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serviceName }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
data:
  default.conf: |
    server {
      listen {{ $port }};
      server_name _;
      # Tunnel-mode localhost access sends every 127.0.0.1 cookie back to the
      # launchpad regardless of port. Give nginx enough headroom to render the
      # page so the portal JS can clean up stale oauth2-proxy cookies.
      client_header_buffer_size 16k;
      large_client_header_buffers 8 32k;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location /api/ {
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://127.0.0.1:{{ $apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
      }

      location / {
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
    app.kubernetes.io/component: platform-home
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
spec:
  replicas: {{ default 1 .Values.platformHome.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
      app.kubernetes.io/component: platform-home
  template:
    metadata:
      annotations:
        checksum/platform-home-config: {{ $platformHomeChecksum | quote }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: platform-home
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: platform-home
          image: "{{ .Values.platformHome.image.repository }}:{{ .Values.platformHome.image.tag }}"
          imagePullPolicy: {{ .Values.platformHome.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
        - name: platform-home-admin-api
          image: "{{ .Values.platformHome.api.image.repository }}:{{ .Values.platformHome.api.image.tag }}"
          imagePullPolicy: {{ .Values.platformHome.api.image.pullPolicy }}
          command:
            - python
            - -u
            - /opt/platform-home-api/admin-api.py
          env:
            - name: PORT
              value: {{ $apiPort | quote }}
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: IDENTITY_USERINFO_URL
              value: {{ include "dlh-in-a-box.identity.internalUserInfoUrl" . | quote }}
            - name: IDENTITY_EXPECTED_ISSUER
              value: {{ include "dlh-in-a-box.identity.issuer" . | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ default "groups" $oidc.groupsClaim | quote }}
            - name: PLATFORM_ADMIN_GROUP
              value: {{ $adminRequiredGroup | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "dlh-ranger-admin" $rangerAdmin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $rangerAdmin.adminPasswordKey }}
                  optional: true
          ports:
            - name: admin-api
              containerPort: {{ $apiPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin-api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin-api
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: admin-api
              mountPath: /opt/platform-home-api
              readOnly: true
      volumes:
        - name: assets
          configMap:
            name: {{ $serviceName }}-assets
        - name: admin-api
          configMap:
            name: {{ $serviceName }}-api
            defaultMode: 0555
        - name: nginx-config
          configMap:
            name: {{ $serviceName }}-nginx
---
{{- if .Values.platformHome.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
  {{- with .Values.platformHome.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.platformHome.ingress.className }}
  ingressClassName: {{ .Values.platformHome.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.platformHome.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  number: 80
  {{- if .Values.platformHome.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.platformHome.ingress.host | quote }}
      secretName: {{ .Values.platformHome.ingress.tlsSecretName }}
  {{- end }}
{{- end }}
{{- end }}
