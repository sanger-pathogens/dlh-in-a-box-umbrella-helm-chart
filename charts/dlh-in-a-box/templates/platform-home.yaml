apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serviceName }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-home
data:
  default.conf: |
    server {
      listen {{ $port }};
      server_name _;
      # Tunnel-mode localhost access sends every 127.0.0.1 cookie back to the
      # launchpad regardless of port. Give nginx enough headroom to render the
      # page so the portal JS can clean up stale oauth2-proxy cookies.
      client_header_buffer_size 16k;
      large_client_header_buffers 8 32k;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location /api/ {
        # nginx does not inherit add_header directives into a location once the
        # location defines its own headers, so repeat the browser-safety
        # headers anywhere we also set cache semantics explicitly.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://127.0.0.1:{{ $apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
      }

      location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
      }
    }
