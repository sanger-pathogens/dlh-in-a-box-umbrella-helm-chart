{{- $global := .Values.global | default dict -}}
{{- $hasEnvironment := hasKey $global "environment" -}}
{{- $environment := default "" $global.environment -}}
{{- $identity := $global.identity | default dict -}}
{{- $provider := get $identity "provider" | default dict -}}
{{- $directory := get $identity "directory" | default dict -}}
{{- $directoryMode := include "dlh-in-a-box.identity.directoryMode" . -}}
{{- $keycloakLocalMode := eq $directoryMode "keycloakLocal" -}}
{{- $ldap := get $directory "ldap" | default dict -}}
{{- $external := get $identity "external" | default dict -}}
{{- $accessRoles := get $identity "accessRoles" | default dict -}}
{{- $clients := get $external "clients" | default dict -}}
{{- $trinoIdentity := get $clients "trino" | default dict -}}
{{- $trinoDirectGrantIdentity := get $clients "trinoDirectGrant" | default dict -}}
{{- $supersetIdentity := get $clients "superset" | default dict -}}
{{- $datahubIdentity := get $clients "datahub" | default dict -}}
{{- $platformHomeIdentity := get $clients "platformHome" | default dict -}}
{{- $jupyterhubIdentity := get $clients "jupyterhub" | default dict -}}
{{- $cloudbeaverIdentity := get $clients "cloudbeaverProxy" | default dict -}}
{{- $rangerProxyIdentity := get $clients "rangerProxy" | default dict -}}
{{- $prefectIdentity := get $clients "prefectProxy" | default dict -}}
{{- $prefectAutomationIdentity := get $clients "prefectAutomation" | default dict -}}
{{- $prefectDirectGrantIdentity := get $clients "prefectDirectGrant" | default dict -}}
{{- $authorization := $global.authorization | default dict -}}
{{- $ranger := get $authorization "ranger" | default dict -}}
{{- $datahubValues := .Values.datahub | default dict -}}
{{- $datahubAuth := get $datahubValues "auth" | default dict -}}
{{- $datahubFrontend := get $datahubValues "datahub-frontend" | default dict -}}
{{- $datahubFrontendIngress := get $datahubFrontend "ingress" | default dict -}}
{{- $datahubOidc := get $datahubFrontend "oidcAuthentication" | default dict -}}
{{- $jupyterhubValues := .Values.jupyterhub | default dict -}}
{{- $jupyterhubHub := get $jupyterhubValues "hub" | default dict -}}
{{- $jupyterhubExtraEnv := get $jupyterhubHub "extraEnv" | default dict -}}
{{- $platformHomeValues := .Values.platformHome | default dict -}}
{{- $platformHomeIngress := get $platformHomeValues "ingress" | default dict -}}
{{- $cloudbeaverValues := .Values.cloudbeaver | default dict -}}
{{- $cloudbeaverAuthProxy := get $cloudbeaverValues "authProxy" | default dict -}}
{{- $cloudbeaverAuthProxyValues := index .Values "cloudbeaver-auth-proxy" | default dict -}}
{{- $cloudbeaverAuthProxyConfig := get $cloudbeaverAuthProxyValues "config" | default dict -}}
{{- $cloudbeaverAuthProxyIngress := get $cloudbeaverAuthProxyValues "ingress" | default dict -}}
{{- $rangerProxyValues := index .Values "ranger-auth-proxy" | default dict -}}
{{- $rangerProxyConfig := get $rangerProxyValues "config" | default dict -}}
{{- $rangerProxyIngress := get $rangerProxyValues "ingress" | default dict -}}
{{- $prefectProxyValues := index .Values "prefect-auth-proxy" | default dict -}}
{{- $prefectProxyConfig := get $prefectProxyValues "config" | default dict -}}
{{- $prefectProxyIngress := get $prefectProxyValues "ingress" | default dict -}}
{{- $supersetValues := .Values.superset | default dict -}}
{{- $supersetExtraEnvRaw := get $supersetValues "extraEnvRaw" | default list -}}
{{- $providerMode := default "externalOidc" $provider.mode -}}
{{- $ldapUrl := default "" $ldap.url -}}
{{- $ldapUsesLdaps := hasPrefix "ldaps://" $ldapUrl -}}
{{- $trustedCaSecretName := include "dlh-in-a-box.identity.directory.trustedCaSecretName" . -}}
{{- $ldapUsesSystemTrustStore := default false $ldap.useSystemTrustStore -}}
{{- $keycloakValues := .Values.keycloak | default dict -}}
{{- $keycloakConfigCli := get $keycloakValues "keycloakConfigCli" | default dict -}}
{{- $keycloakProvider := get $provider "keycloak" | default dict -}}
{{- $keycloakRegistration := get $keycloakProvider "registration" | default dict -}}
{{- $configCliEnvSecretName := default "" $keycloakProvider.configCliEnvExistingSecret -}}
{{- $hasSupersetOauthClientId := false -}}
{{- $hasSupersetOauthClientSecret := false -}}
{{- $supportedAccessModelApps := list "superset" "datahub" "trinoUi" "jupyterhub" "cloudbeaver" "prefect" "ranger" -}}
{{- $accessModelRoleKeys := dict -}}
{{- $accessModelAppAccess := dict -}}

{{- if hasKey .Values "identity" -}}
{{- fail "The top-level identity block is no longer supported. Move all shared identity settings under global.identity." -}}
{{- end -}}
{{- if hasKey .Values "authorization" -}}
{{- fail "The top-level authorization block is no longer supported. Move all Ranger settings under global.authorization." -}}
{{- end -}}
{{- if hasKey $authorization "platformRoleMembershipSource" -}}
{{- fail "global.authorization.platformRoleMembershipSource is no longer supported. Keycloak is the source of truth for platform roles and role membership." -}}
{{- end -}}
{{- if hasKey $authorization "platformRoles" -}}
{{- fail "global.authorization.platformRoles is no longer supported. Define platform roles under global.identity.accessRoles." -}}
{{- end -}}
{{- if hasKey $identity "accessModel" -}}
{{- fail "global.identity.accessModel is no longer supported. Move platform roles directly under global.identity.accessRoles." -}}
{{- end -}}
{{- if hasKey $datahubAuth "groupProvisioning" -}}
{{- fail "datahub.auth.groupProvisioning is no longer supported. DataHub browser access must not depend on OIDC group claims; use global.identity.accessRoles and client roles." -}}
{{- end -}}
{{- range $envName := list "JUPYTERHUB_GROUPS_CLAIM" "JUPYTERHUB_ALLOWED_GROUP" "JUPYTERHUB_ADMIN_GROUP" -}}
  {{- if hasKey $jupyterhubExtraEnv $envName -}}
    {{- fail (printf "jupyterhub.hub.extraEnv.%s is no longer supported. Use JUPYTERHUB_ROLES_CLAIM, JUPYTERHUB_ALLOWED_ROLES, and JUPYTERHUB_ADMIN_ROLES." $envName) -}}
  {{- end -}}
{{- end -}}
{{- range $clientName, $clientConfig := dict "cloudbeaverProxy" $cloudbeaverIdentity "prefectProxy" $prefectIdentity "rangerProxy" $rangerProxyIdentity -}}
  {{- if hasKey $clientConfig "allowedGroups" -}}
    {{- fail (printf "global.identity.external.clients.%s.allowedGroups is no longer supported. Browser access is derived from global.identity.accessRoles appAccess and enforced with Keycloak client roles." $clientName) -}}
  {{- end -}}
{{- end -}}
  {{- range $roleKey, $role := $accessRoles -}}
    {{- $roleEnabled := true -}}
    {{- if hasKey $role "enabled" -}}
      {{- $roleEnabled = get $role "enabled" -}}
    {{- end -}}
    {{- if $roleEnabled -}}
      {{- $_ := set $accessModelRoleKeys $roleKey true -}}
    {{- end -}}
    {{- if hasKey $role "ranger" -}}
      {{- fail (printf "global.identity.accessRoles.%s.ranger is not supported. Keycloak roles control app access only; define Ranger data roles under global.authorization.ranger.dataRoles." $roleKey) -}}
    {{- end -}}
    {{- range $appName, $_ := get $role "appAccess" | default dict -}}
      {{- if not (has $appName $supportedAccessModelApps) -}}
        {{- fail (printf "global.identity.accessRoles.%s.appAccess.%s is not supported. Allowed app access keys are superset, datahub, trinoUi, jupyterhub, cloudbeaver, prefect, and ranger." $roleKey $appName) -}}
      {{- end -}}
      {{- if and $roleEnabled $_ -}}
        {{- $_ := set $accessModelAppAccess $appName true -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- range $launcherName, $launcher := get $platformHomeValues "launchers" | default dict -}}
    {{- if hasKey ($launcher | default dict) "requiredGroups" -}}
      {{- fail (printf "platformHome.launchers.%s.requiredGroups is no longer supported. Use platformHome.launchers.%s.requiredRoles with Keycloak realm role names from global.identity.accessRoles." $launcherName $launcherName) -}}
    {{- end -}}
    {{- range $roleName := get ($launcher | default dict) "requiredRoles" | default list -}}
      {{- if not (hasKey $accessModelRoleKeys (toString $roleName)) -}}
        {{- fail (printf "platformHome.launchers.%s.requiredRoles references unknown or disabled platform role %s." $launcherName $roleName) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- if and (default false $identity.enabled) (or (not $hasEnvironment) (not (has $environment (list "local" "dev" "prod")))) -}}
{{- fail "global.environment must be set to local, dev, or prod when shared identity is enabled." -}}
{{- end -}}
{{- range $env := $supersetExtraEnvRaw -}}
  {{- if eq (get $env "name") "OAUTH_CLIENT_ID" -}}
    {{- $hasSupersetOauthClientId = true -}}
    {{- if and (get $supersetIdentity "clientId") (get $env "value") (ne (get $env "value") (get $supersetIdentity "clientId")) -}}
      {{- fail "superset.extraEnvRaw OAUTH_CLIENT_ID must match global.identity.external.clients.superset.clientId." -}}
    {{- end -}}
  {{- end -}}
  {{- if eq (get $env "name") "OAUTH_CLIENT_SECRET" -}}
    {{- $hasSupersetOauthClientSecret = true -}}
  {{- end -}}
{{- end -}}

{{- if and .Values.prefect.authProxy.enabled (not .Values.prefect.enabled) -}}
{{- fail "prefect.authProxy.enabled requires prefect.enabled=true." -}}
{{- end -}}
{{- if and .Values.prefect.authProxy.enabled (not .Values.prefect.server.enabled) -}}
{{- fail "prefect.authProxy.enabled requires prefect.server.enabled=true." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (eq $providerMode "bundledKeycloak") (not $keycloakValues.enabled) -}}
{{- fail "global.identity.provider.mode=bundledKeycloak requires keycloak.enabled=true." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (eq $providerMode "bundledKeycloak") (not (get $keycloakConfigCli "enabled")) -}}
{{- fail "Bundled Keycloak requires keycloak.keycloakConfigCli.enabled=true so the realm and LDAP federation can be bootstrapped." -}}
{{- end -}}
{{- if and (default false $identity.enabled) $keycloakLocalMode (ne $providerMode "bundledKeycloak") -}}
{{- fail "global.identity.directory.mode=keycloakLocal requires global.identity.provider.mode=bundledKeycloak." -}}
{{- end -}}
{{- if and (default false $identity.enabled) $keycloakLocalMode (default false $ldap.enabled) -}}
{{- fail "global.identity.directory.ldap.enabled must be false when global.identity.directory.mode=keycloakLocal." -}}
{{- end -}}
{{- if and (default false $identity.enabled) $keycloakLocalMode (not (default false (get $keycloakRegistration "enabled"))) -}}
{{- fail "global.identity.provider.keycloak.registration.enabled must be true when global.identity.directory.mode=keycloakLocal." -}}
{{- end -}}
{{- if and (default false $identity.enabled) $keycloakLocalMode (default false $trinoIdentity.passwordAuthEnabled) (ne (default "ldap" $trinoIdentity.passwordAuthMode) "file") -}}
{{- fail "global.identity.external.clients.trino.passwordAuthMode must be file when Trino PASSWORD auth is enabled in global.identity.directory.mode=keycloakLocal. LDAP PASSWORD auth is not allowed in that mode." -}}
{{- end -}}
{{- if and (default false $identity.enabled) $keycloakLocalMode (default false $ranger.enabled) (dig "usersync" "enabled" true $ranger) -}}
{{- fail "global.authorization.ranger.usersync.enabled must be false when global.identity.directory.mode=keycloakLocal." -}}
{{- end -}}
{{- if and (default false (get $trinoDirectGrantIdentity "enabled")) (not (default false (get $trinoIdentity "enabled"))) -}}
{{- fail "global.identity.external.clients.trinoDirectGrant.enabled requires global.identity.external.clients.trino.enabled=true." -}}
{{- end -}}
{{- if and (default false .Values.jupyterhub.enabled) (not (default false (get $jupyterhubIdentity "enabled"))) -}}
{{- fail "jupyterhub.enabled requires global.identity.external.clients.jupyterhub.enabled=true so Keycloak-backed browser login can be configured." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (not $keycloakLocalMode) (not (default false $ldap.enabled)) -}}
{{- fail "global.identity.directory.ldap.enabled must be true when shared identity is enabled in externalLdap mode." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (default false $ldap.enabled) (not $ldapUrl) -}}
{{- fail "global.identity.directory.ldap.url is required when shared identity is enabled." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (default false $ldap.enabled) (not (include "dlh-in-a-box.identity.directory.userBaseDn" .)) -}}
{{- fail "global.identity.directory.ldap.userBaseDn is required when shared identity is enabled." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (default false $ldap.enabled) (not (include "dlh-in-a-box.identity.directory.groupBaseDn" .)) -}}
{{- fail "global.identity.directory.ldap.groupBaseDn is required when shared identity is enabled." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (default false $ldap.enabled) (not (default false $ldap.allowAnonymousRead)) (not (include "dlh-in-a-box.identity.directory.bindDn" .)) -}}
{{- fail "global.identity.directory.ldap.bindDistinguishedName is required when shared identity is enabled." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (default false $ldap.enabled) (not (default false $ldap.allowAnonymousRead)) (not (include "dlh-in-a-box.identity.directory.bindSecretName" .)) -}}
{{- fail "global.identity.directory.ldap.bindExistingSecret is required when shared identity is enabled." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (eq $providerMode "bundledKeycloak") (not $configCliEnvSecretName) -}}
{{- fail "global.identity.provider.keycloak.configCliEnvExistingSecret is required when bundled Keycloak is enabled." -}}
{{- end -}}
{{- if and (default false $identity.enabled) (eq $providerMode "bundledKeycloak") (ne (default "" (get $keycloakConfigCli "extraEnvVarsSecret")) $configCliEnvSecretName) -}}
{{- fail "keycloak.keycloakConfigCli.extraEnvVarsSecret must match global.identity.provider.keycloak.configCliEnvExistingSecret." -}}
{{- end -}}
{{- range $clientName := list "trino" "superset" "datahub" "platformHome" "minio" "vault" "jupyterhub" "cloudbeaverProxy" "rangerProxy" "prefectProxy" -}}
  {{- $client := get $clients $clientName | default dict -}}
  {{- if and (eq $providerMode "bundledKeycloak") (default false (get $client "enabled")) -}}
    {{- $redirectUris := get $client "redirectUris" | default list -}}
    {{- $webOrigins := get $client "webOrigins" | default list -}}
    {{- if eq (len $redirectUris) 0 -}}
      {{- fail (printf "global.identity.external.clients.%s.redirectUris must be set when bundled Keycloak manages the OIDC client." $clientName) -}}
    {{- end -}}
    {{- if eq (len $webOrigins) 0 -}}
      {{- fail (printf "global.identity.external.clients.%s.webOrigins must be set when bundled Keycloak manages the OIDC client." $clientName) -}}
    {{- end -}}
    {{- if ne $environment "local" -}}
      {{- range $uri := $redirectUris -}}
        {{- if contains "*" (toString $uri) -}}
          {{- fail (printf "global.identity.external.clients.%s.redirectUris must not use wildcard values outside local environments." $clientName) -}}
        {{- end -}}
      {{- end -}}
      {{- range $origin := $webOrigins -}}
        {{- if contains "*" (toString $origin) -}}
          {{- fail (printf "global.identity.external.clients.%s.webOrigins must not use wildcard values outside local environments." $clientName) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if and (get $supersetIdentity "enabled") (not .Values.superset.enabled) -}}
{{- fail "global.identity.external.clients.superset.enabled requires superset.enabled=true." -}}
{{- end -}}
{{- if and (get $supersetIdentity "enabled") (not $hasSupersetOauthClientId) -}}
{{- fail "superset.extraEnvRaw must project OAUTH_CLIENT_ID when global.identity.external.clients.superset.enabled=true." -}}
{{- end -}}
{{- if and (get $supersetIdentity "enabled") (not $hasSupersetOauthClientSecret) -}}
{{- fail "superset.extraEnvRaw must project OAUTH_CLIENT_SECRET when global.identity.external.clients.superset.enabled=true." -}}
{{- end -}}
{{- if and (get $datahubIdentity "enabled") (not .Values.datahub.enabled) -}}
{{- fail "global.identity.external.clients.datahub.enabled requires datahub.enabled=true." -}}
{{- end -}}
{{- if and (get $datahubIdentity "enabled") (not (get $datahubOidc "enabled")) -}}
{{- fail "datahub.datahub-frontend.oidcAuthentication.enabled must be true when global.identity.external.clients.datahub.enabled=true." -}}
{{- end -}}
{{- if and (get $datahubIdentity "enabled") (get $datahubIdentity "clientId") (ne (get $datahubOidc "clientId") (get $datahubIdentity "clientId")) -}}
{{- fail "datahub.datahub-frontend.oidcAuthentication.clientId must match global.identity.external.clients.datahub.clientId." -}}
{{- end -}}
{{- if and (get $datahubIdentity "enabled") (get $datahubIdentity "existingSecret") (ne (dig "clientSecretRef" "secretRef" "" $datahubOidc) (get $datahubIdentity "existingSecret")) -}}
{{- fail "datahub.datahub-frontend.oidcAuthentication.clientSecretRef.secretRef must match global.identity.external.clients.datahub.existingSecret." -}}
{{- end -}}
{{- if and (get $platformHomeIdentity "enabled") (ne $providerMode "bundledKeycloak") -}}
{{- fail "platformHome currently requires global.identity.provider.mode=bundledKeycloak because the launchpad uses the Keycloak JavaScript adapter for browser SSO." -}}
{{- end -}}
{{- if and (get $platformHomeIdentity "enabled") (not .Values.platformHome.enabled) -}}
{{- fail "global.identity.external.clients.platformHome.enabled requires platformHome.enabled=true." -}}
{{- end -}}
{{- if and .Values.platformHome.enabled (not (get $platformHomeIdentity "enabled")) -}}
{{- fail "platformHome.enabled requires global.identity.external.clients.platformHome.enabled=true." -}}
{{- end -}}
{{- if and .Values.platformHome.enabled (get $platformHomeIngress "enabled") (get $platformHomeIngress "host") -}}
  {{- $platformHomeOrigin := printf "%s://%s" (ternary "https" "http" (ne (default "" (get $platformHomeIngress "tlsSecretName")) "")) (get $platformHomeIngress "host") -}}
  {{- $platformHomeRedirects := get $platformHomeIdentity "redirectUris" | default list -}}
  {{- $platformHomeOrigins := get $platformHomeIdentity "webOrigins" | default list -}}
  {{- if not (has $platformHomeOrigin $platformHomeOrigins) -}}
    {{- fail "global.identity.external.clients.platformHome.webOrigins must include the platformHome ingress origin." -}}
  {{- end -}}
  {{- if not (or (has $platformHomeOrigin $platformHomeRedirects) (has (printf "%s/" $platformHomeOrigin) $platformHomeRedirects)) -}}
    {{- fail "global.identity.external.clients.platformHome.redirectUris must include the platformHome ingress URL." -}}
  {{- end -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (not .Values.cloudbeaver.enabled) -}}
{{- fail "global.identity.external.clients.cloudbeaverProxy.enabled requires cloudbeaver.enabled=true." -}}
{{- end -}}
{{- if and .Values.cloudbeaver.enabled (not (get $cloudbeaverAuthProxy "enabled")) -}}
{{- fail "cloudbeaver.enabled requires cloudbeaver.authProxy.enabled=true so CloudBeaver stays behind the central authentication boundary." -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (not (get $cloudbeaverAuthProxy "enabled")) -}}
{{- fail "global.identity.external.clients.cloudbeaverProxy.enabled requires cloudbeaver.authProxy.enabled=true." -}}
{{- end -}}
{{- if and .Values.cloudbeaver.enabled (not (dig "bootstrap" "existingSecret" "" $cloudbeaverValues)) -}}
{{- fail "cloudbeaver.bootstrap.existingSecret is required when CloudBeaver is enabled." -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (not (get $cloudbeaverAuthProxyConfig "existingSecret")) -}}
{{- fail "cloudbeaver-auth-proxy.config.existingSecret must be set when global.identity.external.clients.cloudbeaverProxy.enabled=true." -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (get $cloudbeaverIdentity "existingSecret") (ne (get $cloudbeaverAuthProxyConfig "existingSecret") (get $cloudbeaverIdentity "existingSecret")) -}}
{{- fail "cloudbeaver-auth-proxy.config.existingSecret must match global.identity.external.clients.cloudbeaverProxy.existingSecret." -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (not (get $cloudbeaverIdentity "cookieExistingSecret")) -}}
{{- fail "global.identity.external.clients.cloudbeaverProxy.cookieExistingSecret is required when CloudBeaver proxy auth is enabled." -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (eq (len (get $cloudbeaverIdentity "redirectUris" | default list)) 0) -}}
{{- fail "global.identity.external.clients.cloudbeaverProxy.redirectUris must include the oauth2-proxy callback URL." -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (default "" (get $cloudbeaverIdentity "redirectUrl")) -}}
  {{- if not (has (get $cloudbeaverIdentity "redirectUrl") (get $cloudbeaverIdentity "redirectUris" | default list)) -}}
    {{- fail "global.identity.external.clients.cloudbeaverProxy.redirectUrl must also be present in redirectUris." -}}
  {{- end -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (not (hasKey $accessModelAppAccess "cloudbeaver")) -}}
{{- fail "global.identity.accessRoles must grant at least one role appAccess.cloudbeaver=true when CloudBeaver proxy auth is enabled." -}}
{{- end -}}
{{- if and (get $cloudbeaverIdentity "enabled") (get $cloudbeaverAuthProxyIngress "enabled") (gt (len (get $cloudbeaverAuthProxyIngress "hosts" | default list)) 0) -}}
  {{- $cloudbeaverOrigin := printf "%s://%s" (ternary "https" "http" (gt (len (get $cloudbeaverAuthProxyIngress "tls" | default list)) 0)) (index (get $cloudbeaverAuthProxyIngress "hosts") 0) -}}
  {{- if not (has $cloudbeaverOrigin (get $cloudbeaverIdentity "webOrigins" | default list)) -}}
    {{- fail "global.identity.external.clients.cloudbeaverProxy.webOrigins must include the CloudBeaver auth-proxy ingress origin." -}}
  {{- end -}}
  {{- if ne (default "" (get $cloudbeaverIdentity "redirectUrl")) (printf "%s/oauth2/callback" $cloudbeaverOrigin) -}}
    {{- fail "global.identity.external.clients.cloudbeaverProxy.redirectUrl must match the CloudBeaver auth-proxy ingress callback URL." -}}
  {{- end -}}
{{- end -}}
{{- if and (get $rangerProxyIdentity "enabled") (not (default false $ranger.enabled)) -}}
{{- fail "global.identity.external.clients.rangerProxy.enabled requires global.authorization.ranger.enabled=true." -}}
{{- end -}}
{{- if and (get $rangerProxyIdentity "enabled") (eq (len (get $rangerProxyIdentity "redirectUris" | default list)) 0) -}}
{{- fail "global.identity.external.clients.rangerProxy.redirectUris must include the oauth2-proxy callback URL." -}}
{{- end -}}
{{- if and (get $rangerProxyIdentity "enabled") (default "" (get $rangerProxyIdentity "redirectUrl")) -}}
  {{- if not (has (get $rangerProxyIdentity "redirectUrl") (get $rangerProxyIdentity "redirectUris" | default list)) -}}
    {{- fail "global.identity.external.clients.rangerProxy.redirectUrl must also be present in redirectUris." -}}
  {{- end -}}
{{- end -}}
{{- if and (get $rangerProxyIdentity "enabled") (not (hasKey $accessModelAppAccess "ranger")) -}}
{{- fail "global.identity.accessRoles must grant at least one role appAccess.ranger=true when Ranger proxy auth is enabled." -}}
{{- end -}}
{{- if and (get $rangerProxyIdentity "enabled") (get $rangerProxyIngress "enabled") (gt (len (get $rangerProxyIngress "hosts" | default list)) 0) -}}
  {{- $rangerOrigin := printf "%s://%s" (ternary "https" "http" (gt (len (get $rangerProxyIngress "tls" | default list)) 0)) (index (get $rangerProxyIngress "hosts") 0) -}}
  {{- if not (has $rangerOrigin (get $rangerProxyIdentity "webOrigins" | default list)) -}}
    {{- fail "global.identity.external.clients.rangerProxy.webOrigins must include the Ranger auth-proxy ingress origin." -}}
  {{- end -}}
  {{- if ne (default "" (get $rangerProxyIdentity "redirectUrl")) (printf "%s/oauth2/callback" $rangerOrigin) -}}
    {{- fail "global.identity.external.clients.rangerProxy.redirectUrl must match the Ranger auth-proxy ingress callback URL." -}}
  {{- end -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (not .Values.prefect.authProxy.enabled) -}}
{{- fail "global.identity.external.clients.prefectProxy.enabled requires prefect.authProxy.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (not (get $prefectProxyConfig "existingSecret")) -}}
{{- fail "prefect-auth-proxy.config.existingSecret must be set when global.identity.external.clients.prefectProxy.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (get $prefectIdentity "existingSecret") (ne (get $prefectProxyConfig "existingSecret") (get $prefectIdentity "existingSecret")) -}}
{{- fail "prefect-auth-proxy.config.existingSecret must match global.identity.external.clients.prefectProxy.existingSecret." -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (not (get $prefectIdentity "cookieExistingSecret")) -}}
{{- fail "global.identity.external.clients.prefectProxy.cookieExistingSecret is required when Prefect proxy auth is enabled." -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (eq (len (get $prefectIdentity "redirectUris" | default list)) 0) -}}
{{- fail "global.identity.external.clients.prefectProxy.redirectUris must include the oauth2-proxy callback URL." -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (default "" (get $prefectIdentity "redirectUrl")) -}}
  {{- if not (has (get $prefectIdentity "redirectUrl") (get $prefectIdentity "redirectUris" | default list)) -}}
    {{- fail "global.identity.external.clients.prefectProxy.redirectUrl must also be present in redirectUris." -}}
  {{- end -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (not (hasKey $accessModelAppAccess "prefect")) -}}
{{- fail "global.identity.accessRoles must grant at least one role appAccess.prefect=true when Prefect proxy auth is enabled." -}}
{{- end -}}
{{- if and (get $prefectIdentity "enabled") (get $prefectProxyIngress "enabled") (gt (len (get $prefectProxyIngress "hosts" | default list)) 0) -}}
  {{- $prefectOrigin := printf "%s://%s" (ternary "https" "http" (gt (len (get $prefectProxyIngress "tls" | default list)) 0)) (index (get $prefectProxyIngress "hosts") 0) -}}
  {{- if not (has $prefectOrigin (get $prefectIdentity "webOrigins" | default list)) -}}
    {{- fail "global.identity.external.clients.prefectProxy.webOrigins must include the Prefect auth-proxy ingress origin." -}}
  {{- end -}}
  {{- if ne (default "" (get $prefectIdentity "redirectUrl")) (printf "%s/oauth2/callback" $prefectOrigin) -}}
    {{- fail "global.identity.external.clients.prefectProxy.redirectUrl must match the Prefect auth-proxy ingress callback URL." -}}
  {{- end -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (not (default false $identity.enabled)) -}}
{{- fail "global.identity.external.clients.prefectAutomation.enabled requires global.identity.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (not .Values.prefect.authProxy.enabled) -}}
{{- fail "global.identity.external.clients.prefectAutomation.enabled requires prefect.authProxy.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (not (get $prefectIdentity "enabled")) -}}
{{- fail "global.identity.external.clients.prefectAutomation.enabled requires global.identity.external.clients.prefectProxy.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (not (default "" (get $prefectAutomationIdentity "clientId"))) -}}
{{- fail "global.identity.external.clients.prefectAutomation.clientId is required when machine access for Prefect is enabled." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (not (default "" (get $prefectAutomationIdentity "tokenAudience"))) -}}
{{- fail "global.identity.external.clients.prefectAutomation.tokenAudience is required when machine access for Prefect is enabled." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (eq $providerMode "bundledKeycloak") (not (default "" (get $prefectAutomationIdentity "configCliSecretKey"))) -}}
{{- fail "global.identity.external.clients.prefectAutomation.configCliSecretKey is required when bundled Keycloak manages the Prefect automation client." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (eq $providerMode "bundledKeycloak") (not (default false (get $prefectAutomationIdentity "serviceAccountsEnabled"))) -}}
{{- fail "global.identity.external.clients.prefectAutomation.serviceAccountsEnabled must be true when machine access for Prefect is enabled." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (eq $providerMode "bundledKeycloak") (get $prefectAutomationIdentity "standardFlowEnabled") -}}
{{- fail "global.identity.external.clients.prefectAutomation.standardFlowEnabled must be false when machine access for Prefect is enabled." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (eq $providerMode "bundledKeycloak") (get $prefectAutomationIdentity "directAccessGrantsEnabled") -}}
{{- fail "global.identity.external.clients.prefectAutomation.directAccessGrantsEnabled must be false when machine access for Prefect is enabled." -}}
{{- end -}}
{{- if and (get $prefectDirectGrantIdentity "enabled") (not (default false $identity.enabled)) -}}
{{- fail "global.identity.external.clients.prefectDirectGrant.enabled requires global.identity.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectDirectGrantIdentity "enabled") (not .Values.prefect.authProxy.enabled) -}}
{{- fail "global.identity.external.clients.prefectDirectGrant.enabled requires prefect.authProxy.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectDirectGrantIdentity "enabled") (not (get $prefectIdentity "enabled")) -}}
{{- fail "global.identity.external.clients.prefectDirectGrant.enabled requires global.identity.external.clients.prefectProxy.enabled=true." -}}
{{- end -}}
{{- if and (get $prefectDirectGrantIdentity "enabled") (not (default "" (get $prefectDirectGrantIdentity "clientId"))) -}}
{{- fail "global.identity.external.clients.prefectDirectGrant.clientId is required when developer access for Prefect is enabled." -}}
{{- end -}}
{{- if and (get $prefectDirectGrantIdentity "enabled") (not (default "" (get $prefectDirectGrantIdentity "tokenAudience"))) -}}
{{- fail "global.identity.external.clients.prefectDirectGrant.tokenAudience is required when developer access for Prefect is enabled." -}}
{{- end -}}
{{- if and (get $prefectAutomationIdentity "enabled") (get $prefectDirectGrantIdentity "enabled") (ne (get $prefectAutomationIdentity "tokenAudience") (get $prefectDirectGrantIdentity "tokenAudience")) -}}
{{- fail "global.identity.external.clients.prefectAutomation.tokenAudience must match global.identity.external.clients.prefectDirectGrant.tokenAudience when both Prefect bearer-token clients are enabled." -}}
{{- end -}}
{{- if and (default false $ldap.enabled) $ldapUsesLdaps (not (default false $ldap.allowInsecure)) (not $trustedCaSecretName) (not $ldapUsesSystemTrustStore) -}}
{{- fail "When using LDAPS with allowInsecure=false, set either global.identity.directory.ldap.trustedCaExistingSecret or global.identity.directory.ldap.useSystemTrustStore=true so Trino and Ranger can validate the directory certificate chain." -}}
{{- end -}}
{{- if and (eq $providerMode "bundledKeycloak") (default false $ldap.enabled) $ldapUsesLdaps (not (default false $ldap.allowInsecure)) (not .Values.keycloak.trustedCertsExistingSecret) (not $ldapUsesSystemTrustStore) -}}
{{- fail "When bundled Keycloak federates to LDAPS, set keycloak.trustedCertsExistingSecret or global.identity.directory.ldap.useSystemTrustStore=true." -}}
{{- end -}}
{{- if and (eq $providerMode "bundledKeycloak") (default false $ldap.enabled) $ldapUsesLdaps (not (default false $ldap.allowInsecure)) (not $ldapUsesSystemTrustStore) .Values.keycloak.trustedCertsExistingSecret $trustedCaSecretName (ne .Values.keycloak.trustedCertsExistingSecret $trustedCaSecretName) -}}
{{- fail "keycloak.trustedCertsExistingSecret must match global.identity.directory.ldap.trustedCaExistingSecret so Keycloak, Trino, and Ranger validate the same LDAP/AD CA." -}}
{{- end -}}
