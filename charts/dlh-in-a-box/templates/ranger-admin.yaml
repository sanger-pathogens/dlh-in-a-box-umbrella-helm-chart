{{- $authorization := .Values.global.authorization | default dict -}}
{{- $ranger := get $authorization "ranger" | default dict -}}
{{- if $ranger.enabled }}
{{- $postgresql := get $ranger "postgresql" | default dict -}}
{{- $dbHost := default (include "dlh-in-a-box.ranger.postgresql.serviceName" .) $postgresql.host -}}
{{- $dbName := default "ranger" $postgresql.database -}}
{{- $dbUser := default "rangeradmin" $postgresql.username -}}
{{- $dbAdminSecret := default $postgresql.existingSecret $postgresql.adminExistingSecret -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-admin
data:
  install.properties.tmpl: |
{{ include "dlh-in-a-box.rangerAdmin.installProperties" . | nindent 4 }}
  ranger-admin-start.sh: |
{{ include "dlh-in-a-box.rangerAdmin.startScript" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
    app.kubernetes.io/component: ranger-admin
  ports:
    - name: http
      port: 6080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
      app.kubernetes.io/component: ranger-admin
  template:
    metadata:
      annotations:
        checksum/bootstrap: {{ printf "%s\n%s" (include "dlh-in-a-box.rangerAdmin.installProperties" .) (include "dlh-in-a-box.rangerAdmin.startScript" .) | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-admin
    spec:
      containers:
        - name: ranger-admin
          image: "{{ $ranger.admin.image.repository }}:{{ $ranger.admin.image.tag }}"
          imagePullPolicy: {{ $ranger.admin.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/bash
            - /opt/ranger/bootstrap/ranger-admin-start.sh
          env:
            - name: RANGER_DB_HOST
              value: {{ $dbHost | quote }}
            - name: RANGER_DB_PORT
              value: "5432"
            - name: RANGER_DB_NAME
              value: {{ $dbName | quote }}
            - name: RANGER_DB_USERNAME
              value: {{ $dbUser | quote }}
            - name: RANGER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresql.existingSecret }}
                  key: {{ default "password" $postgresql.passwordKey }}
            - name: RANGER_DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbAdminSecret }}
                  key: {{ default "postgres-password" $postgresql.adminPasswordKey }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
            {{- if default false (dig "usersync" "enabled" false $ranger) }}
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerUsersyncPassword" $ranger.admin.usersyncPasswordKey }}
            - name: RANGER_TAGSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerTagsyncPassword" $ranger.admin.tagsyncPasswordKey }}
            {{- else }}
            - name: RANGER_USERSYNC_PASSWORD
              value: ""
            - name: RANGER_TAGSYNC_PASSWORD
              value: ""
            {{- end }}
            - name: RANGER_POLICYMGR_EXTERNAL_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
          ports:
            - name: http
              containerPort: 6080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /login.jsp
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login.jsp
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login.jsp
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/ranger/bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-bootstrap
            defaultMode: 0555
{{- end }}
