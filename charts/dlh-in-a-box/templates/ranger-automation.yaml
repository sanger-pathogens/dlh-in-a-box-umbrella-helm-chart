{{- $authorization := .Values.global.authorization | default dict -}}
{{- $platformRoleExceptions := get $authorization "platformRoleExceptions" | default (list) -}}
{{- $ranger := get $authorization "ranger" | default dict -}}
{{- $rangerTrino := get $ranger "trino" | default dict -}}
{{- $exceptionRoleAudit := get $ranger "exceptionRoleAudit" | default dict -}}
{{- $identity := .Values.global.identity | default dict -}}
{{- $provider := get $identity "provider" | default dict -}}
{{- $providerMode := default "externalOidc" $provider.mode -}}
{{- $directory := get $identity "directory" | default dict -}}
{{- $keycloakLocalMode := eq (default "externalLdap" (get $directory "mode")) "keycloakLocal" -}}
{{- $accessModel := get $identity "accessModel" | default dict -}}
{{- $ldap := get $directory "ldap" | default dict -}}
{{- $ldapAllowAnonymousRead := default false $ldap.allowAnonymousRead -}}
{{- $ldapEffectiveBindDn := ternary "" (include "dlh-in-a-box.identity.directory.bindDn" .) $ldapAllowAnonymousRead -}}
{{- $ldapTrustedCaSecretName := include "dlh-in-a-box.identity.directory.trustedCaSecretName" . -}}
{{- $ldapTrustedCaCertKey := include "dlh-in-a-box.identity.directory.trustedCaCertKey" . -}}
{{- $ldapTrustedCaPath := printf "/opt/ranger-automation/ldap-ca/%s" $ldapTrustedCaCertKey -}}
{{- $ldapHostAliases := default (list) $ldap.hostAliases -}}
{{- $rangerBootstrap := get $ranger "bootstrap" | default dict -}}
{{- $usersync := get $ranger "usersync" | default dict -}}
{{- $usersyncImage := get $usersync "image" | default dict -}}
{{- $localUserSync := get $ranger "localUserSync" | default dict -}}
{{- $usersyncEnabled := true -}}
{{- if hasKey $usersync "enabled" -}}
  {{- $usersyncEnabled = $usersync.enabled -}}
{{- end -}}
{{- $localUserSyncRequested := true -}}
{{- if hasKey $localUserSync "enabled" -}}
  {{- $localUserSyncRequested = $localUserSync.enabled -}}
{{- end -}}
{{- $keycloakRangerSyncEnabled := and (default false $identity.enabled) (eq $providerMode "bundledKeycloak") $localUserSyncRequested -}}
{{- $localUserSyncImage := get $localUserSync "image" | default $usersyncImage -}}
{{- $exceptionRoleAuditEnabled := true -}}
{{- if hasKey $exceptionRoleAudit "enabled" -}}
  {{- $exceptionRoleAuditEnabled = $exceptionRoleAudit.enabled -}}
{{- end -}}
{{- $exceptionRoleAuditDeleteExpired := true -}}
{{- if hasKey $exceptionRoleAudit "deleteExpired" -}}
  {{- $exceptionRoleAuditDeleteExpired = $exceptionRoleAudit.deleteExpired -}}
{{- end -}}
{{- $exceptionRoleAuditLogUndocumented := true -}}
{{- if hasKey $exceptionRoleAudit "logUndocumented" -}}
  {{- $exceptionRoleAuditLogUndocumented = $exceptionRoleAudit.logUndocumented -}}
{{- end -}}
{{- $importCatalogAcls := false -}}
{{- if hasKey $ranger "importCatalogAcls" -}}
  {{- $importCatalogAcls = $ranger.importCatalogAcls -}}
{{- else if hasKey $rangerBootstrap "importCatalogAcls" -}}
  {{- $importCatalogAcls = $rangerBootstrap.importCatalogAcls -}}
{{- end -}}
{{- $bootstrapPolicies := get $ranger "bootstrapPolicies" | default (get $rangerBootstrap "policies" | default (list)) -}}
{{- if $ranger.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-automation
data:
  bootstrap-config.json: |
    {{- dict
      "ranger" (dict
        "serviceName" (include "dlh-in-a-box.ranger.serviceName" .)
        "serviceUsername" (default "trino" $ranger.serviceUsername)
        "serviceAdminUsers" ($ranger.serviceAdminUsers | default (list))
        "serviceAdminGroups" ($ranger.serviceAdminGroups | default (list))
        "superUsers" ($ranger.superUsers | default (list))
        "superGroups" ($ranger.superGroups | default (list))
        "legacyManagedUsers" ($ranger.legacyManagedUsers | default (list))
        "legacyManagedGroups" ($ranger.legacyManagedGroups | default (list))
        "legacyManagedRoles" ($ranger.legacyManagedRoles | default (list))
        "legacyManagedPolicies" ($ranger.legacyManagedPolicies | default (list))
        "cleanup" ($ranger.cleanup | default dict)
        "trinoEnabled" (and (default false $ranger.enabled) (default false $rangerTrino.enabled))
        "importCatalogAcls" $importCatalogAcls
        "bootstrapPolicies" $bootstrapPolicies
        "exceptionRoleAudit" (dict
          "enabled" $exceptionRoleAuditEnabled
          "prefix" (default "exception-" $exceptionRoleAudit.prefix)
          "schedule" (default "23 * * * *" $exceptionRoleAudit.schedule)
          "gracePeriodDays" (default 7 $exceptionRoleAudit.gracePeriodDays)
          "deleteExpired" $exceptionRoleAuditDeleteExpired
          "logUndocumented" $exceptionRoleAuditLogUndocumented
        )
      )
      "accessModel" $accessModel
      "platformRoleExceptions" $platformRoleExceptions
      "catalogs" (.Values.global.dataCatalogs | default (dict))
      "trinoJdbcUrl" (include "dlh-in-a-box.ranger.trinoJdbcUrl" .)
      "ldap" (dict
        "url" (include "dlh-in-a-box.identity.directory.url" .)
        "allowInsecure" (default false $ldap.allowInsecure)
        "bindDn" $ldapEffectiveBindDn
        "trustedCaPath" (ternary $ldapTrustedCaPath "" (and (ne $ldapTrustedCaSecretName "") (not (default false $ldap.allowInsecure))))
        "userBaseDn" (include "dlh-in-a-box.identity.directory.userBaseDn" .)
        "groupBaseDn" (include "dlh-in-a-box.identity.directory.groupBaseDn" .)
        "usernameAttribute" (default "uid" $ldap.usernameAttribute)
        "firstNameAttribute" (default "givenName" $ldap.firstNameAttribute)
        "lastNameAttribute" (default "sn" $ldap.lastNameAttribute)
        "emailAttribute" (default "mail" $ldap.emailAttribute)
        "groupNameAttribute" (default "cn" $ldap.groupNameAttribute)
        "groupSearchFilter" (default "(cn=trino_*)" $ldap.groupSearchFilter)
        "groupSearchMemberAttribute" (default "member" $ldap.groupSearchMemberAttribute)
      )
      "identity" (dict
        "directoryMode" (default "externalLdap" (get $directory "mode"))
        "keycloak" (dict
          "realm" (include "dlh-in-a-box.keycloak.realm" .)
          "adminUrl" (include "dlh-in-a-box.keycloak.internalBaseUrl" .)
          "adminUsername" (default "admin" .Values.keycloak.auth.adminUser)
          "requireEmailVerification" (default false (dig "provider" "keycloak" "registration" "requireEmailVerification" false $identity))
        )
      )
    | toPrettyJson | nindent 4 }}
  bootstrap.py: |
{{ .Files.Get "files/ranger-automation/bootstrap.py" | nindent 4 }}
  exception_audit.py: |
{{ .Files.Get "files/ranger-automation/exception_audit.py" | nindent 4 }}
  usersync.py: |
{{ .Files.Get "files/ranger-automation/usersync.py" | nindent 4 }}
  keycloak_ranger_sync.py: |
{{ .Files.Get "files/ranger-automation/keycloak_ranger_sync.py" | nindent 4 }}
---
{{- if (dig "bootstrap" "enabled" true $ranger) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ranger-bootstrap
          image: "{{ $ranger.bootstrap.image.repository }}:{{ $ranger.bootstrap.image.tag }}"
          imagePullPolicy: {{ $ranger.bootstrap.image.pullPolicy }}
          command:
            - python
            - -u
            - /opt/ranger-automation/bootstrap.py
          env:
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
          volumeMounts:
            - name: automation
              mountPath: /opt/ranger-automation
              readOnly: true
      volumes:
        - name: automation
          configMap:
            name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
            defaultMode: 0555
---
{{- end }}
{{- if $keycloakRangerSyncEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-keycloak-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-keycloak-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-keycloak-sync
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ranger-keycloak-sync
          image: "{{ $localUserSyncImage.repository }}:{{ $localUserSyncImage.tag }}"
          imagePullPolicy: {{ $localUserSyncImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              python /opt/ranger-automation/keycloak_ranger_sync.py
          env:
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.auth.existingSecret }}
                  key: {{ .Values.keycloak.auth.passwordSecretKey }}
          volumeMounts:
            - name: automation
              mountPath: /opt/ranger-automation
              readOnly: true
      volumes:
        - name: automation
          configMap:
            name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
            defaultMode: 0555
---
{{- end }}
{{- if $usersyncEnabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-usersync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-usersync
spec:
  schedule: {{ default "*/15 * * * *" (dig "usersync" "schedule" "*/15 * * * *" $ranger) | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-usersync
        spec:
          restartPolicy: OnFailure
          {{- with $ldapHostAliases }}
          hostAliases:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: ranger-usersync
              image: "{{ $usersyncImage.repository }}:{{ $usersyncImage.tag }}"
              imagePullPolicy: {{ $usersyncImage.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python -m pip install --no-cache-dir ldap3 >/tmp/ranger-usersync-pip.log
                  python /opt/ranger-automation/usersync.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
                - name: LDAP_BIND_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "dlh-in-a-box.identity.directory.bindSecretName" . }}
                      key: {{ include "dlh-in-a-box.identity.directory.bindSecretKey" . }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
                {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
                - name: ldap-trusted-ca
                  mountPath: /opt/ranger-automation/ldap-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
            {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
            - name: ldap-trusted-ca
              secret:
                secretName: {{ $ldapTrustedCaSecretName }}
                items:
                  - key: {{ $ldapTrustedCaCertKey }}
                    path: {{ $ldapTrustedCaCertKey }}
            {{- end }}
{{- end }}
{{- if $keycloakRangerSyncEnabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-keycloak-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-keycloak-sync
spec:
  schedule: {{ default "*/5 * * * *" $localUserSync.schedule | quote }}
  suspend: {{ ternary "true" "false" (default false $localUserSync.suspend) }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-keycloak-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ranger-keycloak-sync
              image: "{{ $localUserSyncImage.repository }}:{{ $localUserSyncImage.tag }}"
              imagePullPolicy: {{ $localUserSyncImage.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python /opt/ranger-automation/keycloak_ranger_sync.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.auth.existingSecret }}
                      key: {{ default "adminPassword" .Values.keycloak.auth.passwordSecretKey }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
{{- end }}
{{- if $exceptionRoleAuditEnabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-exception-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-exception-audit
spec:
  schedule: {{ default "23 * * * *" $exceptionRoleAudit.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-exception-audit
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ranger-exception-audit
              image: "{{ $ranger.bootstrap.image.repository }}:{{ $ranger.bootstrap.image.tag }}"
              imagePullPolicy: {{ $ranger.bootstrap.image.pullPolicy }}
              command:
                - python
                - -u
                - /opt/ranger-automation/exception_audit.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
{{- end }}
{{- end }}
