{{- $authorization := .Values.global.authorization | default dict -}}
{{- $ranger := get $authorization "ranger" | default dict -}}
{{- $rangerTrino := get $ranger "trino" | default dict -}}
{{- $identity := .Values.global.identity | default dict -}}
{{- $provider := get $identity "provider" | default dict -}}
{{- $providerMode := default "externalOidc" $provider.mode -}}
{{- $directory := get $identity "directory" | default dict -}}
{{- $keycloakLocalMode := eq (default "keycloakLocal" (get $directory "mode")) "keycloakLocal" -}}
{{- $accessRoles := get $identity "accessRoles" | default dict -}}
{{- $ldap := get $directory "ldap" | default dict -}}
{{- $ldapAllowAnonymousRead := default false $ldap.allowAnonymousRead -}}
{{- $ldapEffectiveBindDn := ternary "" (include "dlh-in-a-box.identity.directory.bindDn" .) $ldapAllowAnonymousRead -}}
{{- $ldapTrustedCaSecretName := include "dlh-in-a-box.identity.directory.trustedCaSecretName" . -}}
{{- $ldapTrustedCaCertKey := include "dlh-in-a-box.identity.directory.trustedCaCertKey" . -}}
{{- $ldapTrustedCaPath := printf "/opt/ranger-automation/ldap-ca/%s" $ldapTrustedCaCertKey -}}
{{- $ldapHostAliases := default (list) $ldap.hostAliases -}}
{{- $rangerAdmin := get $ranger "admin" | default dict -}}
{{- $passwordReconcile := get $rangerAdmin "passwordReconcile" | default dict -}}
{{- $passwordReconcileImage := get $passwordReconcile "image" | default dict -}}
{{- $passwordReconcileEnabled := true -}}
{{- if hasKey $passwordReconcile "enabled" -}}
  {{- $passwordReconcileEnabled = $passwordReconcile.enabled -}}
{{- end -}}
{{- $postgresql := get $ranger "postgresql" | default dict -}}
{{- $dbHost := default (include "dlh-in-a-box.ranger.postgresql.serviceName" .) $postgresql.host -}}
{{- $dbName := default "ranger" $postgresql.database -}}
{{- $dbUser := default "rangeradmin" $postgresql.username -}}
{{- $usersync := get $ranger "usersync" | default dict -}}
{{- $usersyncImage := get $usersync "image" | default dict -}}
{{- $localUserSync := get $ranger "localUserSync" | default dict -}}
{{- $localUserSyncReadiness := get $localUserSync "readiness" | default dict -}}
{{- $localUserSyncReadinessAttempts := default 120 $localUserSyncReadiness.attempts -}}
{{- $localUserSyncReadinessDelaySeconds := default 5 $localUserSyncReadiness.delaySeconds -}}
{{- $usersyncEnabled := true -}}
{{- if hasKey $usersync "enabled" -}}
  {{- $usersyncEnabled = $usersync.enabled -}}
{{- end -}}
{{- $localUserSyncRequested := true -}}
{{- if hasKey $localUserSync "enabled" -}}
  {{- $localUserSyncRequested = $localUserSync.enabled -}}
{{- end -}}
{{- $keycloakRangerSyncEnabled := and (default false $identity.enabled) (eq $providerMode "bundledKeycloak") $localUserSyncRequested -}}
{{- $localUserSyncImage := get $localUserSync "image" | default $usersyncImage -}}
{{- $baselinePolicies := get $ranger "baselinePolicies" | default dict -}}
{{- if $ranger.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-automation
data:
  bootstrap-config.json: |
    {{- dict
      "ranger" (dict
        "serviceName" (include "dlh-in-a-box.ranger.serviceName" .)
        "serviceUsername" (default "trino" $ranger.serviceUsername)
        "serviceAdminUsers" ($ranger.serviceAdminUsers | default (list))
        "serviceAdminGroups" ($ranger.serviceAdminGroups | default (list))
        "superUsers" ($ranger.superUsers | default (list))
        "superGroups" ($ranger.superGroups | default (list))
        "dataRoles" ($ranger.dataRoles | default dict)
        "trinoEnabled" (and (default false $ranger.enabled) (default false $rangerTrino.enabled))
        "baselinePolicies" $baselinePolicies
      )
      "accessRoles" $accessRoles
      "catalogs" (.Values.global.dataCatalogs | default (dict))
      "trinoJdbcUrl" (include "dlh-in-a-box.ranger.trinoJdbcUrl" .)
      "ldap" (dict
        "url" (include "dlh-in-a-box.identity.directory.url" .)
        "allowInsecure" (default false $ldap.allowInsecure)
        "bindDn" $ldapEffectiveBindDn
        "trustedCaPath" (ternary $ldapTrustedCaPath "" (and (ne $ldapTrustedCaSecretName "") (not (default false $ldap.allowInsecure))))
        "userBaseDn" (include "dlh-in-a-box.identity.directory.userBaseDn" .)
        "groupBaseDn" (include "dlh-in-a-box.identity.directory.groupBaseDn" .)
        "usernameAttribute" (default "uid" $ldap.usernameAttribute)
        "firstNameAttribute" (default "givenName" $ldap.firstNameAttribute)
        "lastNameAttribute" (default "sn" $ldap.lastNameAttribute)
        "emailAttribute" (default "mail" $ldap.emailAttribute)
        "groupNameAttribute" (default "cn" $ldap.groupNameAttribute)
        "groupSearchFilter" (default "(cn=trino_*)" $ldap.groupSearchFilter)
        "groupSearchMemberAttribute" (default "member" $ldap.groupSearchMemberAttribute)
      )
      "identity" (dict
        "directoryMode" (default "keycloakLocal" (get $directory "mode"))
        "keycloak" (dict
          "realm" (include "dlh-in-a-box.keycloak.realm" .)
          "adminUrl" (include "dlh-in-a-box.keycloak.internalBaseUrl" .)
          "adminUsername" (default "admin" .Values.keycloak.auth.adminUser)
        )
      )
    | toPrettyJson | nindent 4 }}
  bootstrap.py: |
{{ .Files.Get "files/ranger-automation/bootstrap.py" | nindent 4 }}
  usersync.py: |
{{ .Files.Get "files/ranger-automation/usersync.py" | nindent 4 }}
  keycloak_ranger_sync.py: |
{{ .Files.Get "files/ranger-automation/keycloak_ranger_sync.py" | nindent 4 }}
  wait_for_ranger_keycloak.py: |
    import os
    import sys
    import time
    import urllib.error
    import urllib.request
    from urllib.parse import urljoin

    attempts = int(os.getenv("RANGER_KEYCLOAK_SYNC_READINESS_ATTEMPTS", "120"))
    delay_seconds = float(os.getenv("RANGER_KEYCLOAK_SYNC_READINESS_DELAY_SECONDS", "5"))

    checks = [
        ("Ranger Admin", urljoin(os.environ["RANGER_URL"].rstrip("/") + "/", "login.jsp")),
        ("Keycloak OIDC discovery", os.environ["KEYCLOAK_OIDC_DISCOVERY_URL"]),
    ]

    opener = urllib.request.build_opener()
    opener.addheaders = [("User-Agent", "dlh-ranger-keycloak-sync-readiness")]

    for name, url in checks:
        for attempt in range(1, attempts + 1):
            try:
                with opener.open(url, timeout=5) as response:
                    if 200 <= response.status < 500:
                        print(f"{name} readiness check passed: HTTP {response.status} {url}", flush=True)
                        break
                    print(f"{name} readiness check returned HTTP {response.status} on attempt {attempt}/{attempts}", flush=True)
            except (urllib.error.URLError, TimeoutError, OSError) as exc:
                print(f"{name} readiness check failed on attempt {attempt}/{attempts}: {exc}", flush=True)
            if attempt == attempts:
                print(f"{name} readiness check timed out after {attempts} attempts: {url}", file=sys.stderr, flush=True)
                sys.exit(1)
            time.sleep(delay_seconds)
---
{{- if $passwordReconcileEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-password-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-password-reconcile
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-password-reconcile
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ranger-password-reconcile
          image: "{{ default "postgres" $passwordReconcileImage.repository }}:{{ default "15" $passwordReconcileImage.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $passwordReconcileImage.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              export PGPASSWORD="${RANGER_DB_PASSWORD}"

              for _ in $(seq 1 120); do
                if psql -h "${RANGER_DB_HOST}" -U "${RANGER_DB_USERNAME}" -d "${RANGER_DB_NAME}" -tAc "select to_regclass('public.x_portal_user')" | grep -qx x_portal_user; then
                  break
                fi
                sleep 5
              done

              update_ranger_password() {
                local login_id="${1:?login id required}"
                local password="${2:-}"
                local password_hash
                if [ -z "${password}" ]; then
                  return 0
                fi
                password_hash="$(printf '%s{%s}' "${password}" "${login_id}" | sha256sum | awk '{print $1}')"
                psql -h "${RANGER_DB_HOST}" -U "${RANGER_DB_USERNAME}" -d "${RANGER_DB_NAME}" -v ON_ERROR_STOP=1 \
                  --set=login_id="${login_id}" \
                  --set=password_hash="${password_hash}" <<'SQL'
              UPDATE x_portal_user
                 SET password = :'password_hash',
                     update_time = CURRENT_TIMESTAMP
               WHERE login_id = :'login_id'
                 AND password <> :'password_hash';

              DELETE FROM x_auth_sess
               WHERE login_id = :'login_id'
                 AND auth_status <> 1;
              SQL
              }

              update_ranger_password admin "${RANGER_ADMIN_PASSWORD}"
              update_ranger_password rangerusersync "${RANGER_USERSYNC_PASSWORD:-}"
              update_ranger_password rangertagsync "${RANGER_TAGSYNC_PASSWORD:-}"
          env:
            - name: RANGER_DB_HOST
              value: {{ $dbHost | quote }}
            - name: RANGER_DB_NAME
              value: {{ $dbName | quote }}
            - name: RANGER_DB_USERNAME
              value: {{ $dbUser | quote }}
            - name: RANGER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresql.existingSecret }}
                  key: {{ default "password" $postgresql.passwordKey }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $rangerAdmin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $rangerAdmin.adminPasswordKey }}
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $rangerAdmin.existingSecret }}
                  key: {{ default "rangerUsersyncPassword" $rangerAdmin.usersyncPasswordKey }}
            - name: RANGER_TAGSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $rangerAdmin.existingSecret }}
                  key: {{ default "rangerTagsyncPassword" $rangerAdmin.tagsyncPasswordKey }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ranger-bootstrap
          image: "{{ $ranger.bootstrap.image.repository }}:{{ $ranger.bootstrap.image.tag }}"
          imagePullPolicy: {{ $ranger.bootstrap.image.pullPolicy }}
          command:
            - python
            - -u
            - /opt/ranger-automation/bootstrap.py
          env:
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
          volumeMounts:
            - name: automation
              mountPath: /opt/ranger-automation
              readOnly: true
      volumes:
        - name: automation
          configMap:
            name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
            defaultMode: 0555
---
{{- if $keycloakRangerSyncEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-keycloak-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-keycloak-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-keycloak-sync
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ranger-keycloak-sync
          image: "{{ $localUserSyncImage.repository }}:{{ $localUserSyncImage.tag }}"
          imagePullPolicy: {{ $localUserSyncImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              python /opt/ranger-automation/wait_for_ranger_keycloak.py
              python /opt/ranger-automation/keycloak_ranger_sync.py
          env:
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: KEYCLOAK_OIDC_DISCOVERY_URL
              value: {{ printf "%s/.well-known/openid-configuration" (include "dlh-in-a-box.identity.internalIssuer" .) | quote }}
            - name: RANGER_KEYCLOAK_SYNC_READINESS_ATTEMPTS
              value: {{ $localUserSyncReadinessAttempts | quote }}
            - name: RANGER_KEYCLOAK_SYNC_READINESS_DELAY_SECONDS
              value: {{ $localUserSyncReadinessDelaySeconds | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.auth.existingSecret }}
                  key: {{ .Values.keycloak.auth.passwordSecretKey }}
          volumeMounts:
            - name: automation
              mountPath: /opt/ranger-automation
              readOnly: true
      volumes:
        - name: automation
          configMap:
            name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
            defaultMode: 0555
---
{{- end }}
{{- if $usersyncEnabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-usersync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-usersync
spec:
  schedule: {{ default "*/15 * * * *" (dig "usersync" "schedule" "*/15 * * * *" $ranger) | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-usersync
        spec:
          restartPolicy: OnFailure
          {{- with $ldapHostAliases }}
          hostAliases:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: ranger-usersync
              image: "{{ $usersyncImage.repository }}:{{ $usersyncImage.tag }}"
              imagePullPolicy: {{ $usersyncImage.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python -m pip install --no-cache-dir ldap3 >/tmp/ranger-usersync-pip.log
                  python /opt/ranger-automation/usersync.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
                - name: LDAP_BIND_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "dlh-in-a-box.identity.directory.bindSecretName" . }}
                      key: {{ include "dlh-in-a-box.identity.directory.bindSecretKey" . }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
                {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
                - name: ldap-trusted-ca
                  mountPath: /opt/ranger-automation/ldap-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
            {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
            - name: ldap-trusted-ca
              secret:
                secretName: {{ $ldapTrustedCaSecretName }}
                items:
                  - key: {{ $ldapTrustedCaCertKey }}
                    path: {{ $ldapTrustedCaCertKey }}
            {{- end }}
{{- end }}
{{- if $keycloakRangerSyncEnabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-keycloak-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-keycloak-sync
spec:
  schedule: {{ default "*/5 * * * *" $localUserSync.schedule | quote }}
  suspend: {{ ternary "true" "false" (default false $localUserSync.suspend) }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-keycloak-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ranger-keycloak-sync
              image: "{{ $localUserSyncImage.repository }}:{{ $localUserSyncImage.tag }}"
              imagePullPolicy: {{ $localUserSyncImage.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python /opt/ranger-automation/wait_for_ranger_keycloak.py
                  python /opt/ranger-automation/keycloak_ranger_sync.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: KEYCLOAK_OIDC_DISCOVERY_URL
                  value: {{ printf "%s/.well-known/openid-configuration" (include "dlh-in-a-box.identity.internalIssuer" .) | quote }}
                - name: RANGER_KEYCLOAK_SYNC_READINESS_ATTEMPTS
                  value: {{ $localUserSyncReadinessAttempts | quote }}
                - name: RANGER_KEYCLOAK_SYNC_READINESS_DELAY_SECONDS
                  value: {{ $localUserSyncReadinessDelaySeconds | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.auth.existingSecret }}
                      key: {{ default "adminPassword" .Values.keycloak.auth.passwordSecretKey }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
{{- end }}
{{- end }}
