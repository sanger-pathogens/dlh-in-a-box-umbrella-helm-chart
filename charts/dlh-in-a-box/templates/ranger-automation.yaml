    def keycloak_role_projection_groups(raw_role, role_key):
        members = (raw_role or {}).get("members") or {}
        apps = (raw_role or {}).get("apps") or {}
        groups = set(normalize_names(members.get("directoryGroups", [])))
        app_group_names = {
            "superset": "platform-app-superset",
            "datahub": "platform-app-datahub",
            "cloudbeaver": "platform-app-cloudbeaver",
            "prefect": "platform-app-prefect",
            "trinoUi": "platform-app-trino",
        }
        for app_key, group_name in app_group_names.items():
            if bool(apps.get(app_key)):
                groups.add(group_name)
        if not groups:
            groups.add(f"platform-role-{role_key}")
        return sorted(groups)


    def projected_keycloak_groups(config):
        membership_source = str((config.get("ranger") or {}).get("platformRoleMembershipSource", "git") or "git").lower()
        if membership_source != "ranger":
            return {}

        projected = {}
        for role_key in sorted(config.get("platformRoles", {})):
            raw_role = config["platformRoles"][role_key] or {}
            ranger_role_name = str(((raw_role.get("ranger") or {}).get("roleName") or role_key)).strip()
            if not ranger_role_name:
                continue
            projected_groups = keycloak_role_projection_groups(raw_role, role_key)
            if not projected_groups:
                continue
            live_role = get_role(ranger_role_name) or {}
            for member in live_role.get("users", []) or []:
                username = str((member or {}).get("name") or "").strip()
                if not username:
                    continue
                projected.setdefault(username, set()).update(projected_groups)

        return {username: sorted(groups) for username, groups in projected.items()}


    def sync_projected_keycloak_groups(config, token, user, desired_groups):
        username = str(user.get("username") or "").strip()
        if not username:
            return False, False

        desired = normalize_names(desired_groups)
        existing_attributes = dict(user.get("attributes") or {})
        previous = normalize_names(existing_attributes.get("platformProjectedGroups", []))
        current_groups = keycloak_user_groups(config, token, user["id"])
        changed = False

        for group_name in desired:
            group_id = ensure_keycloak_group(config, token, group_name)
            if group_name not in current_groups:
                ensure_keycloak_group_membership(config, token, user["id"], group_id)
                current_groups[group_name] = group_id
                changed = True

        for group_name in previous:
            if group_name in desired:
                continue
            group_id = current_groups.get(group_name) or keycloak_group_id(config, token, group_name)
            if not group_id:
                continue
            remove_keycloak_group_membership(config, token, user["id"], group_id)
            current_groups.pop(group_name, None)
            changed = True

        if previous != desired:
            updated_user = dict(user)
            updated_attributes = dict(existing_attributes)
            if desired:
                updated_attributes["platformProjectedGroups"] = desired
                updated_attributes["platformProjectedGroupsSource"] = ["ranger-platform-roles"]
            else:
                updated_attributes.pop("platformProjectedGroups", None)
                updated_attributes.pop("platformProjectedGroupsSource", None)
            updated_user["attributes"] = updated_attributes
            keycloak_request(
                config,
                token,
                "PUT",
                f"/admin/realms/{config['identity']['keycloak']['realm']}/users/{user['id']}",
                updated_user,
                ok=(204,),
            )
            user["attributes"] = updated_attributes
            changed = True

        logged_out = False
        if changed:
            try:
                keycloak_logout_user(config, token, user["id"])
                logged_out = True
            except Exception as exc:
                print(
                    f"WARNING: projected Keycloak groups for {username} but failed to clear stale sessions: {exc}",
                    file=sys.stderr,
                )

        return changed, logged_out


    def sync():
        config = load_config()
        if config["identity"].get("directoryMode") != "keycloakLocal":
            print("Keycloak local-user mode is not active; skipping Ranger local-user sync.")
            return

        wait_for_ranger()
        token = keycloak_token(config)
        realm = config["identity"]["keycloak"]["realm"]
        users = keycloak_request(
            config,
            token,
            "GET",
            f"/admin/realms/{realm}/users?max=1000",
            ok=(200,),
        ) or []

        synced_count = 0
        created_count = 0
        normalized_count = 0
        logged_out_count = 0
        projected_group_updates = 0
        projected_group_logouts = 0
        users_by_username = {}

        for user in users:
            username = (user.get("username") or "").strip()
            email = (user.get("email") or "").strip()
            enabled = bool(user.get("enabled", True))
            first_name = (user.get("firstName") or username or "").strip()
            last_name = (user.get("lastName") or "User").strip()
            if not username or not should_sync_user(username, email, enabled):
                continue
            users_by_username[username] = user

            normalized, logged_out = normalize_keycloak_user(config, token, user)
            if normalized:
                normalized_count += 1
            if logged_out:
                logged_out_count += 1

            if ensure_ranger_user(username, first_name, last_name, email):
                created_count += 1

            sync_ranger_sql(config, username, first_name, last_name, email)
            synced_count += 1

        projected_groups_by_user = projected_keycloak_groups(config)

        for username, desired_groups in projected_groups_by_user.items():
            user = users_by_username.get(username)
            if not user:
                continue
            changed, logged_out = sync_projected_keycloak_groups(config, token, user, desired_groups)
            if changed:
                projected_group_updates += 1
            if logged_out:
                projected_group_logouts += 1

        for username, user in users_by_username.items():
            if username in projected_groups_by_user:
                continue
            changed, logged_out = sync_projected_keycloak_groups(config, token, user, [])
            if changed:
                projected_group_updates += 1
            if logged_out:
                projected_group_logouts += 1

        print(
            "Ensured "
            f"{synced_count} eligible Keycloak-local users are mirrored into Ranger "
            f"({created_count} Ranger API users created, {normalized_count} Keycloak accounts normalized, "
            f"{logged_out_count} stale Keycloak sessions cleared, {projected_group_updates} Keycloak role/app "
            f"group projections refreshed, {projected_group_logouts} additional projected-group logouts issued)."
        )


    if __name__ == "__main__":
        sync()
---
{{- if (dig "bootstrap" "enabled" true $ranger) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ranger-bootstrap
          image: "{{ $ranger.bootstrap.image.repository }}:{{ $ranger.bootstrap.image.tag }}"
          imagePullPolicy: {{ $ranger.bootstrap.image.pullPolicy }}
          command:
            - python
            - -u
            - /opt/ranger-automation/bootstrap.py
          env:
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
          volumeMounts:
            - name: automation
              mountPath: /opt/ranger-automation
              readOnly: true
      volumes:
        - name: automation
          configMap:
            name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
            defaultMode: 0555
---
{{- end }}
{{- if $usersyncEnabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-usersync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-usersync
spec:
  schedule: {{ default "*/15 * * * *" (dig "usersync" "schedule" "*/15 * * * *" $ranger) | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-usersync
        spec:
          restartPolicy: OnFailure
          {{- with $ldapHostAliases }}
          hostAliases:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: ranger-usersync
              image: "{{ $usersyncImage.repository }}:{{ $usersyncImage.tag }}"
              imagePullPolicy: {{ $usersyncImage.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python -m pip install --no-cache-dir ldap3 >/tmp/ranger-usersync-pip.log
                  python /opt/ranger-automation/usersync.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
                - name: LDAP_BIND_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "dlh-in-a-box.identity.directory.bindSecretName" . }}
                      key: {{ include "dlh-in-a-box.identity.directory.bindSecretKey" . }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
                {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
                - name: ldap-trusted-ca
                  mountPath: /opt/ranger-automation/ldap-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
            {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
            - name: ldap-trusted-ca
              secret:
                secretName: {{ $ldapTrustedCaSecretName }}
                items:
                  - key: {{ $ldapTrustedCaCertKey }}
                    path: {{ $ldapTrustedCaCertKey }}
            {{- end }}
{{- end }}
{{- if $localUserSyncEnabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-local-user-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-local-user-sync
spec:
  schedule: {{ default "*/5 * * * *" $localUserSync.schedule | quote }}
  suspend: {{ ternary "true" "false" (default false $localUserSync.suspend) }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-local-user-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ranger-local-user-sync
              image: "{{ $localUserSyncImage.repository }}:{{ $localUserSyncImage.tag }}"
              imagePullPolicy: {{ $localUserSyncImage.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python -m pip install --no-cache-dir "psycopg[binary]" >/tmp/ranger-local-user-sync-pip.log
                  python /opt/ranger-automation/keycloak_local_users.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.auth.existingSecret }}
                      key: {{ default "adminPassword" .Values.keycloak.auth.passwordSecretKey }}
                - name: RANGER_POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $rangerPostgresql.existingSecret }}
                      key: {{ default "password" $rangerPostgresql.passwordKey }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
{{- end }}
{{- if $exceptionRoleAuditEnabled }}
---
