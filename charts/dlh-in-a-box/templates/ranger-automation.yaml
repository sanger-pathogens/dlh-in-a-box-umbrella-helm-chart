{{- $authorization := .Values.global.authorization | default dict -}}
{{- $platformRoles := get $authorization "platformRoles" | default dict -}}
{{- $platformRoleExceptions := get $authorization "platformRoleExceptions" | default (list) -}}
{{- $platformRoleMembershipSource := default "git" (get $authorization "platformRoleMembershipSource") -}}
{{- $ranger := get $authorization "ranger" | default dict -}}
{{- $exceptionRoleAudit := get $ranger "exceptionRoleAudit" | default dict -}}
{{- $identity := .Values.global.identity | default dict -}}
{{- $directory := get $identity "directory" | default dict -}}
{{- $keycloakLocalMode := eq (default "externalLdap" (get $directory "mode")) "keycloakLocal" -}}
{{- $ldap := get $directory "ldap" | default dict -}}
{{- $ldapAllowAnonymousRead := default false $ldap.allowAnonymousRead -}}
{{- $ldapEffectiveBindDn := ternary "" (include "dlh-in-a-box.identity.directory.bindDn" .) $ldapAllowAnonymousRead -}}
{{- $ldapTrustedCaSecretName := include "dlh-in-a-box.identity.directory.trustedCaSecretName" . -}}
{{- $ldapTrustedCaCertKey := include "dlh-in-a-box.identity.directory.trustedCaCertKey" . -}}
{{- $ldapTrustedCaPath := printf "/opt/ranger-automation/ldap-ca/%s" $ldapTrustedCaCertKey -}}
{{- $ldapHostAliases := default (list) $ldap.hostAliases -}}
{{- $rangerBootstrap := get $ranger "bootstrap" | default dict -}}
{{- $rangerPostgresql := get $ranger "postgresql" | default dict -}}
{{- $rangerPostgresqlHost := default (include "dlh-in-a-box.ranger.postgresql.serviceName" .) $rangerPostgresql.host -}}
{{- $usersync := get $ranger "usersync" | default dict -}}
{{- $usersyncImage := get $usersync "image" | default dict -}}
{{- $localUserSync := get $ranger "localUserSync" | default dict -}}
{{- $usersyncEnabled := true -}}
{{- if hasKey $usersync "enabled" -}}
  {{- $usersyncEnabled = $usersync.enabled -}}
{{- end -}}
{{- $localUserSyncRequested := true -}}
{{- if hasKey $localUserSync "enabled" -}}
  {{- $localUserSyncRequested = $localUserSync.enabled -}}
{{- end -}}
{{- $localUserSyncEnabled := and $keycloakLocalMode $localUserSyncRequested -}}
{{- $localUserSyncImage := get $localUserSync "image" | default $usersyncImage -}}
{{- $exceptionRoleAuditEnabled := true -}}
{{- if hasKey $exceptionRoleAudit "enabled" -}}
  {{- $exceptionRoleAuditEnabled = $exceptionRoleAudit.enabled -}}
{{- end -}}
{{- $exceptionRoleAuditDeleteExpired := true -}}
{{- if hasKey $exceptionRoleAudit "deleteExpired" -}}
  {{- $exceptionRoleAuditDeleteExpired = $exceptionRoleAudit.deleteExpired -}}
{{- end -}}
{{- $exceptionRoleAuditLogUndocumented := true -}}
{{- if hasKey $exceptionRoleAudit "logUndocumented" -}}
  {{- $exceptionRoleAuditLogUndocumented = $exceptionRoleAudit.logUndocumented -}}
{{- end -}}
{{- $importCatalogAcls := false -}}
{{- if hasKey $ranger "importCatalogAcls" -}}
  {{- $importCatalogAcls = $ranger.importCatalogAcls -}}
{{- else if hasKey $rangerBootstrap "importCatalogAcls" -}}
  {{- $importCatalogAcls = $rangerBootstrap.importCatalogAcls -}}
{{- end -}}
{{- $bootstrapPolicies := get $ranger "bootstrapPolicies" | default (get $rangerBootstrap "policies" | default (list)) -}}
{{- if $ranger.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-automation
data:
  bootstrap-config.json: |
    {{- dict
      "ranger" (dict
        "serviceName" (include "dlh-in-a-box.ranger.serviceName" .)
        "serviceUsername" (default "trino" $ranger.serviceUsername)
        "serviceAdminUsers" ($ranger.serviceAdminUsers | default (list))
        "serviceAdminGroups" ($ranger.serviceAdminGroups | default (list))
        "superUsers" ($ranger.superUsers | default (list))
        "superGroups" ($ranger.superGroups | default (list))
        "legacyManagedUsers" ($ranger.legacyManagedUsers | default (list))
        "legacyManagedGroups" ($ranger.legacyManagedGroups | default (list))
        "legacyManagedRoles" ($ranger.legacyManagedRoles | default (list))
        "legacyManagedPolicies" ($ranger.legacyManagedPolicies | default (list))
        "platformRoleMembershipSource" $platformRoleMembershipSource
        "importCatalogAcls" $importCatalogAcls
        "bootstrapPolicies" $bootstrapPolicies
        "exceptionRoleAudit" (dict
          "enabled" $exceptionRoleAuditEnabled
          "prefix" (default "exception-" $exceptionRoleAudit.prefix)
          "schedule" (default "23 * * * *" $exceptionRoleAudit.schedule)
          "gracePeriodDays" (default 7 $exceptionRoleAudit.gracePeriodDays)
          "deleteExpired" $exceptionRoleAuditDeleteExpired
          "logUndocumented" $exceptionRoleAuditLogUndocumented
        )
      )
      "platformRoles" $platformRoles
      "platformRoleExceptions" $platformRoleExceptions
      "catalogs" (.Values.global.dataCatalogs | default (dict))
      "trinoJdbcUrl" (include "dlh-in-a-box.ranger.trinoJdbcUrl" .)
      "ldap" (dict
        "url" (include "dlh-in-a-box.identity.directory.url" .)
        "allowInsecure" (default false $ldap.allowInsecure)
        "bindDn" $ldapEffectiveBindDn
        "trustedCaPath" (ternary $ldapTrustedCaPath "" (and (ne $ldapTrustedCaSecretName "") (not (default false $ldap.allowInsecure))))
        "userBaseDn" (include "dlh-in-a-box.identity.directory.userBaseDn" .)
        "groupBaseDn" (include "dlh-in-a-box.identity.directory.groupBaseDn" .)
        "usernameAttribute" (default "uid" $ldap.usernameAttribute)
        "firstNameAttribute" (default "givenName" $ldap.firstNameAttribute)
        "lastNameAttribute" (default "sn" $ldap.lastNameAttribute)
        "emailAttribute" (default "mail" $ldap.emailAttribute)
        "groupNameAttribute" (default "cn" $ldap.groupNameAttribute)
        "groupSearchFilter" (default "(cn=trino_*)" $ldap.groupSearchFilter)
        "groupSearchMemberAttribute" (default "member" $ldap.groupSearchMemberAttribute)
      )
      "identity" (dict
        "directoryMode" (default "externalLdap" (get $directory "mode"))
        "keycloak" (dict
          "realm" (include "dlh-in-a-box.keycloak.realm" .)
          "adminUrl" (include "dlh-in-a-box.keycloak.internalBaseUrl" .)
          "adminUsername" (default "admin" .Values.keycloak.auth.adminUser)
          "requireEmailVerification" (default false (dig "provider" "keycloak" "registration" "requireEmailVerification" false $identity))
        )
      )
      "rangerPostgresql" (dict
        "host" $rangerPostgresqlHost
        "port" 5432
        "database" (default "ranger" $rangerPostgresql.database)
        "username" (default "rangeradmin" $rangerPostgresql.username)
      )
    | toPrettyJson | nindent 4 }}
  bootstrap.py: |
    import base64
    import datetime
    import json
    import os
    import re
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    CONFIG_PATH = "/opt/ranger-automation/bootstrap-config.json"
    RANGER_URL = os.environ["RANGER_URL"].rstrip("/")
    RANGER_PASSWORD = os.environ["RANGER_ADMIN_PASSWORD"]


    def load_config():
        with open(CONFIG_PATH, "r", encoding="utf-8") as handle:
            return json.load(handle)


    def request(method, path, payload=None, ok=(200, 201), parse_json=True):
        url = f"{RANGER_URL}{path}"
        headers = {
            "Authorization": "Basic "
            + base64.b64encode(f"admin:{RANGER_PASSWORD}".encode("utf-8")).decode("ascii"),
            "Accept": "application/json",
        }
        body = None
        if payload is not None:
            body = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as response:
                data = response.read().decode("utf-8")
                if not parse_json:
                    return data
                return json.loads(data) if data else None
        except urllib.error.HTTPError as exc:
            data = exc.read().decode("utf-8")
            if exc.code in ok:
                if not parse_json:
                    return data
                return json.loads(data) if data else None
            exc.ranger_body = data
            print(f"Ranger API {method} {path} failed with HTTP {exc.code}: {data}")
            raise


    def wait_for_ranger():
        deadline = time.time() + 600
        while time.time() < deadline:
            try:
                request("GET", "/login.jsp", ok=(200,), parse_json=False)
                return
            except Exception:
                time.sleep(5)
        raise RuntimeError("Timed out waiting for Ranger Admin")


    def as_resource(value):
        if isinstance(value, dict):
            result = dict(value)
            result.setdefault("isExcludes", False)
            result.setdefault("isRecursive", False)
            if "values" in result and not isinstance(result["values"], list):
                result["values"] = [str(result["values"])]
            return result
        if value is None:
            values = ["*"]
        elif isinstance(value, list):
            values = [str(item) for item in value] or ["*"]
        else:
            values = [str(value)]
        return {"values": values, "isExcludes": False, "isRecursive": False}


    def normalize_names(items):
        return sorted({str(item) for item in items if str(item).strip()})


    def role_member(name, is_admin=False):
        return {"name": str(name), "isAdmin": bool(is_admin)}


    def normalize_role_members(items):
        members = {}
        for item in items or []:
            if isinstance(item, dict):
                name = str(item.get("name", "")).strip()
                is_admin = bool(item.get("isAdmin", False))
            else:
                name = str(item).strip()
                is_admin = False
            if not name:
                continue
            current = members.get(name)
            members[name] = role_member(name, is_admin or bool(current and current.get("isAdmin")))
        return [members[name] for name in sorted(members)]


    def role_member_names(items):
        return normalize_names(
            [
                item.get("name", "")
                if isinstance(item, dict)
                else item
                for item in (items or [])
            ]
        )


    def should_preserve_ranger_membership(existing_items, seed_items):
        seed_names = set(role_member_names(seed_items))
        if not seed_names:
            return True
        existing_names = set(role_member_names(existing_items))
        return seed_names.issubset(existing_names)


    def access_item(users, groups, roles, accesses):
        if not users and not groups and not roles:
            return None
        return {
            "users": normalize_names(users),
            "groups": normalize_names(groups),
            "roles": normalize_names(roles),
            "accesses": [{"type": access, "isAllowed": True} for access in accesses],
            "conditions": [],
            "delegateAdmin": False,
        }


    def upsert_service(config):
        ranger_cfg = config["ranger"]
        service_name = ranger_cfg["serviceName"]
        payload = {
            "name": service_name,
            "type": "trino",
            "configs": {
                "username": ranger_cfg["serviceUsername"],
                "password": "",
                "jdbc.driverClassName": "io.trino.jdbc.TrinoDriver",
                "jdbc.url": config["trinoJdbcUrl"],
                "policy.download.auth.users": ranger_cfg["serviceUsername"],
                "tag.download.auth.users": ranger_cfg["serviceUsername"],
                "userstore.download.auth.users": ranger_cfg["serviceUsername"],
                "service.admin.users": ",".join(ranger_cfg.get("serviceAdminUsers", [])),
                "service.admin.groups": ",".join(ranger_cfg.get("serviceAdminGroups", [])),
                "ranger.plugin.super.users": ",".join(ranger_cfg.get("superUsers", [])),
                "ranger.plugin.super.groups": ",".join(ranger_cfg.get("superGroups", [])),
                "ranger.plugin.trino.policy.refresh.synchronous": "true",
            },
        }

        path = "/service/public/v2/api/service/name/" + urllib.parse.quote(service_name, safe="")
        try:
            existing = request("GET", path, ok=(200,))
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
            existing = None

        if existing:
            payload["id"] = existing["id"]
            payload["guid"] = existing.get("guid")
            request("PUT", path, payload, ok=(200,))
        else:
            request("POST", "/service/public/v2/api/service/", payload, ok=(200, 201))


    def normalize_policy(policy, service_name):
        normalized = dict(policy)
        normalized["service"] = service_name
        normalized["serviceType"] = "trino"
        normalized.setdefault("isEnabled", True)
        normalized.setdefault("isAuditEnabled", True)
        normalized.setdefault("policyType", 0)
        normalized["resources"] = {
            key: as_resource(value) for key, value in normalized.get("resources", {}).items()
        }
        normalized.setdefault("policyItems", [])
        normalized.setdefault("denyPolicyItems", [])
        normalized.setdefault("allowExceptions", [])
        normalized.setdefault("denyExceptions", [])
        normalized.setdefault("dataMaskPolicyItems", [])
        normalized.setdefault("rowFilterPolicyItems", [])
        return normalized


    def role_create_path(service_name):
        del service_name
        return "/service/public/v2/api/roles?createNonExistUserGroup=true"


    def role_update_path(role_id):
        return f"/service/public/v2/api/roles/{role_id}?createNonExistUserGroup=true"


    def list_roles():
        roles = []
        start_index = 0
        page_size = 200
        while True:
            page = request(
                "GET",
                f"/service/public/v2/api/roles?startIndex={start_index}&pageSize={page_size}",
                ok=(200,),
            ) or []
            roles.extend(page)
            if len(page) < page_size:
                break
            start_index += page_size
        return roles


    def list_policies(service_name):
        path = "/service/public/v2/api/policy?serviceName=" + urllib.parse.quote(service_name, safe="")
        return request("GET", path, ok=(200,)) or []


    def list_users():
        users = []
        start_index = 0
        page_size = 200
        while True:
            payload = request(
                "GET",
                f"/service/xusers/users?startIndex={start_index}&pageSize={page_size}",
                ok=(200,),
            ) or {}
            batch = payload.get("vXUsers", []) or []
            if not batch:
                break
            users.extend(batch)
            total_count = int(payload.get("totalCount", len(users)) or len(users))
            if len(users) >= total_count:
                break
            start_index += len(batch)
        return users


    def list_groups():
        groups = []
        start_index = 0
        page_size = 200
        while True:
            payload = request(
                "GET",
                f"/service/xusers/groups?startIndex={start_index}&pageSize={page_size}",
                ok=(200,),
            ) or {}
            batch = payload.get("vXGroups", []) or []
            if not batch:
                break
            groups.extend(batch)
            total_count = int(payload.get("totalCount", len(groups)) or len(groups))
            if len(groups) >= total_count:
                break
            start_index += len(batch)
        return groups


    def get_user(username):
        username = str(username or "").strip()
        if not username:
            return None
        for user in list_users():
            if str(user.get("name", "")).strip() == username:
                return user
        return None


    def build_external_user(username, first_name="", last_name="", email_address=""):
        username = str(username or "").strip()
        first_name = str(first_name or "").strip() or username
        last_name = str(last_name or "").strip() or "User"
        email_address = str(email_address or "").strip()
        return {
            "name": username,
            "firstName": first_name,
            "lastName": last_name,
            "emailAddress": email_address,
            "status": 1,
            "isVisible": 1,
            "userSource": 1,
            "userRoleList": ["ROLE_USER"],
            "syncSource": "LDAP",
        }


    def ensure_users_exist(usernames):
        existing_usernames = {
            str(user.get("name", "")).strip()
            for user in list_users()
            if str(user.get("name", "")).strip()
        }
        missing = [
            build_external_user(username)
            for username in normalize_names(usernames)
            if username not in existing_usernames
        ]
        if not missing:
            return
        request(
            "POST",
            "/service/xusers/ugsync/users",
            {"vXUsers": missing},
            ok=(200, 201),
        )
        print("Seeded Ranger users: " + ", ".join(sorted(user["name"] for user in missing)))


    def exception_role_name(base_role_name, username, expires_at):
        return f"exception-{base_role_name}-{username}-{expires_at.replace('-', '')}"


    def exception_role_description(base_role_name, exception):
        metadata = {
            "approvalRef": exception["approvalRef"],
            "reason": exception["reason"],
            "grantedBy": exception["grantedBy"],
            "expiresAt": exception["expiresAt"],
            "platformRole": exception["platformRole"],
            "username": exception["username"],
        }
        return (
            f"Temporary additive exception role nested into {base_role_name}. "
            f"EXCEPTION_METADATA={json.dumps(metadata, sort_keys=True, separators=(',', ':'))}"
        )


    def get_role(service_name, role_name):
        del service_name
        for role in list_roles():
            if str(role.get("name", "")) == str(role_name):
                return role
        return None


    def delete_role(service_name, role_name):
        existing = get_role(service_name, role_name)
        if not existing:
            return
        path = "/service/public/v2/api/roles/" + urllib.parse.quote(str(existing["id"]), safe="")
        request("DELETE", path, ok=(204, 404))


    def policy_path(policy_id):
        return "/service/public/v2/api/policy/" + urllib.parse.quote(str(policy_id), safe="")


    def filter_role_from_policy_items(items, role_name):
        filtered_items = []
        removed = False
        for item in items or []:
            updated_item = dict(item)
            roles = normalize_names(name for name in item.get("roles", []) if str(name) != role_name)
            removed = removed or len(roles) != len(item.get("roles", []) or [])
            updated_item["roles"] = roles
            updated_item["users"] = normalize_names(item.get("users", []))
            updated_item["groups"] = normalize_names(item.get("groups", []))
            if updated_item["users"] or updated_item["groups"] or updated_item["roles"]:
                filtered_items.append(updated_item)
        return filtered_items, removed


    def detach_role_from_policies(service_name, role_name):
        for policy in list_policies(service_name):
            updated_policy = dict(policy)
            removed = False
            for key in [
                "policyItems",
                "denyPolicyItems",
                "allowExceptions",
                "denyExceptions",
                "dataMaskPolicyItems",
                "rowFilterPolicyItems",
            ]:
                filtered_items, key_removed = filter_role_from_policy_items(policy.get(key, []), role_name)
                updated_policy[key] = filtered_items
                removed = removed or key_removed

            if not removed:
                continue

            has_principals = any(
                updated_policy.get(key)
                for key in [
                    "policyItems",
                    "denyPolicyItems",
                    "allowExceptions",
                    "denyExceptions",
                    "dataMaskPolicyItems",
                    "rowFilterPolicyItems",
                ]
            )
            if has_principals:
                request("PUT", policy_path(policy["id"]), updated_policy, ok=(200,))
                print(f"Detached legacy role {role_name} from Ranger policy: {policy['name']}")
            else:
                request("DELETE", policy_path(policy["id"]), ok=(204, 404))
                print(f"Deleted stale Ranger policy with no remaining principals: {policy['name']}")


    def upsert_role(service_name, role, existing=None):
        payload = {
            "name": role["name"],
            "description": role.get("description", ""),
            "isEnabled": True,
            "users": normalize_role_members(role.get("users", [])),
            "groups": normalize_role_members(role.get("groups", [])),
            "roles": normalize_role_members(role.get("roles", [])),
        }
        existing = existing or get_role(service_name, role["name"])
        if existing:
            payload["id"] = existing["id"]
            payload["guid"] = existing.get("guid")
            payload["version"] = existing.get("version")
            payload["createdByUser"] = existing.get("createdByUser")
            request("PUT", role_update_path(existing["id"]), payload, ok=(200,))
        else:
            request("POST", role_create_path(service_name), payload, ok=(200, 201))


    def build_platform_roles(config):
        result = []
        for role_key in sorted(config.get("platformRoles", {})):
            raw_role = config["platformRoles"][role_key] or {}
            members = raw_role.get("members", {}) or {}
            ranger_cfg = raw_role.get("ranger", {}) or {}
            result.append(
                {
                    "key": role_key,
                    "name": ranger_cfg.get("roleName") or role_key,
                    "description": raw_role.get("description", "").strip(),
                    "users": normalize_names(members.get("users", [])),
                    "groups": normalize_names(members.get("directoryGroups", [])),
                    "nestedRoleKeys": normalize_names(members.get("nestedRoles", [])),
                }
            )
        return result


    def build_exception_roles(config, base_roles):
        base_roles_by_key = {role["key"]: role for role in base_roles}
        exception_roles = []
        for raw_exception in config.get("platformRoleExceptions", []):
            exception = raw_exception or {}
            base_role = base_roles_by_key.get(exception.get("platformRole"))
            if not base_role:
                continue
            role_name = exception_role_name(
                base_role["name"],
                exception["username"],
                exception["expiresAt"],
            )
            exception_roles.append(
                {
                    "name": role_name,
                    "description": exception_role_description(base_role["name"], exception),
                    "users": [exception["username"]],
                    "groups": [],
                    "roles": [],
                    "targetRoleKey": base_role["key"],
                }
            )
        return exception_roles


    def build_catalog_acl_policies(config):
        service_name = config["ranger"]["serviceName"]
        read_accesses = ["select", "show", "use", "execute"]
        write_accesses = read_accesses + ["insert", "create", "delete", "drop", "alter", "grant", "revoke"]
        policies = []

        if not config["ranger"].get("importCatalogAcls", False):
            return policies

        for catalog_name, catalog in config.get("catalogs", {}).items():
            groups_acl = catalog.get("authorizedGroups", {}) or {}
            users_acl = catalog.get("authorizedUsers", {}) or {}
            read_item = access_item(users_acl.get("read", []), groups_acl.get("read", []), [], read_accesses)
            write_item = access_item(users_acl.get("write", []), groups_acl.get("write", []), [], write_accesses)

            if read_item:
                policies.append(
                    normalize_policy(
                        {
                            "name": f"{service_name}-{catalog_name}-read",
                            "description": f"Imported read-only catalog policy for {catalog_name}.",
                            "resources": {
                                "catalog": catalog_name,
                                "schema": "*",
                                "table": "*",
                                "column": "*",
                            },
                            "policyItems": [read_item],
                        },
                        service_name,
                    )
                )
            if write_item:
                policies.append(
                    normalize_policy(
                        {
                            "name": f"{service_name}-{catalog_name}-write",
                            "description": f"Imported read-write catalog policy for {catalog_name}.",
                            "resources": {
                                "catalog": catalog_name,
                                "schema": "*",
                                "table": "*",
                                "column": "*",
                            },
                            "policyItems": [write_item],
                        },
                        service_name,
                    )
                )

        return policies


    def usernames_from_policy_items(items):
        usernames = set()
        for item in items or []:
            usernames.update(normalize_names(item.get("users", [])))
        return usernames


    def policy_principal_usernames(config, policies):
        usernames = set()
        ranger_cfg = config.get("ranger", {}) or {}
        usernames.update(normalize_names(ranger_cfg.get("serviceAdminUsers", [])))
        usernames.update(normalize_names(ranger_cfg.get("superUsers", [])))
        service_username = str(ranger_cfg.get("serviceUsername") or "").strip()
        if service_username:
            usernames.add(service_username)
        for role in build_platform_roles(config):
            usernames.update(role.get("users", []))
        for policy in policies or []:
            for key in [
                "policyItems",
                "denyPolicyItems",
                "allowExceptions",
                "denyExceptions",
                "dataMaskPolicyItems",
                "rowFilterPolicyItems",
            ]:
                usernames.update(usernames_from_policy_items(policy.get(key, [])))
        return usernames


    def reconcile_roles(config):
        service_name = config["ranger"]["serviceName"]
        membership_source = str(config["ranger"].get("platformRoleMembershipSource", "git") or "git").lower()
        if membership_source not in {"git", "ranger"}:
            membership_source = "git"
        base_roles = build_platform_roles(config)
        base_roles_by_key = {role["key"]: role for role in base_roles}
        existing_roles_by_name = {
            str(role.get("name", "")): role
            for role in list_roles()
            if str(role.get("name", "")).strip()
        }

        for role in base_roles:
            existing = existing_roles_by_name.get(role["name"])
            effective_users = role["users"]
            effective_groups = role["groups"]
            if membership_source == "ranger" and existing:
                preserve_users = should_preserve_ranger_membership(existing.get("users", []), role["users"])
                preserve_groups = should_preserve_ranger_membership(existing.get("groups", []), role["groups"])
                if preserve_users:
                    effective_users = existing.get("users", [])
                if preserve_groups:
                    effective_groups = existing.get("groups", [])
                if not preserve_users or not preserve_groups:
                    print(
                        "Reset Ranger role membership to the seeded baseline for "
                        f"{role['name']} because the live role no longer contained the "
                        "required approved members."
                    )
            upsert_role(
                service_name,
                {
                    "name": role["name"],
                    "description": role["description"],
                    "users": effective_users,
                    "groups": effective_groups,
                    "roles": [],
                },
                existing=existing,
            )
            role["effectiveUsers"] = effective_users
            role["effectiveGroups"] = effective_groups
            print(f"Reconciled Ranger role: {role['name']}")

        for stale_role_name in normalize_names(config["ranger"].get("legacyManagedRoles", [])):
            if stale_role_name in existing_roles_by_name:
                detach_role_from_policies(service_name, stale_role_name)
                delete_role(service_name, stale_role_name)
                print(f"Deleted stale managed Ranger role: {stale_role_name}")

        exception_roles = build_exception_roles(config, base_roles)
        exception_names_by_target = {}
        for role in exception_roles:
            upsert_role(service_name, role)
            exception_names_by_target.setdefault(role["targetRoleKey"], []).append(role["name"])
            print(f"Reconciled Ranger exception role: {role['name']}")

        for role in base_roles:
            nested_role_names = [
                base_roles_by_key[nested_role_key]["name"]
                for nested_role_key in role.get("nestedRoleKeys", [])
                if nested_role_key in base_roles_by_key
            ]
            nested_role_names.extend(exception_names_by_target.get(role["key"], []))
            upsert_role(
                service_name,
                {
                    "name": role["name"],
                    "description": role["description"],
                    "users": role.get("effectiveUsers", role["users"]),
                    "groups": role.get("effectiveGroups", role["groups"]),
                    "roles": nested_role_names,
                },
            )


    def filter_user_from_role_members(items, username):
        filtered = []
        removed = False
        for item in items or []:
            name = str(item.get("name", "")).strip() if isinstance(item, dict) else str(item).strip()
            if name == username:
                removed = True
                continue
            filtered.append(item)
        return filtered, removed


    def detach_user_from_roles(service_name, username):
        for role in list_roles():
            filtered_users, removed = filter_user_from_role_members(role.get("users", []), username)
            if not removed:
                continue
            payload = {
                "id": role["id"],
                "guid": role.get("guid"),
                "version": role.get("version"),
                "createdByUser": role.get("createdByUser"),
                "name": role["name"],
                "description": role.get("description", ""),
                "isEnabled": bool(role.get("isEnabled", True)),
                "users": normalize_role_members(filtered_users),
                "groups": normalize_role_members(role.get("groups", [])),
                "roles": normalize_role_members(role.get("roles", [])),
            }
            request("PUT", role_update_path(role["id"]), payload, ok=(200,))
            print(f"Detached legacy user {username} from Ranger role: {role['name']}")


    def filter_user_from_policy_items(items, username):
        filtered_items = []
        removed = False
        for item in items or []:
            updated_item = dict(item)
            users = normalize_names(name for name in item.get("users", []) if str(name) != username)
            removed = removed or len(users) != len(item.get("users", []) or [])
            updated_item["users"] = users
            updated_item["groups"] = normalize_names(item.get("groups", []))
            updated_item["roles"] = normalize_names(item.get("roles", []))
            if updated_item["users"] or updated_item["groups"] or updated_item["roles"]:
                filtered_items.append(updated_item)
        return filtered_items, removed


    def detach_user_from_policies(service_name, username):
        for policy in list_policies(service_name):
            updated_policy = dict(policy)
            removed = False
            for key in [
                "policyItems",
                "denyPolicyItems",
                "allowExceptions",
                "denyExceptions",
                "dataMaskPolicyItems",
                "rowFilterPolicyItems",
            ]:
                filtered_items, key_removed = filter_user_from_policy_items(policy.get(key, []), username)
                updated_policy[key] = filtered_items
                removed = removed or key_removed

            if not removed:
                continue

            has_principals = any(
                updated_policy.get(key)
                for key in [
                    "policyItems",
                    "denyPolicyItems",
                    "allowExceptions",
                    "denyExceptions",
                    "dataMaskPolicyItems",
                    "rowFilterPolicyItems",
                ]
            )
            if has_principals:
                request("PUT", policy_path(policy["id"]), updated_policy, ok=(200,))
                print(f"Detached legacy user {username} from Ranger policy: {policy['name']}")
            else:
                request("DELETE", policy_path(policy["id"]), ok=(204, 404))
                print(f"Deleted stale Ranger policy with no remaining principals: {policy['name']}")


    def delete_user_by_name(username):
        user = get_user(username)
        if not user:
            return
        request(
            "DELETE",
            f"/service/xusers/secure/users/id/{user['id']}?forceDelete=true",
            ok=(200, 204, 404),
            parse_json=False,
        )
        print(f"Deleted stale Ranger user: {username}")


    def purge_legacy_users(config, service_name):
        for username in normalize_names(config["ranger"].get("legacyManagedUsers", [])):
            detach_user_from_roles(service_name, username)
            detach_user_from_policies(service_name, username)
            delete_user_by_name(username)


    def delete_group_by_name(group_name):
        existing = None
        for group in list_groups():
            name = str(group.get("name", "")).strip()
            if name == group_name:
                existing = group
                break
        if not existing:
            return
        request(
            "DELETE",
            f"/service/xusers/groups/{existing['id']}",
            ok=(200, 204, 404),
            parse_json=False,
        )
        print(f"Deleted stale Ranger group: {group_name}")


    def purge_legacy_groups(config):
        for group_name in normalize_names(config["ranger"].get("legacyManagedGroups", [])):
            delete_group_by_name(group_name)


    def delete_policy_by_name(service_name, policy_name):
        path = (
            "/service/public/v2/api/service/"
            + urllib.parse.quote(service_name, safe="")
            + "/policy/"
            + urllib.parse.quote(policy_name, safe="")
        )
        try:
            existing = request("GET", path, ok=(200,))
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                return
            raise
        request("DELETE", policy_path(existing["id"]), ok=(200, 204, 404))
        print(f"Deleted stale Ranger policy: {policy_name}")


    def purge_legacy_policies(config, service_name):
        for policy_name in normalize_names(config["ranger"].get("legacyManagedPolicies", [])):
            delete_policy_by_name(service_name, policy_name)


    def normalize_policy_resource(value):
        normalized = as_resource(value)
        normalized["values"] = sorted(str(item) for item in normalized.get("values", []))
        normalized["isExcludes"] = bool(normalized.get("isExcludes", False))
        normalized["isRecursive"] = bool(normalized.get("isRecursive", False))
        return normalized


    def upsert_policy(service_name, policy):
        name = policy["name"]
        path = (
            "/service/public/v2/api/service/"
            + urllib.parse.quote(service_name, safe="")
            + "/policy/"
            + urllib.parse.quote(name, safe="")
        )
        try:
            existing = request("GET", path, ok=(200,))
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
            existing = None

        if existing:
            policy["id"] = existing["id"]
            policy["guid"] = existing.get("guid")
            request("PUT", path, policy, ok=(200,))
        else:
            try:
                request("POST", "/service/public/v2/api/policy/", policy, ok=(200, 201))
            except urllib.error.HTTPError as exc:
                if exc.code != 400:
                    raise
                detail = getattr(exc, "ranger_body", "")
                match = re.search(r"policy-name=\[([^\]]+)\]", detail)
                if not match:
                    raise
                existing_name = match.group(1).strip()
                existing_path = (
                    "/service/public/v2/api/service/"
                    + urllib.parse.quote(service_name, safe="")
                    + "/policy/"
                    + urllib.parse.quote(existing_name, safe="")
                )
                existing = request("GET", existing_path, ok=(200,))
                if not existing:
                    raise
                policy["id"] = existing["id"]
                policy["guid"] = existing.get("guid")
                update_path = (
                    "/service/public/v2/api/policy/"
                    + urllib.parse.quote(str(existing["id"]), safe="")
                )
                request("PUT", update_path, policy, ok=(200,))


    def main():
        wait_for_ranger()
        config = load_config()
        service_name = config["ranger"]["serviceName"]
        upsert_service(config)
        reconcile_roles(config)

        policies = []
        policies.extend(build_catalog_acl_policies(config))
        for raw_policy in config["ranger"].get("bootstrapPolicies", []):
            policies.append(normalize_policy(raw_policy, service_name))

        ensure_users_exist(policy_principal_usernames(config, policies))
        purge_legacy_users(config, service_name)
        purge_legacy_groups(config)
        purge_legacy_policies(config, service_name)

        for policy in policies:
            upsert_policy(service_name, policy)
            print(f"Reconciled Ranger policy: {policy['name']}")


    if __name__ == "__main__":
        main()
