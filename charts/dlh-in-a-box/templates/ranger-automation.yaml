    import base64
    import datetime
    import json
    import os
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    CONFIG_PATH = "/opt/ranger-automation/bootstrap-config.json"
    RANGER_URL = os.environ["RANGER_URL"].rstrip("/")
    RANGER_PASSWORD = os.environ["RANGER_ADMIN_PASSWORD"]


    def load_config():
        with open(CONFIG_PATH, "r", encoding="utf-8") as handle:
            return json.load(handle)


    def request(method, path, payload=None, ok=(200, 201), parse_json=True):
        url = f"{RANGER_URL}{path}"
        headers = {
            "Authorization": "Basic "
            + base64.b64encode(f"admin:{RANGER_PASSWORD}".encode("utf-8")).decode("ascii"),
            "Accept": "application/json",
        }
        body = None
        if payload is not None:
            body = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as response:
                data = response.read().decode("utf-8")
                if not parse_json:
                    return data
                return json.loads(data) if data else None
        except urllib.error.HTTPError as exc:
            if exc.code in ok:
                data = exc.read().decode("utf-8")
                if not parse_json:
                    return data
                return json.loads(data) if data else None
            raise


    def wait_for_ranger():
        deadline = time.time() + 600
        while time.time() < deadline:
            try:
                request("GET", "/login.jsp", ok=(200,), parse_json=False)
                return
            except Exception:
                time.sleep(5)
        raise RuntimeError("Timed out waiting for Ranger Admin")


    def as_resource(value):
        if isinstance(value, dict):
            result = dict(value)
            result.setdefault("isExcludes", False)
            result.setdefault("isRecursive", False)
            if "values" in result and not isinstance(result["values"], list):
                result["values"] = [str(result["values"])]
            return result
        if value is None:
            values = ["*"]
        elif isinstance(value, list):
            values = [str(item) for item in value] or ["*"]
        else:
            values = [str(value)]
        return {"values": values, "isExcludes": False, "isRecursive": False}


    def normalize_names(items):
        return sorted({str(item) for item in items if str(item).strip()})


    def role_member(name, is_admin=False):
        return {"name": str(name), "isAdmin": bool(is_admin)}


    def normalize_role_members(items):
        members = {}
        for item in items or []:
            if isinstance(item, dict):
                name = str(item.get("name", "")).strip()
                is_admin = bool(item.get("isAdmin", False))
            else:
                name = str(item).strip()
                is_admin = False
            if not name:
                continue
            current = members.get(name)
            members[name] = role_member(name, is_admin or bool(current and current.get("isAdmin")))
        return [members[name] for name in sorted(members)]


    def access_item(users, groups, roles, accesses):
        if not users and not groups and not roles:
            return None
        return {
            "users": normalize_names(users),
            "groups": normalize_names(groups),
            "roles": normalize_names(roles),
            "accesses": [{"type": access, "isAllowed": True} for access in accesses],
            "conditions": [],
            "delegateAdmin": False,
        }


    def upsert_service(config):
        ranger_cfg = config["ranger"]
        service_name = ranger_cfg["serviceName"]
        payload = {
            "name": service_name,
            "type": "trino",
            "configs": {
                "username": ranger_cfg["serviceUsername"],
                "password": "",
                "jdbc.driverClassName": "io.trino.jdbc.TrinoDriver",
                "jdbc.url": config["trinoJdbcUrl"],
                "policy.download.auth.users": ranger_cfg["serviceUsername"],
                "tag.download.auth.users": ranger_cfg["serviceUsername"],
                "userstore.download.auth.users": ranger_cfg["serviceUsername"],
                "service.admin.users": ",".join(ranger_cfg.get("serviceAdminUsers", [])),
                "service.admin.groups": ",".join(ranger_cfg.get("serviceAdminGroups", [])),
                "ranger.plugin.super.users": ",".join(ranger_cfg.get("superUsers", [])),
                "ranger.plugin.super.groups": ",".join(ranger_cfg.get("superGroups", [])),
                "ranger.plugin.trino.policy.refresh.synchronous": "true",
            },
        }

        path = "/service/public/v2/api/service/name/" + urllib.parse.quote(service_name, safe="")
        try:
            existing = request("GET", path, ok=(200,))
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
            existing = None

        if existing:
            payload["id"] = existing["id"]
            payload["guid"] = existing.get("guid")
            request("PUT", path, payload, ok=(200,))
        else:
            request("POST", "/service/public/v2/api/service/", payload, ok=(200, 201))


    def normalize_policy(policy, service_name):
        normalized = dict(policy)
        normalized["service"] = service_name
        normalized["serviceType"] = "trino"
        normalized.setdefault("isEnabled", True)
        normalized.setdefault("isAuditEnabled", True)
        normalized.setdefault("policyType", 0)
        normalized["resources"] = {
            key: as_resource(value) for key, value in normalized.get("resources", {}).items()
        }
        normalized.setdefault("policyItems", [])
        normalized.setdefault("denyPolicyItems", [])
        normalized.setdefault("allowExceptions", [])
        normalized.setdefault("denyExceptions", [])
        normalized.setdefault("dataMaskPolicyItems", [])
        normalized.setdefault("rowFilterPolicyItems", [])
        return normalized


    def role_create_path(service_name):
        del service_name
        return "/service/public/v2/api/roles?createNonExistUserGroup=true"


    def role_update_path(role_id):
        return f"/service/public/v2/api/roles/{role_id}?createNonExistUserGroup=true"


    def list_roles():
        roles = []
        start_index = 0
        page_size = 200
        while True:
            page = request(
                "GET",
                f"/service/public/v2/api/roles?startIndex={start_index}&pageSize={page_size}",
                ok=(200,),
            ) or []
            roles.extend(page)
            if len(page) < page_size:
                break
            start_index += page_size
        return roles


    def exception_role_name(base_role_name, username, expires_at):
        return f"exception-{base_role_name}-{username}-{expires_at.replace('-', '')}"


    def exception_role_description(base_role_name, exception):
        metadata = {
            "approvalRef": exception["approvalRef"],
            "reason": exception["reason"],
            "grantedBy": exception["grantedBy"],
            "expiresAt": exception["expiresAt"],
            "platformRole": exception["platformRole"],
            "username": exception["username"],
        }
        return (
            f"Temporary additive exception role nested into {base_role_name}. "
            f"EXCEPTION_METADATA={json.dumps(metadata, sort_keys=True, separators=(',', ':'))}"
        )


    def get_role(service_name, role_name):
        del service_name
        for role in list_roles():
            if str(role.get("name", "")) == str(role_name):
                return role
        return None


    def upsert_role(service_name, role, existing=None):
        payload = {
            "name": role["name"],
            "description": role.get("description", ""),
            "isEnabled": True,
            "users": normalize_role_members(role.get("users", [])),
            "groups": normalize_role_members(role.get("groups", [])),
            "roles": normalize_role_members(role.get("roles", [])),
        }
        existing = existing or get_role(service_name, role["name"])
        if existing:
            payload["id"] = existing["id"]
            payload["guid"] = existing.get("guid")
            payload["version"] = existing.get("version")
            payload["createdByUser"] = existing.get("createdByUser")
            request("PUT", role_update_path(existing["id"]), payload, ok=(200,))
        else:
            request("POST", role_create_path(service_name), payload, ok=(200, 201))


    def build_platform_roles(config):
        result = []
        for role_key in sorted(config.get("platformRoles", {})):
            raw_role = config["platformRoles"][role_key] or {}
            members = raw_role.get("members", {}) or {}
            ranger_cfg = raw_role.get("ranger", {}) or {}
            result.append(
                {
                    "key": role_key,
                    "name": ranger_cfg.get("roleName") or role_key,
                    "description": raw_role.get("description", "").strip(),
                    "users": normalize_names(members.get("users", [])),
                    "groups": normalize_names(members.get("directoryGroups", [])),
                    "nestedRoleKeys": normalize_names(members.get("nestedRoles", [])),
                }
            )
        return result


    def build_exception_roles(config, base_roles):
        base_roles_by_key = {role["key"]: role for role in base_roles}
        exception_roles = []
        for raw_exception in config.get("platformRoleExceptions", []):
            exception = raw_exception or {}
            base_role = base_roles_by_key.get(exception.get("platformRole"))
            if not base_role:
                continue
            role_name = exception_role_name(
                base_role["name"],
                exception["username"],
                exception["expiresAt"],
            )
            exception_roles.append(
                {
                    "name": role_name,
                    "description": exception_role_description(base_role["name"], exception),
                    "users": [exception["username"]],
                    "groups": [],
                    "roles": [],
                    "targetRoleKey": base_role["key"],
                }
            )
        return exception_roles


    def build_catalog_acl_policies(config):
        service_name = config["ranger"]["serviceName"]
        read_accesses = ["select", "show", "use", "execute"]
        write_accesses = read_accesses + ["insert", "create", "delete", "drop", "alter", "grant", "revoke"]
        policies = []

        if not config["ranger"].get("importCatalogAcls", False):
            return policies

        for catalog_name, catalog in config.get("catalogs", {}).items():
            groups_acl = catalog.get("authorizedGroups", {}) or {}
            users_acl = catalog.get("authorizedUsers", {}) or {}
            read_item = access_item(users_acl.get("read", []), groups_acl.get("read", []), [], read_accesses)
            write_item = access_item(users_acl.get("write", []), groups_acl.get("write", []), [], write_accesses)

            if read_item:
                policies.append(
                    normalize_policy(
                        {
                            "name": f"{service_name}-{catalog_name}-read",
                            "description": f"Imported read-only catalog policy for {catalog_name}.",
                            "resources": {
                                "catalog": catalog_name,
                                "schema": "*",
                                "table": "*",
                                "column": "*",
                            },
                            "policyItems": [read_item],
                        },
                        service_name,
                    )
                )
            if write_item:
                policies.append(
                    normalize_policy(
                        {
                            "name": f"{service_name}-{catalog_name}-write",
                            "description": f"Imported read-write catalog policy for {catalog_name}.",
                            "resources": {
                                "catalog": catalog_name,
                                "schema": "*",
                                "table": "*",
                                "column": "*",
                            },
                            "policyItems": [write_item],
                        },
                        service_name,
                    )
                )

        return policies


    def reconcile_roles(config):
        service_name = config["ranger"]["serviceName"]
        membership_source = str(config["ranger"].get("platformRoleMembershipSource", "git") or "git").lower()
        if membership_source not in {"git", "ranger"}:
            membership_source = "git"
        base_roles = build_platform_roles(config)
        base_roles_by_key = {role["key"]: role for role in base_roles}
        existing_roles_by_name = {
            str(role.get("name", "")): role
            for role in list_roles()
            if str(role.get("name", "")).strip()
        }

        for role in base_roles:
            existing = existing_roles_by_name.get(role["name"])
            effective_users = role["users"]
            effective_groups = role["groups"]
            if membership_source == "ranger" and existing:
                effective_users = existing.get("users", [])
                effective_groups = existing.get("groups", [])
            upsert_role(
                service_name,
                {
                    "name": role["name"],
                    "description": role["description"],
                    "users": effective_users,
                    "groups": effective_groups,
                    "roles": [],
                },
                existing=existing,
            )
            role["effectiveUsers"] = effective_users
            role["effectiveGroups"] = effective_groups
            print(f"Reconciled Ranger role: {role['name']}")

        exception_roles = build_exception_roles(config, base_roles)
        exception_names_by_target = {}
        for role in exception_roles:
            upsert_role(service_name, role)
            exception_names_by_target.setdefault(role["targetRoleKey"], []).append(role["name"])
            print(f"Reconciled Ranger exception role: {role['name']}")

        for role in base_roles:
            nested_role_names = [
                base_roles_by_key[nested_role_key]["name"]
                for nested_role_key in role.get("nestedRoleKeys", [])
                if nested_role_key in base_roles_by_key
            ]
            nested_role_names.extend(exception_names_by_target.get(role["key"], []))
            upsert_role(
                service_name,
                {
                    "name": role["name"],
                    "description": role["description"],
                    "users": role.get("effectiveUsers", role["users"]),
                    "groups": role.get("effectiveGroups", role["groups"]),
                    "roles": nested_role_names,
                },
            )


    def upsert_policy(service_name, policy):
        name = policy["name"]
        path = (
            "/service/public/v2/api/service/"
            + urllib.parse.quote(service_name, safe="")
            + "/policy/"
            + urllib.parse.quote(name, safe="")
        )
        try:
            existing = request("GET", path, ok=(200,))
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
            existing = None

        if existing:
            policy["id"] = existing["id"]
            policy["guid"] = existing.get("guid")
            request("PUT", path, policy, ok=(200,))
        else:
            request("POST", "/service/public/v2/api/policy/", policy, ok=(200, 201))


    def main():
        wait_for_ranger()
        config = load_config()
        service_name = config["ranger"]["serviceName"]
        upsert_service(config)
        reconcile_roles(config)

        policies = []
        policies.extend(build_catalog_acl_policies(config))
        for raw_policy in config["ranger"].get("bootstrapPolicies", []):
            policies.append(normalize_policy(raw_policy, service_name))

        for policy in policies:
            upsert_policy(service_name, policy)
            print(f"Reconciled Ranger policy: {policy['name']}")


    if __name__ == "__main__":
        main()
