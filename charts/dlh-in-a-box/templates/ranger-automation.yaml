    from ldap3 import BASE, SUBTREE, Connection, Server, Tls

    CONFIG_PATH = "/opt/ranger-automation/bootstrap-config.json"
    RANGER_URL = os.environ["RANGER_URL"].rstrip("/")
    RANGER_PASSWORD = os.environ["RANGER_ADMIN_PASSWORD"]
    LDAP_BIND_PASSWORD = os.environ["LDAP_BIND_PASSWORD"]


    def load_config():
        with open(CONFIG_PATH, "r", encoding="utf-8") as handle:
            return json.load(handle)


    def ranger_request(method, path, payload=None, ok=(200, 201), parse_json=True):
        url = f"{RANGER_URL}{path}"
        headers = {
            "Authorization": "Basic "
            + base64.b64encode(f"admin:{RANGER_PASSWORD}".encode("utf-8")).decode("ascii"),
            "Accept": "application/json",
        }
        body = None
        if payload is not None:
            body = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as response:
                data = response.read().decode("utf-8")
                if not parse_json:
                    return data
                return json.loads(data) if data else None
        except urllib.error.HTTPError as exc:
            if exc.code in ok:
                data = exc.read().decode("utf-8")
                if not parse_json:
                    return data
                return json.loads(data) if data else None
            raise


    def wait_for_ranger():
        deadline = time.time() + 600
        while time.time() < deadline:
            try:
                ranger_request("GET", "/login.jsp", ok=(200,), parse_json=False)
                return
            except Exception:
                time.sleep(5)
        raise RuntimeError("Timed out waiting for Ranger Admin")


    def attr_value(entry, name):
        try:
            return str(entry[name].value or "")
        except Exception:
            return ""


    def sync(config):
        ldap_cfg = config["ldap"]
        parsed = urllib.parse.urlparse(ldap_cfg["url"])
        use_ssl = parsed.scheme == "ldaps"
        host = parsed.hostname or ldap_cfg["url"]
        port = parsed.port or (636 if use_ssl else 389)
        tls = None
        if use_ssl:
            trusted_ca_path = ldap_cfg.get("trustedCaPath")
            if ldap_cfg.get("allowInsecure", False):
                tls = Tls(validate=ssl.CERT_NONE)
            elif trusted_ca_path and os.path.exists(trusted_ca_path):
                tls = Tls(validate=ssl.CERT_REQUIRED, ca_certs_file=trusted_ca_path)
            else:
                tls = Tls(validate=ssl.CERT_REQUIRED)
        server = Server(host, port=port, use_ssl=use_ssl, tls=tls, get_info=None)
        conn = Connection(server, user=ldap_cfg["bindDn"], password=LDAP_BIND_PASSWORD, auto_bind=True)
        conn.search(
            ldap_cfg["groupBaseDn"],
            ldap_cfg["groupSearchFilter"],
            search_scope=SUBTREE,
            attributes=[
                ldap_cfg["groupNameAttribute"],
                ldap_cfg["groupSearchMemberAttribute"],
            ],
        )

        groups = {}
        users = {}

        for group_entry in conn.entries:
            group_name = attr_value(group_entry, ldap_cfg["groupNameAttribute"])
            if not group_name:
                continue
            raw_members = []
            try:
                raw_members = list(group_entry[ldap_cfg["groupSearchMemberAttribute"]].values)
            except Exception:
                raw_members = []

            member_names = set()
            for member_dn in raw_members:
                member_dn = str(member_dn)
                if not member_dn:
                    continue
                if "=" in member_dn and "," in member_dn:
                    conn.search(
                        member_dn,
                        "(objectClass=*)",
                        search_scope=BASE,
                        attributes=[
                            ldap_cfg["usernameAttribute"],
                            ldap_cfg["firstNameAttribute"],
                            ldap_cfg["lastNameAttribute"],
                            ldap_cfg["emailAttribute"],
                        ],
                    )
                    if not conn.entries:
                        continue
                    user_entry = conn.entries[0]
                    username = attr_value(user_entry, ldap_cfg["usernameAttribute"])
                    if not username:
                        continue
                    member_names.add(username)
                    users[username] = {
                        "name": username,
                        "firstName": attr_value(user_entry, ldap_cfg["firstNameAttribute"]) or username,
                        "lastName": attr_value(user_entry, ldap_cfg["lastNameAttribute"]) or "User",
                        "emailAddress": attr_value(user_entry, ldap_cfg["emailAttribute"]) or "",
                        "status": 1,
                        "isVisible": 1,
                        "userSource": 1,
                        "userRoleList": ["ROLE_USER"],
                        "syncSource": "LDAP",
                    }
                else:
                    member_names.add(member_dn)
                    users.setdefault(
                        member_dn,
                        {
                            "name": member_dn,
                            "firstName": member_dn,
                            "lastName": "User",
                            "emailAddress": "",
                            "status": 1,
                            "isVisible": 1,
                            "userSource": 1,
                            "userRoleList": ["ROLE_USER"],
                            "syncSource": "LDAP",
                        },
                    )

            groups[group_name] = sorted(member_names)

        if users:
            ranger_request(
                "POST",
                "/service/xusers/ugsync/users",
                {"vXUsers": list(users.values())},
                ok=(200, 201),
            )

        if groups:
            ranger_request(
                "POST",
                "/service/xusers/ugsync/groups",
                {
                    "vXGroups": [
                        {
                            "name": group_name,
                            "description": "Synced from LDAP/AD",
                            "isVisible": 1,
                            "groupSource": 1,
                            "syncSource": "LDAP",
                        }
                        for group_name in sorted(groups)
                    ]
                },
                ok=(200, 201),
            )

        current = ranger_request("GET", "/service/xusers/ugsync/groupusers", ok=(200,)) or {}
        deltas = []
        for group_name, desired_members in groups.items():
            current_members = set(current.get(group_name, []))
            desired_members = set(desired_members)
            add_users = sorted(desired_members - current_members)
            del_users = sorted(current_members - desired_members)
            if add_users or del_users:
                deltas.append(
                    {
                        "groupName": group_name,
                        "addUsers": add_users,
                        "delUsers": del_users,
                    }
                )

        if deltas:
            ranger_request("POST", "/service/xusers/ugsync/groupusers", deltas, ok=(200, 201))


    def main():
        wait_for_ranger()
        sync(load_config())


    if __name__ == "__main__":
        main()
---
{{- if (dig "bootstrap" "enabled" true $ranger) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ranger-bootstrap
          image: "{{ $ranger.bootstrap.image.repository }}:{{ $ranger.bootstrap.image.tag }}"
          imagePullPolicy: {{ $ranger.bootstrap.image.pullPolicy }}
          command:
            - python
            - -u
            - /opt/ranger-automation/bootstrap.py
          env:
            - name: RANGER_URL
              value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ranger.admin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
          volumeMounts:
            - name: automation
              mountPath: /opt/ranger-automation
              readOnly: true
      volumes:
        - name: automation
          configMap:
            name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
            defaultMode: 0555
---
{{- end }}
{{- if (dig "usersync" "enabled" true $ranger) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-usersync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-usersync
spec:
  schedule: {{ default "*/15 * * * *" (dig "usersync" "schedule" "*/15 * * * *" $ranger) | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-usersync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ranger-usersync
              image: "{{ $ranger.usersync.image.repository }}:{{ $ranger.usersync.image.tag }}"
              imagePullPolicy: {{ $ranger.usersync.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  python -m pip install --no-cache-dir ldap3 >/tmp/ranger-usersync-pip.log
                  python /opt/ranger-automation/usersync.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
                - name: LDAP_BIND_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "dlh-in-a-box.identity.directory.bindSecretName" . }}
                      key: {{ include "dlh-in-a-box.identity.directory.bindSecretKey" . }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
                {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
                - name: ldap-trusted-ca
                  mountPath: /opt/ranger-automation/ldap-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
            {{- if and $ldapTrustedCaSecretName (not (default false $ldap.allowInsecure)) }}
            - name: ldap-trusted-ca
              secret:
                secretName: {{ $ldapTrustedCaSecretName }}
                items:
                  - key: {{ $ldapTrustedCaCertKey }}
                    path: {{ $ldapTrustedCaCertKey }}
            {{- end }}
{{- end }}
{{- if (default true $exceptionRoleAudit.enabled) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-exception-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-exception-audit
spec:
  schedule: {{ default "23 * * * *" $exceptionRoleAudit.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
            app.kubernetes.io/component: ranger-exception-audit
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ranger-exception-audit
              image: "{{ $ranger.bootstrap.image.repository }}:{{ $ranger.bootstrap.image.tag }}"
              imagePullPolicy: {{ $ranger.bootstrap.image.pullPolicy }}
              command:
                - python
                - -u
                - /opt/ranger-automation/exception_audit.py
              env:
                - name: RANGER_URL
                  value: {{ include "dlh-in-a-box.ranger.admin.url" . | quote }}
                - name: RANGER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $ranger.admin.existingSecret }}
                      key: {{ default "rangerAdminPassword" $ranger.admin.adminPasswordKey }}
              volumeMounts:
                - name: automation
                  mountPath: /opt/ranger-automation
                  readOnly: true
          volumes:
            - name: automation
              configMap:
                name: {{ include "dlh-in-a-box.ranger.admin.serviceName" . }}-automation
                defaultMode: 0555
{{- end }}
{{- end }}
