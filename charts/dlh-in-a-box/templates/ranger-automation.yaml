    def search_user_by_dn(conn, ldap_cfg, member_dn):
        conn.search(
            member_dn,
            "(objectClass=*)",
            search_scope=BASE,
            attributes=[
                ldap_cfg["usernameAttribute"],
                ldap_cfg["firstNameAttribute"],
                ldap_cfg["lastNameAttribute"],
                ldap_cfg["emailAttribute"],
            ],
        )
        if not conn.entries:
