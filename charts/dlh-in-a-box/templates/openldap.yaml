{{- if .Values.openldap.enabled }}
{{- $seed := .Values.openldap.seed | default dict -}}
{{- $baseDn := include "dlh-in-a-box.identity.directory.baseDn" . -}}
{{- $userBaseDn := include "dlh-in-a-box.identity.directory.userBaseDn" . -}}
{{- $groupBaseDn := include "dlh-in-a-box.identity.directory.groupBaseDn" . -}}
{{- $bindDn := include "dlh-in-a-box.identity.directory.bindDn" . -}}
{{- $seedSecretName := default "" $seed.existingSecret -}}
{{- $seedKey := default "bootstrap.ldif" $seed.ldifKey -}}
{{- if and (not $seedSecretName) (or (gt (len ($seed.users | default (list))) 0) (gt (len ($seed.groups | default (list))) 0)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dlh-in-a-box.openldap.serviceName" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
data:
  {{ $seedKey }}: |
    dn: {{ $userBaseDn }}
    objectClass: organizationalUnit
    ou: people

    dn: {{ $groupBaseDn }}
    objectClass: organizationalUnit
    ou: groups
{{- range $index, $user := ($seed.users | default (list)) }}

    dn: {{ printf "uid=%s,%s" $user.username $userBaseDn }}
    objectClass: inetOrgPerson
    objectClass: organizationalPerson
    objectClass: person
    objectClass: top
    uid: {{ $user.username }}
    cn: {{ default (printf "%s %s" (default $user.username $user.givenName) (default "User" $user.sn)) $user.cn }}
    sn: {{ default "User" $user.sn }}
    givenName: {{ default $user.username $user.givenName }}
    mail: {{ default (printf "%s@%s" $user.username (default "example.org" $seed.domain)) $user.mail }}
    userPassword: {{ default "change-me" $user.password }}
{{- end }}
{{- range $group := ($seed.groups | default (list)) }}
{{- $memberCount := 0 }}

    dn: {{ printf "cn=%s,%s" $group.name $groupBaseDn }}
    objectClass: groupOfNames
    objectClass: top
    cn: {{ $group.name }}
{{- range $member := ($group.members | default (list)) }}
    member: {{ printf "uid=%s,%s" $member $userBaseDn }}
{{- $memberCount = add1 $memberCount }}
{{- end }}
{{- range $user := ($seed.users | default (list)) }}
{{- if has $group.name ($user.groups | default (list)) }}
    member: {{ printf "uid=%s,%s" $user.username $userBaseDn }}
{{- $memberCount = add1 $memberCount }}
{{- end }}
{{- end }}
{{- if eq $memberCount 0 }}
    member: {{ $bindDn }}
{{- end }}
{{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlh-in-a-box.openldap.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
    app.kubernetes.io/component: openldap
  ports:
    - name: ldap
      port: {{ default 389 .Values.openldap.service.port }}
      targetPort: ldap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlh-in-a-box.openldap.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
      app.kubernetes.io/component: openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: openldap
    spec:
      containers:
        - name: openldap
          image: "{{ .Values.openldap.image.repository }}:{{ .Values.openldap.image.tag }}"
          imagePullPolicy: {{ .Values.openldap.image.pullPolicy }}
          env:
            - name: LDAP_ORGANISATION
              value: {{ default "Example" $seed.organization | quote }}
            - name: LDAP_DOMAIN
              value: {{ default "example.org" $seed.domain | quote }}
            - name: LDAP_BASE_DN
              value: {{ $baseDn | quote }}
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openldap.auth.existingSecret }}
                  key: {{ default "adminPassword" .Values.openldap.auth.adminPasswordKey }}
            - name: LDAP_TLS
              value: "false"
          ports:
            - name: ldap
              containerPort: 389
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            {{- if $seedSecretName }}
            - name: bootstrap-ldif
              mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom/{{ $seedKey }}
              subPath: {{ $seedKey }}
              readOnly: true
            {{- else if or (gt (len ($seed.users | default (list))) 0) (gt (len ($seed.groups | default (list))) 0) }}
            - name: bootstrap-ldif
              mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom/{{ $seedKey }}
              subPath: {{ $seedKey }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if $seedSecretName }}
        - name: bootstrap-ldif
          secret:
            secretName: {{ $seedSecretName }}
        {{- else if or (gt (len ($seed.users | default (list))) 0) (gt (len ($seed.groups | default (list))) 0) }}
        - name: bootstrap-ldif
          configMap:
            name: {{ include "dlh-in-a-box.openldap.serviceName" . }}-bootstrap
        {{- end }}
{{- end }}
