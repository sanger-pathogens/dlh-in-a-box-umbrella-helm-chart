{{- $sharedPostgresql := .Values.sharedPostgresql | default dict -}}
{{- $external := get $sharedPostgresql "external" | default dict -}}
{{- $provisioning := get $sharedPostgresql "provisioning" | default dict -}}
{{- $provisioningDatabases := get $provisioning "databases" | default dict -}}
{{- $provisioningDatabaseList := get $provisioning "database-list" | default list -}}
{{- $global := .Values.global | default dict -}}
{{- $catalogs := get $global "dataCatalogs" | default dict -}}
{{- $hiveExternalDatabase := get (get .Values "hive" | default dict) "externalDatabase" | default dict -}}
{{- $hiveMetastoreProvisioning := get $provisioningDatabases "hiveMetastore" | default dict -}}
{{- $hiveMetastoreEnabled := default false (get $hiveMetastoreProvisioning "enabled") -}}
{{- /* hiveMetastore is handled by its own dedicated blocks below (one database
per dataCatalogs entry, sharing hive.externalDatabase.* as the owner identity)
rather than the generic single-database-per-name loops, so it's excluded here. */ -}}
{{- $genericProvisioningDatabases := omit $provisioningDatabases "hiveMetastore" -}}

{{- if and $sharedPostgresql.enabled (default true $provisioning.enabled) -}}
{{- $image := $provisioning.image | default dict -}}
{{- $adminSecret := $provisioning.adminSecret | default dict -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-shared-postgresql-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-postgresql-provisioner
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Must run before any hook that expects per-app database roles/passwords
    # to already exist, including hooks from vendored subcharts (e.g. the
    # Superset chart's init-db Job) that carry no explicit hook-weight and
    # therefore default to weight 0. A negative weight here guarantees this
    # job always runs first regardless of what other charts add later.
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ default 6 $provisioning.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "dlh-in-a-box.labels" . | nindent 8 }}
        app.kubernetes.io/component: shared-postgresql-provisioner
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: "{{ default "docker.io" $image.registry }}/{{ default "postgres" $image.repository }}:{{ default "15" $image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -euo pipefail

              export PGHOST="${PGHOST}"
              export PGPORT="${PGPORT}"
              export PGUSER="${PGUSER}"
              export PGPASSWORD="${PGPASSWORD}"

              until pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"; do
                echo "Waiting for shared PostgreSQL at ${PGHOST}:${PGPORT}..."
                sleep 2
              done

              provision_database() {
                local app="$1"
                local db="$2"
                local owner="$3"
                local password_env="$4"
                local app_password="${!password_env}"
                local role_exists
                local database_exists

                echo "Provisioning ${app}: database=${db}, owner=${owner}"

                if [ "${owner}" = "${PGUSER}" ]; then
                  echo "Owner ${owner} is the connecting user; skipping role and ownership management."
                else
                  role_exists="$(printf '%s\n' "SELECT 1 FROM pg_roles WHERE rolname = :'owner';" | psql --dbname=postgres --tuples-only --no-align --set=owner="${owner}")"
                  if [ "${role_exists}" != "1" ]; then
                    printf '%s\n' "CREATE ROLE :\"owner\" LOGIN PASSWORD :'app_password';" | psql --dbname=postgres --set=ON_ERROR_STOP=1 --set=owner="${owner}" --set=app_password="${app_password}"
                  else
                    printf '%s\n' "ALTER ROLE :\"owner\" LOGIN PASSWORD :'app_password';" | psql --dbname=postgres --set=ON_ERROR_STOP=1 --set=owner="${owner}" --set=app_password="${app_password}"
                  fi
                fi

                database_exists="$(printf '%s\n' "SELECT 1 FROM pg_database WHERE datname = :'db';" | psql --dbname=postgres --tuples-only --no-align --set=db="${db}")"
                if [ "${database_exists}" != "1" ]; then
                  printf '%s\n' "CREATE DATABASE :\"db\" OWNER :\"owner\";" | psql --dbname=postgres --set=ON_ERROR_STOP=1 --set=db="${db}" --set=owner="${owner}"
                fi

                if [ "${owner}" != "${PGUSER}" ]; then
                  printf '%s\n' \
                    "ALTER DATABASE :\"db\" OWNER TO :\"owner\";" \
                    "GRANT ALL PRIVILEGES ON DATABASE :\"db\" TO :\"owner\";" |
                    psql --dbname=postgres --set=ON_ERROR_STOP=1 --set=db="${db}" --set=owner="${owner}"

                  printf '%s\n' \
                    "GRANT ALL ON SCHEMA public TO :\"owner\";" \
                    "ALTER SCHEMA public OWNER TO :\"owner\";" \
                    "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO :\"owner\";" \
                    "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO :\"owner\";" \
                    "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO :\"owner\";" |
                    psql --dbname="${db}" --set=ON_ERROR_STOP=1 --set=owner="${owner}"
                fi
              }

{{- range $name, $database := $genericProvisioningDatabases }}
              provision_database {{ $name | quote }} {{ $database.database | quote }} {{ $database.username | quote }} "APP_{{ $name | replace "-" "_" | upper }}_PASSWORD"
{{- end }}
{{- range $database := $provisioningDatabaseList }}
              provision_database {{ $database.name | quote }} {{ $database.database | quote }} {{ $database.username | quote }} "APP_{{ $database.name | replace "-" "_" | upper }}_PASSWORD"
{{- end }}
{{- if $hiveMetastoreEnabled }}
{{- range $catalogName, $catalog := $catalogs }}
              provision_database {{ printf "hive-%s" $catalogName | quote }} {{ $catalogName | quote }} {{ $hiveExternalDatabase.user | quote }} "APP_HIVE_METASTORE_PASSWORD"
{{- end }}
{{- end }}
          env:
            - name: PGHOST
              value: {{ include "dlh-in-a-box.sharedPostgresql.serviceName" . | quote }}
            - name: PGPORT
              value: {{ include "dlh-in-a-box.sharedPostgresql.port" . | quote }}
            - name: PGUSER
              value: {{ if default false $external.enabled }}{{ default "postgres" $external.username | quote }}{{ else }}postgres{{ end }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if default false $external.enabled }}
                  name: {{ $external.existingSecret | quote }}
                  key: {{ default "postgres-password" $external.passwordKey | quote }}
                  {{- else }}
                  name: {{ default $adminSecret.name $adminSecret.name | quote }}
                  key: {{ default "postgres-password" $adminSecret.passwordKey | quote }}
                  {{- end }}
{{- range $name, $database := $genericProvisioningDatabases }}
            - name: APP_{{ $name | replace "-" "_" | upper }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if and (get (get $database "password" | default dict) "existingSecret") (ne (get (get $database "password" | default dict) "existingSecret") "") -}}{{ (get (get $database "password" | default dict) "existingSecret") | quote }}{{- else -}}{{ default (printf "dlh-%s-postgresql" $name) (get $database "secretName") | quote }}{{- end }}
                  key: {{ default "password" (get (get $database "password" | default dict) "key") | quote }}
{{- end }}
{{- range $database := $provisioningDatabaseList }}
            - name: APP_{{ $database.name | replace "-" "_" | upper }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $database.secretName | quote }}
                  key: {{ default "password" $database.passwordKey | quote }}
{{- end }}
{{- if $hiveMetastoreEnabled }}
            - name: APP_HIVE_METASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $hiveExternalDatabase.existingSecret | quote }}
                  key: password
{{- end }}
{{- end -}}
