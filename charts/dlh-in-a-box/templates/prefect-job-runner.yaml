{{- $prefect := .Values.prefect | default dict -}}
{{- $jobRunner := get $prefect "jobRunner" | default dict -}}
{{- if and (default false (get $prefect "enabled")) (default false (get $jobRunner "enabled")) -}}
{{- $serviceAccount := get $jobRunner "serviceAccount" | default dict -}}
{{- $pullSecret := get $jobRunner "pullSecret" | default dict -}}
{{- $serviceAccountName := default "prefect-job-runner" (get $serviceAccount "name") -}}
{{- $pullSecretName := default "prefect-job-runner-registry" (get $pullSecret "name") -}}
{{- $pullSecretCreate := default false (get $pullSecret "create") -}}
{{- if $pullSecretCreate }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pullSecretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: prefect-job-runner
    {{- with (get $pullSecret "labels") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (get $pullSecret "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: kubernetes.io/dockerconfigjson
stringData:
  {{- $server := default "ghcr.io" (get $pullSecret "server") -}}
  {{- $username := required "prefect.jobRunner.pullSecret.username is required when prefect.jobRunner.pullSecret.create=true." (get $pullSecret "username") -}}
  {{- $password := required "prefect.jobRunner.pullSecret.password is required when prefect.jobRunner.pullSecret.create=true." (get $pullSecret "password") -}}
  {{- $auth := printf "%s:%s" $username $password | b64enc -}}
  {{- $entry := dict "username" $username "password" $password "auth" $auth -}}
  .dockerconfigjson: {{ dict "auths" (dict $server $entry) | toJson | quote }}
{{- end }}
{{- $serviceAccountCreate := true -}}
{{- if hasKey $serviceAccount "create" -}}
{{- $serviceAccountCreate = get $serviceAccount "create" -}}
{{- end -}}
{{- if $serviceAccountCreate }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: prefect-job-runner
    {{- with (get $serviceAccount "labels") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (get $serviceAccount "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ default false (get $serviceAccount "automountServiceAccountToken") }}
{{- $imagePullSecrets := list -}}
{{- if $pullSecretCreate -}}
{{- $imagePullSecrets = append $imagePullSecrets (dict "name" $pullSecretName) -}}
{{- end -}}
{{- range (default list (get $serviceAccount "imagePullSecrets")) -}}
{{- if kindIs "string" . -}}
{{- $imagePullSecrets = append $imagePullSecrets (dict "name" .) -}}
{{- else -}}
{{- $imagePullSecrets = append $imagePullSecrets . -}}
{{- end -}}
{{- end -}}
{{- if $imagePullSecrets }}
imagePullSecrets:
  {{- toYaml $imagePullSecrets | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
