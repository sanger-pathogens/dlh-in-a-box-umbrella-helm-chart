{{- $global := .Values.global | default dict -}}
{{- $hasEnvironment := hasKey $global "environment" -}}
{{- $environment := default "" $global.environment -}}
{{- $catalogs := $global.dataCatalogs | default dict -}}

{{- if and (gt (len $catalogs) 0) (or (not $hasEnvironment) (not (has $environment (list "local" "dev" "prod")))) -}}
  {{- fail "global.environment must be set to local, dev, or prod when global.dataCatalogs is not empty." -}}
{{- end -}}

{{- if and (gt (len $catalogs) 0) (ne $environment "local") -}}
  {{- range $catalogName, $catalog := $catalogs -}}
    {{- if hasKey $catalog "authorizedGroups" -}}
      {{- fail (printf "global.dataCatalogs.%s.authorizedGroups is no longer supported. Use authorizedRoles or explicit Ranger bootstrap policies with Ranger role names." $catalogName) -}}
    {{- end -}}
    {{- if hasKey $catalog "authorizedUsers" -}}
      {{- fail (printf "global.dataCatalogs.%s.authorizedUsers is no longer supported. Grant catalog access to Ranger roles only, via authorizedRoles or explicit Ranger bootstrap policies with Ranger role names." $catalogName) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
