{{- $sharedPostgresql := .Values.sharedPostgresql | default dict -}}
{{- $external := get $sharedPostgresql "external" | default dict -}}
{{- $bundled := get $sharedPostgresql "bundled" | default dict -}}
{{- $externalEnabled := default false (get $external "enabled") -}}
{{- $bundledEnabled := default false (get $bundled "enabled") -}}
{{- if and $bundledEnabled $externalEnabled -}}
{{- fail "sharedPostgresql.bundled.enabled and sharedPostgresql.external.enabled are mutually exclusive: pick one data plane." -}}
{{- end -}}
{{- if and $sharedPostgresql.enabled (not (or $bundledEnabled $externalEnabled)) -}}
{{- fail "sharedPostgresql.enabled=true requires picking a data plane: set sharedPostgresql.bundled.enabled=true or sharedPostgresql.external.enabled=true." -}}
{{- end -}}
{{- if and (or $bundledEnabled $externalEnabled) (not $sharedPostgresql.enabled) -}}
{{- fail "sharedPostgresql.bundled.enabled or sharedPostgresql.external.enabled is set without sharedPostgresql.enabled=true, so nothing will actually deploy." -}}
{{- end -}}
{{- if $externalEnabled -}}
{{- if empty (get $external "host") -}}
{{- fail "sharedPostgresql.external.host is required when sharedPostgresql.external.enabled=true." -}}
{{- end -}}
{{- if empty (get $external "existingSecret") -}}
{{- fail "sharedPostgresql.external.existingSecret is required when sharedPostgresql.external.enabled=true." -}}
{{- end -}}
{{- end -}}
{{- if $sharedPostgresql.enabled -}}
{{- $provisioning := get $sharedPostgresql "provisioning" | default dict -}}
{{- $provisioningDatabases := get $provisioning "databases" | default dict -}}
{{- $provisioningDatabaseList := get $provisioning "database-list" | default list -}}

{{- if not (kindIs "map" $provisioningDatabases) -}}
  {{- fail "sharedPostgresql.provisioning.databases must be a map/object." -}}
{{- end -}}
{{- if not (kindIs "slice" $provisioningDatabaseList) -}}
  {{- fail "sharedPostgresql.provisioning.database-list must be a list/array." -}}
{{- end -}}

{{- $prefectDb := get $provisioningDatabases "prefect" | default dict -}}
{{- if empty $prefectDb -}}
  {{- fail "sharedPostgresql.provisioning.databases.prefect is required when prefectServer.postgresql.enabled=false." -}}
{{- end -}}

{{- $prefectDbEnabled := true -}}
{{- if hasKey $prefectDb "enabled" -}}
  {{- $prefectDbEnabled = $prefectDb.enabled -}}
{{- end -}}
{{- if not $prefectDbEnabled -}}
  {{- fail "sharedPostgresql.provisioning.databases.prefect.enabled must be true when prefectServer.postgresql.enabled=false." -}}
{{- end -}}

{{- $prefectConnectionSecretCreate := true -}}
{{- $prefectConnectionSecretName := "dlh-prefect-postgresql-connection" -}}
{{- if hasKey $prefectDb "connectionSecret" -}}
  {{- $prefectConnectionSecret := get $prefectDb "connectionSecret" | default dict -}}
  {{- if hasKey $prefectConnectionSecret "create" -}}
    {{- $prefectConnectionSecretCreate = $prefectConnectionSecret.create -}}
  {{- end -}}
  {{- if hasKey $prefectConnectionSecret "name" -}}
    {{- $prefectConnectionSecretName = $prefectConnectionSecret.name -}}
  {{- end -}}
{{- end -}}

{{- $prefectServer := get .Values "prefectServer" | default dict -}}
{{- $prefectServerSecret := get $prefectServer "secret" | default dict -}}
{{- $prefectServerSecretCreate := true -}}
{{- if hasKey $prefectServerSecret "create" -}}
  {{- $prefectServerSecretCreate = $prefectServerSecret.create -}}
{{- end -}}
{{- if and $prefectConnectionSecretCreate $prefectServerSecretCreate -}}
  {{- fail "sharedPostgresql.provisioning.databases.prefect.connectionSecret.create=true requires prefectServer.secret.create=false so Helm does not render the same Secret twice." -}}
{{- end -}}
{{- if and $prefectConnectionSecretCreate (empty $prefectConnectionSecretName) -}}
  {{- fail "sharedPostgresql.provisioning.databases.prefect.connectionSecret.name is required when connectionSecret.create=true." -}}
{{- end -}}

{{- $migration := get $sharedPostgresql "migration" | default dict -}}
{{- $allowBundledPostgresql := default false (get $migration "allowBundledPostgresql") -}}
{{- $keycloakValues := get .Values "keycloak" | default dict -}}
{{- $prefectServerValues := get .Values "prefectServer" | default dict -}}
{{- $supersetValues := get .Values "superset" | default dict -}}
{{- $keycloakPostgresql := get $keycloakValues "postgresql" | default dict -}}
{{- $prefectPostgresql := get $prefectServerValues "postgresql" | default dict -}}
{{- $supersetPostgresql := get $supersetValues "postgresql" | default dict -}}
{{- $rangerPostgresql := get .Values "rangerPostgresql" | default dict -}}
{{- $hivePostgresql := get .Values "hivePostgresql" | default dict -}}
{{- $keycloakPostgresqlEnabled := true -}}
{{- $prefectPostgresqlEnabled := true -}}
{{- $supersetPostgresqlEnabled := true -}}
{{- if hasKey $keycloakPostgresql "enabled" -}}
  {{- $keycloakPostgresqlEnabled = $keycloakPostgresql.enabled -}}
{{- end -}}
{{- if hasKey $prefectPostgresql "enabled" -}}
  {{- $prefectPostgresqlEnabled = $prefectPostgresql.enabled -}}
{{- end -}}
{{- if hasKey $supersetPostgresql "enabled" -}}
  {{- $supersetPostgresqlEnabled = $supersetPostgresql.enabled -}}
{{- end -}}
{{- if and $keycloakPostgresqlEnabled (not $allowBundledPostgresql) -}}
  {{- fail "a shared PostgreSQL instance is active, which requires keycloak.postgresql.enabled=false." -}}
{{- end -}}
{{- if and $prefectPostgresqlEnabled (not $allowBundledPostgresql) -}}
  {{- fail "a shared PostgreSQL instance is active, which requires prefectServer.postgresql.enabled=false." -}}
{{- end -}}
{{- if and $supersetPostgresqlEnabled (not $allowBundledPostgresql) -}}
  {{- fail "a shared PostgreSQL instance is active, which requires superset.postgresql.enabled=false." -}}
{{- end -}}
{{- if and (default false (get $rangerPostgresql "enabled")) (not $allowBundledPostgresql) -}}
  {{- fail "a shared PostgreSQL instance is active, which requires rangerPostgresql.enabled=false." -}}
{{- end -}}
{{- if and (default false (get $hivePostgresql "enabled")) (not $allowBundledPostgresql) -}}
  {{- fail "a shared PostgreSQL instance is active, which requires hivePostgresql.enabled=false." -}}
{{- end -}}
{{- end -}}
