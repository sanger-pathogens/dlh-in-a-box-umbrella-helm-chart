{{- $prefect := .Values.prefect | default dict -}}
{{- $extPg := get $prefect "externalPostgresql" | default dict -}}
{{- if and (default false (get $prefect "enabled")) (default false (get $extPg "enabled")) -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prefect-init-database
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: prefect-init-database
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "dlh-in-a-box.labels" . | nindent 8 }}
        app.kubernetes.io/component: prefect-init-database
    spec:
      restartPolicy: Never
      containers:
        - name: create-database
          image: postgres:15
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Checking if database '{{ $extPg.database }}' exists..."
              if ! PGPASSWORD="$POSTGRES_PASSWORD" psql \
                  -h "$POSTGRES_HOST" \
                  -U "$POSTGRES_USER" \
                  -p "$POSTGRES_PORT" \
                  -d postgres \
                  -tAc "SELECT 1 FROM pg_database WHERE datname='{{ $extPg.database }}';" | grep -q 1; then
                echo "Creating database '{{ $extPg.database }}'..."
                PGPASSWORD="$POSTGRES_PASSWORD" psql \
                  -h "$POSTGRES_HOST" \
                  -U "$POSTGRES_USER" \
                  -p "$POSTGRES_PORT" \
                  -d postgres \
                  -c "CREATE DATABASE \"{{ $extPg.database }}\""
              else
                echo "Database '{{ $extPg.database }}' already exists."
              fi
          env:
            - name: POSTGRES_USER
              value: {{ $extPg.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $extPg.existingSecret | quote }}
                  key: {{ $extPg.passwordKey | quote }}
            - name: POSTGRES_HOST
              value: {{ $extPg.host | quote }}
            - name: POSTGRES_PORT
              value: {{ $extPg.port | quote }}
{{- end -}}