{{- $authorization := .Values.global.authorization | default dict -}}
{{- $ranger := get $authorization "ranger" | default dict -}}
{{- $identity := get .Values.global "identity" | default dict -}}
{{- $external := get $identity "external" | default dict -}}
{{- $clients := get $external "clients" | default dict -}}
{{- $rangerProxy := get $clients "rangerProxy" | default dict -}}
{{- if and (default false $ranger.enabled) (default false $rangerProxy.enabled) }}
{{- $serviceName := include "dlh-in-a-box.ranger.browserProxy.serviceName" . -}}
{{- $rangerAdmin := get $ranger "admin" | default dict -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-browser-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
    app.kubernetes.io/component: ranger-browser-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlh-in-a-box.labels" . | nindent 4 }}
    app.kubernetes.io/component: ranger-browser-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
      app.kubernetes.io/component: ranger-browser-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "dlh-in-a-box.name" . }}
        app.kubernetes.io/component: ranger-browser-proxy
    spec:
      containers:
        - name: ranger-browser-proxy
          image: docker.io/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              basic_auth="$(printf '%s:%s' "${RANGER_ADMIN_USERNAME}" "${RANGER_ADMIN_PASSWORD}" | base64 | tr -d '\n')"
              cat >/etc/nginx/conf.d/default.conf <<EOF
              server {
                listen 8080;
                server_name _;
                client_max_body_size 16m;
                proxy_buffer_size 16k;
                proxy_buffers 8 32k;
                proxy_busy_buffers_size 64k;
                proxy_connect_timeout 10s;
                proxy_send_timeout 180s;
                proxy_read_timeout 180s;
                send_timeout 180s;

                location = /healthz {
                  access_log off;
                  return 200;
                }

                location = /readyz {
                  access_log off;
                  proxy_pass {{ include "dlh-in-a-box.ranger.admin.browserUrl" . }}/login.jsp;
                  proxy_http_version 1.1;
                  proxy_set_header Host {{ include "dlh-in-a-box.ranger.admin.browserServiceName" . | quote }};
                  proxy_set_header Authorization "Basic ${basic_auth}";
                  proxy_set_header Connection "";
                }

                location / {
                  proxy_pass {{ include "dlh-in-a-box.ranger.admin.browserUrl" . }};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header Authorization "Basic ${basic_auth}";
                  proxy_set_header Connection "";
                }
              }
              EOF
              exec nginx -g 'daemon off;'
          env:
            - name: RANGER_ADMIN_USERNAME
              value: "admin"
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "dlh-ranger-admin" $rangerAdmin.existingSecret }}
                  key: {{ default "rangerAdminPassword" $rangerAdmin.adminPasswordKey }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
{{- end }}
