      {{- $secretKey := .Values.global.identity.external.clients.rangerProxy.cookieSecretKey -}}
      {{- with (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
      {{- index .data $secretKey | b64dec -}}
      {{- end -}}
    configFile: |-
      provider = "keycloak-oidc"
      oidc_issuer_url = "{{ include "dlh-in-a-box.identity.issuer" $ }}"
      skip_oidc_discovery = true
      login_url = "{{ include "dlh-in-a-box.identity.authorizeUrl" $ }}"
      redeem_url = "{{ include "dlh-in-a-box.identity.internalAccessTokenUrl" $ }}"
      oidc_jwks_url = "{{ include "dlh-in-a-box.identity.internalJwksUri" $ }}"
      profile_url = "{{ include "dlh-in-a-box.identity.internalUserInfoUrl" $ }}"
      scope = "{{ join " " .Values.global.identity.external.oidc.scopes }}"
      email_domains = [{{- range $index, $domain := .Values.global.identity.external.clients.rangerProxy.emailDomains }}{{ if $index }}, {{ end }}{{ $domain | quote }}{{- end }}]
      allowed_roles = [{{ printf "%s:access" .Values.global.identity.external.clients.rangerProxy.clientId | quote }}]
      oidc_groups_claim = "{{ .Values.global.identity.external.oidc.groupsClaim }}"
      redirect_url = "{{ .Values.global.identity.external.clients.rangerProxy.redirectUrl }}"
      approval_prompt = "auto"
      skip_provider_button = true
      cookie_secure = {{ hasPrefix "https://" .Values.global.identity.external.clients.rangerProxy.redirectUrl }}
