global:
  nameOverride: ""
  fullnameOverride: ""
  domain: ""
  environment: ""
  imagePullSecrets: []
  storage:
    backend: externalS3
    existingSecret: ""
    s3:
      endpoint: ""
      region: ""
      bucket: ""
      pathStyleAccess: true
      accessKey: ""
      secretKey: ""
      accessKeyKey: accessKey
      secretKeyKey: secretKey

  # Data catalogs configuration (used to generate Hive metastores and Trino catalogs)
  dataCatalogs:
    default:
      type: deltaLake  # deltaLake or hive
      authorizedUsers:
        read: []
        write: []

trino:
  enabled: true
  accessControl:
    type: configmap

prefect:
  enabled: true
  server:
    enabled: true
  workers:
    enabled: true
    replicaCount: 1
    workPool: kubernetes-pool
    workQueue: default
    resources: {}

# Upstream Prefect chart values can be passed directly via these aliases.
prefectServer:
  postgresql:
    enabled: true

prefectWorker:
  worker:
    apiConfig: selfHostedServer
    config:
      workPool: kubernetes-pool
    selfHostedServerApiConfig:
      apiUrl: http://prefect-server:4200/api

sparkOperator:
  enabled: true
  nameOverride: spark-operator

minio:
  enabled: false

datahub:
  enabled: false

# Upstream DataHub chart values
datahubUpstream:
  mysql:
    enabled: true

hive:
  enabled: false
  metastore:
    image:
      registry: ""
      repository: ""
      tag: ""
  schemainit:
    image:
      registry: ""
      repository: ""
      tag: ""
    job:
      enabled: false
  postgres:
    host: ""
    port: "5432"
    username: ""
    password: ""
    existingSecret: ""
  s3:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    pathStyleAccess: true
    existingSecret: ""
  warehouseDir: ""
  ingress:
    enabled: false
    className: ""
    tlsSecretName: ""
  dataCatalogs:
    default:
      type: deltaLake
      authorizedUsers:
        read: []
        write: []

vault:
  enabled: true

postgresql:
  nameOverride: hive-postgresql
