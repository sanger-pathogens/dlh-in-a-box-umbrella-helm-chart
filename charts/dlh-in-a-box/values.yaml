      skip_oidc_discovery = true
      login_url = "{{ include "dlh-in-a-box.identity.authorizeUrl" $ }}"
      redeem_url = "{{ include "dlh-in-a-box.identity.internalAccessTokenUrl" $ }}"
      oidc_jwks_url = "{{ include "dlh-in-a-box.identity.internalJwksUri" $ }}"
      profile_url = "{{ include "dlh-in-a-box.identity.internalUserInfoUrl" $ }}"
      scope = "{{ join " " .Values.global.identity.external.oidc.scopes }}"
      email_domains = [{{- range $index, $domain := .Values.global.identity.external.clients.prefectProxy.emailDomains }}{{ if $index }}, {{ end }}{{ $domain | quote }}{{- end }}]
      allowed_groups = [{{- range $index, $group := .Values.global.identity.external.clients.prefectProxy.allowedGroups }}{{ if $index }}, {{ end }}{{ $group | quote }}{{- end }}]
      oidc_groups_claim = "{{ .Values.global.identity.external.oidc.groupsClaim }}"
      redirect_url = "{{ .Values.global.identity.external.clients.prefectProxy.redirectUrl }}"
      skip_provider_button = true
      cookie_secure = {{ hasPrefix "https://" .Values.global.identity.external.clients.prefectProxy.redirectUrl }}
