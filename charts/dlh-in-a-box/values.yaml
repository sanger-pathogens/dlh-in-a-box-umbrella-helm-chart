global:
  nameOverride: ""
  fullnameOverride: ""
  domain: ""
  environment: ""
  imagePullSecrets: []
  storage:
    backend: externalS3
    existingSecret: ""
    s3:
      endpoint: ""
      region: ""
      bucket: ""
      pathStyleAccess: true
      accessKeyKey: accessKey
      secretKeyKey: secretKey

# Data catalogs configuration
dataCatalogs:
  default:
    type: deltaLake  # deltaLake or hive
    authorizedUsers:
      read: []
      write: []

trino:
  enabled: true

prefect:
  enabled: true
  server:
    enabled: true
  workers:
    enabled: true
    replicaCount: 1
    workPool: kubernetes-pool
    workQueue: default
    resources: {}

# Upstream Prefect chart values can be passed directly via these aliases.
prefectServer:
  postgresql:
    enabled: true

prefectWorker:
  worker:
    apiConfig: server

sparkOperator:
  enabled: true

minio:
  enabled: false

datahub:
  enabled: false

# Upstream DataHub chart values
datahubUpstream:
  mysql:
    enabled: true

hive:
  enabled: false
  metastore:
    image:
      registry: ""
      repository: ""
      tag: ""
  schemainit:
    image:
      registry: ""
      repository: ""
      tag: ""
  postgres:
    host: ""
    port: "5432"
    username: ""
    password: ""
    existingSecret: ""
  s3:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    existingSecret: ""
  warehouseDir: ""
  dataCatalogs:
    default:
      type: deltaLake
      authorizedUsers:
        read: []
        write: []

vault:
  enabled: true
