superset:
  enabled: false
  auth:
    roleMappings:
      Gamma:
        - platform-app-superset
      Alpha: []
      Admin:
        - platform-role-data-engineer
  image:
    repository: apache/superset
  bootstrapScript: |
    #!/bin/bash
    set -eu
    if [ ! -f ~/bootstrap ]; then
      if command -v uv >/dev/null 2>&1; then
        UV_CACHE_DIR=/tmp/uv-cache uv pip install --python /app/.venv/bin/python psycopg2-binary==2.9.11 Authlib==1.6.1
      else
        /app/.venv/bin/python -m ensurepip --upgrade
        /app/.venv/bin/python -m pip install psycopg2-binary==2.9.11 Authlib==1.6.1
      fi
      /app/.venv/bin/python -c "import psycopg2"
      /app/.venv/bin/python -c "import authlib"
      echo "Installed Superset runtime extras" > ~/bootstrap
    fi
  # Superset chart 0.15.x still references Bitnami image tags that have moved.
  # Default to the legacy repository names so the optional bundled PostgreSQL
  # and Redis subcharts remain installable.
  postgresql:
    # Give the bundled Superset metadata database its own chart name so the
    # generated Service selectors do not collide with other PostgreSQL
    # dependencies in the same umbrella release.
    nameOverride: superset-postgresql
    image:
      repository: bitnamilegacy/postgresql
  redis:
    # Give the bundled Superset Redis dependency its own chart name so the
    # generated Service selectors do not collide with other Redis
    # dependencies in the same umbrella release.
    nameOverride: superset-redis
    image:
      repository: bitnamilegacy/redis
  configOverrides:
    enable_oauth: |
      {{- if .Values.global.identity.external.clients.superset.enabled }}
      import os
      import jwt
      from flask_appbuilder.security.manager import AUTH_OAUTH
      from superset.security.manager import SupersetSecurityManager

      AUTH_TYPE = AUTH_OAUTH
      AUTH_ROLES_SYNC_AT_LOGIN = True
      AUTH_USER_REGISTRATION = True
      AUTH_USER_REGISTRATION_ROLE = "Gamma"
      GROUPS_CLAIM = {{ .Values.global.identity.external.oidc.groupsClaim | quote }}
      AUTH_ROLES_MAPPING = {
      {{- range $role, $groups := .Values.auth.roleMappings }}
        {{- range $group := $groups }}
        {{ $group | quote }}: ["{{ $role }}"],
        {{- end }}
      {{- end }}
      }

      OAUTH_PROVIDERS = [
          {
              "name": {{ .Values.global.identity.external.clients.superset.providerName | quote }},
              "icon": {{ .Values.global.identity.external.clients.superset.icon | quote }},
              "token_key": "access_token",
              "remote_app": {
                  "client_id": os.environ.get("OAUTH_CLIENT_ID"),
                  "client_secret": os.environ.get("OAUTH_CLIENT_SECRET"),
                  "api_base_url": {{ include "dlh-in-a-box.identity.internalApiBaseUrl" $ | quote }},
                  "client_kwargs": {
                      "scope": {{ join " " .Values.global.identity.external.oidc.scopes | quote }},
                      "verify_signature": False,
                  },
                  "access_token_url": {{ include "dlh-in-a-box.identity.internalAccessTokenUrl" $ | quote }},
                  "authorize_url": {{ include "dlh-in-a-box.identity.authorizeUrl" $ | quote }},
                  "jwks_uri": {{ include "dlh-in-a-box.identity.internalJwksUri" $ | quote }},
                  "userinfo_endpoint": {{ include "dlh-in-a-box.identity.internalUserInfoUrl" $ | quote }},
              },
          }
      ]

      class DlhKeycloakSecurityManager(SupersetSecurityManager):
          def oauth_user_info(self, provider, response=None):
              if provider == "keycloak" and response:
                  token = response.get("id_token") or response.get("access_token")
                  if token:
                      claims = jwt.decode(
                          token,
                          options={
                              "verify_signature": False,
                              "verify_aud": False,
                          },
                      )
                      return {
                          "username": claims.get("preferred_username", claims.get("email", "")),
                          "first_name": claims.get("given_name", ""),
                          "last_name": claims.get("family_name", ""),
                          "email": claims.get("email", ""),
                          "role_keys": claims.get(GROUPS_CLAIM) or claims.get("groups", []),
                      }
              return super().oauth_user_info(provider, response)

      CUSTOM_SECURITY_MANAGER = DlhKeycloakSecurityManager
      {{- end }}
  extraSecretEnv:
    SUPERSET_SECRET_KEY: ""
  extraEnvRaw: []
  # Set a real SUPERSET_SECRET_KEY via extraSecretEnv or external secret
  # delivery before enabling Superset outside disposable local overlays.

