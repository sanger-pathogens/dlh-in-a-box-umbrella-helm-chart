jupyterhub:
  enabled: false
  proxy:
    service:
      type: ClusterIP
  hub:
    db:
      type: sqlite-memory
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: generic-oauth
      Spawner:
        http_timeout: 180
        start_timeout: 600
    extraEnv:
      JUPYTERHUB_BROWSER_AUTHORIZE_URL: ""
      JUPYTERHUB_INTERNAL_TOKEN_URL: ""
      JUPYTERHUB_INTERNAL_USERDATA_URL: ""
      JUPYTERHUB_OAUTH_CALLBACK_URL: ""
      JUPYTERHUB_CLIENT_ID: ""
      JUPYTERHUB_CLIENT_SECRET:
        value: ""
      JUPYTERHUB_ROLES_CLAIM: platform_roles
      JUPYTERHUB_ALLOWED_ROLES: ""
      JUPYTERHUB_ADMIN_ROLES: ""
      JUPYTERHUB_USERNAME_CLAIM: preferred_username
      JUPYTERHUB_LOGIN_SERVICE: Keycloak
    extraConfig:
      10-generic-oauth.py: |
        import os
        from oauthenticator.generic import GenericOAuthenticator

        def _env(name, default=""):
            return os.environ.get(name, default).strip()

        def _claim_list(auth_state, claim_name):
            auth_state = auth_state or {}
            oauth_user = auth_state.get("oauth_user") or {}
            values = oauth_user.get(claim_name) or []
            if isinstance(values, str):
                values = [values]
            return [value for value in values if isinstance(value, str) and value]

        def _role_list(auth_state):
            return _claim_list(auth_state, _env("JUPYTERHUB_ROLES_CLAIM", "platform_roles"))

        def _csv_set(name):
            return {value.strip() for value in _env(name).split(",") if value.strip()}

        c.GenericOAuthenticator.client_id = _env("JUPYTERHUB_CLIENT_ID")
        c.GenericOAuthenticator.client_secret = _env("JUPYTERHUB_CLIENT_SECRET")
        c.GenericOAuthenticator.authorize_url = _env("JUPYTERHUB_BROWSER_AUTHORIZE_URL")
        c.GenericOAuthenticator.token_url = _env("JUPYTERHUB_INTERNAL_TOKEN_URL")
        c.GenericOAuthenticator.userdata_url = _env("JUPYTERHUB_INTERNAL_USERDATA_URL")
        c.GenericOAuthenticator.oauth_callback_url = _env("JUPYTERHUB_OAUTH_CALLBACK_URL")
        c.GenericOAuthenticator.login_service = _env("JUPYTERHUB_LOGIN_SERVICE", "Keycloak")
        c.GenericOAuthenticator.username_claim = _env("JUPYTERHUB_USERNAME_CLAIM", "preferred_username")
        c.GenericOAuthenticator.scope = ["openid", "profile", "email"]
        c.GenericOAuthenticator.manage_groups = True
        c.GenericOAuthenticator.auth_state_groups_key = _role_list
        c.GenericOAuthenticator.refresh_pre_spawn = True
        c.Authenticator.enable_auth_state = True
        c.Authenticator.auth_refresh_age = 300
        c.GenericOAuthenticator.allow_all = False

        allowed_roles = _csv_set("JUPYTERHUB_ALLOWED_ROLES")
        if allowed_roles:
            c.GenericOAuthenticator.allowed_groups = allowed_roles

        admin_roles = _csv_set("JUPYTERHUB_ADMIN_ROLES")
        if admin_roles:
            c.GenericOAuthenticator.admin_groups = admin_roles
      20-spawn-env.py: |
        import os

        def _claim_list(auth_state, claim_name):
            auth_state = auth_state or {}
            oauth_user = auth_state.get("oauth_user") or {}
            values = oauth_user.get(claim_name) or []
            if isinstance(values, str):
                values = [values]
            return [value for value in values if isinstance(value, str) and value]

        async def _inject_platform_identity(spawner):
            auth_state = await spawner.user.get_auth_state()
            if not auth_state:
                return

            oauth_user = auth_state.get("oauth_user") or {}
            username_claim = os.environ.get("JUPYTERHUB_USERNAME_CLAIM", "preferred_username")
            username = oauth_user.get(username_claim) or spawner.user.name
            access_token = auth_state.get("access_token") or ""
            refresh_token = auth_state.get("refresh_token") or ""
            roles_claim = os.environ.get("JUPYTERHUB_ROLES_CLAIM", "platform_roles")
            roles = _claim_list(auth_state, roles_claim)

            spawner.environment.update(
                {
                    "KEYCLOAK_ACCESS_TOKEN": access_token,
                    "KEYCLOAK_REFRESH_TOKEN": refresh_token,
                    "KEYCLOAK_USERNAME": username,
                    "PLATFORM_ROLES": ",".join(sorted(roles)),
                    "TRINO_ACCESS_TOKEN": access_token,
                    "TRINO_USER": username,
                }
            )

        c.Spawner.pre_spawn_hook = _inject_platform_identity
  singleuser:
    cmd:
      - /bin/sh
      - /usr/local/bin/dlh-singleuser-start.sh
    defaultUrl: /lab/tree/examples/ICDDRB_Trino_Demo.ipynb
    storage:
      type: none
      capacity: 5Gi
    extraEnv:
      DLH_TRINO_PYTHON_CLIENT_VERSION: "0.337.0"
      TRINO_HOST: ""
      TRINO_PORT: "443"
      TRINO_HTTP_SCHEME: https
      TRINO_CATALOG: redcap
      TRINO_SCHEMA: default
      TRINO_VERIFY_TLS: "true"
      TRINO_DEMO_QUERY: SELECT * FROM redcap.default.platform_demo_enrollment LIMIT 10
      TRINO_TOKEN_MIN_TTL_SECONDS: "1800"
    extraFiles:
      dlh-singleuser-start.sh:
        mountPath: /usr/local/bin/dlh-singleuser-start.sh
        mode: 365
        stringData: |
          #!/bin/sh
          set -eu

          HOME_DIR="${HOME:-/home/jovyan}"
          EXAMPLES_DIR="${HOME_DIR}/examples"
          NOTEBOOK_SOURCE="/etc/dlh-jupyterhub/notebooks/ICDDRB_Trino_Demo.ipynb"
          NOTEBOOK_TARGET="${EXAMPLES_DIR}/ICDDRB_Trino_Demo.ipynb"
          NOTEBOOK_MARKER="${EXAMPLES_DIR}/.ICDDRB_Trino_Demo.ipynb.managed-sha256"
          VENV_DIR="${HOME_DIR}/.cache/dlh-trino-demo/venv"
          VERSION_MARKER="${VENV_DIR}/.trino-client-version"
          TRINO_CLIENT_VERSION="${DLH_TRINO_PYTHON_CLIENT_VERSION:-0.337.0}"

          mkdir -p "${EXAMPLES_DIR}" "$(dirname "${VENV_DIR}")"

          if [ ! -x "${VENV_DIR}/bin/python" ] || [ ! -f "${VERSION_MARKER}" ] || [ "$(cat "${VERSION_MARKER}" 2>/dev/null)" != "${TRINO_CLIENT_VERSION}" ]; then
            rm -rf "${VENV_DIR}"
            python3 -m venv "${VENV_DIR}"
            "${VENV_DIR}/bin/pip" install --quiet --disable-pip-version-check --upgrade pip
            "${VENV_DIR}/bin/pip" install --quiet --disable-pip-version-check \
              "ipykernel>=6.29.0" \
              "pandas>=2.2.0" \
              "requests>=2.31.0" \
              "trino==${TRINO_CLIENT_VERSION}"
            printf '%s' "${TRINO_CLIENT_VERSION}" > "${VERSION_MARKER}"
          fi

          "${VENV_DIR}/bin/python" -m ipykernel install --user --name dlh-trino-demo --display-name "Python 3 (Trino Demo)" >/dev/null 2>&1 || true

          file_sha256() {
            NOTEBOOK_HASH_PATH="$1" "${VENV_DIR}/bin/python" - <<'PY'
          import hashlib
          import os

          digest = hashlib.sha256()
          with open(os.environ["NOTEBOOK_HASH_PATH"], "rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          print(digest.hexdigest())
          PY
          }

          if [ -f "${NOTEBOOK_SOURCE}" ]; then
            NOTEBOOK_HASH="$(file_sha256 "${NOTEBOOK_SOURCE}")"
            CURRENT_MARKER="$(cat "${NOTEBOOK_MARKER}" 2>/dev/null || true)"

            if [ ! -f "${NOTEBOOK_TARGET}" ]; then
              cp "${NOTEBOOK_SOURCE}" "${NOTEBOOK_TARGET}"
              printf '%s' "${NOTEBOOK_HASH}" > "${NOTEBOOK_MARKER}"
            elif [ "${CURRENT_MARKER}" != "${NOTEBOOK_HASH}" ]; then
              if [ -z "${CURRENT_MARKER}" ] || [ "$(file_sha256 "${NOTEBOOK_TARGET}")" != "${CURRENT_MARKER}" ]; then
                cp "${NOTEBOOK_TARGET}" "${NOTEBOOK_TARGET}.pre-managed-$(date +%Y%m%d%H%M%S).bak"
              fi
              cp "${NOTEBOOK_SOURCE}" "${NOTEBOOK_TARGET}"
              printf '%s' "${NOTEBOOK_HASH}" > "${NOTEBOOK_MARKER}"
            fi
          fi

          exec jupyterhub-singleuser
      dlh-trino-demo-notebook.ipynb:
        mountPath: /etc/dlh-jupyterhub/notebooks/ICDDRB_Trino_Demo.ipynb
        stringData: |
          {
            "cells": [
              {
                "cell_type": "markdown",
                "metadata": {},
                "source": [
                  "# ICDDR,B Trino Demo\n",
                  "\n",
                  "This notebook uses the Keycloak access token from your JupyterHub sign-in to query Trino without a second password prompt.\n",
                  "\n",
                  "If queries later fail with an authentication error, stop and restart your Jupyter server so JupyterHub refreshes the Keycloak token before spawning a new notebook session."
                ]
              },
              {
                "cell_type": "code",
                "execution_count": null,
                "metadata": {},
                "outputs": [],
                "source": [
                  "import os\n",
                  "import base64\n",
                  "import json\n",
                  "import time\n",
                  "\n",
                  "import pandas as pd\n",
                  "import requests\n",
                  "from trino.auth import JWTAuthentication\n",
                  "from trino.dbapi import connect\n",
                  "\n",
                  "token = os.environ.get(\"TRINO_ACCESS_TOKEN\") or os.environ.get(\"KEYCLOAK_ACCESS_TOKEN\")\n",
                  "user = os.environ.get(\"TRINO_USER\") or os.environ.get(\"KEYCLOAK_USERNAME\") or os.environ.get(\"JUPYTERHUB_USER\")\n",
                  "host = os.environ.get(\"TRINO_HOST\")\n",
                  "port = int(os.environ.get(\"TRINO_PORT\", \"443\"))\n",
                  "http_scheme = os.environ.get(\"TRINO_HTTP_SCHEME\", \"https\")\n",
                  "catalog = os.environ.get(\"TRINO_CATALOG\", \"redcap\")\n",
                  "schema = os.environ.get(\"TRINO_SCHEMA\", \"default\")\n",
                  "verify_tls = os.environ.get(\"TRINO_VERIFY_TLS\", \"true\").lower() not in {\"0\", \"false\", \"no\"}\n",
                  "query = os.environ.get(\"TRINO_DEMO_QUERY\", \"SELECT * FROM redcap.default.platform_demo_enrollment LIMIT 10\")\n",
                  "min_ttl_seconds = int(os.environ.get(\"TRINO_TOKEN_MIN_TTL_SECONDS\", \"1800\"))\n",
                  "\n",
                  "if not token:\n",
                  "    raise RuntimeError(\"No Trino or Keycloak access token was found in the notebook environment.\")\n",
                  "if not user:\n",
                  "    raise RuntimeError(\"No Trino user identity was found in the notebook environment.\")\n",
                  "if not host:\n",
                  "    raise RuntimeError(\"TRINO_HOST is not configured for this notebook server.\")\n",
                  "\n",
                  "claims = json.loads(base64.urlsafe_b64decode(token.split(\".\")[1] + \"=\" * (-len(token.split(\".\")[1]) % 4)))\n",
                  "ttl_seconds = int(claims.get(\"exp\", 0)) - int(time.time())\n",
                  "if ttl_seconds < min_ttl_seconds:\n",
                  "    raise RuntimeError(f\"The forwarded Trino token expires too soon ({ttl_seconds}s remaining). Stop and restart your Jupyter server to refresh it.\")\n",
                  "\n",
                  "session = requests.Session()\n",
                  "session.verify = verify_tls\n",
                  "if not verify_tls:\n",
                  "    requests.packages.urllib3.disable_warnings()\n",
                  "\n",
                  "conn = connect(\n",
                  "    host=host,\n",
                  "    port=port,\n",
                  "    http_scheme=http_scheme,\n",
                  "    user=user,\n",
                  "    catalog=catalog,\n",
                  "    schema=schema,\n",
                  "    verify=verify_tls,\n",
                  "    auth=JWTAuthentication(token),\n",
                  "    http_session=session,\n",
                  ")\n",
                  "\n",
                  "cur = conn.cursor()\n",
                  "cur.execute(query)\n",
                  "rows = cur.fetchall()\n",
                  "columns = [column[0] for column in cur.description]\n",
                  "pd.DataFrame(rows, columns=columns)\n"
                ]
              }
            ],
            "metadata": {
              "kernelspec": {
                "display_name": "Python 3 (Trino Demo)",
                "language": "python",
                "name": "dlh-trino-demo"
              },
              "language_info": {
                "name": "python",
                "version": "3.12"
              }
            },
            "nbformat": 4,
            "nbformat_minor": 5
          }

# CloudBeaver is a nested subchart (charts/dlh-in-a-box/charts/cloudbeaver/,
# see its own values.yaml for the full settings list). This umbrella-level
# block only needs to restate `enabled` -- Helm's dependency `condition:` in
# Chart.yaml reads it before the subchart's own defaults are merged in.
cloudbeaver:
  enabled: false

rangerPostgresql:
  enabled: false
  nameOverride: ranger-postgresql
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: rangeradmin
    database: ranger
    existingSecret: dlh-ranger-postgresql
  primary:
    persistence:
      enabled: true
      size: 8Gi

prefect:
  enabled: true
  server:
    enabled: true
  workers:
    enabled: true
  authProxy:
    enabled: false
  jobRunner:
    # Creates a lightweight service account intended for Prefect Kubernetes flow-run Jobs.
    enabled: false
    serviceAccount:
      create: true
      name: prefect-job-runner
      automountServiceAccountToken: false
      annotations: {}
      labels: {}
      # Use this for image pull secrets created outside this chart, such as
      # Vault Secrets Operator or External Secrets Operator outputs. When
      # pullSecret.create=true, the created pull secret is added automatically.
      imagePullSecrets: []
    pullSecret:
      # Set create=true only when Helm should own the registry credential Secret.
      # The created Secret is automatically attached to the job runner service
      # account; do not also list the same Secret in serviceAccount.imagePullSecrets.
      create: false
      name: prefect-job-runner-registry
      annotations: {}
      labels: {}
      server: ghcr.io
      username: ""
      password: ""

# Upstream Prefect chart values can be passed directly via these aliases.
prefectServer:
  postgresql:
    enabled: true
    nameOverride: prefect-postgresql
    image:
      repository: bitnamilegacy/postgresql
  secret:
    # Fixed name used by both the bundled-postgres path (upstream creates it)
    # and the sharedPostgresql path (templates/prefect-shared-postgresql-connection.yaml
    # creates it when prefectServer.postgresql.enabled=false).
    name: dlh-prefect-postgresql-connection

prefectWorker:
  worker:
    apiConfig: selfHostedServer
    replicaCount: 1
    config:
      workPool: kubernetes-pool
      workQueues:
        - default
      baseJobTemplate:
        existingConfigMapName: prefect-worker-base-job-template
    selfHostedServerApiConfig:
      apiUrl: http://prefect-server:4200/api

prefect-auth-proxy:
  config:
    clientID: '{{ .Values.global.identity.external.clients.prefectProxy.clientId }}'
    # When using an externally managed Secret, it must contain the oauth2-proxy
    # keys `client-id`, `client-secret`, and `cookie-secret`.
    existingSecret: ""
    configFile: |-
      provider = "keycloak-oidc"
      oidc_issuer_url = "{{ include "dlh-in-a-box.identity.issuer" $ }}"
      skip_oidc_discovery = true
      login_url = "{{ include "dlh-in-a-box.identity.authorizeUrl" $ }}"
      redeem_url = "{{ include "dlh-in-a-box.identity.internalAccessTokenUrl" $ }}"
      oidc_jwks_url = "{{ include "dlh-in-a-box.identity.internalJwksUri" $ }}"
      profile_url = "{{ include "dlh-in-a-box.identity.internalUserInfoUrl" $ }}"
      scope = "{{ join " " .Values.global.identity.external.oidc.scopes }}"
      email_domains = [{{- range $index, $domain := .Values.global.identity.external.clients.prefectProxy.emailDomains }}{{ if $index }}, {{ end }}{{ $domain | quote }}{{- end }}]
      allowed_roles = [{{ printf "%s:access" .Values.global.identity.external.clients.prefectProxy.clientId | quote }}]
      oidc_groups_claim = "{{ .Values.global.identity.external.oidc.groupsClaim }}"
      redirect_url = "{{ .Values.global.identity.external.clients.prefectProxy.redirectUrl }}"
      approval_prompt = "auto"
      skip_provider_button = true
      cookie_secure = {{ hasPrefix "https://" .Values.global.identity.external.clients.prefectProxy.redirectUrl }}
      # Use a distinct oauth2-proxy cookie per app so localhost tunnel access
      # does not mix Prefect and CloudBeaver sessions on 127.0.0.1.
      cookie_name = "_oauth2_proxy_prefect"
      session_cookie_minimal = true
      upstreams = [ "http://prefect-server:4200" ]
      pass_access_token = false
      pass_authorization_header = false
      pass_user_headers = true
      set_xauthrequest = true
      reverse_proxy = true
      {{- if or .Values.global.identity.external.clients.prefectAutomation.enabled .Values.global.identity.external.clients.prefectDirectGrant.enabled }}
      skip_jwt_bearer_tokens = true
      api_routes = [ "^/api/" ]
      extra_jwt_issuers = "{{ include "dlh-in-a-box.identity.issuer" $ }}={{ ternary .Values.global.identity.external.clients.prefectAutomation.tokenAudience .Values.global.identity.external.clients.prefectDirectGrant.tokenAudience .Values.global.identity.external.clients.prefectAutomation.enabled }}"
      oidc_extra_audiences = [ "{{ ternary .Values.global.identity.external.clients.prefectAutomation.tokenAudience .Values.global.identity.external.clients.prefectDirectGrant.tokenAudience .Values.global.identity.external.clients.prefectAutomation.enabled }}" ]
      {{- end }}
      {{- if .Values.global.identity.external.oidc.providerCaFile }}
      provider_ca_files = [ "{{ .Values.global.identity.external.oidc.providerCaFile }}" ]
      {{- end }}
  service:
    type: ClusterIP
  ingress:
    enabled: false

cloudbeaver-auth-proxy:
