global:
  nameOverride: ""
  fullnameOverride: ""
  domain: ""
  imagePullSecrets: []
  identity: &identity_defaults
    enabled: false
    accessRoles:
      platform-admin:
        enabled: true
        appAccess:
          superset: true
          datahub: true
          jupyterhub: true
          cloudbeaver: true
          prefect: true
          ranger: true
          trinoUi: true
          keycloak: true
          minio: true
      platform-user:
        enabled: true
        appAccess:
          superset: true
          datahub: true
          jupyterhub: true
          cloudbeaver: true
      platform-viewer:
        enabled: true
        appAccess:
          superset: true
          datahub: true
    provider:
      mode: externalOidc
      keycloak:
        realm: dlh
        browserHost: ""
        internalScheme: http
        displayName: ""
        loginTheme: ""
        registration:
          enabled: false
          requireEmailVerification: true
        adminClientRoles:
          enabled: true
          clientId: realm-management
          roles:
            - realm-admin
        configCliEnvExistingSecret: dlh-keycloak-config-cli-env
    external:
      oidc:
        issuer: ""
        usernameClaim: email
        groupsClaim: groups
        rolesClaim: platform_roles
        userMappingPattern: "([^@]+)"
        providerCaFile: ""
        scopes:
          - openid
          - profile
          - email
        processForwardedHeaders: true
      clients:
        trino:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: trinoClientSecret
          redirectUris: []
          webOrigins: []
          passwordAuthMode: ldap
          passwordAuthEnabled: false
          sharedSecretExistingSecret: ""
          sharedSecretKey: sharedSecret
          discovery:
            enabled: true
          challengeTimeout: ""
        trinoDirectGrant:
          enabled: false
          clientId: ""
        superset:
          enabled: false
          providerName: keycloak
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: supersetClientSecret
          redirectUris: []
          webOrigins: []
          authorizeUrl: ""
          accessTokenUrl: ""
          apiBaseUrl: ""
          jwksUri: ""
          userInfoUrl: ""
          icon: fa-openid
          roleKeysPath: role_keys
        datahub:
          enabled: false
          provider: other
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: datahubClientSecret
          redirectUris: []
          webOrigins: []
          discoveryUri: ""
          scope: ""
          userNameClaim: email
          userNameClaimRegex: "([^@]+)"
        platformHome:
          enabled: false
          clientId: ""
          redirectUris: []
          webOrigins: []
        minio:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: minioClientSecret
          redirectUris: []
          webOrigins: []
        vault:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: vaultClientSecret
          redirectUris: []
          webOrigins: []
        jupyterhub:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: jupyterhubClientSecret
          redirectUris: []
          webOrigins: []
          accessTokenLifespanSeconds: 28800
        rangerProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: rangerClientSecret
          configCliSecretKey: KC_RANGER_CLIENT_SECRET
          cookieExistingSecret: dlh-cloudbeaver-oauth2-proxy
          cookieSecretKey: cookie-secret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        cloudbeaverProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-cloudbeaver-oauth2-proxy
          clientSecretKey: client-secret
          cookieExistingSecret: ""
          cookieSecretKey: cookie-secret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        prefectProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: prefectClientSecret
          cookieExistingSecret: ""
          cookieSecretKey: cookieSecret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        prefectAutomation:
          enabled: false
          clientId: ""
          configCliSecretKey: KC_PREFECT_AUTOMATION_CLIENT_SECRET
          tokenAudience: prefect-api
          serviceAccountsEnabled: true
          standardFlowEnabled: false
          directAccessGrantsEnabled: false
        prefectDirectGrant:
          enabled: false
          clientId: ""
          tokenAudience: prefect-api
    directory:
      mode: keycloakLocal
      ldap:
        enabled: false
        url: ""
        userBaseDn: ""
        usernameAttribute: uid
        firstNameAttribute: givenName
        lastNameAttribute: sn
        emailAttribute: mail
        uuidAttribute: entryUUID
        userObjectClasses: inetOrgPerson,organizationalPerson,person
        userSearchFilter: "(uid={0})"
        userBindPattern: ""
        groupNameAttribute: cn
        membershipUserAttribute: uid
        groupObjectClasses: groupOfNames
        useGroupFilter: false
        groupBaseDn: ""
        groupSearchFilter: "(cn=*)"
        groupSearchMemberAttribute: member
        userMemberOfAttribute: memberOf
        bindDistinguishedName: ""
        bindExistingSecret: ""
        bindPasswordKey: bindPassword
        allowAnonymousRead: false
        trustedCaExistingSecret: ""
        trustedCaCertKey: ca.crt
        useSystemTrustStore: false
        allowInsecure: false
        syncGroupsToKeycloak: true
        hostAliases: []
  authorization: &authorization_defaults
    platformRoleExceptions: []
    ranger:
      enabled: false
      serviceName: trino
      serviceUsername: trino
      serviceAdminUsers:
        - admin
      serviceAdminGroups: []
      superUsers:
        - admin
      superGroups: []
      legacyManagedUsers: []
      legacyManagedGroups: []
      legacyManagedRoles: []
      legacyManagedPolicies: []
      dataRoles: {}
      syncAccessModelRoles: true
      cleanup:
        enabled: true
        dryRun: false
        staleUsers: []
        staleUserPatterns:
          - "^codex-"
          - "-test-sync$"
        staleGroups: []
        staleRoles: []
        stalePolicies: []
      useRangerGroups: false
      postgresql:
        enabled: true
        host: ""
        database: ranger
        username: rangeradmin
        existingSecret: dlh-ranger-postgresql
        passwordKey: password
        adminPasswordKey: postgres-password
      admin:
        browserUrl: ""
        image:
          repository: apache/ranger
          tag: 2.8.0
          pullPolicy: IfNotPresent
        existingSecret: dlh-ranger-admin
        adminPasswordKey: rangerAdminPassword
        usersyncPasswordKey: rangerUsersyncPassword
        tagsyncPasswordKey: rangerTagsyncPassword
        passwordReconcile:
          enabled: true
          image:
            repository: postgres
            tag: "15"
            pullPolicy: IfNotPresent
      usersync:
        enabled: true
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        schedule: "*/15 * * * *"
        syncSource: KEYCLOAK_LOCAL
      localUserSync:
        enabled: true
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        schedule: "*/5 * * * *"
        suspend: false
        readiness:
          attempts: 120
          delaySeconds: 5
      importCatalogAcls: false
      exceptionRoleAudit:
        enabled: true
        prefix: exception-
        schedule: "23 * * * *"
        gracePeriodDays: 7
        deleteExpired: true
        logUndocumented: true
      bootstrapPolicies: []
      bootstrap:
        enabled: true
        importCatalogAcls: false
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        policies: []
      trino:
        enabled: false
        auditMode: log4j
  storage:
    backend: externalS3
    s3:
      endpoint: ""
      region: ""
      bucket: ""
      pathStyleAccess: true
      # Do not commit real credentials in tracked values files. Prefer CI-injected
      # values, environment-specific secrets, or external secret delivery.
      existingSecret: ""
      accessKey: ""
      secretKey: ""
      accessKeyKey: accessKey
      secretKeyKey: secretKey

  # Data catalogs configuration (used to generate Hive metastores and Trino catalogs)
  dataCatalogs: {}

sharedPostgresql:
  # Master switch for the whole shared-postgres feature. Pick exactly one
  # data plane below (bundled.enabled or external.enabled) once this is true.
  enabled: false
  bundled:
    enabled: false
    nameOverride: shared-postgresql
    image:
      repository: bitnamilegacy/postgresql
      tag: 17.6.0-debian-12-r0
    auth:
      enablePostgresUser: true
      existingSecret: ""
      secretKeys:
        adminPasswordKey: postgres-password
    primary:
      extendedConfiguration: |-
        password_encryption = md5
      persistence:
        enabled: true
        size: 100Gi
  # Point the shared-postgres feature at an instance you manage yourself
  # instead of the bundled instance above.
  external:
    enabled: false
    host: ""
    port: 5432
    username: postgres
    # Name of an existing Secret containing the admin/superuser password used
    # to provision the per-app databases and roles below.
    existingSecret: ""
    passwordKey: postgres-password
  provisioning:
    enabled: true
    backoffLimit: 6
    image:
      registry: docker.io
      repository: postgres
      tag: "15"
      pullPolicy: IfNotPresent
    adminSecret:
      name: dlh-shared-postgresql
      passwordKey: postgres-password
    # Legacy list contract kept for non-Prefect integrations until they are
    # deliberately migrated to the new map form below.
    database-list:
      - name: keycloak
        database: bitnami_keycloak
        username: bn_keycloak
        secretName: dlh-keycloak-postgresql
        passwordKey: password
      - name: ranger
        database: ranger
        username: rangeradmin
        secretName: dlh-ranger-postgresql
        passwordKey: password
      - name: hive-redcap
        database: redcap
        username: hive
        secretName: dlh-hive-metastore-postgres
        passwordKey: password
      - name: superset
        database: superset
        username: superset
        secretName: dlh-superset-runtime-env
        passwordKey: DB_PASS
      - name: jupyterhub
        database: jupyterhub
        username: jupyterhub
        secretName: dlh-jupyterhub-postgresql
        passwordKey: password
    # New map contract for Prefect.
    databases:
      prefect:
        enabled: true
        database: prefect
        username: prefect
        password:
          # Empty means generate the app password Secret; set an existing
          # Secret name here to reuse it instead.
          existingSecret: ""
          key: password
        connectionSecret:
          create: true
          name: dlh-prefect-postgresql-connection
  migration:
    allowBundledPostgresql: false

trino:
  enabled: true
  accessControl:
    type: configmap

keycloak:
  enabled: false
  production: false
  httpEnabled: true
  proxyHeaders: xforwarded
  image:
    repository: bitnamilegacy/keycloak
  auth:
    adminUser: admin
    existingSecret: dlh-keycloak-admin
    passwordSecretKey: adminPassword
  keycloakConfigCli:
    enabled: true
    image:
      repository: bitnamilegacy/keycloak-config-cli
    extraEnvVarsSecret: dlh-keycloak-config-cli-env
    extraEnvVars:
      - name: IMPORT_VARSUBSTITUTION_ENABLED
        value: "true"
      - name: IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR
        value: "false"
    configuration:
      dlh-realm.yaml: |
        realm: {{ include "dlh-in-a-box.keycloak.realm" $ }}
        enabled: true
        {{- $keycloakRegistration := default (dict) .Values.global.identity.provider.keycloak.registration }}
        {{- $registrationEnabled := default false (get $keycloakRegistration "enabled") }}
        {{- $requireEmailVerification := true }}
        {{- if hasKey $keycloakRegistration "requireEmailVerification" }}
        {{- $requireEmailVerification = get $keycloakRegistration "requireEmailVerification" }}
        {{- end }}
        registrationAllowed: {{ ternary "true" "false" $registrationEnabled }}
        loginWithEmailAllowed: true
        duplicateEmailsAllowed: false
        verifyEmail: {{ ternary "true" "false" (and $registrationEnabled $requireEmailVerification) }}
        resetPasswordAllowed: true
        rememberMe: true
        {{- $keycloakDisplayName := default "" .Values.global.identity.provider.keycloak.displayName }}
        {{- if $keycloakDisplayName }}
        displayName: {{ $keycloakDisplayName | quote }}
        {{- end }}
        {{- $keycloakLoginTheme := default "" .Values.global.identity.provider.keycloak.loginTheme }}
        {{- if $keycloakLoginTheme }}
        loginTheme: {{ $keycloakLoginTheme | quote }}
        {{- end }}
        defaultDefaultClientScopes:
          - profile
          - email
          - roles
          - platform-access
        clientScopes:
          - name: groups
            protocol: openid-connect
            attributes:
              include.in.token.scope: "true"
              display.on.consent.screen: "false"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                consentRequired: false
                config:
                  full.path: "false"
                  id.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "true"
                  introspection.token.claim: "true"
                  claim.name: {{ .Values.global.identity.external.oidc.groupsClaim | quote }}
                  jsonType.label: String
          - name: platform-access
            protocol: openid-connect
            attributes:
              include.in.token.scope: "true"
              display.on.consent.screen: "false"
            protocolMappers:
              - name: platform-realm-roles
                protocol: openid-connect
                protocolMapper: oidc-usermodel-realm-role-mapper
                consentRequired: false
                config:
                  multivalued: "true"
                  id.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "true"
                  introspection.token.claim: "true"
                  claim.name: {{ default "platform_roles" .Values.global.identity.external.oidc.rolesClaim | quote }}
                  jsonType.label: String
        {{- $accessModelRoles := fromJson (include "dlh-in-a-box.identity.accessModelRolesJson" $) }}
        {{- $accessModelAppClients := fromJson (include "dlh-in-a-box.identity.accessModelAppClientsJson" $) }}
        {{- $accessModelClientRoleApps := dict }}
        {{- range $roleKey, $role := $accessModelRoles }}
          {{- range $appName, $enabled := get $role "appAccess" | default dict }}
            {{- if and $enabled (hasKey $accessModelAppClients $appName) }}
              {{- $_ := set $accessModelClientRoleApps $appName true }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if gt (len $accessModelRoles) 0 }}
        roles:
          realm:
          {{- range $roleKey := keys $accessModelRoles | sortAlpha }}
            {{- $role := get $accessModelRoles $roleKey | default dict }}
            {{- $roleClientComposites := dict }}
            {{- range $appName, $enabled := get $role "appAccess" | default dict }}
              {{- if and $enabled (hasKey $accessModelAppClients $appName) }}
                {{- $_ := set $roleClientComposites (get $accessModelAppClients $appName) (list "access") }}
              {{- end }}
            {{- end }}
            {{- if eq $roleKey "platform-admin" }}
              {{- $_ := set $roleClientComposites "realm-management" (list "realm-admin") }}
            {{- end }}
            - name: {{ $roleKey | quote }}
              {{- if get $role "description" }}
              description: {{ get $role "description" | quote }}
              {{- else }}
              description: {{ printf "Built-in platform role %s" $roleKey | quote }}
              {{- end }}
              {{- if gt (len $roleClientComposites) 0 }}
              composite: true
              composites:
                client:
                  {{- range $clientId := keys $roleClientComposites | sortAlpha }}
                  {{ $clientId | quote }}:
                    {{- range $clientRole := get $roleClientComposites $clientId }}
                    - {{ $clientRole | quote }}
                    {{- end }}
                  {{- end }}
              {{- end }}
          {{- end }}
          {{- if gt (len $accessModelClientRoleApps) 0 }}
          client:
          {{- range $appName := keys $accessModelClientRoleApps | sortAlpha }}
            {{- $clientId := get $accessModelAppClients $appName }}
            {{ $clientId | quote }}:
              - name: access
                description: {{ printf "Browser access entitlement for %s" $appName | quote }}
          {{- end }}
        {{- end }}
        {{- end }}
        clients:
        {{- if .Values.global.identity.external.clients.trino.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.trino.clientId | quote }}
            name: Trino
            description: OIDC client for Trino browser login
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_TRINO_CLIENT_SECRET)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.trino.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.trino.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
        {{- end }}
        {{- if .Values.global.identity.external.clients.trinoDirectGrant.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.trinoDirectGrant.clientId | quote }}
            name: Trino Direct Grant
            description: Public OIDC client for non-browser Trino workstation token grants
            enabled: true
            protocol: openid-connect
            publicClient: true
            standardFlowEnabled: false
            directAccessGrantsEnabled: true
            serviceAccountsEnabled: false
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
            protocolMappers:
              - name: trino-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
                  access.token.claim: "true"
                  id.token.claim: "false"
                  introspection.token.claim: "true"
                  included.client.audience: {{ .Values.global.identity.external.clients.trino.clientId | quote }}
        {{- end }}
        {{- if .Values.global.identity.external.clients.superset.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.superset.clientId | quote }}
            name: Superset
            description: OIDC client for Apache Superset
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_SUPERSET_CLIENT_SECRET)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.superset.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.superset.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
        {{- end }}
        {{- if .Values.global.identity.external.clients.datahub.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.datahub.clientId | quote }}
            name: DataHub
            description: OIDC client for DataHub frontend
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_DATAHUB_CLIENT_SECRET)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.datahub.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.datahub.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
        {{- end }}
        {{- if .Values.global.identity.external.clients.platformHome.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.platformHome.clientId | quote }}
            name: Platform Home
            description: Public browser client for the data-platform launchpad
            enabled: true
            protocol: openid-connect
            publicClient: true
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            redirectUris:
            {{- range .Values.global.identity.external.clients.platformHome.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.platformHome.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
        {{- end }}
        {{- if .Values.global.identity.external.clients.minio.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.minio.clientId | quote }}
            name: MinIO Console
            description: OIDC client for MinIO Console browser login
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_MINIO_CLIENT_SECRET)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.minio.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.minio.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
            protocolMappers:
              - name: minio-policy
                protocol: openid-connect
                protocolMapper: oidc-hardcoded-claim-mapper
                consentRequired: false
                config:
                  access.token.claim: "true"
                  id.token.claim: "true"
                  userinfo.token.claim: "true"
                  introspection.token.claim: "true"
                  claim.name: "policy"
                  claim.value: "consoleAdmin"
                  jsonType.label: String
        {{- end }}
        {{- if .Values.global.identity.external.clients.vault.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.vault.clientId | quote }}
            name: Vault
            description: OIDC client for Vault UI browser login
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_VAULT_CLIENT_SECRET)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.vault.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.vault.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
        {{- end }}
        {{- if .Values.global.identity.external.clients.jupyterhub.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.jupyterhub.clientId | quote }}
            name: JupyterHub
            description: OIDC client for JupyterHub browser login and notebook token forwarding
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_JUPYTERHUB_CLIENT_SECRET)"
            attributes:
              access.token.lifespan: {{ printf "%d" (int (default 28800 .Values.global.identity.external.clients.jupyterhub.accessTokenLifespanSeconds)) | quote }}
            redirectUris:
            {{- range .Values.global.identity.external.clients.jupyterhub.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.jupyterhub.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - platform-access
            {{- if .Values.global.identity.external.clients.trino.enabled }}
            protocolMappers:
              - name: trino-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
                  access.token.claim: "true"
                  id.token.claim: "false"
                  introspection.token.claim: "true"
                  included.client.audience: {{ .Values.global.identity.external.clients.trino.clientId | quote }}
            {{- end }}
        {{- end }}
        {{- if .Values.global.identity.external.clients.cloudbeaverProxy.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.cloudbeaverProxy.clientId | quote }}
            name: CloudBeaver Proxy
            description: OIDC client for oauth2-proxy in front of CloudBeaver
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
