        - default
      baseJobTemplate:
        existingConfigMapName: prefect-worker-base-job-template
    selfHostedServerApiConfig:
      apiUrl: http://prefect-server:4200/api

prefect-auth-proxy:
  config:
    clientID: '{{ .Values.global.identity.external.clients.prefectProxy.clientId }}'
    # When using an externally managed Secret, it must contain the oauth2-proxy
    # keys `client-id`, `client-secret`, and `cookie-secret`.
    existingSecret: ""
    configFile: |-
      provider = "keycloak-oidc"
      oidc_issuer_url = "{{ include "dlh-in-a-box.identity.issuer" $ }}"
      skip_oidc_discovery = true
      login_url = "{{ include "dlh-in-a-box.identity.authorizeUrl" $ }}"
      redeem_url = "{{ include "dlh-in-a-box.identity.internalAccessTokenUrl" $ }}"
      oidc_jwks_url = "{{ include "dlh-in-a-box.identity.internalJwksUri" $ }}"
      profile_url = "{{ include "dlh-in-a-box.identity.internalUserInfoUrl" $ }}"
      scope = "{{ join " " .Values.global.identity.external.oidc.scopes }}"
      email_domains = [{{- range $index, $domain := .Values.global.identity.external.clients.prefectProxy.emailDomains }}{{ if $index }}, {{ end }}{{ $domain | quote }}{{- end }}]
      allowed_roles = [{{ printf "%s:access" .Values.global.identity.external.clients.prefectProxy.clientId | quote }}]
      oidc_groups_claim = "{{ .Values.global.identity.external.oidc.groupsClaim }}"
      redirect_url = "{{ .Values.global.identity.external.clients.prefectProxy.redirectUrl }}"
      approval_prompt = "auto"
      skip_provider_button = true
      cookie_secure = {{ hasPrefix "https://" .Values.global.identity.external.clients.prefectProxy.redirectUrl }}
      # Use a distinct oauth2-proxy cookie per app so localhost tunnel access
      # does not mix Prefect and CloudBeaver sessions on 127.0.0.1.
      cookie_name = "_oauth2_proxy_prefect"
      session_cookie_minimal = true
      upstreams = [ "http://prefect-server:4200" ]
      pass_access_token = false
      pass_authorization_header = false
      pass_user_headers = true
      set_xauthrequest = true
      reverse_proxy = true
      {{- if or .Values.global.identity.external.clients.prefectAutomation.enabled .Values.global.identity.external.clients.prefectDirectGrant.enabled }}
      skip_jwt_bearer_tokens = true
      api_routes = [ "^/api/" ]
      extra_jwt_issuers = "{{ include "dlh-in-a-box.identity.issuer" $ }}={{ ternary .Values.global.identity.external.clients.prefectAutomation.tokenAudience .Values.global.identity.external.clients.prefectDirectGrant.tokenAudience .Values.global.identity.external.clients.prefectAutomation.enabled }}"
      oidc_extra_audiences = [ "{{ ternary .Values.global.identity.external.clients.prefectAutomation.tokenAudience .Values.global.identity.external.clients.prefectDirectGrant.tokenAudience .Values.global.identity.external.clients.prefectAutomation.enabled }}" ]
      {{- end }}
      {{- if .Values.global.identity.external.oidc.providerCaFile }}
      provider_ca_files = [ "{{ .Values.global.identity.external.oidc.providerCaFile }}" ]
      {{- end }}
  service:
    type: ClusterIP
  ingress:
    enabled: false

