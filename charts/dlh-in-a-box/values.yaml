global:
  nameOverride: ""
  fullnameOverride: ""
  domain: ""
  imagePullSecrets: []
  identity: &identity_defaults
    enabled: false
    # accessRoles is an open map, not a fixed enum — platform-admin below is just
    # a starting point shipped disabled by default. Add, rename, or remove roles
    # freely; each key becomes a Keycloak realm role, and appAccess accepts any
    # of: superset, datahub, trinoUi, jupyterhub, cloudbeaver, prefect, ranger,
    # keycloak, minio. For example:
    #
    # data-scientist:
    #   enabled: true
    #   label: Data Scientist
    #   description: Read/query access to approved catalogs via Trino and notebooks.
    #   appAccess:
    #     jupyterhub: true
    #     cloudbeaver: true
    accessRoles:
      platform-admin:
        enabled: false
        appAccess:
          superset: true
          datahub: true
          jupyterhub: true
          cloudbeaver: true
          prefect: true
          ranger: true
          trinoUi: true
          keycloak: true
          minio: true
    provider:
      mode: externalOidc
      keycloak:
        realm: dlh
        browserHost: ""
        internalScheme: http
        displayName: ""
        loginTheme: ""
        registration:
          enabled: false
          requireEmailVerification: true
        adminClientRoles:
          enabled: true
          clientId: realm-management
          roles:
            - realm-admin
        configCliEnvExistingSecret: dlh-keycloak-config-cli-env
    external:
      oidc:
        issuer: ""
        usernameClaim: email
        groupsClaim: groups
        rolesClaim: platform_roles
        userMappingPattern: "([^@]+)"
        providerCaFile: ""
        scopes:
          - openid
          - profile
          - email
        processForwardedHeaders: true
      clients:
        trino:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: trinoClientSecret
          redirectUris: []
          webOrigins: []
          passwordAuthMode: ldap
          passwordAuthEnabled: false
          sharedSecretExistingSecret: ""
          sharedSecretKey: sharedSecret
          discovery:
            enabled: true
          challengeTimeout: ""
        trinoDirectGrant:
          enabled: false
          clientId: ""
        superset:
          enabled: false
          providerName: keycloak
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: supersetClientSecret
          redirectUris: []
          webOrigins: []
          authorizeUrl: ""
          accessTokenUrl: ""
          apiBaseUrl: ""
          jwksUri: ""
          userInfoUrl: ""
          icon: fa-openid
          roleKeysPath: role_keys
        datahub:
          enabled: false
          provider: other
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: datahubClientSecret
          redirectUris: []
          webOrigins: []
          discoveryUri: ""
          scope: ""
          userNameClaim: email
          userNameClaimRegex: "([^@]+)"
        platformHome:
          enabled: false
          clientId: ""
          redirectUris: []
          webOrigins: []
        minio:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: minioClientSecret
          redirectUris: []
          webOrigins: []
        vault:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: vaultClientSecret
          redirectUris: []
          webOrigins: []
        jupyterhub:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: jupyterhubClientSecret
          redirectUris: []
          webOrigins: []
          accessTokenLifespanSeconds: 28800
        rangerProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: rangerClientSecret
          configCliSecretKey: KC_RANGER_CLIENT_SECRET
          cookieExistingSecret: dlh-cloudbeaver-oauth2-proxy
          cookieSecretKey: cookie-secret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        cloudbeaverProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-cloudbeaver-oauth2-proxy
          clientSecretKey: client-secret
          cookieExistingSecret: ""
          cookieSecretKey: cookie-secret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        prefectProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: prefectClientSecret
          cookieExistingSecret: ""
          cookieSecretKey: cookieSecret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        prefectAutomation:
          enabled: false
          clientId: ""
          configCliSecretKey: KC_PREFECT_AUTOMATION_CLIENT_SECRET
          tokenAudience: prefect-api
          serviceAccountsEnabled: true
          standardFlowEnabled: false
          directAccessGrantsEnabled: false
        prefectDirectGrant:
          enabled: false
          clientId: ""
          tokenAudience: prefect-api
    directory:
      mode: keycloakLocal
      ldap:
        enabled: false
        url: ""
        userBaseDn: ""
        usernameAttribute: uid
        firstNameAttribute: givenName
        lastNameAttribute: sn
        emailAttribute: mail
        uuidAttribute: entryUUID
        userObjectClasses: inetOrgPerson,organizationalPerson,person
        userSearchFilter: "(uid={0})"
        userBindPattern: ""
        groupNameAttribute: cn
        membershipUserAttribute: uid
        groupObjectClasses: groupOfNames
        useGroupFilter: false
        groupBaseDn: ""
        groupSearchFilter: "(cn=*)"
        groupSearchMemberAttribute: member
        userMemberOfAttribute: memberOf
        bindDistinguishedName: ""
        bindExistingSecret: ""
        bindPasswordKey: bindPassword
        allowAnonymousRead: false
        trustedCaExistingSecret: ""
        trustedCaCertKey: ca.crt
        useSystemTrustStore: false
        allowInsecure: false
        syncGroupsToKeycloak: true
        hostAliases: []
  authorization: &authorization_defaults
    ranger:
      enabled: false
      serviceName: trino
      serviceUsername: trino
      serviceAdminUsers:
        - admin
      serviceAdminGroups: []
      superUsers:
        - admin
      superGroups: []
      dataRoles:
        manage: false
        roles: {}
      useRangerGroups: false
      postgresql:
        host: ""
        database: ranger
        username: rangeradmin
        existingSecret: dlh-ranger-postgresql
        passwordKey: password
        adminPasswordKey: postgres-password
      admin:
        browserUrl: ""
        image:
          repository: apache/ranger
          tag: 2.8.0
          pullPolicy: IfNotPresent
        existingSecret: dlh-ranger-admin
        adminPasswordKey: rangerAdminPassword
        usersyncPasswordKey: rangerUsersyncPassword
        tagsyncPasswordKey: rangerTagsyncPassword
        passwordReconcile:
          enabled: true
          image:
            repository: postgres
            tag: "15"
            pullPolicy: IfNotPresent
      usersync:
        enabled: true
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        schedule: "*/15 * * * *"
      localUserSync:
        enabled: true
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        schedule: "*/5 * * * *"
        suspend: false
        readiness:
          attempts: 120
          delaySeconds: 5
      # Custom catalog access is expressed via
      # dataCatalogs.{}.authorizedRoles instead. Disabling one removes it from Ranger.
      baselinePolicies:
        selfQueryExecution:
          enabled: true
          name: "trino - self query execution"
          description: "Required Trino/Ranger baseline policy that lets each authenticated user execute their own queries."
        selfImpersonation:
          enabled: true
          name: "trino - self impersonation"
          description: "Required Trino/Ranger baseline policy that lets each authenticated user impersonate themselves."
        systemCatalogMetadata:
          enabled: true
          name: "trino - catalog metadata"
          description: "Baseline policy that provides access to system catalog metadata to each authenticated user."
      bootstrap:
        # bootstrap.py only uses the Python stdlib, so any Python 3 image
        # works here (e.g. an internal mirror) -- no extra pip packages required.
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
      trino:
        enabled: false
        auditMode: log4j
  storage:
    backend: externalS3
    s3:
      endpoint: ""
      region: ""
      pathStyleAccess: true
      # Do not commit real credentials in tracked values files. Prefer CI-injected
      # values, environment-specific secrets, or external secret delivery.
      existingSecret: ""
      accessKey: ""
      secretKey: ""
      accessKeyKey: accessKey
      secretKeyKey: secretKey

  # Data catalogs configuration (used to generate Hive metastores and Trino catalogs)
  dataCatalogs: {}

sharedPostgresql:
  # Master switch for the whole shared-postgres feature. Pick exactly one
  # data plane below (bundled.enabled or external.enabled) once this is true.
  enabled: false
  bundled:
    enabled: false
    nameOverride: shared-postgresql
    image:
      repository: bitnamilegacy/postgresql
      tag: 17.6.0-debian-12-r0
    auth:
      enablePostgresUser: true
      existingSecret: ""
      secretKeys:
        adminPasswordKey: postgres-password
    primary:
      extendedConfiguration: |-
        password_encryption = md5
      persistence:
        enabled: true
        size: 100Gi
  # Point the shared-postgres feature at an instance you manage yourself
  # instead of the bundled instance above.
  external:
    enabled: false
    host: ""
    port: 5432
    username: postgres
    # Name of an existing Secret containing the admin/superuser password used
    # to provision the per-app databases and roles below.
    existingSecret: ""
    passwordKey: postgres-password
  provisioning:
    enabled: true
    backoffLimit: 6
    image:
      registry: docker.io
      repository: postgres
      tag: "15"
      pullPolicy: IfNotPresent
    adminSecret:
      name: dlh-shared-postgresql
      passwordKey: postgres-password
    # Legacy list contract kept for non-Prefect integrations until they are
    # deliberately migrated to the new map form below.
    database-list:
      - name: keycloak
        database: bitnami_keycloak
        username: bn_keycloak
        secretName: dlh-keycloak-postgresql
        passwordKey: password
      - name: ranger
        database: ranger
        username: rangeradmin
        secretName: dlh-ranger-postgresql
        passwordKey: password
      - name: superset
        database: superset
        username: superset
        secretName: dlh-superset-runtime-env
        passwordKey: DB_PASS
      - name: jupyterhub
        database: jupyterhub
        username: jupyterhub
        secretName: dlh-jupyterhub-postgresql
        passwordKey: password
    # New map contract for Prefect.
    databases:
      prefect:
        enabled: true
        database: prefect
        username: prefect
        password:
          # Empty means generate the app password Secret; set an existing
          # Secret name here to reuse it instead.
          existingSecret: ""
          key: password
        connectionSecret:
          create: true
          name: dlh-prefect-postgresql-connection
      # Provisions one database per global.dataCatalogs entry, owned by
      # hive.externalDatabase.user/existingSecret.
      hiveMetastore:
        enabled: true
  migration:
    allowBundledPostgresql: false

trino:
  enabled: true
  accessControl:
    type: configmap

keycloak:
  enabled: false
  production: false
  httpEnabled: true
  proxyHeaders: xforwarded
  image:
    repository: bitnamilegacy/keycloak
  auth:
    adminUser: admin
    existingSecret: dlh-keycloak-admin
    passwordSecretKey: adminPassword
  keycloakConfigCli:
    enabled: true
    image:
      repository: bitnamilegacy/keycloak-config-cli
    extraEnvVarsSecret: dlh-keycloak-config-cli-env
    extraEnvVars:
