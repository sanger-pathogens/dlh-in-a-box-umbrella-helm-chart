      skip_oidc_discovery = true
      login_url = "{{ include "dlh-in-a-box.identity.authorizeUrl" $ }}"
      redeem_url = "{{ include "dlh-in-a-box.identity.internalAccessTokenUrl" $ }}"
      oidc_jwks_url = "{{ include "dlh-in-a-box.identity.internalJwksUri" $ }}"
      profile_url = "{{ include "dlh-in-a-box.identity.internalUserInfoUrl" $ }}"
      scope = "{{ join " " .Values.global.identity.external.oidc.scopes }}"
      email_domains = [{{- range $index, $domain := .Values.global.identity.external.clients.cloudbeaverProxy.emailDomains }}{{ if $index }}, {{ end }}{{ $domain | quote }}{{- end }}]
      allowed_groups = [{{- range $index, $group := .Values.global.identity.external.clients.cloudbeaverProxy.allowedGroups }}{{ if $index }}, {{ end }}{{ $group | quote }}{{- end }}]
      oidc_groups_claim = "{{ .Values.global.identity.external.oidc.groupsClaim }}"
      redirect_url = "{{ .Values.global.identity.external.clients.cloudbeaverProxy.redirectUrl }}"
      skip_provider_button = true
      cookie_secure = {{ hasPrefix "https://" .Values.global.identity.external.clients.cloudbeaverProxy.redirectUrl }}
      # Use a distinct oauth2-proxy cookie per app so localhost tunnel access
      # does not mix CloudBeaver and Prefect sessions on 127.0.0.1.
      cookie_name = "_oauth2_proxy_cloudbeaver"
      session_cookie_minimal = true
      upstreams = [ "http://{{ include "dlh-in-a-box.cloudbeaver.serviceName" $ }}:8978" ]
      pass_access_token = false
      pass_authorization_header = false
      pass_user_headers = true
      set_xauthrequest = true
      reverse_proxy = true
