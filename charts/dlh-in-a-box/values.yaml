global:
  nameOverride: ""
  fullnameOverride: ""
  domain: ""
  environment: ""
  imagePullSecrets: []
  storage:
    backend: externalS3
    s3:
      endpoint: ""
      region: ""
      bucket: ""
      pathStyleAccess: true
      # Do not commit real credentials in tracked values files. Prefer CI-injected
      # values, environment-specific secrets, or external secret delivery.
      accessKey: ""
      secretKey: ""
      accessKeyKey: accessKey
      secretKeyKey: secretKey

  # Data catalogs configuration (used to generate Hive metastores and Trino catalogs)
  dataCatalogs:
    default:
      type: deltaLake  # deltaLake or hive
      authorizedUsers:
        read: []
        write: []

trino:
  enabled: true
  accessControl:
    type: configmap

prefect:
  enabled: true
  server:
    enabled: true
  workers:
    enabled: true

# Upstream Prefect chart values can be passed directly via these aliases.
prefectServer:
  postgresql:
    enabled: true

prefectWorker:
  worker:
    apiConfig: selfHostedServer
    replicaCount: 1
    config:
      workPool: kubernetes-pool
      workQueues:
        - default
    selfHostedServerApiConfig:
      apiUrl: http://prefect-server:4200/api

sparkOperator:
  enabled: true
  nameOverride: spark-operator

minio:
  enabled: false

datahub:
  enabled: false
  # Upstream DataHub chart values should be set directly under this key.
  # Example:
  # datahub-frontend:
  #   service:
  #     type: ClusterIP
  # datahubSystemUpdate:
  #   annotations:
  #     helm.sh/hook: post-install,post-upgrade
  #     helm.sh/hook-delete-policy: before-hook-creation

# Upstream DataHub prerequisites chart values. These are deployed alongside the
# DataHub chart when DataHub is enabled so the umbrella release remains
# self-contained.
datahubPrerequisites:
  mysql:
    auth:
      rootPassword: ""

hive:
  enabled: false
  metastore:
    image:
      registry: ""
      repository: ""
      tag: ""
  schemainit:
    image:
      registry: ""
      repository: ""
      tag: ""
    job:
      enabled: false
  postgres:
    host: ""
    port: "5432"
    username: ""
    # Do not commit real database passwords in tracked values files.
    password: ""
    existingSecret: ""
  s3:
    endpoint: ""
    # Do not commit real object-store credentials in tracked values files.
    accessKey: ""
    secretKey: ""
    pathStyleAccess: true
    existingSecret: ""
  warehouseDir: ""
  ingress:
    enabled: false
    className: ""
    tlsSecretName: ""

vault:
  enabled: true

postgresql:
  nameOverride: hive-postgresql
