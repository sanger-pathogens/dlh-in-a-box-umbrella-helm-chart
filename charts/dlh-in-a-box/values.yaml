global:
  nameOverride: ""
  fullnameOverride: ""
  domain: ""
  imagePullSecrets: []
  identity: &identity_defaults
    enabled: false
    provider:
      mode: externalOidc
      keycloak:
        realm: dlh
        browserHost: ""
        internalScheme: http
        displayName: ""
        loginTheme: ""
        registration:
          enabled: false
          requireEmailVerification: true
        configCliEnvExistingSecret: dlh-keycloak-config-cli-env
        bootstrapUsers: []
    external:
      oidc:
        issuer: ""
        usernameClaim: email
        groupsClaim: groups
        userMappingPattern: "([^@]+)"
        providerCaFile: ""
        scopes:
          - openid
          - profile
          - email
          - groups
        processForwardedHeaders: true
      clients:
        trino:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: trinoClientSecret
          redirectUris: []
          webOrigins: []
          passwordAuthMode: ldap
          passwordAuthEnabled: false
          sharedSecretExistingSecret: ""
          sharedSecretKey: sharedSecret
          discovery:
            enabled: true
          challengeTimeout: ""
        trinoDirectGrant:
          enabled: false
          clientId: ""
        superset:
          enabled: false
          providerName: keycloak
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: supersetClientSecret
          redirectUris: []
          webOrigins: []
          authorizeUrl: ""
          accessTokenUrl: ""
          apiBaseUrl: ""
          jwksUri: ""
          userInfoUrl: ""
          icon: fa-openid
          roleKeysPath: role_keys
        datahub:
          enabled: false
          provider: other
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: datahubClientSecret
          redirectUris: []
          webOrigins: []
          discoveryUri: ""
          scope: ""
          userNameClaim: email
          userNameClaimRegex: "([^@]+)"
        platformHome:
          enabled: false
          clientId: ""
          redirectUris: []
          webOrigins: []
        minio:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: minioClientSecret
          redirectUris: []
          webOrigins: []
        vault:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: vaultClientSecret
          redirectUris: []
          webOrigins: []
        headlamp:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: headlampClientSecret
          redirectUris: []
          webOrigins: []
        jupyterhub:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: jupyterhubClientSecret
          redirectUris: []
          webOrigins: []
        rangerProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: rangerClientSecret
          configCliSecretKey: KC_RANGER_CLIENT_SECRET
          cookieExistingSecret: dlh-cloudbeaver-oauth2-proxy
          cookieSecretKey: cookie-secret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          allowedGroups: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        cloudbeaverProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-cloudbeaver-oauth2-proxy
          clientSecretKey: client-secret
          cookieExistingSecret: ""
          cookieSecretKey: cookie-secret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          allowedGroups: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        prefectProxy:
          enabled: false
          clientId: ""
          existingSecret: dlh-oidc-clients
          clientSecretKey: prefectClientSecret
          cookieExistingSecret: ""
          cookieSecretKey: cookieSecret
          redirectUrl: ""
          redirectUris: []
          webOrigins: []
          allowedGroups: []
          emailDomains:
            - "*"
          ingress:
            enabled: false
            className: ""
            host: ""
            tlsSecretName: ""
            annotations: {}
        prefectAutomation:
          enabled: false
          clientId: ""
          configCliSecretKey: KC_PREFECT_AUTOMATION_CLIENT_SECRET
          tokenAudience: prefect-api
          serviceAccountsEnabled: true
          standardFlowEnabled: false
          directAccessGrantsEnabled: false
        prefectDirectGrant:
          enabled: false
          clientId: ""
          tokenAudience: prefect-api
    directory:
      mode: externalLdap
      ldap:
        enabled: false
        url: ""
        userBaseDn: ""
        usernameAttribute: uid
        firstNameAttribute: givenName
        lastNameAttribute: sn
        emailAttribute: mail
        uuidAttribute: entryUUID
        userObjectClasses: inetOrgPerson,organizationalPerson,person
        userSearchFilter: "(uid={0})"
        userBindPattern: ""
        groupNameAttribute: cn
        membershipUserAttribute: uid
        groupObjectClasses: groupOfNames
        useGroupFilter: false
        groupBaseDn: ""
        groupSearchFilter: "(cn=*)"
        groupSearchMemberAttribute: member
        userMemberOfAttribute: memberOf
        bindDistinguishedName: ""
        bindExistingSecret: ""
        bindPasswordKey: bindPassword
        allowAnonymousRead: false
        trustedCaExistingSecret: ""
        trustedCaCertKey: ca.crt
        useSystemTrustStore: false
        allowInsecure: false
        syncGroupsToKeycloak: true
        hostAliases: []
    groupConventions:
      appAccessPrefix: platform-app-
      rolePrefix: platform-role-
      dataPrefix: platform-data-
  authorization: &authorization_defaults
    platformRoles: {}
    platformRoleExceptions: []
    platformRoleMembershipSource: git
    ranger:
      enabled: false
      serviceName: trino
      serviceUsername: trino
      serviceAdminUsers:
        - admin
      serviceAdminGroups: []
      superUsers:
        - admin
      superGroups: []
      legacyManagedUsers: []
      legacyManagedGroups: []
      legacyManagedRoles: []
      legacyManagedPolicies: []
      useRangerGroups: false
      postgresql:
        enabled: true
        host: ""
        database: ranger
        username: rangeradmin
        existingSecret: dlh-ranger-postgresql
        passwordKey: password
        adminPasswordKey: postgres-password
      admin:
        browserUrl: ""
        image:
          repository: apache/ranger
          tag: 2.8.0
          pullPolicy: IfNotPresent
        existingSecret: dlh-ranger-admin
        adminPasswordKey: rangerAdminPassword
        usersyncPasswordKey: rangerUsersyncPassword
        tagsyncPasswordKey: rangerTagsyncPassword
      usersync:
        enabled: true
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        schedule: "*/15 * * * *"
        syncSource: LDAP
      localUserSync:
        enabled: true
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        schedule: "*/5 * * * *"
        suspend: false
      importCatalogAcls: false
      exceptionRoleAudit:
        enabled: true
        prefix: exception-
        schedule: "23 * * * *"
        gracePeriodDays: 7
        deleteExpired: true
        logUndocumented: true
      bootstrapPolicies: []
      bootstrap:
        enabled: true
        importCatalogAcls: false
        image:
          repository: python
          tag: 3.12-slim
          pullPolicy: IfNotPresent
        policies: []
      trino:
        enabled: false
        auditMode: log4j
  storage:
    backend: externalS3
    s3:
      endpoint: ""
      region: ""
      bucket: ""
      pathStyleAccess: true
      # Do not commit real credentials in tracked values files. Prefer CI-injected
      # values, environment-specific secrets, or external secret delivery.
      existingSecret: ""
      accessKey: ""
      secretKey: ""
      accessKeyKey: accessKey
      secretKeyKey: secretKey

  # Data catalogs configuration (used to generate Hive metastores and Trino catalogs)
  dataCatalogs: {}

trino:
  enabled: true
  accessControl:
    type: configmap

keycloak:
  enabled: false
  production: false
  httpEnabled: true
  proxyHeaders: xforwarded
  image:
    repository: bitnamilegacy/keycloak
  auth:
    adminUser: admin
    existingSecret: dlh-keycloak-admin
    passwordSecretKey: adminPassword
  keycloakConfigCli:
    enabled: true
    image:
      repository: bitnamilegacy/keycloak-config-cli
    extraEnvVarsSecret: dlh-keycloak-config-cli-env
    extraEnvVars:
      - name: IMPORT_VARSUBSTITUTION_ENABLED
        value: "true"
      - name: IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR
        value: "false"
    configuration:
      dlh-realm.yaml: |
        realm: {{ include "dlh-in-a-box.keycloak.realm" $ }}
        enabled: true
        {{- $keycloakRegistration := default (dict) .Values.global.identity.provider.keycloak.registration }}
        {{- $registrationEnabled := default false (get $keycloakRegistration "enabled") }}
        {{- $requireEmailVerification := true }}
        {{- if hasKey $keycloakRegistration "requireEmailVerification" }}
        {{- $requireEmailVerification = get $keycloakRegistration "requireEmailVerification" }}
        {{- end }}
        registrationAllowed: {{ ternary "true" "false" $registrationEnabled }}
        loginWithEmailAllowed: true
        duplicateEmailsAllowed: false
        verifyEmail: {{ ternary "true" "false" (and $registrationEnabled $requireEmailVerification) }}
        resetPasswordAllowed: true
        rememberMe: true
        {{- $keycloakDisplayName := default "" .Values.global.identity.provider.keycloak.displayName }}
        {{- if $keycloakDisplayName }}
        displayName: {{ $keycloakDisplayName | quote }}
        {{- end }}
        {{- $keycloakLoginTheme := default "" .Values.global.identity.provider.keycloak.loginTheme }}
        {{- if $keycloakLoginTheme }}
        loginTheme: {{ $keycloakLoginTheme | quote }}
        {{- end }}
        defaultDefaultClientScopes:
          - profile
          - email
          - roles
          - groups
        clientScopes:
          - name: groups
            protocol: openid-connect
            attributes:
              include.in.token.scope: "true"
              display.on.consent.screen: "false"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                consentRequired: false
                config:
                  full.path: "false"
                  id.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "true"
                  introspection.token.claim: "true"
                  claim.name: {{ .Values.global.identity.external.oidc.groupsClaim | quote }}
                  jsonType.label: String
        {{- $bootstrapUsers := default (list) .Values.global.identity.provider.keycloak.bootstrapUsers }}
        {{- $managedGroups := fromJsonArray (include "dlh-in-a-box.identity.keycloakManagedGroupsJson" $) }}
        {{- $seededGroups := dict }}
        {{- range $groupName := $managedGroups }}
          {{- $_ := set $seededGroups (toString $groupName) true }}
        {{- end }}
        {{- range $user := $bootstrapUsers }}
          {{- range $group := default (list) $user.groups }}
            {{- $_ := set $seededGroups (toString $group) true }}
          {{- end }}
        {{- end }}
        {{- if gt (len $seededGroups) 0 }}
        groups:
        {{- range $groupName := keys $seededGroups | sortAlpha }}
          - name: {{ $groupName | quote }}
        {{- end }}
        {{- end }}
        {{- if gt (len $bootstrapUsers) 0 }}
        users:
        {{- range $user := $bootstrapUsers }}
          - username: {{ $user.username | quote }}
            enabled: {{ default true $user.enabled }}
            emailVerified: true
            {{- if $user.email }}
            email: {{ $user.email | quote }}
            {{- end }}
            {{- if $user.firstName }}
            firstName: {{ $user.firstName | quote }}
            {{- end }}
            {{- if $user.lastName }}
            lastName: {{ $user.lastName | quote }}
            {{- end }}
            credentials:
              - type: password
                value: {{ printf "$(env:%s:change-me)" (default "KC_BOOTSTRAP_USER_PASSWORD" $user.passwordEnvVar) | quote }}
                temporary: {{ default false $user.temporaryPassword }}
            {{- if $user.groups }}
            groups:
            {{- range $group := $user.groups }}
              - {{ $group | quote }}
            {{- end }}
            {{- end }}
            {{- if $user.realmRoles }}
            realmRoles:
            {{- range $role := $user.realmRoles }}
              - {{ $role | quote }}
            {{- end }}
            {{- end }}
            {{- if $user.clientRoles }}
            clientRoles:
            {{- range $clientName := keys $user.clientRoles | sortAlpha }}
              {{ $clientName | quote }}:
              {{- range $role := (get $user.clientRoles $clientName | default (list)) }}
                - {{ $role | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
        {{- end }}
        {{- end }}
        clients:
        {{- if .Values.global.identity.external.clients.trino.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.trino.clientId | quote }}
            name: Trino
            description: OIDC client for Trino browser login
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_TRINO_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.trino.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.trino.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.trinoDirectGrant.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.trinoDirectGrant.clientId | quote }}
            name: Trino Direct Grant
            description: Public OIDC client for non-browser Trino workstation token grants
            enabled: true
            protocol: openid-connect
            publicClient: true
            standardFlowEnabled: false
            directAccessGrantsEnabled: true
            serviceAccountsEnabled: false
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
            protocolMappers:
              - name: trino-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
                  access.token.claim: "true"
                  id.token.claim: "false"
                  introspection.token.claim: "true"
                  included.client.audience: {{ .Values.global.identity.external.clients.trino.clientId | quote }}
        {{- end }}
        {{- if .Values.global.identity.external.clients.superset.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.superset.clientId | quote }}
            name: Superset
            description: OIDC client for Apache Superset
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_SUPERSET_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.superset.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.superset.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.datahub.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.datahub.clientId | quote }}
            name: DataHub
            description: OIDC client for DataHub frontend
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_DATAHUB_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.datahub.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.datahub.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.platformHome.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.platformHome.clientId | quote }}
            name: Platform Home
            description: Public browser client for the data-platform launchpad
            enabled: true
            protocol: openid-connect
            publicClient: true
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            redirectUris:
            {{- range .Values.global.identity.external.clients.platformHome.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.platformHome.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.minio.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.minio.clientId | quote }}
            name: MinIO Console
            description: OIDC client for MinIO Console browser login
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_MINIO_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.minio.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.minio.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
            protocolMappers:
              - name: minio-policy
                protocol: openid-connect
                protocolMapper: oidc-hardcoded-claim-mapper
                consentRequired: false
                config:
                  access.token.claim: "true"
                  id.token.claim: "true"
                  userinfo.token.claim: "true"
                  introspection.token.claim: "true"
                  claim.name: "policy"
                  claim.value: "consoleAdmin"
                  jsonType.label: String
        {{- end }}
        {{- if .Values.global.identity.external.clients.vault.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.vault.clientId | quote }}
            name: Vault
            description: OIDC client for Vault UI browser login
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_VAULT_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.vault.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.vault.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.headlamp.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.headlamp.clientId | quote }}
            name: Headlamp
            description: OIDC client for Headlamp browser login
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_HEADLAMP_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.headlamp.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.headlamp.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.jupyterhub.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.jupyterhub.clientId | quote }}
            name: JupyterHub
            description: OIDC client for JupyterHub browser login and notebook token forwarding
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_JUPYTERHUB_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.jupyterhub.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.jupyterhub.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
            {{- if .Values.global.identity.external.clients.trino.enabled }}
            protocolMappers:
              - name: trino-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
                  access.token.claim: "true"
                  id.token.claim: "false"
                  introspection.token.claim: "true"
                  included.client.audience: {{ .Values.global.identity.external.clients.trino.clientId | quote }}
            {{- end }}
        {{- end }}
        {{- if .Values.global.identity.external.clients.cloudbeaverProxy.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.cloudbeaverProxy.clientId | quote }}
            name: CloudBeaver Proxy
            description: OIDC client for oauth2-proxy in front of CloudBeaver
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_CLOUDBEAVER_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.cloudbeaverProxy.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.cloudbeaverProxy.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.rangerProxy.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.rangerProxy.clientId | quote }}
            name: Ranger Proxy
            description: OIDC client for oauth2-proxy in front of Ranger Admin
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_RANGER_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.rangerProxy.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.rangerProxy.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.prefectProxy.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.prefectProxy.clientId | quote }}
            name: Prefect Proxy
            description: OIDC client for oauth2-proxy in front of Prefect
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            secret: "$(env:KC_PREFECT_CLIENT_SECRET:change-me)"
            redirectUris:
            {{- range .Values.global.identity.external.clients.prefectProxy.redirectUris }}
              - {{ . | quote }}
            {{- end }}
            webOrigins:
            {{- range .Values.global.identity.external.clients.prefectProxy.webOrigins }}
              - {{ . | quote }}
            {{- end }}
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
        {{- end }}
        {{- if .Values.global.identity.external.clients.prefectAutomation.enabled }}
          - clientId: {{ .Values.global.identity.external.clients.prefectAutomation.clientId | quote }}
            name: Prefect Automation
            description: OIDC machine client for programmatic Prefect API access through oauth2-proxy
            enabled: true
            protocol: openid-connect
            publicClient: false
            standardFlowEnabled: {{ .Values.global.identity.external.clients.prefectAutomation.standardFlowEnabled }}
            directAccessGrantsEnabled: {{ .Values.global.identity.external.clients.prefectAutomation.directAccessGrantsEnabled }}
            serviceAccountsEnabled: {{ .Values.global.identity.external.clients.prefectAutomation.serviceAccountsEnabled }}
            secret: "$(env:{{ .Values.global.identity.external.clients.prefectAutomation.configCliSecretKey }}:change-me)"
            defaultClientScopes:
              - profile
              - email
              - roles
              - groups
            protocolMappers:
              - name: prefect-automation-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
