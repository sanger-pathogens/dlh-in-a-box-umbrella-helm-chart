apiVersion: v2
name: dlh-in-a-box
description: Production-oriented umbrella Helm chart for deploying a modular data lakehouse platform on Kubernetes.
type: application
version: 0.4.1
appVersion: "0.4.1"
home: https://github.com/sanger-pathogens/dlh-in-a-box-umbrella-helm-chart
icon: https://raw.githubusercontent.com/sanger-pathogens/dlh-in-a-box-umbrella-helm-chart/main/docs/assets/dlh-in-a-box-icon.jpg
annotations:
  org.opencontainers.image.title: dlh-in-a-box
  org.opencontainers.image.description: Production-oriented umbrella Helm chart for deploying a modular data lakehouse platform on Kubernetes.
  org.opencontainers.image.url: https://github.com/sanger-pathogens/dlh-in-a-box-umbrella-helm-chart
  org.opencontainers.image.source: https://github.com/sanger-pathogens/dlh-in-a-box-umbrella-helm-chart
  org.opencontainers.image.documentation: https://github.com/sanger-pathogens/dlh-in-a-box-umbrella-helm-chart#readme
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.vendor: Wellcome Sanger Institute
sources:
  - https://github.com/sanger-pathogens/dlh-in-a-box-umbrella-helm-chart
  - https://github.com/trinodb/charts
  - https://github.com/apache/superset
  - https://github.com/PrefectHQ/prefect-helm
  - https://github.com/oauth2-proxy/manifests
  - https://github.com/bitnami/charts
  - https://github.com/kubeflow/spark-operator
  - https://github.com/acryldata/datahub-helm
  - https://github.com/hashicorp/vault-helm
  - https://github.com/dbeaver/cloudbeaver
  - https://github.com/jupyterhub/zero-to-jupyterhub-k8s
keywords:
  - lakehouse
  - kubernetes
  - helm
  - trino
  - hive
  - superset
  - prefect
  - spark
  - datahub
  - vault
  - jupyterhub
maintainers:
  - name: Sanger Pathogens
    url: https://github.com/sanger-pathogens

# This chart intentionally prefers upstream dependencies with minimal local templates.
dependencies:
  - name: trino
    version: "1.41.0"
    repository: file://charts/trino
    condition: trino.enabled

  - name: superset
    version: "0.15.2"
    repository: https://apache.github.io/superset
    condition: superset.enabled

  - name: prefect-server
    alias: prefectServer
    version: "2026.6.1154549"
    repository: https://prefecthq.github.io/prefect-helm
    condition: prefect.enabled,prefect.server.enabled

  - name: prefect-worker
    alias: prefectWorker
    version: "2026.6.1154549"
    repository: https://prefecthq.github.io/prefect-helm
    condition: prefect.enabled,prefect.workers.enabled

  - name: oauth2-proxy
    alias: prefect-auth-proxy
    version: "10.1.4"
    repository: https://oauth2-proxy.github.io/manifests
    condition: prefect.authProxy.enabled

  - name: oauth2-proxy
    alias: cloudbeaver-auth-proxy
    version: "10.1.4"
    repository: https://oauth2-proxy.github.io/manifests
    condition: cloudbeaver.enabled,cloudbeaver.authProxy.enabled

  - name: oauth2-proxy
    alias: ranger-auth-proxy
    version: "10.1.4"
    repository: https://oauth2-proxy.github.io/manifests
    condition: global.identity.external.clients.rangerProxy.enabled

  - name: keycloak
    version: "25.2.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: keycloak.enabled

  - name: spark-operator
    alias: sparkOperator
    version: "2.4.0"
    repository: https://kubeflow.github.io/spark-operator
    condition: sparkOperator.enabled

  - name: minio
    version: "15.0.7"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled

  - name: datahub
    version: "0.8.21"
    repository: https://helm.datahubproject.io
    condition: datahub.enabled

  - name: datahub-prerequisites
    alias: datahubPrerequisites
    version: "0.2.3"
    repository: https://helm.datahubproject.io
    condition: datahub.enabled

  - name: vault
    version: "0.32.0"
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled

  - name: jupyterhub
    version: "4.3.3"
    repository: https://jupyterhub.github.io/helm-chart
    condition: jupyterhub.enabled

  - name: shared-postgresql
    alias: sharedPostgresql
    version: "0.1.0"
    repository: file://charts/shared-postgresql
    condition: sharedPostgresql.enabled

  - name: hive
    version: "0.1.0"
    repository: file://charts/hive
    condition: hive.enabled

  - name: postgresql
    alias: rangerPostgresql
    version: "14.3.3"
    repository: https://charts.bitnami.com/bitnami
    condition: rangerPostgresql.enabled

  - name: postgresql
    alias: hivePostgresql
    version: "14.3.3"
    repository: https://charts.bitnami.com/bitnami
    condition: hivePostgresql.enabled
